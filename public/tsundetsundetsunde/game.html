k:break-all;width:100%;max-height:76%;overflow:hidden;text-align:center;display:flex;align-items:center;justify-content:center;text-shadow:0 5px 0 #134d6c,0 0 25px #61d8ff;animation:nameBang .65s cubic-bezier(.18,1.5,.3,1) both}#nameReveal .revealCount{font-size:24px;font-weight:900;color:#ffdf80;margin-top:14px}@keyframes nameBang{0%{transform:scale(2.4);opacity:0;filter:blur(8px)}65%{transform:scale(.93);opacity:1;filter:blur(0)}100%{transform:scale(1)}}@keyframes revealFade{from{opacity:0}to{opacity:1}}#shareStatus{font-size:13px;color:#a8eaff;min-height:0}#shareStatus:empty{display:none}</style></head><body><header><h1>ツンデツンデツンデ</h1><small>積んで、積んで、ツンデツンデ！</small></header><div id="stats"><span>段数 <b id="score">0</b></span><span>最高 <b id="best">0</b></span><span>PERFECT <b id="combo">0</b>/5</span></div><div id="frame"><button id="soundToggle" type="button">🔊 ON</button><canvas id="game"></canvas><div id="nameReveal" aria-live="polite"><div class="revealLabel">完成した名前は……</div><div class="revealText" id="revealText"></div><div class="revealCount" id="revealCount"></div></div><div id="overlay"><h2 id="headline">ツンデツンデツンデ</h2><p id="description">左右に動くツンデツンデをタップで積み上げよう！<br>5連続PERFECTで幅が回復！</p><div id="resultPanel" hidden><h3 id="resultScore"></h3><canvas id="resultPreview" width="900" height="1100" aria-label="積み上げたツンデツンデの全体像"></canvas><small>↓ 下から頂上へ自動プレビュー（タップで再生）</small><div id="previewTools"><button id="detailOpen" type="button">🔍 全体を高画質で見る</button></div><h3>完成した名前</h3><div id="longName"></div><button id="saveImage" type="button" style="margin-top:10px;font-size:15px">🖼️ 結果画像を保存</button></div><button id="start" type="button">スタート</button><div id="actions"><button id="share" type="button">📤 記録を共有</button><button id="records" type="button">📊 記録を見る</button></div><div id="shareStatus" role="status" aria-live="polite"></div><div id="history" aria-live="polite" hidden></div></div></div><dialog id="detailDialog"><h3>積み上げたツンデツンデ</h3><div id="detailScroll"><canvas id="detailCanvas"></canvas></div><div id="previewTools"><button id="zoomOut" type="button">－ 縮小</button><button id="zoomIn" type="button">＋ 拡大</button><button id="detailClose" type="button">閉じる</button></div><small>＋で拡大、指で上下左右にスクロールして細部を確認できます</small></dialog><div id="msg" aria-live="polite"></div><p id="hint">画面タップ・クリック・スペースキーで落とす / ずれ5px以内でPERFECT</p><script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),frame=document.getElementById('frame'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),headline=document.getElementById('headline'),description=document.getElementById('description'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),msg=document.getElementById('msg'),shareBtn=document.getElementById('share'),recordsBtn=document.getElementById('records'),historyEl=document.getElementById('history'),resultPanel=document.getElementById('resultPanel'),resultScore=document.getElementById('resultScore'),resultPreview=document.getElementById('resultPreview'),longName=document.getElementById('longName'),saveImage=document.getElementById('saveImage');let previewRaf=0,revealTimer=0,soundOn=true,audioCtx=null;function bang(){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;const master=audioCtx.createGain();master.gain.value=.55;master.connect(audioCtx.destination);const hit=audioCtx.createOscillator(),hg=audioCtx.createGain();hit.type='sine';hit.frequency.setValueAtTime(180,t);hit.frequency.exponentialRampToValueAtTime(48,t+.23);hg.gain.setValueAtTime(.0001,t);hg.gain.exponentialRampToValueAtTime(.6,t+.008);hg.gain.exponentialRampToValueAtTime(.0001,t+.52);hit.connect(hg);hg.connect(master);hit.start(t);hit.stop(t+.54);const len=Math.floor(audioCtx.sampleRate*.24),buffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const noise=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),ng=audioCtx.createGain();noise.buffer=buffer;filter.type='lowpass';filter.frequency.value=1400;ng.gain.value=.25;noise.connect(filter);filter.connect(ng);ng.connect(master);noise.start(t);for(const [i,freq] of [392,494,587,784].entries()){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;const at=t+.11+i*.045;g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(.095,at+.04);g.gain.exponentialRampToValueAtTime(.0001,at+1.05);o.connect(g);g.connect(master);o.start(at);o.stop(at+1.1)}}catch{}}function showNameReveal(){if(mode!=='over')return;const el=document.getElementById('nameReveal');const nameEl=document.getElementById('revealText');nameEl.textContent='ツンデツンデ'.repeat(score)||'ツンデツンデ';const chars=nameEl.textContent.length;const areaW=Math.max(180,frame.clientWidth-44),areaH=Math.max(180,frame.clientHeight*.66);let font=Math.min(46,Math.max(11,areaW/Math.min(chars,12)*1.65));nameEl.style.fontSize=font+'px';nameEl.style.lineHeight='1.25';requestAnimationFrame(()=>{let steps=0;while((nameEl.scrollHeight>nameEl.clientHeight+2||nameEl.scrollWidth>nameEl.clientWidth+2)&&font>8&&steps++<60){font-=1;nameEl.style.fontSize=font+'px'}});document.getElementById('revealCount').textContent=score+'段！';el.classList.remove('show');void el.offsetWidth;el.classList.add('show');bang();clearTimeout(revealTimer);revealTimer=setTimeout(()=>el.classList.remove('show'),Math.min(5500,2400+score*45))}function beep(type){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.connect(gain);gain.connect(audioCtx.destination);o.type=type==='perfect'?'sine':'triangle';const freq=type==='perfect'?740:type==='end'?220:type==='bonus'?900:430;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(type==='end'?100:freq*1.3,t+.13);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.075,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+.19);o.start(t);o.stop(t+.2)}catch{}}document.getElementById('soundToggle').addEventListener('click',e=>{e.stopPropagation();soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 ON':'🔇 OFF';if(soundOn)beep('perfect')});let W=400,H=600,scale=1,blocks=[],moving=null,particles=[],score=0,combo=0,best=0,mode='menu',camera=0,last=0,raf=0,messageTimer=0,history=[],plays=0;try{history=JSON.parse(localStorage.getItem('tsundetsundetsunde_history')||'[]');if(!Array.isArray(history))history=[];plays=Number(localStorage.getItem('tsundetsundetsunde_plays')||0)||0}catch{}try{best=Number(localStorage.getItem('tsundetsundetsunde_best')||0)||0}catch{}bestEl.textContent=best;const BW=180,BH=90,STEP=74,BASE=H-110;function resize(){const r=frame.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}function baseY(){return H-112}function targetY(index){return baseY()-index*STEP+camera}function startGame(){clearTimeout(revealTimer);document.getElementById('nameReveal').classList.remove('show');cancelAnimationFrame(previewRaf);resize();score=0;combo=0;camera=0;particles=[];blocks=[{x:(W-BW)/2,w:BW,index:0}];mode='play';overlay.classList.remove('result');resultPanel.hidden=true;overlay.classList.add('hidden');historyEl.hidden=true;recordsBtn.textContent='📊 記録を見る';shareStatus.textContent='';msg.textContent='';update();spawn();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function spawn(){const prev=blocks[blocks.length-1],dir=(score%2===0)?1:-1;moving={x:dir===1?-prev.w:W,w:prev.w,index:blocks.length,dir};}function update(){scoreEl.textContent=score;comboEl.textContent=combo;bestEl.textContent=best}function notify(s){msg.textContent=s;clearTimeout(messageTimer);messageTimer=setTimeout(()=>msg.textContent='',1100)}function end(){beep('end');mode='over';plays++;history.unshift({score,date:new Date().toLocaleDateString('ja-JP')});history=history.slice(0,10);try{localStorage.setItem('tsundetsundetsunde_history',JSON.stringify(history));localStorage.setItem('tsundetsundetsunde_plays',String(plays))}catch{};headline.textContent='結果発表！';description.textContent=`${score}段積み上げた！ 最高記録：${best}段`;resultScore.textContent=score+'段のツンデツンデタワー';longName.textContent='ツンデツンデ'.repeat(score)||'まだ積み上げられなかった！';resultPanel.hidden=false;overlay.classList.add('result');drawResultPreview();start.textContent='もう一度';historyEl.hidden=true;overlay.classList.remove('hidden')}function drop(){if(mode!=='play'||!moving)return;const prev=blocks[blocks.length-1],delta=moving.x-prev.x,perfect=Math.abs(delta)<=5;let left=Math.max(prev.x,moving.x),right=Math.min(prev.x+prev.w,moving.x+moving.w);if(perfect){left=prev.x;right=prev.x+prev.w;combo++;notify('PERFECT! '+combo+'/5')}else{combo=0;const cutLeft=moving.x<prev.x?moving.x:null,cutRight=moving.x+moving.w>prev.x+prev.w?prev.x+prev.w:null;if(cutLeft!==null)shatter(moving.x,prev.x,targetY(moving.index));if(cutRight!==null)shatter(prev.x+prev.w,moving.x+moving.w,targetY(moving.index))}let width=right-left;if(width<=0){moving=null;end();return}beep(perfect?'perfect':'drop');if(combo===5){const old=width;width=Math.min(BW,width+10);left=Math.max(0,Math.min(W-width,left-(width-old)/2));combo=0;beep('bonus');notify('✨ 5連続！ 幅が10px回復！')}blocks.push({x:left,w:width,index:moving.index});score++;if(score>best){best=score;try{localStorage.setItem('tsundetsundetsunde_best',String(best))}catch{}}update();moving=null;spawn()}
function shatter(a,b,y){for(let i=0;i<Math.min(12,Math.ceil((b-a)/5));i++)particles.push({x:a+Math.random()*(b-a),y:y+Math.random()*25,vx:(Math.random()-.5)*160,vy:-Math.random()*90,size:3+Math.random()*8,life:1})}
function creatureOn(g,x,y,w,alpha=1){
 if(w<=0)return;
 g.save();g.globalAlpha=alpha;g.beginPath();g.rect(x,y,w,BH);g.clip();
 // Stylized full-body Stakataka: masonry shell, cyan eyes and four segmented legs.
 const h=BH,top=y+3,bodyH=h*.69,unit=Math.max(8,w/5);
 g.fillStyle='#353c3b';g.fillRect(x+2,top+3,w-4,bodyH);
 g.fillStyle='#7b8380';g.fillRect(x+3,top,w*.69,bodyH-3);
 g.fillStyle='#505755';g.fillRect(x+w*.72,top,w*.27,bodyH-3);
 g.strokeStyle='#2b3433';g.lineWidth=1.5;
 for(let row=1;row<5;row++){
   const yy=top+row*(bodyH-3)/5;
   g.beginPath();g.moveTo(x+2,yy);g.lineTo(x+w-2,yy);g.stroke();
 }
 for(let row=0;row<5;row++){
   const yy=top+row*(bodyH-3)/5,offset=row%2?unit*.55:0;
   for(let k=0;k<8;k++){
     const xx=x+offset+k*unit;
     if(xx>x+3&&xx<x+w-3){g.beginPath();g.moveTo(xx,yy);g.lineTo(xx-2,yy+(bodyH-3)/5);g.stroke()}
   }
 }
 // Vertical cyan joints.
 g.fillStyle='#6ad7f5';g.fillRect(x+w*.70,top+4,Math.max(2,w*.023),bodyH-10);
 const eye=(ex,ey,r)=>{g.fillStyle='#172e39';g.fillRect(ex-r*1.5,ey-r*1.5,r*3,r*3);g.fillStyle='#67d8ff';g.beginPath();g.arc(ex,ey,r,0,Math.PI*2);g.fill();g.fillStyle='#172f3a';g.beginPath();g.arc(ex,ey,Math.max(1,r*.27),0,Math.PI*2);g.fill()};
 eye(x+w*.33,y+h*.38,Math.max(2,Math.min(6,w*.038)));
 eye(x+w*.85,y+h*.24,Math.max(1.5,Math.min(4,w*.025)));
 const legY=y+h*.69;
 for(let i=0;i<4;i++){
   const lx=x+w*(.08+i*.25),lw=Math.max(4,w*.11);
   g.fillStyle=i%2?'#474e4c':'#656d69';
   g.fillRect(lx,legY,lw,h*.15);
   g.fillStyle='#343b3b';g.fillRect(lx+(i%2?2:-2),legY+h*.15,lw,h*.14);
   eye(lx+lw*.5,legY+h*.20,Math.max(1.2,Math.min(3,w*.018)));
 }
 g.restore();
}
function creature(x,y,w,alpha=1){creatureOn(ctx,x,y,w,alpha)}
function paintTower(g,cw,ch,padding=20){g.clearRect(0,0,cw,ch);g.fillStyle='#172a34';g.fillRect(0,0,cw,ch);const tower=blocks.slice(1);if(!tower.length){g.fillStyle='#c9e7f2';g.font='16px sans-serif';g.textAlign='center';g.fillText('積み上げ記録なし',cw/2,ch/2);return}const minX=Math.min(...tower.map(b=>b.x)),maxX=Math.max(...tower.map(b=>b.x+b.w));const f=Math.min((cw-padding*2)/Math.max(1,maxX-minX),(ch-padding*2)/(tower.length*STEP+BH));g.save();g.translate((cw-(maxX-minX)*f)/2-minX*f,ch-padding);g.scale(f,f);for(const b of tower){creatureOn(g,b.x,-(b.index*STEP+BH),b.w)}g.restore()}
function drawResultPreview(){cancelAnimationFrame(previewRaf);const g=resultPreview.getContext('2d'),cw=resultPreview.width,ch=resultPreview.height,tower=blocks.slice(1);if(!tower.length){paintTower(g,cw,ch);return}const minX=Math.min(...tower.map(b=>b.x)),maxX=Math.max(...tower.map(b=>b.x+b.w)),height=tower.length*STEP+BH;const fit=Math.min((cw-80)/Math.max(1,maxX-minX),(ch-50)/height);const close=Math.min((cw-90)/Math.max(1,maxX-minX),1.9);const zoom=Math.max(fit,close);const visible=ch/zoom;const travel=Math.max(0,height-visible+30);const duration=Math.min(10500,Math.max(2600,1600+tower.length*210));const startAt=performance.now();function render(now){if(mode!=='over')return;const elapsed=now-startAt;let y,f;if(elapsed<duration){const p=Math.min(1,elapsed/duration);const ease=p*p*p;y=20+travel*ease;f=zoom}else{const p=Math.min(1,(elapsed-duration)/900);const ease=p*p*(3-2*p);f=zoom+(fit-zoom)*ease;y=(20+travel)*(1-ease)+height/2*ease}g.fillStyle='#172a34';g.fillRect(0,0,cw,ch);g.save();g.translate(cw/2-(minX+maxX)/2*f,ch-25+y*f);g.scale(f,f);for(const b of tower)creatureOn(g,b.x,-(b.index*STEP+BH),b.w);g.restore();if(elapsed<duration+900)previewRaf=requestAnimationFrame(render);else showNameReveal()}previewRaf=requestAnimationFrame(render)}resultPreview.addEventListener('click',()=>{clearTimeout(revealTimer);document.getElementById('nameReveal').classList.remove('show');drawResultPreview()});
let detailZoom=1;const detailDialog=document.getElementById('detailDialog'),detailCanvas=document.getElementById('detailCanvas');function drawDetail(){const n=Math.max(1,blocks.length-1),baseWidth=1100,baseHeight=Math.min(12000,Math.max(900,n*STEP*3+240));detailCanvas.width=baseWidth;detailCanvas.height=baseHeight;paintTower(detailCanvas.getContext('2d'),baseWidth,baseHeight,45);detailCanvas.style.width=Math.round(Math.min(650,document.getElementById('detailScroll').clientWidth||650)*detailZoom)+'px';detailCanvas.style.height='auto'}document.getElementById('detailOpen').addEventListener('click',()=>{detailZoom=1;detailDialog.showModal();drawDetail()});document.getElementById('detailClose').addEventListener('click',()=>detailDialog.close());document.getElementById('zoomIn').addEventListener('click',()=>{detailZoom=Math.min(4,detailZoom*1.5);drawDetail()});document.getElementById('zoomOut').addEventListener('click',()=>{detailZoom=Math.max(.5,detailZoom/1.5);drawDetail()});
function resultImage(){const tower=blocks.slice(1),n=tower.length,c=document.createElement('canvas'),g=c.getContext('2d');const towerHeight=Math.max(360,Math.min(1800,n*45+100));c.width=720;c.height=175+towerHeight+55;g.fillStyle='#101c29';g.fillRect(0,0,c.width,c.height);g.fillStyle='#eaf8ff';g.textAlign='center';g.font='bold 38px sans-serif';g.fillText('ツンデツンデツンデ',360,58);g.font='bold 34px sans-serif';g.fillText(score+'段',360,115);g.fillStyle='#1a3440';g.fillRect(35,145,650,towerHeight);if(n){const minX=Math.min(...tower.map(b=>b.x)),maxX=Math.max(...tower.map(b=>b.x+b.w)),f=Math.min(600/Math.max(1,maxX-minX),(towerHeight-35)/(n*STEP+BH));g.save();g.translate(360-(minX+maxX)/2*f,145+towerHeight-12);g.scale(f,f);for(const b of tower)creatureOn(g,b.x,-(b.index*STEP+BH),b.w);g.restore()}else{g.fillStyle='#eaf8ff';g.font='24px sans-serif';g.fillText('0段',360,350)}return c}
saveImage.addEventListener('click',e=>{e.stopPropagation();const c=resultImage();if(!c)return;c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ツンデツンデツンデ_'+score+'段.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')});
function tick(now){if(mode!=='play')return;const dt=Math.min(.05,(now-last)/1000||0);last=now;const cross=Math.max(1,2.5-1.5*(1-Math.exp(-score/32)));const speed=(W+(moving?moving.w:BW))/cross;if(moving){moving.x+=moving.dir*speed*dt;if(moving.x+moving.w>=W&&moving.dir>0){moving.x=W-moving.w;moving.dir=-1}else if(moving.x<=0&&moving.dir<0){moving.x=0;moving.dir=1}}const want=Math.max(0,(blocks.length-5)*STEP);camera+=(want-camera)*Math.min(1,dt*5);ctx.clearRect(0,0,W,H);ctx.fillStyle='#172a34';for(let i=0;i<24;i++){const px=(i*97+37)%W,py=(i*131+43)%H;ctx.fillRect(px,py,2,2)}ctx.fillStyle='#314b50';ctx.fillRect(0,baseY()+BH*.7,W,H);for(const b of blocks)creature(b.x,targetY(b.index),b.w);if(moving)creature(moving.x,targetY(moving.index),moving.w,.93);particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt*.85;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#77817c';ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;raf=requestAnimationFrame(tick)}function showRecords(){const open=historyEl.hidden;historyEl.hidden=!open;recordsBtn.textContent=open?'📊 記録を閉じる':'📊 記録を見る';if(open){historyEl.innerHTML='<strong>プレイ回数：'+plays+'回 ／ 最高：'+best+'段</strong><br>'+(history.length?history.map((r,i)=>(i+1)+'回前：'+Number(r.score)+'段（'+String(r.date).replace(/[<>&]/g,'')+'）').join('<br>'):'まだ記録はありません');historyEl.scrollIntoView({block:'nearest',behavior:'smooth'})}}
const shareStatus=document.getElementById('shareStatus');async function share(){const url=new URL('./', location.href).href;const content='ツンデツンデツンデで'+score+'段！\n'+url+'\n#ツンデツンデツンデ';shareStatus.textContent='共有の準備中…';try{const c=resultImage();const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(blob&&navigator.share&&typeof File!=='undefined'){const file=new File([blob],'ツンデツンデツンデ_'+score+'段.png',{type:'image/png'});if(!navigator.canShare||navigator.canShare({files:[file]})){await navigator.share({title:'ツンデツンデツンデ',text:content,files:[file]});shareStatus.textContent='画像付き共有画面を開きました';return}}if(navigator.share){await navigator.share({title:'ツンデツンデツンデ',text:content});shareStatus.textContent='共有画面を開きました（画像は「結果画像を保存」から保存できます）';return}}catch(e){if(e.name==='AbortError'){shareStatus.textContent='共有をキャンセルしました';return}}try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(content);shareStatus.textContent='段数とURLをコピーしました！画像は「結果画像を保存」から保存できます';return}}catch(e){}shareStatus.textContent='下の文章を長押ししてコピーできます。画像は「結果画像を保存」から保存できます';historyEl.hidden=false;recordsBtn.textContent='📊 記録を見る';historyEl.textContent=content;historyEl.style.whiteSpace='pre-wrap';historyEl.scrollIntoView({block:'nearest'})}
shareBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();share()});recordsBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();historyEl.style.whiteSpace='';showRecords()});start.addEventListener('click',e=>{e.stopPropagation();startGame()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();drop()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();drop()}});window.addEventListener('resize',()=>{resize();if(mode==='play'){blocks.forEach(b=>b.x=Math.min(b.x,W-b.w));if(moving)moving.x=Math.max(-moving.w,Math.min(W,moving.x))}});resize();})();
</script></body></html>
