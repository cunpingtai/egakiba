<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:#cfd6dd}
#stage{position:absolute;left:50%;top:50%;width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;transform:translate(-50%,-50%);overflow:hidden;background:#000;container-type:size}
#monitor{position:absolute;left:5cqw;top:20cqw;width:90cqw;height:90cqw;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 0 1px #0d1014}
#view{width:100%;height:100%;display:block}
#vids{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;left:0;top:0}

.choices{position:absolute;left:5cqw;right:5cqw;top:122cqw;display:flex;gap:4cqw;visibility:hidden}
.choices.low{top:157cqw}
.choices.low .choice{height:13cqw;font-size:max(13px,3.7cqw);letter-spacing:.02em}
#talk{position:absolute;left:6cqw;right:6cqw;top:113cqw;display:none;flex-direction:column;gap:1.4cqw;font-size:max(13px,3.6cqw);line-height:1.45;color:#e2e7ec;letter-spacing:.03em}

.choices.on{visibility:visible}
.choice{flex:1 1 0;min-height:48px;height:15cqw;border:1px solid #3a424b;border-radius:2cqw;background:#10151a;color:#d9dfe5;font:inherit;font-size:max(15px,4.4cqw);letter-spacing:.06em;cursor:pointer;padding:0;transition:background .08s,border-color .08s}
.choice.pressed{background:#2b343d;border-color:#9aa6b2}
.layer{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:10}
.layer.on{display:flex}
#start p{margin:0 0 14cqw;font-size:max(16px,5cqw);letter-spacing:.08em;color:#d6dce2}
#startBtn{min-width:40cqw;min-height:48px;height:13cqw;border:1px solid #4a535c;border-radius:2cqw;background:#0e1216;color:#e3e8ed;font:inherit;font-size:max(15px,4.4cqw);letter-spacing:.1em;cursor:pointer}
#langs{display:none;gap:2.2cqw;margin-top:7cqw}
#langs button{min-height:36px;padding:0 3.2cqw;border:1px solid #3a424b;border-radius:1.5cqw;background:transparent;color:#9aa3ad;font:inherit;font-size:max(12px,3.3cqw);cursor:pointer}
#langs button[aria-pressed=true]{background:#c9cfd6;color:#0e1216;border-color:#c9cfd6}

#sub{position:absolute;left:5cqw;right:5cqw;top:5cqw;min-height:12cqw;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-size:max(13px,3.9cqw);line-height:1.45;color:#e6ebf0;letter-spacing:.02em;opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 0 6px #000}
#sub.on{opacity:1}
#start small{position:absolute;bottom:10cqw;text-align:center;line-height:1.8;font-size:max(11px,3.2cqw);color:#6f7880;letter-spacing:.06em}
#end{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
#result{opacity:0;transition:opacity .8s;text-align:center;padding:12cqw 8cqw max(84px,calc(env(safe-area-inset-bottom) + 64px));margin:auto 0;letter-spacing:.06em;pointer-events:none}
#result.on{pointer-events:auto}
#endHidden{margin:-4cqw 0 6cqw;font-size:max(13px,3.8cqw);color:#d9b45a}
.share{display:block;margin:0 auto 4cqw;width:62cqw;min-height:44px;line-height:44px;border:1px solid #4a535c;border-radius:2cqw;background:#0e1216;color:#e3e8ed;text-decoration:none;font-size:max(13px,3.8cqw);letter-spacing:.08em}
.share[hidden]{display:none}
#hint,#feedback{margin:0 0 6cqw;font-size:max(12px,3.3cqw);color:#aab3bc}
#hint{margin-bottom:1.5cqw}
#hint a,#feedback a{color:#d6dce2;text-underline-offset:3px}
#again{display:block;margin:6cqw auto 5cqw}
.streaming{margin:6cqw 8cqw 0;max-width:84cqw;font-size:max(12px,3.3cqw);line-height:1.8;color:#8a949d;letter-spacing:.04em}
.streaming summary{cursor:pointer;text-align:center;list-style:none;color:#8a949d;text-decoration:underline;text-underline-offset:3px}
.streaming summary::-webkit-details-marker{display:none}
#start .streaming p{margin:3cqw 0 0;font-size:max(12px,3.3cqw);letter-spacing:.04em;line-height:1.8;text-align:left;color:#aab3bc;user-select:text;-webkit-user-select:text}
#result.on{opacity:1}
#endLabel{margin:0;font-size:max(12px,3.4cqw);letter-spacing:.2em;color:#8a949d}
#endName{margin:2cqw 0 4cqw;font-size:max(20px,6.4cqw);font-weight:500;color:#e6ebf0}
#endText{margin:0 0 8cqw;font-size:max(13px,3.8cqw);line-height:1.7;color:#c3cbd2}
#endList{list-style:none;margin:0 auto 3cqw;padding:0;display:inline-flex;flex-direction:column;gap:1.6cqw;text-align:left;font-size:max(12px,3.4cqw);color:#7d8790}
#endList li::before{content:'・'}
#endList li.now{color:#e6ebf0}
#endCount{margin:0 0 2cqw;font-size:max(12px,3.2cqw);color:#8a949d}
#thanks{margin-top:4cqw;font-size:max(12px,3.4cqw);line-height:1.9;color:#c3cbd2;user-select:text;-webkit-user-select:text}
#thanks p{margin:0 0 3cqw}
#thanks a{color:#c3cbd2;text-underline-offset:3px}
#again{opacity:0;transition:opacity .8s;min-height:44px;padding:0 6cqw;border:0;background:none;color:#6d757d;font:inherit;font-size:max(12px,3.4cqw);letter-spacing:.12em;cursor:pointer;pointer-events:none}
#again.on{opacity:1;pointer-events:auto}
/* system notices — deliberately plain, separate from the story */
.sys{position:absolute;left:8cqw;right:8cqw;bottom:12cqw;display:none;flex-direction:column;align-items:center;gap:3cqw;padding:5cqw;border-radius:2cqw;background:#15191e;border:1px solid #2c333a;z-index:20;font-family:system-ui,sans-serif;font-size:max(12px,3.4cqw);color:#aab3bc}
.sys.on{display:flex}
/* デバッグメニュー：左上を3回タップで開く（本公開の前に DEBUG_MENU を false にする） */
#dbgHot{position:absolute;left:0;top:0;width:18cqw;height:18cqw;z-index:50}
#dbg{position:absolute;left:3cqw;right:3cqw;top:113cqw;bottom:3cqw;display:none;flex-direction:column;gap:2.5cqw;padding:3cqw;border-radius:2cqw;background:rgba(21,25,30,.94);border:1px solid #2c333a;z-index:40;font-family:system-ui,sans-serif;font-size:max(12px,3.4cqw);color:#aab3bc;overflow-y:auto}
#dbg.on{display:flex}
#dbg p{margin:0}
#dbgList{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw}
#dbg button{min-height:40px;border:1px solid #4a535c;border-radius:1.5cqw;background:#222930;color:#e3e8ed;font:inherit;cursor:pointer;padding:0}
#dbg button.now{background:#3a4652;border-color:#9aa6b2}
.dbgRow{display:flex;gap:2cqw}.dbgRow button{flex:1}
.sys button{min-height:44px;min-width:30cqw;border:1px solid #4a535c;border-radius:1.5cqw;background:#222930;color:#e3e8ed;font:inherit;cursor:pointer}
</style>

<body>
<div id="stage">
  <div id="monitor"><canvas id="view"></canvas></div>
  <div id="sub"></div>
  <div id="talk"></div>
  <div class="choices" id="choices">
    <button class="choice" id="c0" tabindex="-1"></button>
    <button class="choice" id="c1" tabindex="-1"></button>
  </div>
  <div class="layer on" id="start">
    <p id="ttl"></p>
    <button id="startBtn"></button>
    <div id="langs" role="group" aria-label="Language"><button type="button" data-lang="ja" lang="ja">日本語</button><button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="ko" lang="ko">한국어</button></div>
    <details class="streaming"><summary id="streamTitle"></summary><div id="streamBody"></div></details>
    <small><span id="noteSound"></span><br><span id="noteScare"></span></small>
  </div>
  <div class="layer" id="end">
    <div id="result">
      <p id="endLabel"></p>
      <h2 id="endName"></h2>
      <p id="endText"></p>
      <p id="endHidden" hidden></p>
      <a class="share" id="share1" href="#" hidden></a>
      <p id="hint" hidden></p>
      <p id="feedback" hidden></p>
      <ul id="endList"></ul>
      <p id="endCount"></p>
      <button id="again"></button>
      <div id="thanks">
        <p id="thanksText"></p>
        <p id="creator"></p>
      </div>
    </div>
  </div>
  <div class="sys" id="err"><span id="errText"></span><button id="retry"></button></div>
  <div class="sys" id="resume"><span id="pauseText"></span><button id="resumeBtn"></button></div>
  <div id="dbgHot"></div>
  <div id="dbg"><p id="dbgNow">デバッグ：見たい動画を選んでください</p><div id="dbgList"></div><div class="dbgRow"><button id="dbgReplay">もう一度再生</button><button id="dbgClose">閉じる（最初から）</button></div></div>
  <div id="vids"></div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);

/* ============================================================
   Config — adjust voice cue offsets here once real footage exists
   ============================================================ */
const CUE = {
  F01_line: 1.3,   // 「父さんだ。鍵、忘れたんだ。」
  F03_line: 0.8,   // 「……早く、開けてくれ。」
  F05_line: 1.0,   // 「……だめだ。」
  F06_line: 0.1,   // 主人公「……開けない。」
};
const LINES = {
  v1:     { who: 'man',    text: '配達です。開けてもらえますか。', intercom: true },
  v2:     { who: 'woman',  text: '……開けてください。',           intercom: true },
  f_ent:  { who: 'father', text: '父さんだ。鍵、忘れたんだ。',     intercom: true },
  f_door: { who: 'father', text: '……早く、開けてくれ。',         intercom: true },
  f_dame: { who: 'father', text: '……だめだ。',                   intercom: true },
  me:     { who: 'me',     text: '……開けない。',                 intercom: false },
  r_ent:  { who: 'father', text: 'ただいま。父さんだよ。開けてくれるか。', intercom: true },
  r_door: { who: 'father', text: 'ただいま。遅くなってごめんな。', intercom: true },
  r_home: { who: 'father', text: 'ただいま。',                     intercom: true },
};
// Colour match for the entrance footage: pull each clip toward V2's dim, warm lobby
const GRADE = { F01: [0.72, 0.66, 0.55], F02: [0.72, 0.66, 0.55], F07: [0.72, 0.66, 0.55], D1: [0.72, 0.66, 0.55] };
const VIDEO_IDS = ['V1', 'V2', 'D1', 'F01', 'F02', 'F05', 'F08', 'K08', 'K09', 'M01'];
const STILL_IDS = [];
// Lines recorded inside the footage itself (video mode skips their separate voice track)
const BAKED = { v1: 'V1', v2: 'V2', f_ent: 'F01', f_door: 'F03', f_dame: 'F05', me: 'F06', r_ent: 'F07', r_door: 'F08', r_home: 'F09' };
const SFX_IDS = ['cough', 'lurk', 'ring', 'hangup', 'unlock_entrance', 'static', 'chime', 'unlock_door', 'door_open', 'step', 'knock', 'knock_iron', 'kick_door', 'breath', 'impact', 'scratch', 'bark', 'dog_threat', 'amb_hall', 'amb_lobby'];

/* ============================================================
   Clock — game time only advances while nothing is holding it
   ============================================================ */
let gt = 0, run = 0;
const holds = new Set();
const paused = () => holds.size > 0;
let timers = [];
function wait(s) { return new Promise(res => timers.push({ at: gt + s, fn: res })); }
const STALE = Symbol('stale');
function guard(p) { const r = run; return p.then(v => { if (r !== run) throw STALE; return v; }); }
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const seg = (t, a, b) => ease((t - a) / (b - a));

/* ============================================================
   Audio
   ============================================================ */
let ac = null, master = null, noiseBuf = null;
const sfxBuf = {}, voiceBuf = {}, rawAudio = {};
function initAudio() {
  if (ac) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iPhone のマナーモードでも鳴らす
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  for (const [k, ab] of Object.entries(rawAudio)) decodeInto(k, ab);
}
function decodeInto(k, ab) {
  const [kind, id] = k.split(':');
  ac.decodeAudioData(ab.slice(0), b => { (kind === 'v' ? voiceBuf : sfxBuf)[id] = b; }, () => {});
}
function env(g, t, a, peak, dec, sustain = 0.0001) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(sustain, t + a + dec);
}
function tone(freq, t, dur, peak, type = 'sine', dest = master) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  env(g, t, 0.008, peak, dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t + dur + 0.05);
  return o;
}
function noise(t, dur, peak, filt = 'lowpass', freq = 800, q = 0.7, dest = master, attack = 0.004) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; s.loop = true;
  f.type = filt; f.frequency.value = freq; f.Q.value = q;
  env(g, t, attack, peak, dur);
  s.connect(f).connect(g).connect(dest);
  s.start(t, Math.random()); s.stop(t + attack + dur + 0.05);
  return { s, f, g };
}
function playBuf(b, gain = 1) {
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = b; g.gain.value = gain; s.connect(g).connect(master); s.start();
  return s;
}
// Synthesized placeholders. A file at assets/sfx/<id>.mp3 replaces each one.
const SFX = {
  ring() { // 共用エントランスの呼出音
    const t = ac.currentTime;
    for (const o of [0, 1.1]) { tone(1318, t + o, 0.35, 0.18, 'triangle'); tone(1046, t + o + 0.32, 0.9, 0.18, 'triangle'); }
  },
  chime() { // 自宅玄関チャイム (別の音色)
    const t = ac.currentTime;
    tone(659, t, 1.2, 0.22); tone(659 * 2.01, t, 0.5, 0.05);
    tone(523, t + 0.45, 1.8, 0.22); tone(523 * 2.01, t + 0.45, 0.6, 0.05);
  },
  hangup() {
    const t = ac.currentTime;
    noise(t, 0.03, 0.3, 'bandpass', 2500, 2);
    tone(880, t + 0.05, 0.12, 0.08, 'square');
  },
  unlock_entrance() {
    const t = ac.currentTime;
    tone(1000, t, 0.12, 0.1, 'square');
    noise(t + 0.25, 0.25, 0.25, 'lowpass', 300);
    tone(90, t + 0.25, 0.2, 0.15, 'square');
  },
  unlock_door() { // 室内側のサムターン
    const t = ac.currentTime;
    noise(t, 0.04, 0.6, 'bandpass', 3200, 3);
    noise(t + 0.06, 0.12, 0.7, 'bandpass', 1400, 2);
    tone(110, t + 0.06, 0.12, 0.4);
  },
  door_open() {
    const t = ac.currentTime;
    noise(t, 0.05, 0.5, 'bandpass', 2600, 3);
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(140, t + 0.1); o.frequency.linearRampToValueAtTime(95, t + 0.9);
    f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 6;
    env(g, t + 0.1, 0.15, 0.06, 0.8);
    o.connect(f).connect(g).connect(master); o.start(t + 0.1); o.stop(t + 1.1);
    noise(t + 0.15, 0.9, 0.18, 'lowpass', 500, 0.7, master, 0.3);
  },
  step(gain = 0.5, bright = 900) {
    const t = ac.currentTime;
    noise(t, 0.09, gain, 'lowpass', bright);
    tone(65, t, 0.1, gain * 0.6);
  },
  knock(gain = 0.5) {
    const t = ac.currentTime;
    tone(105, t, 0.14, gain);
    noise(t, 0.06, gain * 0.8, 'lowpass', 1100);
  },
  breath(dur = 0.6, gain = 0.06, shaky = false) {
    const t = ac.currentTime;
    const n = noise(t, dur, gain, 'bandpass', 1300, 0.8, master, dur * 0.4);
    if (shaky) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 11; lg.gain.value = 350; l.connect(lg).connect(n.f.frequency); l.start(t); l.stop(t + dur * 1.5); }
  },
  cough() {}, // 素材 (assets/sfx/cough.mp3) があるときだけ鳴る
  knock_iron() { [0, 0.3, 0.6].forEach(d => timers.push({ at: gt + d, fn: () => SFX.knock(0.7) })); }, // 素材が無いときの代わり
  kick_door() { SFX.impact(); },
  lurk(gain = 0.05) { // 偽物の背後にいる誰かの息づかい（インターホン越し・低め）
    const t = ac.currentTime;
    const one = (at, dur, freq, peak) => {
      const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), bp = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf; s.loop = true;
      hp.type = 'highpass'; hp.frequency.value = 280;
      bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.setValueAtTime(freq, at); bp.frequency.linearRampToValueAtTime(freq * 0.8, at + dur);
      g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(peak, at + dur * 0.45); g.gain.linearRampToValueAtTime(0.0001, at + dur);
      s.connect(hp).connect(bp).connect(g).connect(master); s.start(at, Math.random()); s.stop(at + dur + 0.05);
    };
    one(t, 0.75, 700, gain * 0.7);          // 吸う
    one(t + 0.85, 1.1, 520, gain);           // 吐く（重く長め）
  },
  scratch(gain = 0.3) { // 玄関の戸を爪でひっかく音
    const t = ac.currentTime;
    for (let i = 0; i < 3; i++) noise(t + i * 0.13, 0.1, gain * (0.7 + Math.random() * 0.3), 'bandpass', 3000 + Math.random() * 1500, 4, master, 0.01);
  },
  bark(gain = 0.35) { // ドア越しのくぐもった鳴き声
    const t = ac.currentTime;
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(620, t); o.frequency.exponentialRampToValueAtTime(330, t + 0.16);
    f.type = 'lowpass'; f.frequency.value = 900;
    env(g, t, 0.01, gain, 0.18);
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.25);
    noise(t, 0.12, gain * 0.4, 'bandpass', 700, 1.5);
  },
  dog_threat() {    // 素材が無いときの代わり：うなり → 吠える
    const t = ac.currentTime;
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 95; f.type = 'lowpass'; f.frequency.value = 600;
    env(g, t, 0.3, 0.25, 1.6);
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 2);
    [2.0, 2.3, 2.6, 2.9].forEach(d => timers.push({ at: gt + d, fn: () => SFX.bark(0.6) }));
  },
  static() { // モニターが乱れる「ザッ」
    const t = ac.currentTime;
    noise(t, 0.45, 0.35, 'bandpass', 2800, 0.6);
  },
  impact() {
    const t = ac.currentTime;
    tone(48, t, 0.22, 0.9);
    noise(t, 0.16, 0.9, 'lowpass', 2200);
  },
};
function sfx(id, ...args) {
  if (!ac) return;
  if (sfxBuf[id]) playBuf(sfxBuf[id], args[0] ?? 1);
  else SFX[id](...args);
}
// Corridor ambience (BGMなし)
let amb = null;
function ambience(kind) {
  if (!ac) return;
  if (MODE === 'video' && kind && !sfxBuf['amb_' + kind]) kind = null;   // footage carries its own room tone
  const t = ac.currentTime;
  if (amb) { const a = amb; a.g.gain.setTargetAtTime(0.0001, t, 0.08); setTimeout(() => a.nodes.forEach(n => { try { n.stop(); } catch (e) {} }), 600); amb = null; }
  if (!kind) return;
  const g = ac.createGain(); g.gain.value = 0.0001; g.connect(master);
  const nodes = [];
  const file = sfxBuf['amb_' + kind];

async function game() {
  const g = p => guard(p);
  fade = 0;
  show('STANDBY');
  const replay = loadSeen().size > 0;                // 2周目以降は1〜3人目の選択肢をすぐ出す
  await g(Promise.all([wait(1.2), ensureReady(['V1', 'V2', 'F01', 'F02'])]));

  // ---- 訪問者1・2 ----
  for (const [img, line] of [['V1', 'v1'], ['V2', 'v2']]) {
    sfx('ring');
    await g(wait(1.4));
    ambience('lobby');
    if (MODE === 'video') {
      const v = show(img); subtitle(line, 3.5);
      await g(replay ? wait(0.8) : v.until(v.dur));   // 台詞入りの映像を最後まで (最終フレームで止まる)
    } else {
      show(img);
      await g(wait(0.4));
      const spoken = say(line);
      await g(replay ? wait(0.4) : spoken);
    }
    if (!replay) await g(wait(0.3));
    const c = await g(choose([T().call, T().refuse]));
    if (c === 0) return knockEnding();
    await g(wait(0.15)); hideChoices();
    sfx('hangup'); ambience(null); show('STANDBY');
    await g(wait(1.5));
  }

  // ---- 犬：エントランスに犬が来る。家に入れると BAD END ----
  await g(ensureReady(['D1']));
  sfx('ring');
  await g(wait(1.4));
  ambience('lobby');
  const d1 = show('D1', { dur: 5 });
  await g(replay ? wait(0.8) : d1.until(d1.dur));
  if (!replay) await g(wait(0.3));
  const cd = await g(choose([T().call, T().refuse]));
  if (cd === 0) return dogEnding();
  await g(wait(0.15)); hideChoices();
  sfx('hangup'); ambience(null); show('STANDBY');
  await g(wait(1.5));

  // ---- 父親(エントランス)：本物と偽物、どちらが先に来るかは毎回ランダム ----
  const order = Math.random() < 0.5 ? ['fake', 'real'] : ['real', 'fake'];
  for (let i = 0; i < order.length; i++) {
    const who = order[i];
    const called = await g(entranceFather(who));
    if (called) {
      sfx('unlock_entrance');
      await g(wait(0.7));
      sfx('hangup'); ambience(null); show('STANDBY');
      // 声に違和感のある方（偽物）を入れたら失敗ルート、本物なら帰宅ルート
      return who === 'fake' ? fakeDoor(i > 0) : realToDoor();
    }
    sfx('hangup'); ambience(null); show('STANDBY');
    await g(wait(i === 0 ? 2.5 : 2));
  }
  return aloneEnding();                            // 2人とも断った
}

// エントランスに父が映る。偽物は背後で息づかい・ささやきが聞こえる。呼んだら true

  const [enter, idle] = ['F01', 'F02'];

  const log = $('talk'); log.innerHTML = ''; log.classList.add('on');
  $('choices').classList.add('low');
  for (const turn of T().talk) {
    const i = await g(choose(turn.q));
    await g(wait(0.15)); hideChoices();
    await g(typeLine(log, T().q[0] + turn[who][i] + T().q[1]));
    await g(wait(0.3));
  }
  const c = await g(choose([T().call, T().refuse]));
  await g(wait(0.15)); hideChoices();
  log.classList.remove('on'); $('choices').classList.remove('low');
  return c === 0;
}

// ---- 手ぶらの父が玄関に来る（F08）。鍵を開けると画面が乱れて、男が侵入する F05 につながる ----
// swapped = エントランスで本物を呼んだのに、すり替わった手ぶらの父が来た。追い返すとケーキの本物が玄関に来る
// realCame = 本物がもうエントランスに来たか（偽物を呼んだとき）
async function fakeDoor(realCame, swapped = false) {
  const g = p => guard(p);
  await g(Promise.all([wait(3), ensureReady(['F08', 'F05'])]));
  sfx('chime');
  await g(wait(1.6));
  ambience('hall');
  let voiceDone = null;
  const f08 = show('F08', { dur: 6, loop: true, cues: [{ t: 0.6, once: true, fn: () => voiceDone = say('r_door') }] });
  await g(f08.until(3.0));                           // 台詞（0.6秒〜）が終わったら選択肢
  if (voiceDone) await g(voiceDone);
  const c2 = await g(choose([T().open, T().keep]));
  await g(wait(0.15)); hideChoices();
  if (c2 === 0) {
    sfx('static'); show('NOISE', { dur: 0.45 });
    await g(wait(0.45));
    const ending = startOpen();
    await g(ending.until(ending.dur));
    return finish('open');
  }
  sfx('hangup'); ambience(null); show('STANDBY');
  // 追い返すと、ドアをゆっくり2回叩く音 → 少しして足音が遠ざかる
  await g(wait(1.2));
  sfx('knock', 0.9); await g(wait(1.3)); sfx('knock', 1);
  await g(wait(1.8));
  [0, 0.55, 1.1, 1.7, 2.3].forEach((d, i) => timers.push({ at: gt + d, fn: () => sfx('step', 0.3 - i * 0.05, 700 - i * 60) }));
  await g(wait(2.4));
  if (swapped) return realDoor();                     // 少しして、ケーキを持った本物がチャイムを鳴らす
  // 偽物を玄関で追い返すと、まだ来ていなければ本物の父がエントランスに来る
  await g(wait(2.5));
  if (!realCame && await g(entranceFather('real'))) {
    sfx('unlock_entrance');
    await g(wait(0.7));
    sfx('hangup'); ambience(null); show('STANDBY');
    return realToDoor();
  }
  sfx('hangup'); ambience(null); show('STANDBY');
  await g(wait(2));
  return aloneEnding();
}

// エントランスで本物を呼ぶと、玄関にはまず必ず手ぶらの父が来る（すり替わり）
function realToDoor() { return fakeDoor(true, true); }

// ---- 正解ルート：本物を玄関へ。ケーキの箱を持っている (K08) ----
async function realDoor() {
  const g = p => guard(p);

  await g(f08.until(3.0));                           // 台詞（0.6秒〜）が終わったら選択肢
  if (voiceDone) await g(voiceDone);
  const c2 = await g(choose([T().open, T().keep]));
  await g(wait(0.15)); hideChoices();
  if (c2 === 1) {                                     // ケーキの本物も追い返すと留守番
    sfx('hangup'); ambience(null); show('STANDBY');

  }

}

// ---- エントランスでの文字の会話（本物 real / 偽物 fake）----
// 偽物の返事は、どれを選んでも頭文字が あ・け・る・な になる。本物は意味のない並び
// 会話の文は I18N の talk（言語ごと）
function typeLine(log, text) {
  const p = document.createElement('p'); log.appendChild(p);
  return new Promise(res => {
    let n = 0;
    const step = () => { p.textContent = text.slice(0, ++n); if (n < text.length) timers.push({ at: gt + 0.025, fn: step }); else res(); };
    step();
  });
}

let whisperOn = false;
function whisperLoop(r) {
  if (!whisperOn || r !== run) return;
  sfx('cough', 0.2);
  timers.push({ at: gt + 7 + Math.random() * 3, fn: () => whisperLoop(r) });
}
function startWhisper() { whisperOn = true; const r = run; timers.push({ at: gt + 0.4, fn: () => whisperLoop(r) }); }
function stopWhisper() { whisperOn = false; }

function startOpen() {
  const steps = [4.1, 4.62, 5.12, 5.6, 6.05].map((t, i) => ({ t, fn: () => sfx('step', 0.35 + i * 0.1, 700) }));
  if (MODE === 'video') return show('F05', { dur: 12, cues: [{ t: CUE.F05_line, fn: () => subtitle('f_dame', 2) }] });
  return show('F05', {
    dur: 7, cues: [
      { t: 0, fn: () => sfx('unlock_door') },
      { t: CUE.F05_line, fn: () => say('f_dame') },
      { t: 2.75, fn: () => sfx('impact') },
      ...steps,
      { t: 6.4, fn: () => { ambience(null); sfx('impact'); timers.push({ at: gt + 0.2, fn: silenceAll }); } },
    ]
  });
}

async function finish(id) {
  hideChoices(); blank(); silenceAll(); $('sub').classList.remove('on');
  const e = ENDINGS.find(x => x.id === id);
  const seen = loadSeen(); seen.add(id); saveSeen(seen);
  const total = ENDINGS.filter(x => !x.hidden).length;
  const found = ENDINGS.filter(x => !x.hidden && seen.has(x.id)).length;
  const t = T(), nm = x => t.endings[x.id][0];
  $('endLabel').textContent = e.label;
  $('endName').textContent = t.nameQ[0] + nm(e) + t.nameQ[1];
  $('endText').textContent = t.endings[e.id][1];
  $('endList').innerHTML = ENDINGS.filter(x => !x.hidden || seen.has(x.id))
    .map(x => `<li class="${x.id === id ? 'now' : ''}">${seen.has(x.id) ? x.label + '　' + nm(x) : t.unknown}</li>`).join('');
  $('endCount').textContent = t.found(found, total);
  // 隠しエンディングの一文・シェア（クリアか隠しエンドのときだけ）・ヒントの一文
  const hiddenLine = e.hidden ? `隠しエンディング ${ENDINGS.filter(x => x.hidden).indexOf(e) + 1}/${ENDINGS.filter(x => x.hidden).length}にたどり着いた！` : '';
  $('endHidden').textContent = hiddenLine; $('endHidden').hidden = !hiddenLine;
  const canShare = true;                              // シェアはどのエンドでも出す（1か所）
  const edNo = ENDINGS.indexOf(e) + 1;                // ED1 おかえり・ED2 留守番 …（ENDINGS の並び順）
  const body = t.shareText + '\n' + `ED${edNo} ${nm(e)}\n`
    + (hiddenLine ? hiddenLine + '\n' : '') + '#家族以外は入れないでください\n' + pageUrl();
  for (const a of [$('share1')]) {
    a.hidden = !canShare;
    a.href = pageUrl();
    a.onclick = ev => shareLocal(ev, body);
  }
  $('hint').hidden = !POST_URL; if (POST_URL) $('hint').innerHTML = withLink(t.hint, POST_URL);
  $('feedback').hidden = !POST_URL; if (POST_URL) $('feedback').innerHTML = withLink(t.feedback, POST_URL);
  $('end').classList.add('on');
  await guard(wait(2));
  $('result').classList.add('on');
  $('again').classList.add('on');
}

    tint(c, LOBBY_TINT);

};
PH_DRAW.F01 = {
  dur: 5, draw(c, t) {
    drawLobby(c);
    const walk = 1 - seg(t, 0, 1.1);
    person(c, { ...ENT, x: ENT.x + walk * 260, y: ENT.y - walk * 20, u: ENT.u * (1 - walk * 0.25), smile: 0.35 + 0.1 * seg(t, 3.5, 4.5), worry: 0.1, gx: walk * -0.4, blink: blinkAt(t, 1.4), talk: talkOf('father') });
    tint(c, LOBBY_TINT);
  }
};
// ケーキの箱（本物の父）とモニターのノイズ
function cakeBox(c, x, y, w) {
  c.fillStyle = '#e9e4da'; c.fillRect(x - w / 2, y, w, w * 0.64);
  c.fillStyle = '#c9a54a'; c.fillRect(x - w * 0.055, y, w * 0.11, w * 0.64);
}
const noiseCv = document.createElement('canvas'); noiseCv.width = noiseCv.height = 96;
PH_DRAW.NOISE = {
  dur: 0.45, draw(c) {
    const n = noiseCv.getContext('2d'), img = n.createImageData(96, 96);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 200; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    n.putImageData(img, 0, 0); c.imageSmoothingEnabled = false; c.drawImage(noiseCv, 0, 0, PH, PH);
  }
};
PH_DRAW.F02 = {
  dur: 4, draw(c, t) {
    drawLobby(c);
    const look = seg(t, 2.0, 2.3) - seg(t, 2.9, 3.2);
    person(c, { ...ENT, smile: 0.45 - look * 0.1, worry: 0.1 + look * 0.05, gy: look * 0.6, breath: Math.sin(t / 4 * Math.PI * 2) * 0.5, blink: blinkAt(t, 1.2), hx: 0.02 * Math.sin(t * Math.PI / 2) });
    tint(c, LOBBY_TINT);
  }
};
PH_DRAW.F03 = {
  dur: 4, draw(c, t) {
    drawHall(c);
    const lean = 1 - seg(t, 0, 0.8), toBase = seg(t, 2.7, 3.7);
    person(c, {
      ...DOOR, y: DOOR.y + lean * 60, u: DOOR.u * (1 - lean * 0.18),
      smile: L(0.15, DOOR_BASE.smile, toBase), worry: L(0.7, DOOR_BASE.worry, toBase), fear: L(0.35, DOOR_BASE.fear, toBase),
      blink: blinkAt(t, 3.0), talk: talkOf('father'),
    });
    tint(c, HALL_TINT);
  }
};
PH_DRAW.F04 = {
  dur: 6, draw(c, t) {
    drawHall(c);
    const e = { ...DOOR, ...DOOR_BASE };
    const side = seg(t, 0.35, 0.55) - seg(t, 1.3, 1.55);          // 0–2s 目だけ横へ (約0.75秒)
    e.gx = 0.9 * side; e.fear += 0.12 * side;
    const crack = seg(t, 2.2, 2.45) - seg(t, 3.25, 3.8);         // 2–4s 笑顔が崩れて震える
    e.smile -= 0.45 * crack; e.tremble = crack; e.worry += 0.2 * crack;
    const o = seg(t, 4.25, 4.55) - seg(t, 4.85, 5.05);           // 4–6s 言いかけて飲み込む
    e.open = 0.32 * o; e.smile -= 0.25 * o;
    e.hy = 0.025 * (seg(t, 5.0, 5.14) - seg(t, 5.14, 5.32));
    e.breath = seg(t, 5.3, 5.6) - seg(t, 5.6, 5.95);
    e.blink = blinkAt(t, 1.72);
    e.hx = 0.006 * Math.sin(t * Math.PI);                          // 0 at every 2s junction
    person(c, e);
    tint(c, HALL_TINT);
  }
};
PH_DRAW.F05 = {
  dur: 7, draw(c, t) {
    drawHall(c);
    const f = seg(t, 0.05, 0.5);
    const rise = seg(t, 1.9, 2.6), down = seg(t, 2.7, 3.2), near = seg(t, 3.6, 5.2);   // 下からせり上がり、父を倒す
    if (down < 1) person(c, {
      ...DOOR, y: DOOR.y + down * 900, tilt: -down * 0.25,
      smile: L(DOOR_BASE.smile, 0, f), worry: L(DOOR_BASE.worry, 0.95, f), fear: L(DOOR_BASE.fear, 1, f), open: 0.12 * f,
      gx: 0.5 * seg(t, 1.6, 1.9), talk: talkOf('father'),
    });
    if (rise > 0) silhouette(c, 700 - near * 190, 1400 - rise * 920 + near * 60, 130 + near * 260);
    tint(c, HALL_TINT);
    const dark = seg(t, 5.5, 6.35);
    if (dark) { c.fillStyle = `rgba(0,0,0,${dark})`; c.fillRect(0, 0, PH, PH); }
  }
};
PH_DRAW.F06 = {
  dur: 8,
  // hold before relief until the protagonist's line has finished (+0.4s)
  hold: t => t >= 1.1 && t < 1.5 && (speaking.me > 0 || gt - (lastEnd.me ?? -1e9) < 0.4 || lastEnd.me === undefined),
  draw(c, t) {
    drawHall(c);
    const rel = seg(t, 1.5, 2.1), back = seg(t, 3.15, 3.5), pull = seg(t, 3.8, 4.7);
    const nod = seg(t, 2.25, 2.45) - seg(t, 2.45, 2.75);
    if (pull < 1) person(c, {
      ...DOOR, x: DOOR.x - pull * 820, tilt: -pull * 0.2,
      smile: L(L(DOOR_BASE.smile, 0.22, rel), 0, back), worry: L(L(DOOR_BASE.worry, 0.18, rel), 0.85, back),
      fear: L(L(DOOR_BASE.fear, 0, rel), 0.75, back), hy: 0.08 * nod, gx: 0.9 * seg(t, 3.0, 3.18),
      breath: seg(t, 1.6, 1.8) - seg(t, 1.8, 2.3), blink: blinkAt(t, 2.9),
    });
    tint(c, HALL_TINT);
    const dark = seg(t, 7.0, 7.9);
    if (dark) { c.fillStyle = `rgba(0,0,0,${dark})`; c.fillRect(0, 0, PH, PH); }
  }
};

PH_DRAW.F07 = PH_DRAW.F01;
const REAL = { smile: 0.5, worry: 0.08, fear: 0 };
PH_DRAW.F08 = {
  dur: 6, draw(c, t) {
    drawHall(c);
    const look = seg(t, 3.0, 3.3) - seg(t, 4.2, 4.6);
    person(c, { ...DOOR, y: DOOR.y + 20, u: DOOR.u * 0.9, ...REAL, smile: REAL.smile + 0.15 * look, gy: 0.7 * look, blink: blinkAt(t, 2.2), talk: talkOf('father'), hx: 0.006 * Math.sin(t * Math.PI / 3) });
    tint(c, HALL_TINT);
  }
};
PH_DRAW.K08 = { dur: 6, draw(c, t) { PH_DRAW.F08.draw(c, t); cakeBox(c, DOOR.x, DOOR.y + 300, 300); } };
PH_DRAW.M01 = { dur: 5, draw(c) { drawHall(c); cakeBox(c, DOOR.x, 760, 220); c.fillStyle = 'rgba(255,240,210,0.18)'; c.fillRect(0, 0, PH, PH); } };
PH_DRAW.F09 = {
  dur: 6, draw(c, t) {
    drawHall(c);
    const go = seg(t, 2.2, 3.6);
    if (go < 1) person(c, { ...DOOR, x: DOOR.x + go * 800, y: DOOR.y + 20, u: DOOR.u * 0.9, ...REAL, smile: 0.5 + 0.3 * seg(t, 0.2, 0.8), talk: talkOf('father') });
    tint(c, HALL_TINT);
    const dark = seg(t, 4.6, 5.8);
    if (dark) { c.fillStyle = `rgba(0,0,0,${dark})`; c.fillRect(0, 0, PH, PH); }
  }
};

// ---- デバッグメニュー：左上を3回タップ → 動画を選ぶと音つきでモニターに流す ----
const DEBUG_MENU = false;   // 動画の確認をするときだけ true（左上を3回タップでメニュー）
const DBG_NAMES = { V1: '訪問者1', V2: '訪問者2', D1: '犬', F01: '父 エントランス', F02: '父 エントランス待ち', F05: '偽物 開ける', F08: '偽物 玄関（手ぶら）', K08: '本物 玄関（ケーキ）', K09: '本物 開ける（ケーキ）', M01: '留守番 朝の玄関' };
let dbgTaps = [], dbgId = null;
if (DEBUG_MENU) {
  $('dbgHot').addEventListener('pointerdown', () => {
    const now = performance.now();
    dbgTaps = dbgTaps.filter(t => now - t < 900).concat(now);
    if (dbgTaps.length >= 3) { dbgTaps = []; openDebug(); }
  });
  $('dbgList').innerHTML = VIDEO_IDS.map(id => `<button data-id="${id}">${id}<br><small>${DBG_NAMES[id] || ''}</small></button>`).join('');
  $('dbgList').addEventListener('click', e => { const b = e.target.closest('button'); if (b) dbgPlay(b.dataset.id); });
  $('dbgReplay').addEventListener('click', () => dbgId && dbgPlay(dbgId));
  $('dbgClose').addEventListener('click', () => { $('dbg').classList.remove('on'); blank(); reset(); });
}
function openDebug() {
  if (!ac) initAudio();
  ac.resume(); restoreMaster();
  run++; timers = []; hideChoices(); stopWhisper(); silenceAll(); restoreMaster();
  holds.clear(); $('err').classList.remove('on'); $('resume').classList.remove('on');
  $('talk').classList.remove('on'); $('start').classList.remove('on'); $('end').classList.remove('on');
  fade = 0; show('STANDBY');
  // スマホで音つき再生できるよう、タップの直後に一度ずつ再生→停止しておく
  Object.values(vids).forEach(v => { const p = v.play(); if (p) p.then(() => { if (!(feed && feed.v === v)) { v.pause(); v.currentTime = 0; } }).catch(() => {}); });
  $('dbg').classList.add('on');
}
async function dbgPlay(id) {
  dbgId = id;
  document.querySelectorAll('#dbgList button').forEach(b => b.classList.toggle('now', b.dataset.id === id));
  $('dbgNow').textContent = id + '　' + (DBG_NAMES[id] || '') + '（読み込み中…）';
  if (MODE === 'video') { try { await assetState[id].p; } catch (e) { $('dbgNow').textContent = id + ' の読み込みに失敗しました'; return; } }
  const f = show(id);
  $('dbgNow').textContent = id + '　' + (DBG_NAMES[id] || '') + (isFinite(f.dur) ? `（${f.dur.toFixed(1)}秒）` : '');
}

// ?dev — peek(id, t) freezes the monitor on a placeholder frame; ?speed=N fast-forwards
const QS = new URLSearchParams(location.search);
const SPEED = +QS.get('speed') || 1;
if (QS.has('dev')) window.DEV = {
  peek(id, t = 0) { $('start').classList.remove('on'); const f = makeFeed(id); f.t = t; feed = f; holds.add('dev'); },
  get state() { return { gt, feed: feed && feed.id, abs: feed && feed.abs(), choice: choiceOpen, holds: [...holds] }; },
};

PH_DRAW.K09 = { dur: 6, draw(c, t) { PH_DRAW.F09.draw(c, t); if (t < 2.2) cakeBox(c, DOOR.x, DOOR.y + 300, 300); } };
applyLang();
boot();
</script>
