// Each new family has five deterministic profile variants. Shapes are polygonal

function extraOutline(cfg){
  const kind=cfg.family,v=cfg.v,p=[],s=Math.sin,c=Math.cos;
  const twist=(v-2)*.045,wide=1+(v%2?-.06:.055),high=1+(v===4?.10:v===1?-.055:0);
  const polar=(count,fn,rotation=-Math.PI/2)=>{
    for(let i=0;i<count;i++){let a=i*T/count+rotation,r=fn(i,a);
      p.push([Math.cos(a)*r,Math.sin(a)*r]);}
    return p;
  };
  const raw=(coords)=>coords.map(([x,y],i)=>[x*wide+(v===3?y*.065:0),y*high+(v===2?x*.065:0)]);
  switch(kind){
    case 'crescent': {
      // A thick C-shaped ice crescent: outer arc down, inner arc back up.
      const start=-Math.PI*.67,end=Math.PI*.67;
      for(let i=0;i<=28;i++){let a=start+(end-start)*i/28;p.push([.22+Math.cos(a)*1.0,Math.sin(a)*1.04]);}
      for(let i=28;i>=0;i--){let a=start+(end-start)*i/28;p.push([.22+Math.cos(a)*(.53+v*.018),Math.sin(a)*(.52+v*.014)]);}
      return p.map(([x,y])=>[x*wide,y*high]);
    }
    case 'heart': {
      for(let i=0;i<90;i++){let t=i*T/90,x=16*s(t)**3/18,
        y=-(13*c(t)-5*c(2*t)-2*c(3*t)-c(4*t))/17;
        p.push([x*(1+v*.02),y*(.94+(v%3)*.04)]);}
      return p;
    }
