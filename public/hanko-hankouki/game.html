<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://egakiba.com/hanko-hankouki/">
  <title>ハンコう期</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #d9dde2; color: #23262c;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; position: relative; z-index: 2; }
    header a { color: #23262c; font-size: 14px; text-decoration: none; margin-right: auto; }
    #back, #lang { display: none !important; }
    header button, header select {
      background: #fff; border: 1px solid #9aa2ae; border-radius: 8px;
      height: 34px; min-width: 40px; padding: 0 10px; font-size: 13px; color: #23262c; cursor: pointer;
    }
    header svg { width: 18px; height: 18px; display: block; }
    #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .bubble {
      position: absolute; left: 0; top: 0; display: none; pointer-events: none; white-space: nowrap;
      background: #fff; color: #23262c; border: 3px solid #23262c; border-radius: 18px;
      padding: .35em .8em; font-size: clamp(15px, 3.4vmin, 28px); font-weight: 800;
    }
    .bubble::after {
      content: ""; position: absolute; left: var(--tail, 50%); bottom: -14px; margin-left: -9px;
      border: 9px solid transparent; border-top: 12px solid #23262c; border-bottom: 0;
    }
    /* 部下と部長の「お疲れ様です！」はトゲトゲの吹き出し: 黒い星形の上に白い星形を重ねて縁取りにする */
    .bubble.spiky { background: none; border: none; isolation: isolate; padding: 1.35em 2em; font-size: clamp(16px, 3.6vmin, 30px); font-weight: 900; }
    .bubble.spiky::before, .bubble.spiky::after { content: ""; position: absolute; z-index: -1; margin: 0; border: 0; left: 0; bottom: auto; clip-path: polygon(50.0% 3.4%, 55.9% 12.9%, 64.9% 4.1%, 66.9% 16.8%, 78.0% 11.4%, 77.0% 23.0%, 86.6% 23.4%, 84.4% 32.5%, 93.0% 36.0%, 87.9% 44.0%, 95.3% 50.0%, 86.9% 55.8%, 94.8% 64.6%, 85.3% 68.0%, 86.9% 76.8%, 76.7% 76.7%, 78.3% 88.9%, 68.2% 85.6%, 64.8% 95.5%, 56.0% 87.8%, 50.0% 99.9%, 44.2% 86.7%, 34.8% 96.9%, 32.8% 83.8%, 23.1% 87.0%, 23.5% 76.5%, 12.3% 77.4%, 14.7% 68.0%, 6.3% 64.2%, 11.6% 56.1%, 1.8% 50.0%, 12.3% 44.0%, 4.6% 35.2%, 16.8% 33.1%, 13.4% 23.4%, 23.3% 23.3%, 21.6% 10.8%, 32.6% 15.8%, 35.6% 5.7%, 43.9% 11.6%); }
    .bubble.spiky::before { inset: -7px; background: #23262c; }
    .bubble.spiky::after { inset: -2px; background: #fff; }
    #result {
      position: absolute; left: 0; right: 0; top: 0; height: var(--band, 30%); display: none;
      flex-direction: column; align-items: center; justify-content: center; pointer-events: none; line-height: 1.05;
    }
    #result span { font-size: clamp(18px, 4.5vmin, 36px); font-weight: 800; color: #fff; text-shadow: 0 2px 0 #7a120c, 0 0 10px rgba(0,0,0,.35); }
    #result b { font-size: clamp(48px, 13vmin, 120px); font-weight: 900; color: #fff; text-shadow: 0 4px 0 #7a120c, 0 0 18px rgba(0,0,0,.35); }
    @media (max-height: 520px) and (min-aspect-ratio: 4/3) {
      #result { flex-direction: row; align-items: baseline; gap: .5em; }
      #result b { font-size: clamp(40px, 11vmin, 90px); }
    }
    #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    /* ゲーム画面は下まで描き、ボタンは下の80pxを空けて上に重ねる（Xアプリ内ブラウザの投稿文で隠れるため） */
    #controls { position: fixed; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom)); display: flex; gap: 8px; padding: 8px 12px 0; max-width: 640px; width: 100%; margin: 0 auto; }
    #controls button, #controls a {
      flex: 1; height: clamp(56px, 8vmin, 72px); border: none; border-radius: 14px; font-size: clamp(18px, 3vmin, 24px); font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none;
      touch-action: manipulation;
    }
    .go { background: #c8281e; color: #fff; box-shadow: 0 4px 0 #6e1410; }
    .post { background: #111; color: #fff; box-shadow: 0 4px 0 #000; flex: 0 0 34% !important; font-size: clamp(16px, 2.6vmin, 20px) !important; }
    #controls button:active, #controls a:active { transform: translateY(3px); box-shadow: none; }
    #controls.hide { visibility: hidden; }
  </style>
</head>
<body>
  <header>
    <a id="back" href="#">← トップへ戻る</a>
    <button id="sound" aria-label="sound"></button>
    <select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="ko">한국어</option><option value="en">English</option><option value="th">ไทย</option></select>
  </header>
  <div id="stage"><div class="bubble" id="b1"></div><div class="bubble" id="b2"></div><div class="bubble spiky" id="b3"></div><div class="bubble spiky" id="b4"></div><div class="bubble" id="b5"></div><div id="result"><span></span><b></b></div><div id="msg"></div></div>
  <div id="controls"></div>

  <script type="importmap">{ "imports": {
    "three": "./vendor/three.module.js"
  } }</script>
  <script>
    // CDN が読めないときの一言
    setTimeout(() => { if (!window.GAME_READY) { const m = document.getElementById('msg'); m.style.display = 'flex'; m.textContent = 'Failed to load. Please reload. / 読み込めませんでした。再読み込みしてください。'; } }, 8000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    window.GAME_READY = true;

    const pageUrl = () => new URL('./', location.href).href;

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('hanko-hankouki:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('hanko-hankouki:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const sec = s => s.toFixed(1);
    const DICT = {
      ja: {
        title: 'ハンコう期', back: '← トップへ戻る', again: 'もう一度', post: '結果をシェア',
        say1: 'ハンコお願いします', say2: 'どれどれ', say3: '…', say4: 'よし', otsu: 'お疲れ様です！', umu: 'うむ',
        v1: 'aooeaiiau', v2: 'oeoe', v4: 'oi',
        lbl: '押されるまで', time: s => `${sec(s)}秒`,
        share: s => `${sec(s)}秒 ハンコから逃げ切った #ハンコう期`,
      },
      ko: {
        title: '도장 반항기', back: '← 처음으로', again: '다시 하기', post: 'X에 게시',
        say1: '도장 부탁드립니다', say2: '어디 보자', say3: '…', say4: '좋아', otsu: '수고하십니다!', umu: '음',
        v1: 'oaueaeiia', v2: 'eioa', v4: 'oa',
        lbl: '찍히기까지', time: s => `${sec(s)}초`,
        share: s => `${sec(s)}초 동안 도장을 피했다 #ハンコう期`,
      },
      en: {
        title: 'Stamp Rebellion', back: '← Back to top', again: 'Play again', post: 'Post on X',
        say1: 'Your stamp, please.', say2: "Let's see...", say3: '...', say4: 'Right.', otsu: 'Good day, sir!', umu: 'Hm.',
        v1: 'oaaie', v2: 'eiei', v4: 'ai',
        lbl: 'Dodged for', time: s => `${sec(s)}s`,
        share: s => `Dodged the stamp for ${sec(s)}s #ハンコう期`,
      },
      th: {
        title: 'วัยต่อต้านตราประทับ', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X',
        say1: 'ขอตราประทับด้วยครับ', say2: 'ไหนดูซิ', say3: '…', say4: 'โอเค', otsu: 'สวัสดีครับท่าน!', umu: 'อืม',
        v1: 'ooaaaauai', v2: 'aiui', v4: 'oe',
        lbl: 'รอดได้', time: s => `${sec(s)} วินาที`,
        // ไทย: กริยา → กรรม → เวลา
        share: s => `หนีตราประทับได้ ${sec(s)} วินาที #ハンコう期`,
      },
    };
    let lang = 'ja';
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    const b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
    const b3 = document.getElementById('b3'), b4 = document.getElementById('b4'), b5 = document.getElementById('b5');
    let b2Key = 'say2';
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      b1.textContent = t('say1'); b2.textContent = t(b2Key);
      b3.textContent = b4.textContent = t('otsu'); b5.textContent = t('umu');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }
    function sayB2(key) { b2Key = key; b2.textContent = t(key); b2.style.display = 'block'; }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null;
    // iPhone の消音モード（マナーモード）でも鳴らす: 音の種類を「再生」にし、
    // 対応していない端末では無音の <audio> をループ再生して同じ扱いにしてもらう
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const on = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    function noise(dur, vol, freq, type = 'lowpass', q = 1, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
      const s = ac.createBufferSource(); s.buffer = buf;
      const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
      const g = ac.createGain(); g.gain.value = vol;
      s.connect(fl).connect(g).connect(ac.destination); s.start(now);
    }
    // 声: 声帯の振動（のこぎり波＋息）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], n: [280, 1000, 2400] };
    // 1文をしゃべる: 母音を1拍ずつ切り替え、拍の間で音量を落とす。抑揚は高く出て下がる（rise で語尾を上げる）
    function speak(f0, vowels, mora = 0.13, vol = 0.45, rise = 0, delay = 0) {
      if (!on()) return;
      const seq = vowels.split(''), n = seq.length, dur = n * mora, now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.2, now);
      o.frequency.linearRampToValueAtTime(f0 * 1.35, now + mora * 1.5);
      o.frequency.linearRampToValueAtTime(f0 * 0.9, now + dur * 0.85);
      o.frequency.linearRampToValueAtTime(f0 * (0.75 + rise), now + dur);
      const vib = ac.createOscillator(); vib.frequency.value = 5 + Math.random() * 2;
      const vg = ac.createGain(); vg.gain.value = f0 * 0.03; vib.connect(vg).connect(o.frequency);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const ng = ac.createGain(); ng.gain.value = 0.15;
      const src = ac.createGain(); o.connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain(); out.gain.setValueAtTime(0, now);
      for (let i = 0; i < n; i++) {
        const t0 = now + i * mora * (0.9 + Math.random() * 0.2) * (i ? 1 : 0);
        out.gain.linearRampToValueAtTime(vol * (i === n - 1 ? 0.8 : 1), t0 + mora * 0.25);
        out.gain.linearRampToValueAtTime(vol * 0.35, t0 + mora * 0.95);
      }
      out.gain.linearRampToValueAtTime(0.0001, now + dur + 0.05);
      const k = f0 > 260 ? 1.15 : 1;
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * k, now + si * mora + (si ? mora * 0.3 : 0)));
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); vib.start(now); ns.start(now);
      o.stop(now + dur + 0.1); vib.stop(now + dur + 0.1); ns.stop(now + dur + 0.1);
      return dur;
    }
    // ハンコの「ポン」: 紙と机に当たる短い音を共鳴に通し、机の低い胴鳴りを足す
    function sStamp(k = 1) {
      if (!on()) return;
      noise(0.04, 0.55 * k, 1900 / Math.sqrt(k), 'bandpass', 1.4);
      noise(0.03, 0.3 * k, 3400, 'bandpass', 3);
      noise(0.14, 0.45 * k, 380);
      tone('sine', 150 / Math.sqrt(k), 55, 0.18 * k, 0.55 * Math.min(1.3, k));
    }
    const sWhoosh = (k = 1) => { noise(0.1, 0.12 * k, 900, 'bandpass', 0.7); };
    const sPof = () => { noise(0.08, 0.3, 700); tone('sine', 180, 90, 0.06, 0.12); };
    const sPaper = () => { noise(0.35, 0.18, 3500, 'highpass', 0.7); noise(0.2, 0.12, 5000, 'bandpass', 1, 0.15); };
    const sPaw = () => { noise(0.05, 0.3, 600); tone('sine', 260, 140, 0.06, 0.15); };
    // 声の高さ: 課長は低め、部下は若い声、部長はさらに低く、社長は重々しく、枠はか細く高い声、猫は高い
    const F_KACHO = 102, F_BUKA = 150, F_BUCHO = 82, F_SHACHO = 92, F_WAKU = 340, F_CAT = 560;

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4; return tx; };
    scene.background = new THREE.Color('#d9dde2');
    scene.fog = new THREE.Fog('#d9dde2', 5, 13);
    const FOV = 36;
    const camera = new THREE.PerspectiveCamera(FOV, 1, 0.05, 60);
    scene.add(new THREE.HemisphereLight('#eaf3ff', '#6a5a48', 1.0));
    // 窓からの暖かい光
    const sun = new THREE.DirectionalLight('#fff0d8', 2.3); sun.position.set(-2.2, 5, 2.6);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4; sun.shadow.bias = -0.0005;
    Object.assign(sun.shadow.camera, { left: -2.2, right: 2.2, top: 2.2, bottom: -2.2, near: 0.5, far: 12 });
    scene.add(sun);

    const mat = (c, rough = 0.75, extra) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, ...extra });
    const shade = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
    const SPH = new THREE.SphereGeometry(1, 28, 18), CYL = new THREE.CylinderGeometry(1, 1, 1, 24), BOX = new THREE.BoxGeometry(1, 1, 1);
    const CAPS = new THREE.CapsuleGeometry(1, 1, 8, 20);
    const part = (geo, m, x, y, z, sx, sy = sx, sz = sx, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); parent?.add(o); return o; };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const clamp = THREE.MathUtils.clamp;
    const easeOut = k => 1 - (1 - k) * (1 - k);

    // 机と書類の大きさ
    const TOPY = 0.75;                 // 机の天板の高さ
    const PW = 1.0, PD = 0.72, PZ = 0.05; // 書類の幅・奥行き・中心
    const PX0 = -PW / 2, PZ0 = PZ - PD / 2;
    const F = 0.063;                   // 押印欄（枠）の半分の大きさ
    const PXU = 1000;                  // 書類のテクスチャ: 1単位あたりの画素数

    // 部屋: カーペット・壁・窓・棚・観葉植物
    {
      const carpet = canvasTex(256, 256, (c, w, h) => {
        c.fillStyle = '#6c7684'; c.fillRect(0, 0, w, h);
        for (let i = 0; i < 6000; i++) { c.fillStyle = `rgba(${Math.random() < .5 ? '30,36,48' : '200,210,220'},${Math.random() * 0.12})`; c.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5); }
        c.strokeStyle = 'rgba(30,36,48,.25)'; c.lineWidth = 2; c.strokeRect(1, 1, w - 2, h - 2);
      });
      carpet.wrapS = carpet.wrapT = THREE.RepeatWrapping; carpet.repeat.set(30 / 0.6, 14 / 0.6);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 14), new THREE.MeshStandardMaterial({ map: carpet, roughness: 1 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      const wallTex = canvasTex(256, 256, (c, w, h) => {
        const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#f1ede4'); gr.addColorStop(1, '#e2dccf'); c.fillStyle = gr; c.fillRect(0, 0, w, h);

    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TOPY), ndc = new THREE.Vector2(), hitP = new THREE.Vector3();

      if (c.kind === 'paw') sPaw(); else sStamp(c.snd);
      shake = Math.max(shake, c.shake);
      burst(V(s.pos.x, TOPY + 0.01, s.pos.z), c.kind === 'square' ? 14 : 7, '#c8281e', c.kind === 'square' ? 0.9 : 0.6, 0.004, 0.35, 0.5, 4);
      burst(V(s.pos.x, TOPY + 0.01, s.pos.z), 4, '#f4f0e4', 0.4, 0.006, 0.4, 0.3, 1);

      const d = Math.hypot(s.pos.x - frame.x, s.pos.z - frame.z);
      if (d < c.R + F * 1.8) {
        frame.shiver = 0.4;
        if (frame.voiceCd <= 0) { speak(F_WAKU * rnd(0.95, 1.1), pick(['i', 'ia', 'ii']), 0.08, 0.25, 0.3); frame.voiceCd = 0.8; }
      }
      if (s.id === 'kacho' && Math.random() < 0.25) talk(kacho, speak(F_KACHO, pick(['un', 'u', 'nn']), 0.1, 0.3, -0.1));
      if (s.id === 'bucho') talk(bucho, speak(F_BUCHO, pick(['u', 'un']), 0.12, 0.4, -0.1));
      if (s.id === 'shacho') talk(shacho, speak(F_SHACHO, pick(['uu', 'un']), 0.16, 0.45, -0.15));
    }
    function gameOver(s) {
      state = 'over'; overT = 0; hitBy = s;
      sStamp(s.cfg.snd * 1.3);
      speak(F_WAKU, 'iaa', 0.1, 0.35, 0.5);
      shake = Math.max(shake, 0.02);

    function stepStamper(s, dt) {
      const c = s.cfg; s.t += dt;
      s.prev.copy(s.pos);
      const p = params(s.id);

          const tx = clampX(frame.x + frame.vx * (lockT + 0.06) * p.lead + s.err.x), tz = clampZ(frame.z + frame.vz * (lockT + 0.06) * p.lead + s.err.y);

    }

    const STEP = 1 / 60;
    function step(dt) {
      frame.px = frame.x; frame.pz = frame.z;
      if (state === 'intro') {
        const t0 = introT; introT += dt;
        const at = x => t0 < x && introT >= x;
        if (at(0.4)) { b1.style.display = 'block'; talk(buka, speak(F_BUKA, t('v1'), 0.12, 0.45, 0.1)); }

        if (at(4.0)) { sayB2('say3'); viewName = 'stare'; }
        if (at(5.6)) { sayB2('say4'); talk(kacho, speak(F_KACHO, t('v4'), 0.16, 0.5, -0.05)); st.kacho.phase = 'hover'; st.kacho.t = 0; }
        if (at(6.0)) { speak(F_WAKU, 'i', 0.1, 0.3, 0.5); frame.shiver = 0.5; }
        if (introT >= 6.8) { toReady(false); }
      }
      if (state === 'ready') { readyT += dt; if (readyT > 1.2) b2.style.display = 'none'; }
      if (state === 'play') {
        // 社長の登場中は手が止まる

      const bowT = pauseT > 0.3 && pauseT < 2.2 ? 1 : 0;
      const showOtsu = state === 'play' && pauseT > 1.2 && pauseT < 2.2, showUmu = state === 'play' && pauseT > 0.05 && pauseT <= 1.2;
      for (const [el, on] of [[b3, showOtsu], [b4, showOtsu], [b5, showUmu]]) { const d = on ? 'block' : 'none'; if (el.style.display !== d) el.style.display = d; }

        let kx = 0, kz = 0;

        if (kx || kz) {

    // ---------- 画面 ----------
    const resultEl = document.getElementById('result');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', () => start(false));
      controls.append(b);
      const a = document.createElement('button');
      a.type = 'button'; a.className = 'post'; a.textContent = t('post');
      a.addEventListener('click', async () => {
        const text = `${t('share')(elapsed)} ${pageUrl()}`;
        const file = shareFile();
        if (navigator.share) {
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text };
          try { await navigator.share(data); return; } catch (e) { if (e && e.name === 'AbortError') return; }
        }

    // 結果画像: 押された枠のまわりを切り抜き、秒数を重ねる

      const side = Math.min(src.width, src.height);
      const sx = clamp(fx2 - side / 2, 0, src.width - side), sy = clamp(fy2 - side * 0.45, 0, src.height - side);

    }
    function resultImage() {

      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {

      };

    }
    function prepareShare() {
      if (!snap) return;

    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() { resultEl.children[0].textContent = t('lbl'); resultEl.children[1].textContent = t('time')(elapsed); }

    // ---------- 描画 ----------
    const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
    const POLE_R = V(1, -1, -0.6), POLE_L = V(-1, -1, -0.6), POLE_BUKA = V(0.6, -1, -0.6), POLE_DOWN = V(0, -1, 0.3);
    function placeBubble(el, obj, dy) {
      if (el.style.display !== 'block') return;
      obj.getWorldPosition(tmpV); tmpV.y += dy; tmpV.project(camera);
      const r = stage.clientWidth;
      let x = (tmpV.x + 1) / 2 * r, y = (1 - tmpV.y) / 2 * stage.clientHeight;

    const sidePos = (p, s) => p.g.localToWorld(tmpV2.set(s * 0.24, 0.86, 0.06)).clone();
    function render(alpha) {
      // 書類: 部下の手から机へ
      const pk = easeOut(paperT);

      paperG.position.lerpVectors(held, PAPER_HOME, pk);
      paperG.position.y += Math.sin(pk * Math.PI) * 0.08;
      paperG.rotation.set(-0.9 * (1 - pk), 0, 0.35 * (1 - pk));

      // 部長

        reach(p, p.arms[b.arm], ready ? V(hp[id].x, hp[id].y + s.top + 0.02, hp[id].z) : sidePos(p, b.arm ? 1 : -1), b.pole);

      }

      catFace.quaternion.copy(camera.quaternion);
      catFace.rotation.z += (st.cat.phase === 'aim' || st.cat.phase === 'lock') ? Math.sin(now * 20) * 0.05 : 0;

      updateCamera(lastDt);
      renderer.render(scene, camera);
      placeBubble(b1, buka.head, 0.26); placeBubble(b2, kacho.head, 0.26);
      placeBubble(b3, buka.head, 0.3); placeBubble(b4, bucho.head, 0.3); placeBubble(b5, shacho.head, 0.32);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    let last = performance.now(), acc = 0, lastDt = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; lastDt = dt;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    resize();
    applyLang();
    start(true);
    // 最初の1回が重くならないように、全部の形を一度描いておく
    { for (const id of ORDER) { st[id].g.visible = true; st[id].tele.visible = true; } bucho.g.visible = shacho.g.visible = true; updateCamera(0); renderer.compile(scene, camera); renderer.render(scene, camera); drawSeal(st.kacho, 0, 0, 0, 1); reset(); }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
