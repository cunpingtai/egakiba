<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ハンバーグ作り</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://egakiba.com/hamburg/">
<meta name="theme-color" content="#c4472f">
<script src="nozoom.js"></script>
<script src="unmute.js"></script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root { --ink: #2b2b2b; --red: #ff4d5e; --yellow: #ffd23f; --cream: #fff6e3; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cream); font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; color: var(--ink); overscroll-behavior: none; }
  #c { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; z-index: 1; }
  .top { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
  .pill { pointer-events: auto; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 900; font-size: 14px; text-decoration: none; color: inherit; box-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
  #step { font-size: 14px; }
  #recipe { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); width: min(380px, calc(100vw - 20px)); max-height: 52vh; overflow: auto; background: #fffdf6; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); padding: 10px 12px; z-index: 8; font-weight: 700; font-size: 13px; line-height: 1.5; }
  #recipe.hide { display: none; }
  #recipe .rc-ing { margin: 6px 0; padding: 6px 8px; background: #fff3d6; border-radius: 10px; font-size: 12.5px; }
  #recipe ol { margin: 4px 0 6px; padding-left: 20px; }
  #recipe li { padding: 1px 0; color: #555; }
  #recipe li.now { color: var(--ink); background: #ffe36e; border-radius: 6px; font-weight: 900; }
  #guide { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); width: min(460px, calc(100vw - 20px)); background: rgba(255,255,255,.93); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink); padding: 6px 10px; text-align: center; z-index: 6; pointer-events: none; }
  #guide:empty { display: none; }
  #toast { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); background: rgba(20,20,20,.88); color: #fff; padding: 9px 16px; border-radius: 12px; font-size: 15px; font-weight: 900; opacity: 0; transition: opacity .2s; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); text-align: center; z-index: 20; }
  #toast.show { opacity: 1; }
  #panel { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(460px, calc(100vw - 20px)); background: #fff; border: 4px solid var(--ink); border-radius: 20px; box-shadow: 5px 5px 0 var(--ink); padding: 10px 12px 12px; text-align: center; z-index: 6; }
  #panel.hide { display: none; }
  .hint { font-weight: 800; font-size: 13px; margin: 0 0 8px; color: #555; }
  .tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .ing { position: relative; border: 2.5px solid var(--ink); border-radius: 12px; background: #fffaf0; padding: 4px 0 3px; touch-action: none; cursor: grab; }
  .ing b { display: block; font-size: 26px; line-height: 1.15; pointer-events: none; }
  .ing span { display: block; font-size: 10px; font-weight: 900; line-height: 1.15; pointer-events: none; white-space: nowrap; }
  .ing i { position: absolute; top: -8px; right: -6px; min-width: 20px; height: 20px; border-radius: 99px; background: var(--red); color: #fff; font-style: normal; font-size: 12px; font-weight: 900; line-height: 20px; border: 2px solid var(--ink); display: none; pointer-events: none; }
  .ing.has i { display: block; }
  .ing.joke { background: #f3f0ff; }
  .btns { display: flex; gap: 8px; }
  .btn { flex: 1; border: 3px solid var(--ink); border-radius: 14px; background: #fff; font: inherit; font-weight: 900; font-size: 16px; padding: 11px 6px; box-shadow: 3px 3px 0 var(--ink); color: var(--ink); cursor: pointer; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.go { background: var(--red); color: #fff; }
  .btn.yel { background: var(--yellow); }
  .btn:disabled { opacity: .45; }
  .meter { height: 14px; border: 3px solid var(--ink); border-radius: 99px; overflow: hidden; background: #f1ebe0; margin: 2px 0 10px; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb347, #ff5a5f); }
  #ghost { position: fixed; left: 0; top: 0; font-size: 46px; pointer-events: none; transform: translate(-50%, -60%); z-index: 30; display: none; filter: drop-shadow(2px 4px 0 rgba(0,0,0,.25)); }
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .ov.hide { display: none; }
  .card { width: min(420px, 100%); background: #fff; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); padding: 18px 16px; text-align: center; }
  .card h1 { margin: 2px 0 6px; font-size: 26px; }
  .card p { margin: 6px 0; font-weight: 700; font-size: 14px; line-height: 1.55; }
  .card .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  #title { background: rgba(255,246,227,.55); }
  #result { align-items: flex-end; padding-bottom: max(12px, env(safe-area-inset-bottom)); pointer-events: none; }
  #result .card { pointer-events: auto; padding: 12px 14px 14px; }
  .score { font-size: 46px; font-weight: 900; line-height: 1; margin: 2px 0; }
  .score small { font-size: 18px; }
  .rank { display: inline-block; background: var(--yellow); border: 3px solid var(--ink); border-radius: 99px; padding: 3px 12px; font-weight: 900; font-size: 15px; }
  .comments { text-align: left; margin: 10px 0 4px; padding: 0; list-style: none; max-height: 24vh; overflow: auto; }
  .comments li { font-weight: 800; font-size: 14px; padding: 3px 0; border-bottom: 1px dashed #ddd; }
  .comments li.bad { color: #d63c3c; }
  .comments li.good { color: #1d8f4e; }
  .row3 { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <a class="pill" href="/" target="_top">‹ 一覧</a>
  <button class="pill" id="recipeBtn" style="font:inherit;font-weight:900;font-size:13px;cursor:pointer">📖 レシピ</button>
  <div class="pill" id="step">🍳 ハンバーグ作り</div>
</div>
<div id="recipe" class="hide"></div>
<div id="guide"></div>
<div id="toast"></div>
<div id="ghost"></div>
<div id="panel" class="hide"></div>

<div id="title" class="ov">
  <div class="card">
    <div style="font-size:54px;line-height:1">🍳</div>
    <h1>ハンバーグ作り</h1>
    <p>玉ねぎを<b>スパスパ切って</b>、材料を<b>手でボウルに入れて</b>、こねて、形を作って、焼く！<br>玉ねぎまるごと入れても、こがしても、それはそれで思い出。</p>
    <div class="stack">
      <button class="btn go" id="startBtn">つくる！</button>
    </div>
  </div>
</div>

<div id="result" class="ov hide">
  <div class="card">
    <div class="rank" id="rankName"></div>
    <div id="hamName" style="font-weight:900;font-size:17px;line-height:1.35;margin:8px 4px 2px;color:#b8321f"></div>
    <div class="score" id="scoreNum"></div>
    <div class="row3">
      <button class="btn" id="shareBtn">共有</button>
      <button class="btn" id="saveBtn">📷 画像</button>
    </div>
    <div class="row3">
      <button class="btn go" id="againBtn">もう一回つくる</button>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script src="ConvexHull.js"></script>
<script src="ConvexGeometry.js"></script>
<script src="cut3d.js"></script>
<script src="bowl3d.js"></script>
<script src="plate3d.js"></script>
<script src="pan3d.js"></script>
<script src="toss3d.js"></script>
<script src="board3d.js"></script>
<script src="app.js"></script>
</body>
</html>
