<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4aa3dc">
<meta name="robots" content="noindex,follow">
<title>都道府県ダービー</title>
<meta name="description" content="支出額トップの県を当てる競馬風ゲーム">
<meta property="og:title" content="都道府県ダービー">
<meta property="og:description" content="支出額トップの県を当てる競馬風ゲーム">
<meta property="og:url" content="https://egakiba.com/prefecture-derby/">
<link rel="canonical" href="https://egakiba.com/prefecture-derby/">
<link rel="icon" href="./favicon.svg">
<style>
  :root{
    --sky:#4aa3dc; --sky2:#a6daf6;
    --board:#111418; --led:#ffb300; --led-dim:#6b4d00;
    --paper:#fffaf0; --ink:#1b1b1b; --sub:#6d6a63; --line:#e6dfcf;
    --gold:#f5c542; --gold2:#e0a100; --red:#d7263d; --win:#1fa35b;
    --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation;font:inherit;color:inherit} /* ダブルタップ拡大を無効化（連打しても取りこぼさない） */
  [hidden]{display:none !important}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    color:var(--ink);
    background:
      linear-gradient(var(--sky), var(--sky2));
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    font-feature-settings:"palt";
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;margin:0 auto}
  section{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  p{margin:0}
  .num{font-variant-numeric:tabular-nums}

  /* 電光掲示板ふうの上部 */
  .board{display:flex;justify-content:space-between;align-items:center;margin:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;padding:8px 14px;background:var(--board);border:2px solid #2a2f36;border-radius:10px;box-shadow:inset 0 0 0 1px #000,0 4px 0 rgba(0,0,0,.35)}
  .board .lbl{font-size:11px;color:#9aa3ad;letter-spacing:.08em}
  .board .led{font-weight:900;color:var(--led);text-shadow:0 0 8px rgba(255,179,0,.55)}
  .board .race .led{font-size:22px}
  .board .race small{font-size:13px;color:var(--led-dim);font-weight:bold;margin-left:2px}
  .board .pts{text-align:right}
  .board .pts .led{font-size:24px}

  /* お題（出馬表の見出し） */
  .q{position:relative;margin:0 12px 10px;padding:12px 14px 12px;background:var(--paper);border-radius:var(--radius);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .q .item{margin-top:0;font-size:22px;font-weight:900;line-height:1.3}
  .q .ask{margin-top:2px;font-size:13px;color:var(--sub)}
  .q.small{margin-top:10px;padding:10px 14px}
  .q.small .item{font-size:18px}

  .btn{display:block;width:100%;min-height:56px;font-size:20px;font-weight:900;letter-spacing:.06em;border:0;border-radius:var(--radius);color:#3a2600;background:linear-gradient(#ffd966,var(--gold) 45%,var(--gold2));box-shadow:0 4px 0 #8a5d00,inset 0 1px 0 rgba(255,255,255,.6)}
  .btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d00,inset 0 1px 0 rgba(255,255,255,.6)}
  .btn:disabled{color:#8b8f95;background:#3a4047;box-shadow:0 4px 0 #22272c}

  /* 出馬表 */
  /* お題と出馬表は上下の中央に寄せる（入りきらないときはスクロール） */
  .mid{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:8px 0}
  .mid > :first-child{margin-top:auto}
  .mid > :last-child{margin-bottom:auto}
  #horses{display:flex;flex-direction:column;gap:6px;padding:0 12px}
  .horse{flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;grid-template-areas:"gate name odds step" "gate ret odds step";column-gap:8px;align-items:center;min-height:60px;padding:0 6px 0 0;background:var(--paper);border:2px solid transparent;border-radius:10px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .horse.on{border-color:var(--gold);background:#fff4cc}
  .gate{grid-area:gate;align-self:stretch;display:grid;place-items:center;font-size:22px;font-weight:900;border-right:1px solid rgba(0,0,0,.12)}
  .g1{background:#fff;color:#111} .g2{background:#1b1b1b;color:#fff} .g3{background:#e53935;color:#fff} .g4{background:#1e63d6;color:#fff} .g5{background:#fdd835;color:#111}
  .horse .name{grid-area:name;align-self:end;font-size:19px;font-weight:900;line-height:1.25;white-space:nowrap}
  .horse .ret{grid-area:ret;align-self:start;font-size:11px;font-weight:bold;line-height:1.4;color:#a86b00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .horse:not(.on) .ret{display:none}
  .horse:not(.on) .name{grid-row:1 / span 2;align-self:center}
  .horse .odds{grid-area:odds;min-width:64px;padding:6px 8px;text-align:right;background:var(--board);border-radius:6px;font-size:19px;font-weight:900;line-height:1;color:var(--led);text-shadow:0 0 6px rgba(255,179,0,.5)}
  .horse .odds small{font-size:12px;font-weight:bold;margin-left:2px;color:#e8e2d0;text-shadow:none}
  .stepper{grid-area:step;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{width:36px;height:44px;font-size:22px;font-weight:bold;border:0;background:transparent}
  .stepper button:disabled{color:#d8d2c3}
  .stepper button:not(:disabled):active{background:#f2ead6}
  .stepper .amt{min-width:2.9em;text-align:center;font-size:15px;font-weight:900}

  .bar{padding:10px 12px calc(8px + env(safe-area-inset-bottom));background:#10263a;border-top:1px solid rgba(255,255,255,.08)}
  .sum{display:flex;justify-content:space-between;align-items:baseline;height:28px;line-height:28px;margin-bottom:10px;font-size:13px;color:#cfd6cf}
  .sum b{font-size:20px;color:var(--led);margin-left:6px;text-shadow:0 0 6px rgba(255,179,0,.45)}
  .round{margin-bottom:8px;text-align:center;font-size:14px;font-weight:900;color:var(--led);text-shadow:0 0 6px rgba(255,179,0,.45)}
  .round b{font-size:20px;margin:0 2px}
  .round small{margin-left:6px;font-size:14px;font-weight:bold;color:#e8e2d0;text-shadow:none}
  .credit{display:block;margin:4px 0 0 auto;padding:4px 2px 2px 12px;font-size:10px;line-height:1.4;color:rgba(255,255,255,.5);text-align:right;text-decoration:underline;background:none;border:0}
  /* お題の出題演出 */
  #intro{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 45%, #1d5a86, #081a2b 75%);text-align:center;transition:opacity .25s}
  #intro.out{opacity:0}
  .intro-inner{width:100%;max-width:380px}
  .intro-race{display:inline-block;padding:6px 18px;font-size:18px;font-weight:900;letter-spacing:.1em;color:var(--led);background:var(--board);border:2px solid #2a2f36;border-radius:8px;text-shadow:0 0 8px rgba(255,179,0,.55)}
  .intro-race b{font-size:26px;margin:0 2px}
  .intro-card{margin-top:26px;padding:20px 14px 16px;background:var(--paper);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 4px var(--gold)}
  .intro-item{font-size:34px;font-weight:900;line-height:1.25;color:var(--ink)}
  .intro-ask{margin-top:10px;font-size:15px;font-weight:bold;line-height:1.5;color:var(--sub)}
  .intro-tap{margin-top:30px;font-size:13px;color:rgba(255,255,255,.55)}
  #intro.play .intro-race{animation:inDrop .45s cubic-bezier(.2,1.4,.4,1) both}
  #intro.play .intro-card{animation:inStamp .5s .5s cubic-bezier(.2,1.5,.4,1) both}
  #intro.play .intro-tap{animation:inFade .3s 1.1s both}
  @keyframes inDrop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
  @keyframes inFade{from{opacity:0}to{opacity:1}}
  @keyframes inStamp{0%{transform:scale(2.2) rotate(-4deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes inUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  #creditBox{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.6)}
  .credit-title{font-size:16px;font-weight:900;margin-bottom:8px}
  .credit-full{font-size:13px;line-height:1.7;color:var(--ink);margin-bottom:16px;word-break:break-all;-webkit-user-select:text;user-select:text}

  /* レース画面 */
  #race{padding-bottom:env(safe-area-inset-bottom)}
  #cv{flex:1;min-height:0;width:100%;display:block;touch-action:none}
  .live{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;background:var(--board);border-top:2px solid #2a2f36}
  .live-tag{flex:none;margin-top:52px;padding:3px 8px;font-size:12px;font-weight:900;color:#fff;background:var(--red);border-radius:4px}
  .live-box{flex:1;min-width:0;height:78px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
  .live-list{transition:transform .3s ease-out}
  .live-list p{font-size:15px;line-height:26px;font-weight:bold;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-list p:last-child{font-size:16px;font-weight:900;color:#fff}

  /* レース結果 */
  #result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.55)}
  .card{width:100%;max-width:360px;background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.3);text-align:center}
  .card .head{padding:14px 12px 12px;background:#3a4047;color:#fff}
  .card .head.hit{background:linear-gradient(#ffd966,var(--gold) 50%,var(--gold2));color:#3a2600}
  #resMain{font-size:30px;font-weight:900;letter-spacing:.08em}
  #resNet{font-size:36px;font-weight:900;line-height:1.15}
  .card .body{padding:12px 16px 16px}
  #resSub{font-size:13px;color:var(--sub)}
  #order{width:100%;margin:10px 0 14px;border-collapse:collapse;font-size:15px}
  #order td{padding:7px 4px;vertical-align:middle;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
  #order td.r{text-align:right}
  #order td.rank{width:2.8em;font-weight:900}
  #order .chip{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:6px;font-size:12px;font-weight:900;border-radius:4px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  #order tr.first td{font-weight:900;background:#fff4cc}
  #order tr.mine .nm{color:#a86b00}
  #order .betmark{font-size:11px;font-weight:bold;color:#a86b00}

  /* 最終結果 */
  #final{align-items:center;justify-content:center;padding:18px}
  #final .card .head{padding:16px 12px;background:var(--board)}
  #finalLabel{font-size:14px;letter-spacing:.2em;color:#9aa3ad}
  #finalScore{margin:4px 0 2px;font-size:56px;font-weight:900;line-height:1.1;color:var(--led);text-shadow:0 0 12px rgba(255,179,0,.6)}
  #finalSub{margin-bottom:16px;font-size:14px;color:var(--sub)}
  #final .credit{margin-top:8px;color:var(--sub)}
  .btn.share{margin-bottom:12px;color:#fff;background:#1e63d6;box-shadow:0 4px 0 #0d3c8a}

  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div id="intro" hidden>
    <div class="intro-inner">
      <p class="intro-race">第<b class="num" id="introRace"></b>レース</p>
      <div class="intro-card">
        <p class="intro-item" id="introItem"></p>
        <p class="intro-ask" id="introAsk"></p>
      </div>
      <p class="intro-tap">タップで次へ</p>
    </div>
  </div>

  <section id="bet">
    <div class="mid">
      <div class="q">
        <p class="item js-item"></p>
        <p class="ask js-ask"></p>
      </div>
      <div id="horses"></div>
    </div>
    <div class="bar">
      <div class="sum" id="sum">
        <span>賭け金<b class="num" id="total"></b></span>
        <span>残り<b class="num" id="left"></b></span>
      </div>
      <p class="round">第<b class="num js-race"></b>レース<small>/ <span class="js-races"></span></small></p>
      <button id="start" class="btn" type="button" disabled>スタート！</button>
      <button type="button" class="credit js-credit">出典</button>
    </div>
  </section>

  <section id="race" hidden>
    <div class="q small">
      <p class="item js-item"></p>
      <p class="ask js-ask"></p>
    </div>
    <canvas id="cv"></canvas>
    <div class="live"><span class="live-tag">実況</span><div class="live-box"><div class="live-list" id="liveList"></div></div></div>
    <div id="result" hidden>
      <div class="card">
        <div class="head" id="resHead">
          <p id="resMain" aria-live="polite"></p>
          <p id="resNet" class="num"></p>
        </div>
        <div class="body">
          <p id="resSub"></p>
          <table id="order"></table>
          <button id="next" class="btn" type="button"></button>
        </div>
      </div>
    </div>
  </section>

  <div id="creditBox" hidden>
    <div class="card">
      <div class="body" style="padding:18px 16px 16px;text-align:left">
        <p class="credit-title">出典</p>
        <p class="credit-full">総務省統計局「家計調査（二人以上の世帯）品目別都道府県庁所在市及び政令指定都市ランキング（2023年〜2025年平均）」を加工して作成。品目は穀類・魚介類・肉類・乳卵類・生鮮野菜・乾物/海藻/大豆加工品等・果物の各品目（「乾めん」は「乾うどん・そば」で、そうめん・冷麦を含む）。各都道府県の値は県庁所在市（東京都は東京都区部）の値。</p>
        <button id="creditClose" class="btn" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <section id="final" hidden>
    <div class="card">
      <div class="head">
        <p id="finalLabel">SCORE</p>
        <p id="finalScore" class="num"></p>
      </div>
      <div class="body" style="padding:14px 16px 16px">
        <p id="finalSub"></p>
        <button id="share" class="btn share" type="button">共有</button>
        <button id="restart" class="btn" type="button">もう一回</button>
        <button type="button" class="credit js-credit">出典</button>
      </div>
    </div>
  </section>
</div>
<script>
(() => {
  'use strict';

  // ---------- 定数 ----------
  const RACES = 3;           // 1ゲームのレース数
  const START_POINTS = 1000; // 最初の持ち点

    f.forEach((h, i) => {
      // 小数の誤差（100×4.1=409.99…）を避けるため、オッズは10倍した整数で持つ
      h.odds10 = Math.min(Math.round(ODDS_MAX * 10), Math.max(Math.round(ODDS_MIN * 10), Math.floor(ODDS_RETURN * sum / s[i] * 10)));
    });
  }

  function gauss(){
    const u = 1 - Math.random(), v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 上部（レース数・持ち点）とお題の表示（賭ける画面・レース画面の両方）
  function updateHeader(){
    $$('.js-race').forEach(e => { e.textContent = raceNo; });
    $$('.js-races').forEach(e => { e.textContent = RACES; });
    $$('.js-points').forEach(e => { e.textContent = fmt(points); });
    $$('.js-item').forEach(e => { e.textContent = data.item; });
    $$('.js-ask').forEach(e => { e.textContent = `1世帯あたり年間${data.label}がいちばん多い都道府県は？`; });
  }

  // ---------- お題の出題演出 ----------
  // レースごとに「第◯レース」の札のあと、品目と問いかけを1枚のカードで一気に出す。タップで閉じる（しばらくすると自動で閉じる）
  const INTRO_TIME = 3.4;    // 自動で閉じるまでの時間（秒）
  let introTimer = 0;

  function showIntro(){
    const el = $('intro');
    $('introRace').textContent = raceNo;
    $('introItem').textContent = data.item;
    $('introAsk').textContent = `1世帯あたり年間${data.label}がいちばん多い都道府県は？`;
    el.hidden = false;
    el.classList.remove('play', 'out');
    void el.offsetWidth;
    el.classList.add('play');
    clearTimeout(introTimer);
    introTimer = setTimeout(hideIntro, INTRO_TIME * 1000);
  }

  function hideIntro(){
    const el = $('intro');
    if (el.hidden || el.classList.contains('out')) return;
    clearTimeout(introTimer);
    el.classList.add('out');
    setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 250);
  }

  // ---------- 賭ける画面 ----------
  // 持ち点を複数の県に振り分けて賭けられる（1着の県に賭けた分だけ 賭け金×オッズ が戻る）
  const totalBet = () => bets.reduce((a, b) => a + b, 0);
  const payout = (amount, h) => Math.floor(amount * h.odds10 / 10);  // 賭け金×オッズ（整数計算）

  function showBetScreen(){
    $('bet').hidden = false;
    $('race').hidden = true;
    $('final').hidden = true;
    updateHeader();
    const box = $('horses');
    box.textContent = '';
    field.forEach((h, i) => {
      const row = document.createElement('div');
      row.className = 'horse';
      row.innerHTML =
        `<span class="gate g${i + 1}">${i + 1}</span>` +
        `<span class="name"></span>` +
        `<span class="ret num"></span>` +
        `<span class="odds num">${(h.odds10 / 10).toFixed(1)}<small>倍</small></span>` +
        `<span class="stepper">` +
          `<button type="button" class="minus" aria-label="減らす">−</button>` +
          `<span class="amt num"></span>` +
          `<button type="button" class="plus" aria-label="増やす">＋</button>` +
        `</span>`;
      row.querySelector('.name').textContent = PREFS[h.p];
      row.querySelector('.minus').addEventListener('click', () => changeBet(i, -1));
      row.querySelector('.plus').addEventListener('click', () => changeBet(i, 1));
      box.appendChild(row);
    });
    updateBet();
  }

  function changeBet(i, dir){
    if (dir > 0){
      const left = points - totalBet();
      bets[i] += Math.min(BET_STEP, left);
    } else {
      bets[i] = bets[i] % BET_STEP ? bets[i] - bets[i] % BET_STEP : Math.max(0, bets[i] - BET_STEP);
    }
    updateBet();
  }

  function updateBet(){
    const total = totalBet();
    const left = points - total;
    [...$('horses').children].forEach((row, i) => {
      const b = bets[i];
      row.classList.toggle('on', b > 0);
      row.querySelector('.amt').textContent = fmt(b);
      row.querySelector('.ret').textContent = b > 0 ? `当たれば ${fmt(payout(b, field[i]))}` : '';
      row.querySelector('.minus').disabled = b <= 0;
      row.querySelector('.plus').disabled = left <= 0;
    });
    $('total').textContent = fmt(total);
    $('left').textContent = fmt(left);
    $('start').disabled = total <= 0;
  }

  // ---------- レース ----------
  // 各県の紙飛行機は実際の数値と同じ距離だけ飛んで着地する（数値が大きいほど遠くまで飛ぶ）。
  // みんな同じ速さで飛び出し、数値の小さい県から順に失速して着地していく。途中は揺らぎで抜きつ抜かれつ。
  function startRace(){
    if (mode !== 'bet' || $('start').disabled) return;
    mode = 'racing';
    points -= totalBet();
    $('bet').hidden = true;
    $('race').hidden = false;
    $('result').hidden = true;
    updateHeader();
    resize();
    const vmax = Math.max(...field.map(h => h.value));
    scaleMax = niceCeil(vmax * 1.06);
    field.forEach(h => {
      h.dist = h.value / scaleMax;              // 止まる位置（コース全体を1とした割合）
      h.dur = T_MAX * h.value / vmax;           // 止まるまでの時間（距離に比例＝スタートの速さはみんな同じ）
      h.stopped = false;
      h.pos = 0;
      h.speed = 0;
      h.seed = Math.random() * Math.PI * 2;    // ふわふわ揺れる動きのずらし
      // 揺らぎ: 周期の異なる波を2つ。振幅の合計を1未満にして後退しないようにする
      const a1 = WOBBLE * (0.3 + Math.random() * 0.4);
      h.w = [
        { a:a1, k:2 + Math.floor(Math.random() * 2), p:Math.random() * Math.PI * 2 },
        { a:WOBBLE - a1, k:4 + Math.floor(Math.random() * 2), p:Math.random() * Math.PI * 2 }
      ];
    });
    planEvents();
    lastFin = Math.max(...field.map(stopTime));
    raceT = -START_WAIT;       // マイナスの間は発射前（待機）
    camX = 0;
    field.forEach(h => { h.trail = []; });
    live = { last:-9, leader:-1, started:false, finished:false, two:false, surged:new Set(), stopSaid:new Set() };
    setLive('まもなくスタートです', true);
  }

  // きりのいい数に切り上げる（1・2・2.5・5 × 10のべき乗）
  function niceStep(v){
    const e = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * e) return m * e;
    return 10 * e;
  }
  function niceCeil(v){
    const st = niceStep(v / 5);
    return Math.ceil(v / st) * st;
  }

  // 等速で走り、BRAKE_AT から先はなめらかに減速して s=1 でぴったり止まる（0〜1 → 0〜1）
  function brake(s){
    const m = 2 / (1 + BRAKE_AT), K = m / (2 * (1 - BRAKE_AT));
    return s < BRAKE_AT ? m * s : 1 - K * (1 - s) * (1 - s);
  }

  // u: 0〜1 の経過割合 → 0〜1 の位置。両端で 0 と 1 に一致し、単調に増える
  function progress(h, u){
    let x = u;
    for (const w of h.w){
      const K = 2 * Math.PI * w.k;
      x += w.a * (Math.sin(K * u + w.p) - Math.sin(w.p)) / K;
    }
    return x;
  }

  // ---------- イベント（追い風・向かい風・落石） ----------
  // イベントは各県の「時間の進み方」を一時的に早めたり遅らせたりするだけ。
  // 途中の順位は大きく動くが、着地点は必ず実際の数値の位置になる（決着は統計どおり）。
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  let evs = [];   // { type:'tail'|'head'|'rock', i:県, t0:始まる時刻, len:長さ, amt:時間の進め具合 }

  // 時刻 t での経過割合（0〜1）。イベントの分だけ進めたり遅らせたりする。必ず単調に増える
  function uAt(h, t){
    let u = Math.max(0, t) / h.dur;
    for (const e of h.warp) u += e.amt * smooth((t - e.t0) / e.len);
    return Math.min(1, Math.max(0, u));
  }
  const posAt = (h, t) => h.dist * brake(progress(h, uAt(h, t)));
  // 着地する時刻
  function stopTime(h){
    let a = 0, b = T_MAX * 3;
    for (let k = 0; k < 40; k++){ const m = (a + b) / 2; if (uAt(h, m) >= 1) b = m; else a = m; }
    return b;
  }
  const orderAt = t => field.map((h, i) => i).sort((a, b) => posAt(field[b], t) - posAt(field[a], t));
  // ほかのイベントと時間が重ならないか
  const freeAt = (t0, len) => evs.every(e => t0 > e.t0 + e.len + 1.2 || t0 + len + 1.2 < e.t0);

  // 1レースで1〜2個。起きる順（追い風 → 向かい風 → 落石）に決めていく
  function planEvents(){
    evs = [];
    field.forEach(h => { h.warp = []; });
    const n = Math.random() < 0.5 ? 1 : 2;
    const pick = shuffle(['tail', 'head', 'rock']).slice(0, n);
    for (const k of ['tail', 'head', 'rock']){
      if (!pick.includes(k)) continue;
      const e = k === 'tail' ? planTail() : k === 'head' ? planHead() : planRock();
      if (e){ e.said = 0; evs.push(e); field[e.i].warp.push(e); }
    }
    // 条件が合わず1つも起きなかったら、起きるものを探す
    if (!evs.length){
      for (const f of [planRock, planHead, planTail]){ const e = f(); if (e){ e.said = 0; evs.push(e); field[e.i].warp.push(e); break; } }
    }
  }

  // 追い風：序盤にビリ（だめなら5位の手前）を一気に押し出して先頭に立たせる
  function planTail(){
    const len = 0.9;
    for (const t0 of [1.2, 1.6, 2.0, 0.9]){
      if (!freeAt(t0, len)) continue;
      const o = orderAt(t0);
      for (const i of [o[RUNNERS - 1], o[RUNNERS - 2]]){
        const h = field[i];
        const t1 = t0 + len;
        if (uAt(h, t0) > 0.5) continue;
        const leadPos = Math.max(...field.filter((g, j) => j !== i).map(g => posAt(g, t1)));
        const u1 = uAt(h, t1);
        for (let amt = 0.05; u1 + amt <= 0.9; amt += 0.02){
          const e = { type:'tail', i, t0, len, amt, last: i === o[RUNNERS - 1] };
          h.warp.push(e);
          const ok = posAt(h, t1) >= leadPos + 0.035;
          h.warp.pop();
          if (ok) return e;
        }
      }
    }
    return null;
  }

  // 向かい風：中盤に先頭の県をしばらく失速させる
  function planHead(){
    const len = 1.4;
    for (const t0 of shuffle([3, 3.5, 4, 4.5, 5, 5.5])){
      if (!freeAt(t0, len)) continue;
      const i = orderAt(t0)[0];
      const h = field[i];
      if (uAt(h, t0 + len) > 0.8) continue;   // 着地間際ではやらない
      // 失速しても後ろへは戻らない強さにする
      return { type:'head', i, t0, len, amt: -Math.min(0.12, 0.8 * len / (1.5 * h.dur)) };
    }
    return null;
  }

  // 落石：着地が近づいた県に岩が当たり、その場で墜落する（画面に映っている県だけ）
  function planRock(){
    const len = 0.35;
    for (const i of shuffle(field.map((h, i) => i))){
      const h = field[i];
      for (let t0 = 2.5; t0 < T_MAX; t0 += 0.25){
        const u = uAt(h, t0);
        if (u < 0.84) continue;
        if (u > 0.93) break;
        if (!freeAt(t0 - 0.8, len + 0.8)) continue;
        const lead = Math.max(...field.map(g => posAt(g, t0)));
        if ((lead - posAt(h, t0)) * TRACK_SCREENS > 0.6) continue;
        return { type:'rock', i, t0, len, amt: 1 - u + 0.02 };
      }
    }
    return null;
  }

  // 風の筋（追い風は右へ、向かい風は左へ流れる）
  function drawWind(){
    for (const e of evs){
      if (e.type === 'rock') continue;
      const a = Math.min(1, (raceT - e.t0 + 0.2) / 0.3, (e.t0 + e.len + 0.4 - raceT) / 0.4);
      if (a <= 0) continue;
      const y0 = top + e.i * laneH;
      const dir = e.type === 'tail' ? 1 : -1;
      ctx.save();
      ctx.globalAlpha = a * 0.85;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (let k = 0; k < 9; k++){
        const span = W + 160;
        const x = ((k * 131 + dir * raceT * 900) % span + span) % span - 80;
        const y = y0 + laneH * (0.15 + 0.7 * ((k * 0.37) % 1));
        const l = 40 + (k * 23) % 40;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - dir * l, y); ctx.stroke();
      }
      // レーンの右下に風の名前
      ctx.font = `900 16px ${FONT}`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.55)';
      const label = e.type === 'tail' ? '追い風 →' : '← 向かい風';
      ctx.strokeText(label, W - 12, y0 + laneH - 12);
      ctx.fillStyle = e.type === 'tail' ? '#fff' : '#ffd1d1';
      ctx.fillText(label, W - 12, y0 + laneH - 12);
      ctx.restore();
    }
  }

  // 落石：空から落ちてきて紙飛行機に当たり、いっしょに地面へ落ちる
  const ROCK = [[1, 0], [0.7, 0.75], [-0.1, 0.95], [-0.85, 0.6], [-0.95, -0.2], [-0.4, -0.9], [0.5, -0.85]];
  function drawRock(){
    const len = planeLen();
    for (const e of evs){
      if (e.type !== 'rock') continue;
      const FALL = 0.7;
      const p = (raceT - (e.t0 - FALL)) / FALL;
      if (p < 0) continue;
      const d = field[e.i].draw;
      const r = len * 0.26;
      let x, y;
      if (p < 1){
        // 落ちてくる途中：地面に影で落ちる場所を知らせる
        x = d.x - len * 0.35;
        y = -r + (d.y - len * 0.12 + r) * p * p;
        ctx.fillStyle = `rgba(0,0,0,${0.1 + 0.2 * p})`;
        ctx.beginPath(); ctx.ellipse(x - camX, d.ground, r * (0.5 + 0.7 * p), 3.5, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        if (!e.hit) e.hit = { x: d.x - len * 0.35, y: d.y - len * 0.12 };
        const q = Math.min(1, (raceT - e.t0) / 0.35);
        x = e.hit.x - len * 0.6 * q;   // はじかれて紙飛行機の後ろに落ちる
        y = e.hit.y + (d.ground - r * 0.8 - e.hit.y) * q * q;
        // 当たった瞬間のはじける線
        const b = (raceT - e.t0) / 0.4;
        if (b < 1){
          ctx.save();
          ctx.strokeStyle = `rgba(255,220,80,${1 - b})`; ctx.lineWidth = 3; ctx.lineCap = 'round';
          for (let k = 0; k < 8; k++){
            const an = k * Math.PI / 4 + 0.3;
            const r0 = r * (1 + b * 1.2), r1 = r * (1.5 + b * 2);
            ctx.beginPath();
            ctx.moveTo(e.hit.x - camX + Math.cos(an) * r0, e.hit.y + Math.sin(an) * r0);
            ctx.lineTo(e.hit.x - camX + Math.cos(an) * r1, e.hit.y + Math.sin(an) * r1);
            ctx.stroke();
          }
          ctx.restore();
        }
      }
      const sx = x - camX;
      if (sx < -r * 2 || sx > W + r * 2) continue;
      ctx.save();
      ctx.translate(sx, y);
      ctx.rotate(Math.min(raceT, e.t0 + 0.35) * 2);   // 落ちている間だけ回る
      ctx.beginPath();
      ROCK.forEach(([a, b], k) => k ? ctx.lineTo(a * r, b * r) : ctx.moveTo(a * r, b * r));
      ctx.closePath();
      ctx.fillStyle = '#857a6d'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#3f372f'; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.35, r * 0.3, r * 0.18, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function update(dt){
    if (mode !== 'racing' && mode !== 'result') return;
    if (mode === 'racing') raceT += dt;
    for (const h of field){
      const prev = h.pos;
      const u = uAt(h, raceT);
      h.pos = h.dist * brake(progress(h, u));
      h.stopped = u >= 1;
      h.speed = (h.pos - prev) / Math.max(dt, 1e-3);
    }
    if (mode === 'racing') commentate();
    if (mode === 'racing' && raceT >= lastFin + END_WAIT) showResult();
  }

  // ---------- 実況 ----------
  let live = null;
  const COMMENT_GAP = 1.3;   // 実況を次に出すまでの最短の間（秒）

  // 実況は下に1行ずつ追加し、古い行は上へスライドして消えていく
  function setLive(text, reset){
    const list = $('liveList');
    if (reset) list.textContent = '';
    const line = document.createElement('p');
    line.textContent = text;
    list.appendChild(line);
    while (list.children.length > 4) list.removeChild(list.firstChild);
    // 長い行は1行に収まるまで文字を小さくする
    for (let fs = 16; fs > 11 && line.scrollWidth > line.clientWidth; fs--) line.style.fontSize = fs + 'px';
    const h = line.offsetHeight;
    list.style.transition = 'none';
    list.style.transform = `translateY(${h}px)`;
    void list.offsetWidth;
    list.style.transition = '';
    list.style.transform = 'none';
  }

  // いまの順位（前にいる順。同じ位置なら数値の大きい順）
  function currentOrder(){
    return field.map((h, i) => i).sort((a, b) => (field[b].pos - field[a].pos) || (field[b].value - field[a].value));
  }

  function commentate(){
    const say = (text, force) => {
      if (!force && raceT - live.last < COMMENT_GAP) return false;
      setLive(text); live.last = raceT; return true;
    };
    const nm = i => PREFS[field[i].p];
    const val = i => `${fmt(field[i].value)}${data.unit}`;
    const o = currentOrder();
    const a = o[0];
    const running = o.filter(i => !field[i].stopped);

    if (!live.started){ if (raceT > 0.2){ live.started = true; live.leader = a; say('5機いっせいに飛ばした！', true); } return; }
    if (live.finished) return;
    // イベントの実況（ほかの実況より優先）
    for (const e of evs){
      const n = nm(e.i);
      if (e.type === 'rock'){
        if (e.said === 0 && raceT >= e.t0 - 0.7){ e.said = 1; say('あっ！ 空から岩が降ってきた！', true); return; }
        if (e.said === 1 && raceT >= e.t0){ e.said = 2; live.stopSaid.add(e.i); say(`${n}に岩が直撃！ ${val(e.i)}で墜落！`, true); return; }
      } else if (e.type === 'tail'){
        if (e.said === 0 && raceT >= e.t0){ e.said = 1; say(`${e.last ? 'ビリの' : ''}${n}に追い風が吹いた！`, true); return; }
        if (e.said === 1 && raceT >= e.t0 + e.len * 0.8 && a === e.i){ e.said = 2; live.leader = e.i; live.surged.add(e.i); say(`${n}、一気に先頭に躍り出た！`, true); return; }
      } else if (e.said === 0 && raceT >= e.t0){
        e.said = 1; say(`先頭の${n}に向かい風！ 失速していく！`, true); return;
      }
    }
    // 全員着地した
    if (running.length === 0){
      live.finished = true;
      const second = o[1];
      const close = (field[a].value - field[second].value) / field[a].value < 0.02;
      say(close ? `わずかな差で${nm(a)}がいちばん遠くまで飛んだ！ ${val(a)}！` : `${nm(a)}がいちばん遠くまで飛んだ！ ${val(a)}！`, true);
      return;
    }
    // 着地した県（同時に着地した県はまとめて言う）
    const newly = o.filter(i => field[i].stopped && !live.stopSaid.has(i));
    if (newly.length){
      if (raceT - live.last > 0.6){
        newly.forEach(i => live.stopSaid.add(i));
        say(newly.length === 1 ? `${nm(newly[0])}、ここで着地！ ${val(newly[0])}` : `${newly.map(nm).join('と')}、ここで着地！`, true);
      }
      return;
    }
    // 残り2県
    if (running.length === 2 && !live.two){
      if (say(`残るは${nm(running[0])}と${nm(running[1])}！`, raceT - live.last > 0.6)) live.two = true;
      return;
    }
    // 賭けた県が2番手以内に上がってきた
    for (const i of o.slice(0, 2)){
      if (bets[i] > 0 && !field[i].stopped && !live.surged.has(i) && raceT > 2 && say(`${nm(i)}、ぐんぐん伸びてきた！`)){ live.surged.add(i); return; }
    }
    // 先頭が入れ替わった
    if (a !== live.leader && !evs.some(e => e.type === 'tail' && e.i === a && e.said === 1)){
      if (say(`${nm(a)}が先頭に立った！`)) live.leader = a;
    }
  }

  function showResult(){
    mode = 'result';
    const order = field.map((h, i) => ({ h, i })).sort((a, b) => b.h.value - a.h.value);
    const winner = order[0].i;
    const total = totalBet();
    const pay = payout(bets[winner], field[winner]);
    const net = pay - total;
    points += pay;
    $('resHead').className = 'head' + (pay > 0 ? ' hit' : '');
    $('resMain').textContent = pay > 0 ? '的中！' : 'はずれ';
    $('resNet').textContent = `${net >= 0 ? '+' : '−'}${fmt(Math.abs(net))}`;
    best = Math.max(best, points);
    updateHeader();
    $('resSub').textContent = `賭け金 ${fmt(total)} → もどり ${fmt(pay)}　持ち点 ${fmt(points)}`;

    // 着順と実際の数値（同じ値は同じ着順）
    const tbl = $('order');
    tbl.textContent = '';
    order.forEach(({ h: o, i }) => {
      const rank = 1 + field.filter(x => x.value > o.value).length;
      const tr = tbl.insertRow();
      tr.className = (rank === 1 ? 'first ' : '') + (bets[i] > 0 ? 'mine' : '');
      const c1 = tr.insertCell(); c1.className = 'rank'; c1.textContent = `${rank}位`;
      const c2 = tr.insertCell(); c2.className = 'nm';
      c2.innerHTML = `<span class="chip g${i + 1}">${i + 1}</span>`;
      c2.append(PREFS[o.p]);
      const c3 = tr.insertCell(); c3.className = 'r num'; c3.textContent = `${fmt(o.value)}${data.unit}`;
      const c4 = tr.insertCell(); c4.className = 'r num betmark'; c4.textContent = bets[i] > 0 ? `賭け ${fmt(bets[i])}` : '';
    });

    const over = raceNo >= RACES || points <= 0;
    $('next').textContent = over ? 'スコアを見る' : '次のレースへ';
    $('result').hidden = false;
  }

  function next(){
    if (mode !== 'result') return;
    if (raceNo >= RACES || points <= 0) showFinal();
    else newRace();
  }

  // ---------- 最終結果 ----------
  function showFinal(){
    mode = 'final';
    $('bet').hidden = true;
    $('race').hidden = true;
    $('final').hidden = false;
    $('finalScore').textContent = fmt(points);
    $('finalSub').textContent = points <= 0
      ? `第${raceNo}レースで持ち点がなくなりました`
      : `最初の持ち点 ${fmt(START_POINTS)}　最高 ${fmt(best)}`;
  }

  // ---------- 描画 ----------
  // コースは画面より長く、カメラが先頭の紙飛行機を追いかける
  let W = 0, H = 0, top = 0, laneH = 0, trackLen = 0, startWX = 0, camX = 0;
  const RAIL = 10;            // 上下の余白
  const TICKER = 0;           // 上部の余白（順位表示は廃止）

  function resize(){
    if ($('race').hidden) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    top = TICKER + RAIL;
    laneH = (H - top - RAIL) / RUNNERS;
    startWX = W * 0.3;
    trackLen = W * TRACK_SCREENS;
  }
  addEventListener('resize', resize);

  const worldX = h => startWX + h.pos * trackLen;   // 紙飛行機の先端の位置（コース上の座標）
  const planeLen = () => Math.min(laneH * 0.9, 80);  // 紙飛行機の長さ

  // 飛んでいる高さ（自分の飛距離のうちどこまで来たか s=0〜1 → レーンの高さに対する割合）。s=1 で地面
  const height = s => (1 - s * s * s) * (0.4 + 0.45 * Math.sin(Math.PI * s));

  function draw(dt){
    if (mode !== 'racing' && mode !== 'result') return;
    // カメラ: 先頭の紙飛行機が画面の右寄りに来るよう追いかける。なるべく最後尾も画面に入れる（コースの右端が見えたら止める）
    const lead = Math.max(...field.map(worldX));
    const trail = Math.min(...field.map(worldX));
    const sz = planeLen();
    let target = Math.min(lead - W * 0.6, trail - sz * 1.2);   // 先頭の右に数値を出す余白を残す
    target = Math.max(target, lead - W * 0.72);   // 先頭は画面の7割より右へは行かせない（後ろの県は見切れてもよい）
    target = Math.min(Math.max(0, target), startWX + trackLen - W * 0.78);
    camX += (target - camX) * Math.min(1, dt * 6);

    // 空
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#5db4ea'); sky.addColorStop(1, '#d4effd');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // 雲（カメラより遅く流れて、進んでいる感じを出す）
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let k = 0; k < 8; k++){
      const span = W * 1.6;
      const cx = ((k * 173 - camX * 0.35) % span + span) % span - W * 0.3;
      const cy = top + ((k * 97) % 100) / 100 * laneH * RUNNERS;
      ctx.beginPath(); ctx.ellipse(cx, cy, 34, 11, 0, 0, Math.PI * 2); ctx.ellipse(cx + 22, cy - 6, 22, 10, 0, 0, Math.PI * 2); ctx.fill();
    }
    // 各レーンの地面（細い芝の帯）
    for (let i = 0; i < RUNNERS; i++){
      const y = top + (i + 1) * laneH;
      ctx.fillStyle = '#5aa54a'; ctx.fillRect(0, y - 4, W, 4);
      ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, y, W, 1);
    }

    // 投げる位置の線と距離の目盛り
    const sx = startWX - camX;
    if (sx > -10 && sx < W + 10){ ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(sx - 1, top, 3, laneH * RUNNERS); }
    drawMarkers();

    const len = planeLen();
    field.forEach((h, i) => {
      const s = h.dist > 0 ? Math.min(1, h.pos / h.dist) : 1;
      const ground = top + (i + 1) * laneH - 4;
      const x = worldX(h);
      // ふわふわ揺れる（着地が近いほど小さく）
      const wob = h.stopped ? 0 : Math.sin(raceT * 3 + h.seed) * 3 * (1 - s);
      const y = ground - len * 0.17 - height(s) * laneH * 0.55 - wob;   // 着地時は胴の下が地面に付く高さ
      // 機首の向き：飛ぶ道すじの傾き（着地したら水平）
      let ang = 0;
      if (!h.stopped){
        const ds = 0.01;
        const dy = (height(Math.max(0, s - ds)) - height(Math.min(1, s + ds))) * laneH * 0.55;
        ang = Math.max(-0.5, Math.min(0.6, Math.atan2(dy, 2 * ds * h.dist * trackLen)));
      }
      // 飛んだ跡（点線）
      const t = h.trail;
      if (!t.length || x - t[t.length - 1].x > 5) t.push({ x, y: y + 2 });
      h.draw = { x, y, ang, ground, s };
    });

    // 飛んだ跡
    field.forEach((h, i) => {
      const t = h.trail; if (t.length < 2) return;
      ctx.save();
      ctx.setLineDash([4, 6]); ctx.lineWidth = 2;
      ctx.strokeStyle = i === 0 ? 'rgba(255,255,255,.8)' : GATE[i].bg;
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.moveTo(t[0].x - camX, t[0].y);
      for (const p of t) ctx.lineTo(p.x - camX, p.y);
      ctx.stroke();
      ctx.restore();
    });

    drawWind();

    // 紙飛行機と名札
    field.forEach((h, i) => {
      const d = h.draw;
      const nose = d.x - camX;
      // 地面の影（高いほど薄く小さく）
      const hs = 1 - Math.min(1, (d.ground - d.y) / (laneH * 0.7));
      ctx.fillStyle = `rgba(0,0,0,${0.08 + 0.14 * hs})`;
      ctx.beginPath(); ctx.ellipse(nose - len * 0.45, d.ground, len * (0.25 + 0.2 * hs), 3, 0, 0, Math.PI * 2); ctx.fill();
      drawPlane(nose, d.y, len, d.ang, GATE[i], bets[i] > 0);
      // 名札は紙飛行機の少し上について動く（レーンの上端より上には出さない）
      const tagH = Math.round(Math.max(11, Math.min(15, laneH * 0.19))) + 8;
      drawTag(PREFS[h.p], nose - len * 0.5, Math.max(top + i * laneH + 2, d.y - len * 0.34 - tagH - 8), i);
      if (h.stopped) drawValue(i, nose + 2, d.y - 2);
    });
    drawRock();
  }

  // 名札：枠番号・県名・オッズ・賭け金（賭けた県だけ）を1本にまとめて出す
  function drawTag(name, cx, y, i){
    const fsz = Math.round(Math.max(11, Math.min(15, laneH * 0.19)));
    const small = fsz - 2;
    const h = fsz + 8;
    const mine = bets[i] > 0;
    const odds = `${(field[i].odds10 / 10).toFixed(1)}倍`;
    const bet = mine ? `賭け ${fmt(bets[i])}` : '';
    ctx.font = `900 ${fsz}px ${FONT}`;
    const nw = ctx.measureText(name).width;
    ctx.font = `900 ${small}px ${FONT}`;
    const ow = ctx.measureText(odds).width;
    const bw = mine ? ctx.measureText(bet).width + 12 : 0;
    const w = h + 2 + nw + 8 + ow + (mine ? 6 + bw : 0) + 8;
    const x = Math.max(4, cx - w / 2);   // 左端で見切れないようにする
    roundRect(x, y, w, h, h / 2);
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fill();
    if (mine){ ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.textBaseline = 'middle';
    // 枠番号
    ctx.fillStyle = GATE[i].bg;
    ctx.beginPath(); ctx.arc(x + h / 2, y + h / 2, h / 2 - 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = GATE[i].fg;
    ctx.font = `900 ${fsz - 3}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), x + h / 2, y + h / 2 + 1);
    // 県名
    let px = x + h + 2;
    ctx.textAlign = 'left';
    ctx.font = `900 ${fsz}px ${FONT}`;
    ctx.fillStyle = '#fff';
    ctx.fillText(name, px, y + h / 2 + 1);
    px += nw + 8;
    // オッズ
    ctx.font = `900 ${small}px ${FONT}`;
    ctx.fillStyle = '#ffb300';
    ctx.fillText(odds, px, y + h / 2 + 1);
    px += ow + 6;
    // 賭け金
    if (mine){
      roundRect(px, y + 3, bw, h - 6, (h - 6) / 2);
      ctx.fillStyle = '#ffd23f'; ctx.fill();
      ctx.fillStyle = '#3a2600';
      ctx.fillText(bet, px + 6, y + h / 2 + 1);
    }
  }

  // 距離の目盛り（実際の数値。例: 1,000g・2,000g …）
  function drawMarkers(){
    const step = niceStep(scaleMax / 5);
    ctx.font = `900 12px ${FONT}`;
    for (let v = step; v <= scaleMax + 1e-9; v += step){
      const x = startWX + trackLen * (v / scaleMax) - camX;
      if (x < -60 || x > W + 60) continue;
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(x - 1, top, 2, laneH * RUNNERS);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - 2, TICKER - 2, 4, RAIL + 4);
      const label = `${fmt(+v.toFixed(6))}${data.unit}`;
      const w = ctx.measureText(label).width + 12;
      // 目盛りの札は下の柵ぎわに出す（上は県名の名札と重なるため）
      ctx.fillRect(x - 2, H - RAIL - 2, 4, RAIL + 4);
      roundRect(x - w / 2, H - RAIL - 22, w, 18, 4);
      ctx.fillStyle = '#c62828'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, x, H - RAIL - 12.5);
    }
  }

  // 着地した紙飛行機の先に、実際の数値を出す
  function drawValue(i, nose, y){
    const h = field[i];
    const label = `${fmt(h.value)}${data.unit}`;
    const fsz = Math.round(Math.max(11, Math.min(14, laneH * 0.18)));
    ctx.font = `900 ${fsz}px ${FONT}`;
    const w = ctx.measureText(label).width + 12, hh = fsz + 8;
    const x = Math.min(nose + 4, W - w - 4);   // 画面の右端からはみ出さないように
    const yy = y - hh / 2;   // y を中心に置く
    roundRect(x, yy, w, hh, 5);
    ctx.fillStyle = '#111418'; ctx.fill();
    ctx.fillStyle = '#ffb300'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, yy + hh / 2 + 1);
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 紙飛行機（横から見た形・右向き）。nose=先端のx、y=先端の高さ、len=長さ、ang=機首の傾き
  function drawPlane(nose, y, len, ang, gate, mine){
    ctx.save();
    ctx.translate(nose, y);
    ctx.rotate(ang);
    ctx.lineJoin = 'round';
    // 下側の折り目（胴）
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-len * 0.8, 0); ctx.lineTo(-len * 0.96, len * 0.16); ctx.closePath();
    ctx.fillStyle = gate.dark; ctx.fill();
    // 翼
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-len, -len * 0.3); ctx.lineTo(-len * 0.8, 0); ctx.closePath();
    ctx.fillStyle = gate.bg; ctx.fill();
    // 輪郭（賭けた県は金色で太く）
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-len, -len * 0.3); ctx.lineTo(-len * 0.8, 0); ctx.lineTo(-len * 0.96, len * 0.16); ctx.closePath();
    ctx.strokeStyle = mine ? '#ffd23f' : 'rgba(0,0,0,.35)';
    ctx.lineWidth = mine ? 3 : 1.2;
    ctx.stroke();
    // 翼の折り目
    ctx.beginPath(); ctx.moveTo(-len * 0.05, -len * 0.015); ctx.lineTo(-len * 0.88, -len * 0.2);
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  // ---------- ループ ----------
  let last = performance.now();
  function loop(now){
    const dt = Math.min((now - last) / 1000, 1/30);
    last = now;
    update(dt);
    draw(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- 操作 ----------
  $('start').addEventListener('click', startRace);
  $('next').addEventListener('click', next);
  $('restart').addEventListener('click', newGame);

  // ---------- 結果の共有 ----------
  const SHARE_TAG = '#都道府県ダービー';
  function shareText(){
    const head = points <= 0 ? `第${raceNo}レースで持ち点がなくなった…` : `スコア ${fmt(points)}！`;
    return `${head}\n最初の持ち点 ${fmt(START_POINTS)} → ${fmt(points)}\n${new URL('./', location.href).href}\n${SHARE_TAG}`;
  }
  // 結果をPNG画像にする（共有シートの制約があるため同期処理で作る）
  function resultImageFile(){
    const S = 600;
    const c = document.createElement('canvas');
    c.width = S; c.height = S;
    const g = c.getContext('2d');
    const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
    const sky = g.createLinearGradient(0, 0, 0, S);
    sky.addColorStop(0, '#5db4ea'); sky.addColorStop(1, '#d4effd');
    g.fillStyle = sky; g.fillRect(0, 0, S, S);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#10263a';
    g.font = `900 44px ${FONT}`;
    g.fillText(document.title, S / 2, 110);
    g.fillStyle = css('--board');
    roundPath(g, 60, 180, S - 120, 250, 24); g.fill();
    g.fillStyle = '#9aa3ad';
    g.font = `900 26px ${FONT}`;
    g.fillText('SCORE', S / 2, 230);
    g.fillStyle = css('--led');
    g.font = `900 110px ${FONT}`;
    g.fillText(fmt(points), S / 2, 330);
    g.fillStyle = '#10263a';
    g.font = `bold 28px ${FONT}`;
    g.fillText(`最初の持ち点 ${fmt(START_POINTS)}`, S / 2, 490);
    const bin = atob(c.toDataURL('image/png').split(',')[1]);   // toBlob の非同期コールバックは避ける
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new File([buf], 'result.png', { type: 'image/png' });
  }
  function roundPath(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  $('share').addEventListener('pointerdown', e => e.stopPropagation());
  $('share').addEventListener('click', () => {
    const btn = $('share');
    const text = shareText();
    const file = resultImageFile();
    // 1) 画像を渡せる共有シート（スマホなど）: 文面＋結果画像
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ text, files: [file] }).catch(() => {});
      return;
    }
    // 2) 画像を渡せない共有シート: 文面のみ
    if (navigator.share){
      navigator.share({ text }).catch(() => {});
      return;
    }
    // 3) 共有シートがない環境（PCのブラウザなど）: 文面をコピーしてボタンの文言で知らせる
    navigator.clipboard?.writeText(text).then(() => {
      btn.textContent = 'コピーしました';
      setTimeout(() => { btn.textContent = '共有'; }, 1500);
    }).catch(() => {});
  });
  $('intro').addEventListener('click', hideIntro);
  $$('.js-credit').forEach(b => b.addEventListener('click', () => { $('creditBox').hidden = false; }));
  $('creditClose').addEventListener('click', () => { $('creditBox').hidden = true; });

  // iPhone(Safari)で長押しや指の移動により文字選択・拡大鏡が出るのを防ぐ
  // （ボタンの操作を殺さないよう、touchstart / touchmove はレース画面のキャンバスに限定する）
  const onCanvas = t => t instanceof Element && !!t.closest('#cv');
  document.addEventListener('touchstart', e => { if (onCanvas(e.target)) e.preventDefault(); }, { passive:false });
  document.addEventListener('touchmove',  e => { if (onCanvas(e.target)) e.preventDefault(); }, { passive:false });
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  newGame();
})();
</script>
</body>
</html>
