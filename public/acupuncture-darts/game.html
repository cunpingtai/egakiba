<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,follow">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #efe4d2; color: #3a2a1a;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    header { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    #back, #lang { display: none; }
    header a { color: #3a2a1a; font-size: 14px; text-decoration: none; margin-right: auto; background: rgba(255,255,255,.7); padding: 6px 10px; border-radius: 8px; }
    header button, header select {
      background: #fff; border: 1px solid #c8ad86; border-radius: 8px;
      height: 34px; min-width: 40px; padding: 0 10px; font-size: 13px; color: #3a2a1a; cursor: pointer;
    }
    header svg { width: 18px; height: 18px; display: block; }
    #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hint { position: absolute; left: 50%; bottom: calc(var(--reserve, 160px) - 10px); width: clamp(60px, 11vmin, 96px); transform: translateX(-50%); pointer-events: none; display: none; }
    #hint svg { width: 100%; height: auto; display: block; animation: swipe 1.6s ease-in-out infinite; }
    @keyframes swipe { 0% { transform: translateY(40%); opacity: 0; } 20% { opacity: 1; } 70% { transform: translateY(-60%); opacity: 1; } 100% { transform: translateY(-80%); opacity: 0; } }
    #result { position: absolute; left: 0; right: 0; top: 56px; display: none; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
    #result b { font-size: clamp(48px, 13vmin, 120px); font-weight: 900; line-height: 1; color: #fff; text-shadow: 0 4px 0 #6b3d1c, 0 0 18px rgba(0,0,0,.3); }
    #result div { width: clamp(180px, 40vmin, 360px); height: clamp(14px, 2.4vmin, 20px); border-radius: 10px; background: rgba(255,255,255,.7); border: 2px solid #6b3d1c; overflow: hidden; }
    #result i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #f2c43a, #e0603a); transform-origin: left; }
    @media (max-height: 520px) and (min-aspect-ratio: 4/3) {
      #result { top: 0; bottom: var(--reserve, 160px); width: 30%; justify-content: center; }
    }
    /* 穴あき枕の下から見た顔の小窓 */
    #face { position: absolute; right: 12px; top: 56px; width: clamp(110px, 28vmin, 230px); aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.25); background: #3a2a1a; pointer-events: none; }
    #face canvas { width: 100%; height: 100%; display: block; }
    @media (max-aspect-ratio: 3/4) { #result { top: calc(64px + clamp(110px, 28vmin, 230px)); } }
    #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    /* ゲーム画面は下まで描き、ボタンは下の80pxを空けて上に重ねる（Xアプリ内ブラウザの投稿文で隠れるため） */
    #controls { position: fixed; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom)); display: flex; gap: 8px; padding: 8px 12px 0; max-width: 640px; width: 100%; margin: 0 auto; }
    #controls button, #controls a {
      flex: 1; height: clamp(56px, 8vmin, 72px); border: none; border-radius: 14px; font-size: clamp(18px, 3vmin, 24px); font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none;
      touch-action: manipulation;
    }
    .go { background: #3a9a7a; color: #fff; box-shadow: 0 4px 0 #1d5a46; }
    .post { background: #111; color: #fff; box-shadow: 0 4px 0 #000; flex: 0 0 34% !important; font-size: clamp(16px, 2.6vmin, 20px) !important; }
    #controls button:active, #controls a:active { transform: translateY(3px); box-shadow: none; }
    #controls.hide { visibility: hidden; }
  </style>
</head>
<body>
  <header>
    <a id="back" href="#">← トップへ戻る</a>
    <button id="sound" aria-label="sound"></button>
    <select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="ko">한국어</option><option value="en">English</option><option value="th">ไทย</option></select>
  </header>
  <div id="stage">
    <div id="hint"><svg viewBox="0 0 60 90"><path d="M30 6 L22 18 M30 6 L38 18 M30 6 V30" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".9"/><path d="M24 78 C16 70 12 62 14 56 C16 52 21 53 24 58 L24 38 C24 33 31 33 31 38 L31 50 C31 46 38 46 38 50 L38 53 C38 49 45 49 45 53 L45 66 C45 74 40 80 34 82 Z" fill="#fff" stroke="#6b3d1c" stroke-width="3" stroke-linejoin="round"/></svg></div>
    <div id="face"><canvas></canvas></div>
    <div id="result"><b></b><div><i></i></div></div>
    <div id="msg"></div>
  </div>
  <div id="controls"></div>

  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
  <script>
    // CDN が読めないときの一言
    setTimeout(() => { if (!window.HARI_READY) { const m = document.getElementById('msg'); m.style.display = 'flex'; m.textContent = 'Failed to load. Please reload. / 読み込めませんでした。再読み込みしてください。'; } }, 8000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
    window.HARI_READY = true;

    const pageUrl = () => new URL('./', location.href).href;

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('acupuncture-darts:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('acupuncture-darts:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const DICT = {
      ja: { title: '鍼ダーツ', back: '← トップへ戻る', again: 'もう一度', post: '結果をシェア', pts: n => `${n}点`, share: n => `鍼を1本投げてツボに${n}点 #鍼ダーツゲーム` },
      ko: { title: '침 다트', back: '← 처음으로', again: '다시 하기', post: 'X에 게시', pts: n => `${n}점`, share: n => `침 한 대를 던져서 혈자리 ${n}점 #鍼ダーツゲーム` },
      en: { title: 'Acupuncture Darts', back: '← Back to top', again: 'Play again', post: 'Post on X', pts: n => `${n} pts`, share: n => `I threw one acupuncture needle and scored ${n} pts #鍼ダーツゲーム` },
      th: { title: 'ปาเข็มฝังเข็ม', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', pts: n => `${n} คะแนน`, share: n => `ปาเข็มเล่มเดียวใส่จุดฝังเข็มได้ ${n} คะแนน #鍼ダーツゲーム` },
    };
    let lang = 'ja';
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = 'ja';
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null;
    function initAudio() {
      if (ac) return;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    // iPhone は指を離した時（touchend / pointerup）でないと音が出せるようにならないので、そこでも起こす
    const wake = () => { initAudio(); if (ac && ac.state !== 'running') ac.resume().catch(() => {}); };
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click']) addEventListener(ev, wake, { capture: true });
    const ok = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    const noiseBuf = dur => { const b = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
    // 風切り音: ノイズを高い方から低い方へ動く共鳴に通す
    function whoosh(power) {
      if (!ok()) return;
      const now = ac.currentTime, dur = 0.35;
      const s = ac.createBufferSource(); s.buffer = noiseBuf(dur);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3;
      bp.frequency.setValueAtTime(2600, now); bp.frequency.exponentialRampToValueAtTime(700, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.25 * power, now + 0.06); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      s.connect(bp).connect(g).connect(ac.destination); s.start(now);
    }
    // 刺さる音: 短いノイズを共鳴に通した「トスッ」＋低い胴鳴り
    function thunk(hard) {
      if (!ok()) return;
      const now = ac.currentTime, len = 0.08;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * (hard ? 0.006 : 0.012)));
      const s = ac.createBufferSource(); s.buffer = buf;
      for (const [f, q, g0] of hard ? [[900, 8, 1.1], [2100, 10, 0.6], [4200, 6, 0.3]] : [[380, 4, 1.2], [900, 5, 0.5], [2400, 4, 0.25]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.95 + Math.random() * 0.1); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
      tone('sine', hard ? 180 : 120, 50, 0.14, 0.3);
    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], h: [700, 1300, 2600] };
    function voice(f0, seq, dur, vol, { rise = 1.3, fall = 0.7, shake = 0.04, breath = 0.15, vib = 6 } = {}) {
      if (!ok()) return;
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * rise, now);
      o.frequency.linearRampToValueAtTime(f0 * rise * 1.08, now + dur * 0.15);
      o.frequency.exponentialRampToValueAtTime(f0 * fall, now + dur);
      const v = ac.createOscillator(); v.frequency.value = vib + Math.random() * 2;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; v.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf(dur);
      const ng = ac.createGain(); ng.gain.value = breath;
      const og = ac.createGain(); og.gain.value = 1 - Math.min(0.9, breath);
      const src = ac.createGain();
      o.connect(og).connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + Math.min(0.08, dur * 0.2));
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((s, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.8; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[s][fi], tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); v.start(now); ns.start(now);
      o.stop(now + dur); v.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    // ツボに入った: 息まじりで、とろけるように下がる「はぁ〜」
    const sBliss = (f0, k) => {
      voice(f0, pick([['h', 'a', 'a', 'o'], ['h', 'a', 'u'], ['o', 'o', 'u'], ['h', 'a', 'e']]), 1.0 + 0.8 * k + Math.random() * 0.3, 0.65, { rise: 1.25, fall: 0.6, shake: 0.06, breath: 0.3, vib: 4 });
    };
    // 外れた: 短く高い悲鳴
    const sOuch = f0 => voice(f0 * 1.6, pick([['i', 'i'], ['i', 'e'], ['a', 'i'], ['u', 'i']]), 0.3 + Math.random() * 0.12, 0.6, { rise: 1.4, fall: 0.9, shake: 0.03, breath: 0.1 });

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e9dcc6');
    scene.fog = new THREE.Fog('#e9dcc6', 7, 16);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 60);
    scene.add(new THREE.HemisphereLight('#dfefff', '#8a6a48', 1.1));
    const sun = new THREE.DirectionalLight('#fff0d8', 2.3); sun.position.set(-2.5, 5, 2.5);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4; sun.shadow.bias = -0.0006;
    Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 14 });
    scene.add(sun);

    const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; };
    const mat = (c, rough = 0.75, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, ...extra });
    const shade = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
    const SPH = new THREE.SphereGeometry(1, 32, 20), CYL = new THREE.CylinderGeometry(1, 1, 1, 24), BOX = new THREE.BoxGeometry(1, 1, 1);
    const part = (geo, m, x, y, z, sx, sy = sx, sz = sx, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); parent?.add(o); return o; };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const colliders = []; // 鍼が当たる物

    // 部屋: 木の床・壁・腰板
    {
      const wood = canvasTex(512, 512, (c, w, h) => {
        const n = 8;
        for (let i = 0; i < n; i++) {
          c.fillStyle = `hsl(${28 + Math.random() * 6},${42 + Math.random() * 10}%,${46 + Math.random() * 10}%)`; c.fillRect(i * w / n, 0, w / n, h);
          for (let k = 0; k < 14; k++) { c.strokeStyle = `rgba(70,35,10,${0.08 + Math.random() * 0.15})`; c.lineWidth = 1 + Math.random() * 1.5; const x = i * w / n + Math.random() * w / n; c.beginPath(); c.moveTo(x, 0); c.bezierCurveTo(x + rnd(-4, 4), h * .3, x + rnd(-4, 4), h * .6, x, h); c.stroke(); }
          c.fillStyle = 'rgba(40,20,5,.45)'; c.fillRect(i * w / n, 0, 2, h);
          c.fillRect(i * w / n, (i * 0.37 % 1) * h, w / n, 2);
        }
      });
      wood.wrapS = wood.wrapT = THREE.RepeatWrapping; wood.repeat.set(2.5, 2.5);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ map: wood, roughness: 0.6 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor); colliders.push(floor);
      const plaster = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#f3ead9'; c.fillRect(0, 0, w, h); for (let i = 0; i < 3000; i++) { c.fillStyle = `rgba(${Math.random() < .5 ? '120,90,60' : '255,255,255'},${Math.random() * 0.06})`; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); } });
      plaster.wrapS = plaster.wrapT = THREE.RepeatWrapping; plaster.repeat.set(3, 2);
      const wallM = new THREE.MeshStandardMaterial({ map: plaster, roughness: 0.95 });
      const panelM = mat('#a87a4e', 0.7);
      const wall = (w, x, z, ry) => {
        const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry;
        const m = part(new THREE.PlaneGeometry(1, 1), wallM, 0, 1.5, 0, w, 3, 1, g); m.receiveShadow = true; colliders.push(m);
        const p = part(BOX, panelM, 0, 0.45, 0.02, w, 0.9, 0.04, g); p.receiveShadow = true;
        part(BOX, mat('#7a5232', 0.6), 0, 0.92, 0.05, w, 0.05, 0.06, g);
        scene.add(g);
      };
      wall(8, 0, -1.85, 0); wall(9, -2.4, 2, Math.PI / 2); wall(9, 2.4, 2, -Math.PI / 2);
      // 窓（右の壁）: 外は空のグラデーション
      const win = new THREE.Group(); win.position.set(2.38, 1.65, -0.4); win.rotation.y = -Math.PI / 2; scene.add(win);
      part(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: canvasTex(4, 128, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#7cc0f0'); g.addColorStop(1, '#e8f6ff'); c.fillStyle = g; c.fillRect(0, 0, w, h); }), fog: false }), 0, 0, 0.01, 1.1, 0.9, 1, win);
      const frameM = mat('#f6f1e8', 0.5);
      for (const [x, y, w, h] of [[0, 0.47, 1.2, 0.06], [0, -0.47, 1.2, 0.06], [-0.57, 0, 0.06, 1], [0.57, 0, 0.06, 1], [0, 0, 0.04, 0.9], [0, 0, 1.1, 0.04]]) part(BOX, frameM, x, y, 0.03, w, h, 0.05, win);
      // いつもの猫のポスター（奥の壁）
      const catTex = new THREE.TextureLoader().load('cat.png'); catTex.colorSpace = THREE.SRGBColorSpace;
      const poster = new THREE.Group(); poster.position.set(0.15, 1.45, -1.83); poster.rotation.z = 0.03; scene.add(poster);
      part(BOX, mat('#5a3a22', 0.5), 0, 0, 0, 0.78, 0.98, 0.03, poster);
      part(new THREE.PlaneGeometry(1, 1), mat('#fbf6ea', 0.9), 0, 0, 0.017, 0.7, 0.9, 1, poster);
      part(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ map: canvasTex(8, 128, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#ffd7a8'); g.addColorStop(1, '#ffeedd'); c.fillStyle = g; c.fillRect(0, 0, w, h); }), roughness: 0.9 }), 0, 0.08, 0.018, 0.62, 0.62, 1, poster);
      part(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ map: catTex, transparent: true, alphaTest: 0.1, roughness: 0.9 }), 0, 0.08, 0.019, 0.56, 0.56, 1, poster);
      // ポスター下のツボ図風の点と線（文字は無し）
      const dotM = new THREE.MeshBasicMaterial({ color: '#c0392b' });
      for (let i = 0; i < 5; i++) part(new THREE.CircleGeometry(0.012, 10), dotM, -0.24 + i * 0.12, -0.32, 0.02, 1, 1, 1, poster);
      part(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: '#8a6a48' }), 0, -0.32, 0.019, 0.5, 0.004, 1, poster);

      const pulse = 1 + Math.sin(clock * 5) * 0.12;
      tuboMat.opacity = 0.8 + (pulse - 1) * 1.6;
      if (face) animFace(face, outcome || 'calm', dt, !outcome && (clock % 3.2) < 0.12); // ふだんはときどき瞬き

      if (state === 'fly') {
        flyT += dt;
        prev.copy(pos);
        vel.y -= GRAV * dt;
        pos.addScaledVector(vel, dt);
        dirV.subVectors(pos, prev); const len = dirV.length();
        if (len > 0) {
          rc.set(prev, dirV.normalize()); rc.far = len + 0.001;
          breathe.updateMatrixWorld(true);
          const hit = rc.intersectObjects(patMeshes.concat(colliders), false)[0];
          if (hit) { stick(hit); return; }
        }
        if (pos.y < -0.5 || flyT > 4 || Math.abs(pos.x) > 6 || pos.z < -6) { state = 'stuck'; outcome = 'miss'; score = 0; endT = 0; }
      } else if (state === 'stuck') {
        endT += dt;
        if (endT > (outcome === 'bliss' ? 1.6 : outcome === 'ouch' ? 2.6 : 1.1)) finish();
      }
    }

    // ---------- 画面 ----------
    const resultEl = document.getElementById('result');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('button');
      a.className = 'post'; a.type = 'button'; a.textContent = t('post');
      a.addEventListener('click', () => {
        const text = `${t('share')(score)}\n${pageUrl()}`;
        const file = shareFile();
        if (navigator.share) {
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text };
          navigator.share(data).catch(() => {});
          return;
        }
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'acupuncture-darts.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 刺さった所を真ん中に切り抜き、点数を重ねる
    let snap = null, faceSnap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      const f = (outcome === 'miss' ? breathe.localToWorld(tuboWorld.copy(tuboLocal)) : needle.getWorldPosition(new THREE.Vector3())).project(camera);
      const fx2 = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const side = Math.min(src.width, src.height) * 0.8;
      const sx = THREE.MathUtils.clamp(fx2 - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side * 0.6, 0, src.height - side);
      faceSnap = document.createElement('canvas'); faceSnap.width = faceSnap.height = faceCv.width; faceSnap.getContext('2d').drawImage(faceCv, 0, 0);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      if (faceSnap) { // 顔の小窓も右上に
        const r = 170, cx = 1080 - r - 40, cy = r + 150;
        g.drawImage(faceSnap, cx - r, cy - r, r * 2, r * 2);
        g.lineWidth = 12; g.strokeStyle = '#fff'; g.strokeRect(cx - r, cy - r, r * 2, r * 2);
      }
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b3d1c'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('pts')(score), 960, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'acupuncture-darts.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      resultEl.querySelector('b').textContent = t('pts')(score);
      resultEl.querySelector('i').style.transform = `scaleX(${score / 100})`;
    }
    function start() {
      if (needle.parent !== scene) scene.attach(needle);
      patient = makePatient();
      squash = 0; jump = 0; jumpV = 0; shake = 0; outcome = null; score = 0;
      breathe.position.set(0, 0, 0); breathe.scale.set(1, 1, 1);
      breathe.updateMatrixWorld(true);
      placeTubo();
      aimOff.set(0, 0, 0);
      state = 'ready';
      resultEl.style.display = 'none';
      hint.style.display = thrownOnce ? 'none' : 'block';
      renderControls(); resize();
    }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- 顔の小窓（穴あき枕の下から） ----------
    const faceEl = document.getElementById('face'), faceCv = faceEl.querySelector('canvas'), faceCtx = faceCv.getContext('2d');
    const faceCam = new THREE.PerspectiveCamera(58, 1, 0.01, 5);
    const faceLight = new THREE.PointLight('#fff1e0', 0.5, 1.5); faceLight.position.set(0.12, 0.1, 0); faceLight.layers.enable(1); // 斜めから当てて陰影を付ける
    scene.children.forEach(o => o.isLight && o.layers.enable(1)); faceCam.add(faceLight); scene.add(faceCam);
    const fDir = new THREE.Vector3(), fUp = new THREE.Vector3(), fPos = new THREE.Vector3();
    function renderFace() {
      if (!headG) return;
      const S = faceEl.clientWidth; if (!S) return;
      const dpr = renderer.getPixelRatio(), px = Math.round(S * dpr);
      if (faceCv.width !== px) { faceCv.width = faceCv.height = px; }
      headG.updateWorldMatrix(true, false);
      headG.getWorldPosition(fPos);
      fDir.set(0, -1, 0).transformDirection(headG.matrixWorld); fUp.set(0, 0, -1).transformDirection(headG.matrixWorld);
      faceCam.position.copy(fPos).addScaledVector(fDir, 0.36);
      // 崩れた後は顔がベッドや床に埋まって見えなくなるので、頭だけを写す
      faceCam.layers.set(ragdoll ? 1 : 0); if (!ragdoll) faceCam.layers.enable(1);
      faceCam.up.copy(fUp); faceCam.lookAt(fPos.x + fDir.x * 0.09, fPos.y + fDir.y * 0.09, fPos.z + fDir.z * 0.09);
      faceCam.updateMatrixWorld();
      // 大きい画面の左下に描いて、すぐ小窓へ写す（そのあと本番の絵で上書きする）
      renderer.setViewport(0, 0, S, S); renderer.setScissor(0, 0, S, S); renderer.setScissorTest(true);
      renderer.shadowMap.autoUpdate = false; // 影は本番の絵で作ったものを使い回す（軽くするため）
      renderer.render(scene, faceCam);
      renderer.shadowMap.autoUpdate = true;
      const H = renderer.domElement.height;
      faceCtx.drawImage(renderer.domElement, 0, H - px, px, px, 0, 0, px, px);
      renderer.setScissorTest(false);
      const sz = renderer.getSize(tmpSize); renderer.setViewport(0, 0, sz.x, sz.y);
    }
    const tmpSize = new THREE.Vector2();

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha) {
      if (state === 'ready') {
        // 手前で浮いている鍼（指に少しついてくる）
        needle.position.copy(START).add(aimOff); needle.position.y += Math.sin(clock * 2.2) * 0.012;
        needle.lookAt(tmpV.copy(needle.position).add(new THREE.Vector3(aimOff.x * 0.6, -0.32, -1)));
      } else if (state === 'fly') {
        needle.position.lerpVectors(prev, pos, alpha);
        needle.lookAt(tmpV.copy(needle.position).add(vel));
      }
      if (ragdoll) poseRagdoll();
      renderFace();
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; if (state !== 'fly' && state !== 'stuck' && acc > STEP * 8) acc = 0; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    // テスト用（自動確認から呼べるように）
    window.__hari = { START, throwNeedle, THREE, camera, renderer, scene, needle, get tubo() { return breathe.localToWorld(tuboLocal.clone()); }, get state() { return state; }, get score() { return score; }, get outcome() { return outcome; } };
    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、一度描いておく
    renderer.compile(scene, camera); renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
