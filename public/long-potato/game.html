<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>ぐるぐるポテトメーカー</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://egakiba.com/long-potato/">
<style>
  :root{
    --bg:#4a4540; --fg:#fff; --sub:#ddd;
    --panel:rgba(0,0,0,.6); --line:rgba(255,255,255,.25);
    --accent:#f0b429; --warn:#ff6a4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #game{position:relative;width:100%;max-width:420px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hidden{display:none !important}

  /* ゲーム側の表示 */
  #msg{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;pointer-events:none;
    font-size:min(52px,10.5vw);font-weight:800;letter-spacing:.04em;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.5)}
  #msg.good{color:var(--accent)}
  #msg.bad{color:var(--warn)}
  #msg.show{animation:msgPop .45s cubic-bezier(.2,1.6,.4,1) both}
  #msg.bad.show{animation:msgPop .45s cubic-bezier(.2,1.6,.4,1) both, msgShake .4s .45s ease-in-out both}
  @keyframes msgPop{from{opacity:0;transform:translateY(-50%) scale(2.4)}to{opacity:1;transform:translateY(-50%) scale(1)}}
  @keyframes msgShake{0%,100%{transform:translateY(-50%) translateX(0)}20%{transform:translateY(-50%) translateX(-10px)}40%{transform:translateY(-50%) translateX(9px)}60%{transform:translateY(-50%) translateX(-6px)}80%{transform:translateY(-50%) translateX(3px)}}

  button{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:12px;min-height:44px;cursor:pointer;touch-action:none}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .mainBtn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);width:180px;height:60px;font-size:20px;font-weight:700;border-color:var(--accent)}

  /* 結果 */
  #over{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 20px);touch-action:none;pointer-events:none}
  #over .panel{pointer-events:auto;width:100%;max-width:360px;background:var(--panel);border-radius:14px;padding:16px;text-align:center}
  #rLen{font-size:min(26px,6.8vw);font-weight:700;margin-bottom:4px;white-space:pre-line;line-height:1.25}
  #rBest{font-size:15px;opacity:.8;margin-bottom:14px}
  #over.wait .panel{visibility:hidden}
  #over .btns{display:flex;gap:10px}
  #mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:48px;height:48px;font-size:22px;padding:0}
  #over .btns button{flex:1;height:52px;font-size:18px;font-weight:700}
  #again{border-color:var(--accent)}

  /* 共有される内容（共有シートが出ない環境用） */
  #share-view{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
  #share-view .panel{width:min(90%,340px);max-height:94%;overflow:auto;touch-action:pan-y;background:#222;border-radius:12px;padding:12px}
  #share-img{display:block;width:100%;height:auto;border-radius:6px}
  #share-text{white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text;font-size:14px;line-height:1.6}
  #share-close{width:100%}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="msg" aria-live="assertive"></div>

  <button id="done" type="button" class="mainBtn hidden">できあがり</button>
  <button id="mute" type="button" class="hidden" aria-label="音を消す">🔊</button>

  <div id="over" class="hidden">
    <div class="panel" aria-live="polite">
      <div id="rLen">0cm</div>
      <div id="rBest"></div>
      <div class="btns">
        <button id="again" type="button">もう一回</button>
        <button id="share" type="button">共有</button>
      </div>
    </div>
  </div>

  <div id="share-view" class="hidden" role="dialog" aria-label="共有される内容">
    <div class="panel">
      <img id="share-img" alt="共有される結果画像">
      <p id="share-text"></p>
      <button id="share-close" type="button">閉じる</button>
    </div>
  </div>
</div>

<script src="./three.min.js"></script>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // ---------- 定数 ----------
  // じゃがいも
  const L0 = 10.5;           // じゃがいもの長さ（cm）
  const R_IN = 0.35;         // 串の穴の半径（cm）
  const R_MAX = 4.0;         // じゃがいもの一番太い所の半径（cm）
  const SKEWER_R = 0.22;     // 串の半径（cm）
  const BUMP = 0.35;         // じゃがいもの凹凸の強さ（1 で以前の強さ、0 で凹凸なし）

  // 切る
  const ROT_SPEED = 1.0;     // じゃがいもが回る速さ（周/秒）
  const BREAK_T = 0.1;       // 1枚の厚みがこれより薄くなると切れる（cm）。刃が1周前の切れ目にほぼ追いついた所
  const GROOVE = 0.08;       // 切ったあと、串に広げる前の切れ目のすき間（cm）。切った位置が見えるように少し広め
  const STRETCH_WAIT = 1.0; // 切り終わってから伸ばし始めるまでの秒数（どこで切れたか見えるように止める）
  const STRETCH_TIME = 1.5; // 伸ばし始めてから伸びきるまでの秒数
  const STRETCH_HOLD = 0.6; // 伸びきってから揚げる場面に移るまでの秒数
  const VAT_MARGIN = 2.5;    // 揚げ鍋の長さの、伸ばしたポテトの両端からの余白（cm）
  const GAP = 3.3;           // 串に沿って伸ばしたときに1周ごとに空くすき間（cm）。長さ = 切った深さ + 周回数 × GAP
  const SAMPLES = 40;        // らせん1周あたりの分割数
  const MAX_SAMPLES = Math.ceil(L0 / BREAK_T + 3) * SAMPLES;

  // 揚げる
  const VAT_W = 14;          // 揚げ鍋の内側の幅（cm）
  const VAT_DEPTH = 8;       // 油の深さ（cm）
  const RIM = 2.5;           // 油面から縁の上までの高さ（cm）
  const LIFT_Y = 6;          // 引き上げているときの串の高さ（油面から cm）
  const DIP_Y = -4.5;        // 沈めたときの串の高さ（全体が油に入る）
  const DIP_SPEED = 25;      // 串を上げ下げする速さ（cm/秒）
  const COOK_TIME = 6;       // 油に入っている所が「ちょうどいい」揚げ色になるまでの秒数
  const GOOD_MIN = 1.0;      // 揚げ色の段階（1 = COOK_TIME 秒揚げた状態）。この間がちょうどいい色
  const GOOD_MAX = 1.8;
  const FRY_X = 200;         // 揚げ場の位置（切る場所と重ならないように離す）
  // 揚げ具合 → 色（切り口と皮）
  const FLESH_COLORS = [[0, 0xf2e2a8], [GOOD_MIN, 0xe8b046], [GOOD_MAX, 0xc98225], [2.8, 0x6a3812], [4, 0x1e120c]];
  const SKIN_COLORS  = [[0, 0xb98b4e], [GOOD_MIN, 0xa8742e], [GOOD_MAX, 0x8a5a1e], [2.8, 0x4a2a10], [4, 0x150c08]];

  const SHARE_INSTANT = 0.5; // 共有がこの秒数より早くキャンセル扱いで終わったら、共有シートは出ていなかったとみなす

  // ---------- three.js ----------
  const cv = $('cv');
  // 共有画像に画面を写すため描画結果を残す
  const renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, preserveDrawingBuffer:true });
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(css('--bg'));
  const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 1000);
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x4a4036, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(20, 40, 30);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3);   // 影側が真っ暗にならないように反対から弱く
  fill.position.set(-25, 5, -10);
  scene.add(fill);

  // 串とじゃがいもをまとめた物（串に沿った向きがローカルの +Y、じゃがいもの下端が0）
  const rig = new THREE.Group();
  scene.add(rig);
  // 串の木目：串の長さの向きに走る細い筋と、ゆるい色むら
  function makeSkewerTexture(){
    const W = 64, H = 512;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#d9b98a';
    g.fillRect(0, 0, W, H);
    // ゆるい色むら（串の向きに長い）
    for (let i = 0; i < 40; i++){
      g.fillStyle = `rgba(${Math.random() < 0.5 ? '150,105,60' : '245,225,185'},${0.05 + Math.random() * 0.08})`;
      g.fillRect(Math.random() * W, Math.random() * H, 2 + Math.random() * 10, 60 + Math.random() * 200);
    }
    // 木目の筋
    for (let i = 0; i < 70; i++){
      const x = Math.random() * W;
      g.strokeStyle = `rgba(${Math.random() < 0.7 ? '120,80,40' : '250,235,200'},${0.1 + Math.random() * 0.25})`;
      g.lineWidth = 0.5 + Math.random() * 1.2;
      g.beginPath();
      g.moveTo(x, 0);
      for (let y = 0; y <= H; y += 32) g.lineTo(x + Math.sin(y * 0.02 + i) * 1.2, y);
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  const skewer = new THREE.Mesh(
    new THREE.CylinderGeometry(SKEWER_R, SKEWER_R, 1, 12),
    new THREE.MeshStandardMaterial({ map:makeSkewerTexture(), roughness:0.75, metalness:0 })
  );
  rig.add(skewer);
  function setSkewer(lo, hi){ skewer.scale.y = hi - lo; skewer.position.y = (lo + hi) / 2; }

  // じゃがいもの深さ d（上端0〜下端 L0）での半径
  // と、ぐるりの角度 phi での半径。端を丸くし、少しいびつにしてじゃがいもらしくする
  function radiusAt(d, phi){
    const u = 1 - d / L0;
    const e = Math.max(0, 1 - (2 * u - 1) * (2 * u - 1));
    const base = R_IN + 0.35 + (R_MAX - R_IN - 0.35) * Math.pow(e, 0.35);
    const bump = 1 + BUMP * (0.07 * Math.sin(2 * phi + 0.8) + 0.04 * Math.sin(3 * phi + 2.1 + d * 0.6)
                   + 0.03 * Math.sin(5 * phi + d * 1.9) + 0.03 * Math.sin(d * 2.4 + 1.0));
    return R_IN + (base - R_IN) * bump;
  }

  function makeStops(list){ return list.map(([v, h]) => [v, new THREE.Color(h)]); }
  const FLESH = makeStops(FLESH_COLORS), SKIN = makeStops(SKIN_COLORS);
  function colorOf(stops, c, out){
    if (c <= stops[0][0]) return out.copy(stops[0][1]);
    for (let i = 1; i < stops.length; i++){
      if (c <= stops[i][0]) return out.copy(stops[i - 1][1]).lerp(stops[i][1], (c - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]));
    }
    return out.copy(stops[stops.length - 1][1]);
  }
  // 揚げ具合の色を、揚げる前の色に対する比にする（画像に掛けるので、揚げる前は白＝画像そのまま）
  function tintOf(stops, c, out){
    colorOf(stops, c, out);
    const b = stops[0][1];
    out.r /= b.r; out.g /= b.g; out.b /= b.b;
    return out;
  }

  // まだ切っていない部分（皮付きのじゃがいも）と、その上の切り口
  const SKIN_REPEAT = 1;      // 皮の画像が1周で繰り返す回数（小さいほど模様が大きい）
  const SKIN_TEX_H = 2 * Math.PI * R_MAX / SKIN_REPEAT;   // 皮の画像1枚分の縦の長さ（cm）。横と同じ縮尺にする
  const FLESH_TEX_SIZE = 7.5;// 切り口の画像1枚分の大きさ（cm）
  const texLoader = new THREE.TextureLoader();
  function loadTex(src){
    const t = texLoader.load(src);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  const matSkin = new THREE.MeshStandardMaterial({ map:loadTex(POTATO_TEX.skin), vertexColors:true, roughness:0.8, metalness:0, side:THREE.DoubleSide });
  const matFlesh = new THREE.MeshStandardMaterial({ map:loadTex(POTATO_TEX.flesh), vertexColors:true, roughness:0.6, metalness:0, side:THREE.DoubleSide });
  const skinU = phi => phi / (Math.PI * 2) * SKIN_REPEAT;
  const skinV = d => d / SKIN_TEX_H;
  const uncut = new THREE.Mesh(new THREE.BufferGeometry(), matSkin);
  const uncutTop = new THREE.Mesh(new THREE.BufferGeometry(), matFlesh);
  rig.add(uncut, uncutTop);

  // ---------- 切った所（らせん）。切った分だけ1か所ずつ記録して作る ----------
  // 1か所あたりの頂点：上面（内・外）、下面（内・外）、皮（上から下へ SKIN_ROWS+1 個。元の形の丸みをなぞる）
  const SKIN_ROWS = 4;
  const VPS = 4 + SKIN_ROWS + 1;          // 1か所あたりの頂点数
  const sPhi = new Float32Array(MAX_SAMPLES);    // 切ったときのじゃがいもの角度
  const sDepth = new Float32Array(MAX_SAMPLES);  // 切ったときの刃の深さ
  const cookO = new Float32Array(MAX_SAMPLES);   // 外側（皮側）の揚げ具合
  const cookI = new Float32Array(MAX_SAMPLES);   // 内側（串側）の揚げ具合
  let count = 0;                                 // 記録した数

  const posArr = new Float32Array(MAX_SAMPLES * VPS * 3);
  const colArr = new Float32Array(MAX_SAMPLES * VPS * 3);
  const uvArr = new Float32Array(MAX_SAMPLES * VPS * 2);
  const geo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(posArr, 3);
  const colAttr = new THREE.BufferAttribute(colArr, 3);
  const uvAttr = new THREE.BufferAttribute(uvArr, 2);
  geo.setAttribute('position', posAttr);
  geo.setAttribute('color', colAttr);
  geo.setAttribute('uv', uvAttr);
  // 面の並び：前半が切り口（上面・下面）、後半が皮。それぞれ描く範囲を切った分だけにする
  const FLESH_IDX = 2 * 6, SKIN_IDX = SKIN_ROWS * 6;   // 1区間あたりの数
  {
    const idx = [];
    const quad = (a, b, p, q) => idx.push(a + p, a + q, b + q, a + p, b + q, b + p);
    for (let j = 0; j < MAX_SAMPLES - 1; j++){
      const a = j * VPS, b = (j + 1) * VPS;
      quad(a, b, 0, 1); quad(a, b, 2, 3);
    }
    for (let j = 0; j < MAX_SAMPLES - 1; j++){
      const a = j * VPS, b = (j + 1) * VPS;
      for (let r = 0; r < SKIN_ROWS; r++) quad(a, b, 4 + r, 5 + r);
    }
    geo.setIndex(idx);
    geo.addGroup(0, 0, 0);
    geo.addGroup((MAX_SAMPLES - 1) * FLESH_IDX, 0, 1);
  }
  const spiral = new THREE.Mesh(geo, [matFlesh, matSkin]);
  spiral.frustumCulled = false;
  rig.add(spiral);

  // 1枚の上端と下端の深さ：上端は同じ角度の1周前に切った深さ（最初の1周はじゃがいもの上端）
  const topDepthAt = k => k >= SAMPLES ? sDepth[k - SAMPLES] : 0;
  const thickAt = k => sDepth[k] - topDepthAt(k);

  // 形を作る。切っている間は元のじゃがいもの位置のまま（切れ目が入るだけ）、
  // spread：0 で切ったままの位置、1 で1周ごとに GAP ずつすき間を空けて串に沿って伸ばした位置（その間は途中の位置）
  // 一番新しく切った1枚（刃のすぐ上）は動かさず、上の周ほど大きく上へずらす
  // 伸ばしたときの崩れ（周ごとのすき間のばらつき・外側のたれ下がり/反り返り）。0 で崩れなし
  const NOISE_Y = 0.7, NOISE_TILT = 1.0;
  let noiseP = [0, 0, 0, 0, 0, 0];
  const rollNoise = () => { noiseP = noiseP.map(() => Math.random() * Math.PI * 2); };
  const wave = (t, a, b, c) => Math.sin(t * 1.3 + a) * 0.55 + Math.sin(t * 3.7 + b) * 0.3 + Math.sin(t * 8.9 + c) * 0.15;
  rollNoise();

  function buildShape(spread){
    const s = spread === true ? 1 : (spread || 0);
    const bladeY = L0 - depth;
    for (let k = 0; k < count; k++){
      let dTop = topDepthAt(k), dBot = Math.max(sDepth[k], dTop + 0.02);
      // 広げた位置
      const lift = (count - 1 - k) / SAMPLES * GAP;
      const yTopS = L0 - dTop + lift, yBotS = L0 - dBot + lift;
      // 切ったままの位置（切れ目のすき間の分だけ上下を少し削る）
      const g = Math.min(GROOVE / 2, (dBot - dTop) * 0.25);
      const yTopC = L0 - (dTop + g), yBotC = L0 - (dBot - g);
      const tn = k / SAMPLES;
      const dy = NOISE_Y * wave(tn, noiseP[0], noiseP[1], noiseP[2]) * s;
      const tilt = NOISE_TILT * wave(tn * 1.6, noiseP[3], noiseP[4], noiseP[5]) * s;
      const yTop = yTopC + (yTopS - yTopC) * s + dy, yBot = yBotC + (yBotS - yBotC) * s + dy;
      const ty = R => tilt * (R - R_IN) / R_MAX;   // 外側ほど上下にずれる
      dTop += g * (1 - s); dBot -= g * (1 - s);
      const phi = sPhi[k], co = Math.cos(phi), si = Math.sin(phi);
      const Rt = radiusAt(dTop, phi), Rb = radiusAt(dBot, phi);
      let o = k * VPS * 3, u = k * VPS * 2;
      const put = (x, y, z) => { posArr[o++] = x; posArr[o++] = y; posArr[o++] = z; };
      const uv = (a, b) => { uvArr[u++] = a; uvArr[u++] = b; };
      const flat = (R) => uv(R * co / FLESH_TEX_SIZE, R * si / FLESH_TEX_SIZE);   // 切り口は真上から貼る
      put(R_IN * co, yTop, R_IN * si); flat(R_IN); put(Rt * co, yTop + ty(Rt), Rt * si); flat(Rt);   // 上面（内・外）
      put(R_IN * co, yBot, R_IN * si); flat(R_IN); put(Rb * co, yBot + ty(Rb), Rb * si); flat(Rb);   // 下面（内・外）
      for (let r = 0; r <= SKIN_ROWS; r++){                            // 皮（元の深さの半径をなぞる）
        const f = r / SKIN_ROWS, d = dTop + (dBot - dTop) * f;
        const R = radiusAt(d, phi);
        put(R * co, yTop + (yBot - yTop) * f + ty(R), R * si);
        uv(skinU(phi), skinV(d));
      }
    }
    posAttr.needsUpdate = true;
    uvAttr.needsUpdate = true;
    geo.computeVertexNormals();
    const seg = Math.max(0, count - 1);
    geo.groups[0].count = seg * FLESH_IDX;
    geo.groups[1].count = seg * SKIN_IDX;

    // まだ切っていない部分
    uncut.geometry.dispose(); uncutTop.geometry.dispose();
    paint();
    if (depth < L0 && fallState !== 2 && (phase === 'cut' || phase === 'stretch' || phase === 'cutEnd')){
      buildUncut();
      uncut.visible = uncutTop.visible = true;
    } else {
      uncut.geometry = new THREE.BufferGeometry();
      uncutTop.geometry = new THREE.BufferGeometry();
      uncut.visible = uncutTop.visible = false;
    }
    return bladeY;
  }

  // まだ切っていない部分。上面は刃が通ったらせんの面（角度ごとに、その角度で最後に切った深さ）
  const NY = 24;
  function buildUncut(){
    const base = count ? sPhi[0] : 0;
    const colPhi = [], colTopY = [];
    for (let i = 0; i <= SAMPLES; i++){   // 最後の列は最初の列と同じ場所（画像の継ぎ目用）
      colPhi.push(base + i / SAMPLES * Math.PI * 2);
      let d = 0, cut = false;
      const ic = i % SAMPLES;
      if (count && count - 1 >= ic){
        const k = ic + SAMPLES * Math.floor((count - 1 - ic) / SAMPLES);
        d = sDepth[k]; cut = true;
      }
      colTopY.push(L0 - d - (cut ? GROOVE / 2 : 0));
    }
    // 皮（0 行目は下端を串の穴まで閉じる輪）
    {
      const pos = [], col = [], uvs = [], idx = [];
      const C = SAMPLES + 1;   // 列の数
      for (let r = 0; r <= NY + 1; r++){
        for (let i = 0; i < C; i++){
          const phi = colPhi[i];
          const y = r === 0 ? 0 : colTopY[i] * (r - 1) / NY;
          const d = L0 - y;
          const R = r === 0 ? R_IN : radiusAt(d, phi);
          pos.push(R * Math.cos(phi), y, R * Math.sin(phi));
          col.push(1, 1, 1);
          uvs.push(skinU(phi), skinV(d));
        }
      }
      for (let r = 0; r <= NY; r++){
        for (let i = 0; i < SAMPLES; i++){
          const a = r * C + i, b = a + 1;
          idx.push(a, a + C, b, b, a + C, b + C);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      g.setIndex(idx);
      g.computeVertexNormals();
      uncut.geometry = g;
    }
    // 上面（切り口）
    {
      const pos = [], col = [], uvs = [], idx = [];
      for (let i = 0; i < SAMPLES; i++){
        const phi = colPhi[i], co = Math.cos(phi), si = Math.sin(phi), y = colTopY[i];
        const R = radiusAt(L0 - y, phi);
        pos.push(R_IN * co, y, R_IN * si, R * co, y, R * si);
        col.push(1, 1, 1, 1, 1, 1);
        uvs.push(R_IN * co / FLESH_TEX_SIZE, R_IN * si / FLESH_TEX_SIZE, R * co / FLESH_TEX_SIZE, R * si / FLESH_TEX_SIZE);
        const a = i * 2, b = ((i + 1) % SAMPLES) * 2;
        idx.push(a, b, a + 1, a + 1, b, b + 1);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      g.setIndex(idx);
      g.computeVertexNormals();
      uncutTop.geometry = g;
    }
  }

  // 揚げ具合に合わせて色を塗る
  const _cf = new THREE.Color(), _cs = new THREE.Color();
  function paint(){
    for (let k = 0; k < count; k++){
      const o = k * VPS * 3;
      const set = (v, col) => { colArr[o + v * 3] = col.r; colArr[o + v * 3 + 1] = col.g; colArr[o + v * 3 + 2] = col.b; };
      tintOf(FLESH, cookI[k], _cf); set(0, _cf); set(2, _cf);      // 内側
      tintOf(FLESH, cookO[k], _cf); set(1, _cf); set(3, _cf);      // 外側
      tintOf(SKIN, cookO[k], _cs);
      for (let r = 0; r <= SKIN_ROWS; r++) set(4 + r, _cs);
    }
    colAttr.needsUpdate = true;
  }

  // ナイフ（じゃがいもの右側に固定。刃の高さ＝今切っている位置）。Kenney の包丁のモデルを使う
  const KNIFE_OUT = 1.3;     // 刃がじゃがいもの外に出ている長さ（cm）
  const KM_TIP = -0.358, KM_HILT = 0.108, KM_END = 0.358, KM_BLADE_Y = 0.02;   // モデルの刃先・刃の根元・柄の端の位置と刃の高さ
  const KNIFE_SCALE = (R_MAX + KNIFE_OUT - R_IN) / (KM_HILT - KM_TIP);       // 刃先が串の近く、刃の根元がじゃがいもの外 KNIFE_OUT の所に来る大きさ
  const KNIFE_RIGHT = R_IN + (KM_END - KM_TIP) * KNIFE_SCALE;                 // ナイフの右端
  const KNIFE_TILT = 40 * Math.PI / 180;   // 持ち手を自分の長さの軸まわりに起こす角度（側面がカメラから見えるように。刃は水平のまま）
  const KM_HANDLE_Z = -0.03;                // モデルの持ち手の前後の真ん中
  const blade = new THREE.Group();
  {
    // モデルを刃と持ち手に分ける（刃の根元より刃先側の三角形が刃）
    const P = KNIFE_MODEL.p, I = KNIFE_MODEL.i;
    const bladeIdx = [], handleIdx = [];
    for (let t = 0; t < I.length; t += 3){
      const tri = [I[t], I[t + 1], I[t + 2]];
      (tri.every(v => P[v * 3] <= KM_HILT + 1e-4) ? bladeIdx : handleIdx).push(...tri);
    }
    const tex = texLoader.load(KNIFE_TEX);
    tex.flipY = false;                                   // glTF の画像の向き
    tex.magFilter = THREE.NearestFilter;
    const mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.45, metalness:0.1, side:THREE.DoubleSide });
    const part = idx => {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(KNIFE_MODEL.p, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(KNIFE_MODEL.n, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(KNIFE_MODEL.uv, 2));
      g.setIndex(idx);
      const m = new THREE.Mesh(g, mat);
      m.scale.setScalar(KNIFE_SCALE);
      return m;
    };
    const tx = R_IN - KM_TIP * KNIFE_SCALE;
    // 刃：水平のまま。刃の高さをナイフの高さ（今切っている位置）に合わせる
    const bladeMesh = part(bladeIdx);
    bladeMesh.position.set(tx, -KM_BLADE_Y * KNIFE_SCALE, 0);
    // 持ち手：自分の長さの軸まわりに起こして、側面をカメラに向ける
    const handleAxis = new THREE.Group();
    handleAxis.position.set(tx, 0, KM_HANDLE_Z * KNIFE_SCALE);
    handleAxis.rotation.x = KNIFE_TILT;
    const handleMesh = part(handleIdx);
    handleMesh.position.set(0, -KM_BLADE_Y * KNIFE_SCALE, -KM_HANDLE_Z * KNIFE_SCALE);
    handleAxis.add(handleMesh);
    blade.add(bladeMesh, handleAxis);
  }
  scene.add(blade);

  // 揚げ鍋（フライヤー）。らせんの長さに合わせて作る
  const vat = new THREE.Group();
  scene.add(vat);
  let vatD = 20;
  const FLOOR_Y = -VAT_DEPTH - 5;   // フライヤーを置いている台の高さ
  const matBasin = new THREE.MeshPhongMaterial({ color:0xc4c9ce, specular:0xffffff, shininess:80 });   // 油が入る槽（明るいステンレス）
  const matBody = new THREE.MeshPhongMaterial({ color:0x80878d, specular:0x777777, shininess:40 });    // 外側の箱
  const matRim = new THREE.MeshPhongMaterial({ color:0xd8dce0, specular:0xffffff, shininess:110 });    // 上のふち
  const matOil = new THREE.MeshPhongMaterial({ color:0xd9a630, specular:0xfff2c0, shininess:160,
    transparent:true, opacity:0.72, depthWrite:false });                                               // 油（沈めたポテトが透けて見える）
  // 台
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 200), new THREE.MeshLambertMaterial({ color:0x6a6158 }));   // 切る場面から見えない大きさ
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(FRY_X, FLOOR_Y, 0);
  scene.add(floor);
  function buildVat(D){
    vatD = D;
    vat.children.slice().forEach(m => { vat.remove(m); m.geometry.dispose(); });
    const add = (geo, mat, x, y, z) => {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(FRY_X + x, y, z);
      vat.add(m);
      return m;
    };
    const box = (w, h, d, mat, x, y, z) => add(new THREE.BoxGeometry(w, h, d), mat, x, y, z);
    const WALL = 0.35;                    // 槽の壁の厚さ
    const LIP = 1.6;                      // 上のふちの幅
    const BODY = 1.2;                     // 槽と外側の箱のすき間
    const bw = VAT_W + 2 * (WALL + BODY), bd = D + 2 * (WALL + BODY);
    const wallH = RIM + VAT_DEPTH;
    // 外側の箱（台からふちの下まで。中は空けて、上は槽とふちが見えるようにする）
    const bodyTop = RIM - 0.3, bodyH = bodyTop - FLOOR_Y, BT = 0.4;
    box(bw, bodyH, BT, matBody, 0, FLOOR_Y + bodyH / 2, -(bd / 2 - BT / 2));
    box(bw, bodyH, BT, matBody, 0, FLOOR_Y + bodyH / 2,  (bd / 2 - BT / 2));
    box(BT, bodyH, bd - 2 * BT, matBody, -(bw / 2 - BT / 2), FLOOR_Y + bodyH / 2, 0);
    box(BT, bodyH, bd - 2 * BT, matBody,  (bw / 2 - BT / 2), FLOOR_Y + bodyH / 2, 0);
    // 槽の壁と底
    box(VAT_W + WALL * 2, wallH, WALL, matBasin, 0, RIM - wallH / 2, -(D / 2 + WALL / 2));
    box(VAT_W + WALL * 2, wallH, WALL, matBasin, 0, RIM - wallH / 2,  (D / 2 + WALL / 2));
    box(WALL, wallH, D, matBasin, -(VAT_W / 2 + WALL / 2), RIM - wallH / 2, 0);
    box(WALL, wallH, D, matBasin,  (VAT_W / 2 + WALL / 2), RIM - wallH / 2, 0);
    box(VAT_W, 0.3, D, matBasin, 0, -VAT_DEPTH - 0.15, 0);
    // 上のふち（槽のまわりを囲む平らな枠）
    const lipY = RIM + 0.15, iw = VAT_W + WALL * 2, id = D + WALL * 2;
    box(iw + LIP * 2, 0.3, LIP, matRim, 0, lipY, -(id / 2 + LIP / 2));
    box(iw + LIP * 2, 0.3, LIP, matRim, 0, lipY,  (id / 2 + LIP / 2));
    box(LIP, 0.3, id, matRim, -(iw / 2 + LIP / 2), lipY, 0);
    box(LIP, 0.3, id, matRim,  (iw / 2 + LIP / 2), lipY, 0);
    // 油
    box(VAT_W, VAT_DEPTH, D, matOil, 0, -VAT_DEPTH / 2, 0).renderOrder = 1;
  }

  // 油の泡。沈んでいるポテトの表面から出て油面まで上がり、油面でふくらんではじける
  const BUBBLE_MAX = 500;
  const BUBBLE_RATE = 160;    // ポテト全体が沈んでいるときに1秒あたり油面に直接出る泡の数
  const RISE_RATE = 260;      // ポテト全体が沈んでいるときに1秒あたりポテトの表面から出る泡の数
  const bubbles = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 10, 8),
    new THREE.MeshPhongMaterial({ color:0xf0c860, specular:0xfff0b0, shininess:90, transparent:true, opacity:0.7 }),   // 油になじむ黄色
    BUBBLE_MAX
  );
  bubbles.renderOrder = 2;
  bubbles.frustumCulled = false;
  scene.add(bubbles);
  // 泡：rise（油の中を上がっている）か、油面（ふくらんではじける）
  const bub = [];   // {x, y, z, vy, rise, age, life, size}
  const _bm = new THREE.Matrix4(), _bv = new THREE.Vector3();
  let bubbleCarry = 0, riseCarry = 0;
  // ポテトの沈んでいる所の表面の点を1つ選ぶ（見つからなければ false）
  function pickSubmerged(){
    for (let tries = 0; tries < 30; tries++){
      const k = Math.floor(Math.random() * count);
      const v = 4 + Math.floor(Math.random() * (SKIN_ROWS + 1));   // 皮の頂点のどれか
      const o = (k * VPS + v) * 3;
      _bv.set(posArr[o], posArr[o + 1], posArr[o + 2]);
      rig.localToWorld(_bv);
      if (_bv.y < -0.1) return true;
    }
    return false;
  }
  function surfaceBubble(x, z, size){
    bub.push({ x, y:0.02, z, vy:0, rise:false, age:0, life:0.25 + Math.random() * 0.35, size });
  }
  function updateBubbles(dt, submergedRatio){
    rig.updateMatrixWorld();
    // ポテトの表面から出る泡
    riseCarry = Math.min(riseCarry + RISE_RATE * submergedRatio * dt, 3);
    while (riseCarry >= 1 && bub.length < BUBBLE_MAX){
      riseCarry -= 1;
      if (!pickSubmerged()) break;
      bub.push({ x:_bv.x + (Math.random() - 0.5) * 0.3, y:_bv.y, z:_bv.z + (Math.random() - 0.5) * 0.3,
                 vy:3 + Math.random() * 4, rise:true, age:0, life:0, size:0.05 + Math.random() * 0.09 });
    }
    // 油面に直接出る泡（沈んでいる所の真上）
    bubbleCarry = Math.min(bubbleCarry + BUBBLE_RATE * submergedRatio * dt, 3);
    while (bubbleCarry >= 1 && bub.length < BUBBLE_MAX){
      bubbleCarry -= 1;
      if (!pickSubmerged()) break;
      surfaceBubble(_bv.x + (Math.random() - 0.5) * 0.8, _bv.z + (Math.random() - 0.5) * 0.8, 0.12 + Math.random() * 0.22);
    }
    // 上がる泡は油面に着いたら油面の泡になる。油面の泡はふくらんではじける
    for (let i = bub.length - 1; i >= 0; i--){
      const b = bub[i];
      if (b.rise){
        b.age += dt;
        b.y += b.vy * dt;
        b.x += Math.sin(b.age * 14 + i) * 0.4 * dt;   // 上がりながら少し揺れる
        if (b.y >= 0){ bub.splice(i, 1); surfaceBubble(b.x, b.z, b.size * 1.8); }
      } else {
        b.age += dt;
        if (b.age >= b.life) bub.splice(i, 1);
      }
    }
    for (let i = 0; i < bub.length; i++){
      const b = bub[i];
      if (b.rise){
        _bm.makeScale(b.size, b.size, b.size);
        _bm.setPosition(b.x, b.y, b.z);
      } else {
        const r = b.size * Math.sin(Math.min(1, b.age / b.life * 1.2) * Math.PI * 0.5);
        _bm.makeScale(r, r * 0.6, r);
        _bm.setPosition(b.x, 0.02, b.z);
      }
      bubbles.setMatrixAt(i, _bm);
    }
    bubbles.count = bub.length;
    bubbles.instanceMatrix.needsUpdate = true;
  }
  function clearBubbles(){ bub.length = 0; bubbles.count = 0; bubbleCarry = 0; riseCarry = 0; }

  // ---------- カメラ ----------
  let view = 'cut';
  // 完成したポテトを回して見るための台座（この中心で回る）
  const SHOW_X = FRY_X;
  const showPivot = new THREE.Group();
  showPivot.position.set(SHOW_X, 0, 0);
  scene.add(showPivot);
  const SHOW_ROT = 0.008;   // 指を1px動かしたときに回る角度（ラジアン）
  let showHalfH = 10, showHalfW = 4;   // 最初の向きでのポテトの縦横の半分の大きさ
  let showZoom = 1;         // 指2本・ホイールで変える倍率
  const ZOOM_MIN = 0.4, ZOOM_MAX = 4;
  let worldPerPx = 0.02;
  let viewTop = L0;   // 切る画面で映す上端（伸ばすときに広げる）
  function placeCamera(){
    const vf = camera.fov * Math.PI / 180;
    const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
    if (view === 'cut'){
      // 真横から、じゃがいもとナイフが入るように（下はボタンの分の余白）
      let lo = -1.5, hi = viewTop + 1.5;
      const span = hi - lo;
      lo -= span * 0.15; hi += span * 0.12;
      const elev = 0;
      const cx = (KNIFE_RIGHT - R_MAX) / 2, halfW = (KNIFE_RIGHT + R_MAX) / 2 + 0.6;
      const dist = Math.max(((hi - lo) / 2) / Math.tan(vf / 2), halfW / Math.tan(hf / 2));
      const cy = (lo + hi) / 2;
      // 指の移動量（px）を串の位置での長さ（cm）に直す係数
      worldPerPx = 2 * dist * Math.tan(vf / 2) / Math.max(1, cv.clientHeight);
      camera.position.set(cx, cy + dist * Math.sin(elev), dist * Math.cos(elev));
      camera.lookAt(cx, cy, 0);
    } else if (view === 'show'){
      // 正面から。下の結果の枠に重ならない所（画面の上側）にポテトが収まる距離にし、その真ん中に映す
      const H = Math.max(1, cv.clientHeight);
      const panel = document.querySelector('#over .panel');
      const below = Math.min(H * 0.5, (panel ? panel.offsetHeight : 0) + 36);   // 下で使えない高さ（px）
      const avail = (H - below) / H;                                            // 使える高さの割合
      const fitDist = Math.max(showHalfH / (Math.tan(vf / 2) * avail * 0.92), showHalfW / (Math.tan(hf / 2) * 0.9)) + R_MAX;
      const dist = fitDist / showZoom;
      const shift = (below / 2) / H * 2 * dist * Math.tan(vf / 2);              // 使える所の真ん中に来るように下げる量
      camera.position.set(SHOW_X, -shift, dist);
      camera.lookAt(SHOW_X, -shift, 0);
    } else {
      // 揚げ鍋を斜め上から
      const tilt = 28 * Math.PI / 180;   // 真上からの傾き（小さいほど上から）
      const halfW = VAT_W / 2 + 4, halfH = (vatD * Math.cos(tilt) + (LIFT_Y + R_MAX) * Math.sin(tilt)) / 2 + 2.5;
      const dist = Math.max(halfW / Math.tan(hf / 2), halfH / Math.tan(vf / 2)) * 1.08;
      const ty = 1.5, tz = 0;
      camera.position.set(FRY_X, ty + dist * Math.cos(tilt), tz + dist * Math.sin(tilt));
      camera.lookAt(FRY_X, ty, tz);
    }
  }
  function resize(){
    const w = cv.clientWidth, h = cv.clientHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    placeCamera();
  }
  addEventListener('resize', resize);

  // ---------- 状態 ----------
  let phase = 'cut';      // cut（切る） / stretch（伸ばしている） / cutEnd（切り終わり） / fry（揚げる） / over（結果）
  let stretchT = 0;       // 伸ばす演出の進み（0〜1）
  let cutting = false;    // 刃を入れ始めた
  let spin = 0;           // じゃがいもの回転角
  let nextSample = 0;     // 次に記録する回転角
  let depth = 0;          // 刃の深さ（cm）
  let frameDepth = 0;     // 前のフレームの刃の深さ
  let press = null;       // 押さえている指 {id, y}
  let rigY = LIFT_Y;      // 揚げるときの串の高さ
  let spiralLen = 0;
  let result = null, overShownAt = 0;

  const turnsCut = () => count / SAMPLES;
  // 伸ばしたときの長さ：切った深さ ＋ 周ごとのすき間
  const stretchedLen = () => count ? sDepth[count - 1] + (count - 1) / SAMPLES * GAP : 0;

  function reset(){
    clearBubbles();
    clearFx();
    halo.visible = false;
    $('over').classList.remove('wait');
    showPtrs.clear(); pinchDist = 0;
    scene.add(rig);   // 台座から外す
    fallState = 0;
    for (const m of [uncut, uncutTop]){ m.position.set(0, 0, 0); m.rotation.set(0, 0, 0); }
    vat.visible = floor.visible = bubbles.visible = true;
    phase = 'cut';
    view = 'cut';
    cutting = false;
    spin = 0; nextSample = 0;
    depth = 0; frameDepth = 0; press = null;
    count = 0;
    cookO.fill(0); cookI.fill(0);
    rig.position.set(0, 0, 0);
    rig.rotation.set(0, 0, 0);
    blade.visible = true;
    viewTop = L0; stretchT = 0;
    rollNoise();
    buildShape(false);
    setSkewer(-3, L0 + 3);
    blade.position.y = L0;
    $('over').classList.add('hidden');
    $('done').classList.add('hidden');
    $('mute').classList.add('hidden');
    showMsg('');
    placeCamera();
  }

  // 画面中央の文字（出るたびに弾む演出をやり直す）
  function showMsg(text, kind){
    const el = $('msg');
    el.textContent = text;
    el.className = '';
    if (!text) return;
    void el.offsetWidth;   // 演出を最初から再生し直すため
    el.className = kind + ' show';
  }

  // 切り終わり（切れた、または最後まで切った）
  // 途中で切れたときに残った部分を串から落とす
  const FALL_G = 120;        // 落ちる速さの増え方（cm/秒²）
  const SKEWER_BOTTOM = -3;  // 串の下端
  let fallState = 0;         // 0：落としていない 1：落ちている 2：落ちきった（もう出さない）
  let fallY = 0, fallV = 0, fallRot = 0;
  function updateFall(dt){
    if (fallState !== 1) return;
    fallV += FALL_G * dt;
    fallY -= fallV * dt;
    // 串の下端を抜けるまでは串に沿ってまっすぐ下り、抜けたら傾きながら落ちる
    if (L0 - depth + fallY < SKEWER_BOTTOM) fallRot += dt * 2.5;
    for (const m of [uncut, uncutTop]){ m.position.y = fallY; m.rotation.z = fallRot; }
    if (fallY < -80){
      fallState = 2;
      uncut.visible = uncutTop.visible = false;
    }
  }

  function endCut(text, ok){
    if (!ok){ fallState = 1; fallY = 0; fallV = 0; fallRot = 0; }
    phase = 'cutEnd';
    press = null;
    spiralLen = stretchedLen();
    buildShape(false);
    if (text) showMsg(text, ok ? 'good' : 'bad');
    // 続けて串に沿って伸ばす演出
    phase = 'stretch';
    stretchT = -STRETCH_WAIT / STRETCH_TIME;
  }

  // 伸ばす演出：切ったままの位置から、串に広げた位置まで動かす。伸びきって少し見せたら揚げる場面へ
  function updateStretch(dt){
    stretchT += dt / STRETCH_TIME;
    if (stretchT >= 1 + STRETCH_HOLD / STRETCH_TIME){ phase = 'cutEnd'; startFry(); return; }
    if (stretchT <= 0) return;   // 伸ばし始める前に止めている間
    const t = Math.min(1, stretchT);
    const s = t * t * (3 - 2 * t);   // 動き始めと終わりをゆっくりに
    const bladeY = buildShape(s);
    const top = L0 + (bladeY + spiralLen - L0) * s;
    setSkewer(-3, Math.max(L0, top) + 3);
    viewTop = Math.max(L0, top);
    placeCamera();
  }

  function startFry(){
    if (phase !== 'cutEnd') return;
    phase = 'fry';
    view = 'fry';
    blade.visible = false;
    uncut.visible = uncutTop.visible = false;   // 残ったじゃがいもは揚げない
    rigY = LIFT_Y;
    buildShape(true);   // 串に広げた形にする
    buildVat(spiralLen + 2 * VAT_MARGIN);   // 伸ばした長さに合わせる
    setSkewer(L0 - depth - VAT_MARGIN + 0.5, L0 - depth + spiralLen + VAT_MARGIN - 0.5);   // 鍋の中に収める
    // 串を寝かせて揚げ鍋の上へ（串の向きが奥へ伸びる）
    const mid = L0 - depth + spiralLen / 2;
    rig.rotation.set(-Math.PI / 2, 0, 0);
    rig.position.set(FRY_X, rigY, mid);
    showMsg('');
    $('done').classList.remove('hidden');
    $('mute').classList.remove('hidden');
    placeCamera();
  }

  // 長さ（cm）に応じた呼び名。上限未満ならその名前
  const RANKS = [
    [10, 'プチぐるぐるポテト'],
    [15, 'ミニぐるぐるポテト'],
    [22, 'ぐるぐるポテト'],
    [30, 'ナイスぐるぐるポテト'],
    [40, 'ビッグぐるぐるポテト'],
    [50, 'グレートぐるぐるポテト'],
    [62, 'スーパーぐるぐるポテト'],
    [75, 'デラックスぐるぐるポテト'],
    [88, 'ジャンボぐるぐるポテト'],
    [100, 'メガぐるぐるポテト'],
    [120, 'ギガぐるぐるポテト'],
    [140, 'テラぐるぐるポテト'],
    [170, 'ウルトラぐるぐるポテト'],
    [200, 'ハイパーぐるぐるポテト'],
    [240, 'ミラクルぐるぐるポテト'],
    [Infinity, 'レジェンドぐるぐるポテト'],
  ];
  const rankName = len => RANKS.find(r => len < r[0])[1];

  const BEST_KEY = 'guruguru-potato-best';   // 最高記録（このブラウザに保存）

  function finish(){
    if (phase !== 'fry') return;
    phase = 'lift';   // 揚げるのはここまで。油から引き上げてから結果を出す
    liftT = 0;
    result = { len: Math.round(spiralLen * 10) / 10 };
    $('rLen').textContent = `${rankName(result.len)}\n${result.len.toFixed(1)}cm`;
    let best = 0;
    try { best = parseFloat(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}
    if (result.len > best){
      best = result.len;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    $('rBest').textContent = `最高 ${best.toFixed(1)}cm`;
    $('done').classList.add('hidden');
  }

  // 油から引き上げる：串ごと油の上まで上げ、少し見せてから完成品を見る場面へ
  const LIFT_TO = LIFT_Y + 2;   // 引き上げる高さ（油面から cm）
  const LIFT_SPEED = 12;        // 引き上げる速さ（cm/秒）
  const LIFT_HOLD = 0.8;        // 上げきってから完成品を見る場面に移るまでの秒数
  let liftT = 0;
  function updateLift(dt){
    rigY = Math.min(LIFT_TO, rigY + LIFT_SPEED * dt);
    rig.position.y = rigY;
    updateBubbles(dt, 0);   // 残っている泡をはじけさせる
    if (rigY < LIFT_TO) return;
    liftT += dt;
    if (liftT < LIFT_HOLD) return;
    // 完成品を見る場面に移り、そこで塩を振る（結果の枠は場所だけ取っておき、振り終わってから見せる）
    phase = 'salt';
    saltT = 0;
    $('mute').classList.add('hidden');
    $('over').classList.add('wait');
    $('over').classList.remove('hidden');
    startShow();
  }

  // 塩を振る：上から塩の粒がポテト全体に降ってから完成
  const SALT_TIME = 1.6;        // 塩を振っている秒数
  const SALT_HOLD = 0.5;        // 振り終わってから完成（結果を出す）までの秒数
  const SALT_RATE = 4;          // ポテト1cmあたり1秒に降る粒の数
  let saltT = 0, saltCarry = 0;
  function updateSalt(dt){
    saltT += dt;
    if (saltT < SALT_TIME){
      // ポテト全体に塩の粒が降りかかり、着いた所にくっつく
      saltCarry += SALT_RATE * spiralLen * dt;
      const sc = Math.max(1, showHalfH / 8);
      rig.updateMatrixWorld(true);
      while (saltCarry >= 1){
        saltCarry -= 1;
        const local = pickSaltSpot(new THREE.Vector3());
        const size = (0.05 + Math.random() * 0.04) * sc;
        local.y += size * 0.5;
        const w = rig.localToWorld(_sp.copy(local));
        const T = 0.3 + Math.random() * 0.15, drop = 4 * sc;   // 落ちる時間と高さ
        const f = addFx(w.x, w.y + drop, w.z, 0, 0, 0, 0, T, size, 0xffffff);
        f.stick = local; f.drop = drop;
      }
    }
    if (saltT < SALT_TIME + SALT_HOLD) return;
    // 完成
    phase = 'over';
    $('over').classList.remove('wait');
    overShownAt = performance.now();
    completeShow();
  }

  // 完成したポテトだけを台座に付けて、回して見られるようにする
  // ---------- 軽いエフェクト（小さな粒を飛ばす） ----------
  const FX_MAX = 1500;
  const fxMesh = new THREE.InstancedMesh(
    new THREE.IcosahedronGeometry(1, 0),
    new THREE.MeshBasicMaterial({ color:0xffffff }),
    FX_MAX
  );
  fxMesh.frustumCulled = false;
  fxMesh.setColorAt(0, new THREE.Color(0xffffff));   // 粒ごとの色を使えるようにしておく（最初の描画の前に必要）
  fxMesh.count = 0;
  scene.add(fxMesh);
  const fx = [];   // {x,y,z, vx,vy,vz, g, age, life, size, color}
  const _fm = new THREE.Matrix4(), _fc = new THREE.Color();
  function addFx(x, y, z, vx, vy, vz, g, life, size, color){
    if (fx.length >= FX_MAX) fx.shift();
    const f = { x, y, z, vx, vy, vz, g, age:0, life, size, color, stick:null };
    fx.push(f);
    return f;
  }
  function updateFx(dt){
    if (fx.length && rig.parent === showPivot) showPivot.updateMatrixWorld(true);   // 回したばかりの向きで塩の着く所を求める
    for (let i = fx.length - 1; i >= 0; i--){
      const f = fx[i];
      f.age += dt;
      if (f.age >= f.life){
        if (f.stick) stickSalt(f.stick, f.size);   // ポテトに着いた塩はそのままくっつく
        fx.splice(i, 1); continue;
      }
      if (f.stick){
        // 着く所（ポテトと一緒に回る）の真上から、まっすぐ落ちる
        rig.localToWorld(_sp.copy(f.stick));
        f.x = _sp.x; f.y = _sp.y + f.drop * (1 - f.age / f.life); f.z = _sp.z;
        continue;
      }
      f.vy -= f.g * dt;
      f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    }
    for (let i = 0; i < fx.length; i++){
      const f = fx[i];
      const sz = f.stick ? f.size : f.size * (1 - f.age / f.life);   // だんだん小さくなって消える（塩は小さくならない）
      _fm.makeScale(sz, sz, sz).setPosition(f.x, f.y, f.z);
      fxMesh.setMatrixAt(i, _fm);
      fxMesh.setColorAt(i, _fc.set(f.color));
    }
    fxMesh.count = fx.length;
    fxMesh.instanceMatrix.needsUpdate = true;
    if (fxMesh.instanceColor) fxMesh.instanceColor.needsUpdate = true;
  }
  function clearFx(){ fx.length = 0; fxMesh.count = 0; saltMesh.count = 0; }

  // ポテトにくっついた塩。ポテトと一緒に回るように、ポテトの子にする
  const SALT_MAX = 3000;
  const saltMesh = new THREE.InstancedMesh(
    new THREE.IcosahedronGeometry(1, 0),
    new THREE.MeshBasicMaterial({ color:0xffffff }),
    SALT_MAX
  );
  saltMesh.frustumCulled = false;
  saltMesh.count = 0;
  rig.add(saltMesh);
  function stickSalt(p, size){
    if (saltMesh.count >= SALT_MAX) return;
    _fm.makeScale(size, size, size).setPosition(p.x, p.y, p.z);
    saltMesh.setMatrixAt(saltMesh.count++, _fm);
    saltMesh.instanceMatrix.needsUpdate = true;
  }
  // ポテトの表面の点を1つ選ぶ（ポテトの中の位置）。7割は1枚ごとの上の面、3割は皮
  const _sp = new THREE.Vector3(), _sq = new THREE.Vector3();
  function pickSaltSpot(out){
    const k = Math.floor(Math.random() * Math.max(1, count - 1));
    const vtx = (kk, v) => { const o = (kk * VPS + v) * 3; return _sq.set(posArr[o], posArr[o + 1], posArr[o + 2]); };
    const t = Math.random();
    if (Math.random() < 0.7){
      const a = vtx(k, 0).clone(), b = vtx(k, 1);
      out.copy(a).lerp(b, 0.15 + 0.85 * Math.random());       // 内側から外側のどこか
      out.lerp(vtx(k + 1, 0).clone().lerp(vtx(k + 1, 1), 0.5), t * 0.5);
    } else {
      const v = 4 + Math.floor(Math.random() * (SKIN_ROWS + 1));
      out.copy(vtx(k, v)).lerp(vtx(k + 1, v), t);
    }
    return out;
  }

  // 切っている間：刃が入っている所（じゃがいもの外側のふち）から細かいかけらが飛ぶ
  const CHIP_RATE = 45;   // 1秒あたりの数
  const CHIP_COLORS = [0xf6e2a8, 0xfff4d0, 0xe8c878];
  let chipCarry = 0;
  function emitChips(dt){
    chipCarry += CHIP_RATE * dt;
    const R = radiusAt(depth, spin), y = L0 - depth;
    while (chipCarry >= 1){
      chipCarry -= 1;
      addFx(R + 0.05, y + 0.04, (Math.random() - 0.5) * 0.3,
        1.5 + Math.random() * 3, 1.5 + Math.random() * 3, -1 - Math.random() * 3,
        25, 0.3 + Math.random() * 0.35, 0.05 + Math.random() * 0.06,
        CHIP_COLORS[Math.floor(Math.random() * CHIP_COLORS.length)]);
    }
  }

  // 完成したとき：ポテトのまわりから金色の粒がはじける
  const DONE_COLORS = [0xffd34d, 0xffe999, 0xffffff, 0xffa53a];
  function burstDone(){
    const h = spiralLen / 2 + 1, sc = Math.max(1, showHalfH / 8);
    for (let i = 0; i < 160; i++){
      const a = Math.random() * Math.PI * 2;
      const y = (Math.random() * 2 - 1) * h * Math.cos(showPivot.rotation.x);
      const r = R_MAX + 0.3;
      const sp = (4 + Math.random() * 6) * sc;
      addFx(SHOW_X + Math.cos(a) * r, y, Math.sin(a) * r,
        Math.cos(a) * sp, (2 + Math.random() * 5) * sc, Math.sin(a) * sp,
        12 * sc, 0.9 + Math.random() * 0.8, (0.12 + Math.random() * 0.12) * sc,
        DONE_COLORS[Math.floor(Math.random() * DONE_COLORS.length)]);
    }
  }

  // 後光：完成品の後ろに放射状の光。いつもポテトより奥に見えるように、先に別に描く
  const HALO_OPACITY = 0.4;   // 後光の濃さ（1 で最も濃い）
  const HALO_ROT = 0.25;      // 後光が回る速さ（ラジアン/秒）
  const haloScene = new THREE.Scene();
  haloScene.background = scene.background;
  // 画像を使わず、光の筋と真ん中の光をその場で計算して描く
  // （画像のグラデーションだと、iPhone では暗い所に色の粒のノイズが出るため）
  const halo = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.ShaderMaterial({
      uniforms:{ uRot:{ value:0 }, uOpacity:{ value:HALO_OPACITY } },
      vertexShader:`
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader:`
        precision highp float;
        uniform float uRot, uOpacity;
        varying vec2 vUv;
        void main(){
          vec2 p = vUv * 2.0 - 1.0;
          float r = length(p);
          float a = atan(p.y, p.x) + uRot;
          float c = cos(a * 12.0);
          float rays = pow(0.5 + 0.5 * c, 4.0) + 0.7 * pow(0.5 - 0.5 * c, 16.0);   // 太い筋と細い筋が交互に24本
          vec3 col = vec3(1.0, 0.88, 0.47) * rays * 0.9 * clamp(1.0 - r, 0.0, 1.0)
                   + vec3(1.0, 0.94, 0.7) * 0.9 * clamp(1.0 - r / 0.6, 0.0, 1.0);    // 真ん中の光
          gl_FragColor = vec4(col * uOpacity, 1.0);
        }`,
      transparent:true, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending
    })
  );
  halo.visible = false;
  haloScene.add(halo);
  function renderAll(){
    if (!halo.visible){ renderer.render(scene, camera); return; }
    renderer.autoClear = false;
    renderer.clear();
    renderer.render(haloScene, camera);
    renderer.clearDepth();
    const bg = scene.background;
    scene.background = null;
    renderer.render(scene, camera);
    scene.background = bg;
    renderer.autoClear = true;
  }

  function startShow(){
    vat.visible = floor.visible = bubbles.visible = false;
    showPivot.quaternion.set(0, 0, 0, 1);
    showPivot.rotation.set(0.35, 0, 0);   // 少し手前に倒して立体に見せる
    showPivot.add(rig);
    const mid = L0 - depth + spiralLen / 2;
    rig.rotation.set(0, 0, 0);
    rig.position.set(0, -mid, 0);         // ポテトの真ん中を回る中心にする
    // 最初の向き（少し手前に倒した縦向き）での見た目の大きさ
    const tilt = showPivot.rotation.x;
    showHalfH = (spiralLen / 2 + 1.5) * Math.cos(tilt) + (R_MAX + 0.5) * Math.sin(tilt);
    showHalfW = R_MAX + 0.8;
    showZoom = 1;
    view = 'show';
    placeCamera();
  }
  // 完成：後光を出し、金色の粒をはじけさせる
  function completeShow(){
    const hs = 2.2 * Math.max(showHalfH, showHalfW * 2);
    halo.scale.set(hs, hs, 1);
    halo.position.set(SHOW_X, 0, 0);
    halo.visible = true;
    burstDone();
  }
  const AUTO_ROT = 0.6;         // 完成品が自動で回る速さ（ラジアン/秒）
  const showPtrs = new Map();   // 完成品の画面で触れている指
  let pinchDist = 0;
  function ptrDist(){
    const [a, b] = [...showPtrs.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  function setZoom(z){
    showZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
    placeCamera();
  }
  const _qa = new THREE.Quaternion(), _ax = new THREE.Vector3();
  function rotateShow(dx, dy){
    // 画面の横の動きは縦軸まわり、縦の動きは横軸まわりに回す（どの向きにも回せる）
    _qa.setFromAxisAngle(_ax.set(0, 1, 0), dx * SHOW_ROT);
    showPivot.quaternion.premultiply(_qa);
    _qa.setFromAxisAngle(_ax.set(1, 0, 0), dy * SHOW_ROT);
    showPivot.quaternion.premultiply(_qa);
  }

  function updateCut(dt){
    // じゃがいもは指で押さえている間だけ、一定の速さで勝手に回る（指を離すと止まる）
    const prevSpin = spin, prevDepth = frameDepth;
    if (press) spin += ROT_SPEED * Math.PI * 2 * dt;
    frameDepth = depth;
    if (cutting){
      // 回った角度ごとに、そのときの刃の深さを記録する
      while (nextSample <= spin && count < MAX_SAMPLES){
        const f = (nextSample - prevSpin) / Math.max(spin - prevSpin, 1e-9);
        sPhi[count] = nextSample;
        sDepth[count] = prevDepth + (depth - prevDepth) * Math.min(Math.max(f, 0), 1);
        const k = count++;
        nextSample += Math.PI * 2 / SAMPLES;
        if (k >= SAMPLES && thickAt(k) < BREAK_T){ rig.rotation.y = spin; endCut('切れた！', false); return; }
      }
      if (depth >= L0 || count >= MAX_SAMPLES){
        // 下まで切れたら、最後の1周の下に残っている下端のかけらも、らせんの最後の1枚として付ける
        for (let i = 0; i < SAMPLES && count < MAX_SAMPLES; i++){
          sPhi[count] = nextSample;
          sDepth[count] = depth;
          count++;
          nextSample += Math.PI * 2 / SAMPLES;
        }
        rig.rotation.y = spin; endCut('', true); return;
      }
    }
    // 切っている所が刃の位置（右側）に来るように回す
    rig.rotation.y = spin;
    blade.position.y = buildShape(false);
    if (cutting && press) emitChips(dt);
  }

  function updateFry(dt){
    const target = DIP_Y;   // 揚げる場面に移ったら自動で油に沈める
    const step = DIP_SPEED * dt;
    rigY = Math.abs(target - rigY) <= step ? target : rigY + Math.sign(target - rigY) * step;
    rig.position.y = rigY;
    // 油に入っている所だけ揚がる（串を寝かせているので、周の角度で高さが変わる）
    let any = false, under = 0;
    for (let k = 0; k < count; k++){
      const s = Math.sin(sPhi[k]);
      const R = radiusAt(sDepth[k], sPhi[k]);
      if (rigY + R * s < 0){ cookO[k] += dt / COOK_TIME; any = true; under++; }
      if (rigY + R_IN * s < 0){ cookI[k] += dt / COOK_TIME; any = true; }
    }
    if (any) paint();
    updateBubbles(dt, count ? under / count : 0);
  }

  // ---------- 入力 ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (phase === 'cut'){
      if (press) return;
      press = { id:e.pointerId, y:e.clientY };
      if (!cutting){
        // 刃を入れる：今の回転角から記録を始める
        cutting = true;
        nextSample = spin;
      }
    } else if (phase === 'over'){
      if (!$('share-view').classList.contains('hidden')) return;
      showPtrs.set(e.pointerId, { x:e.clientX, y:e.clientY });   // 完成したポテトを回す・ズームする
      if (showPtrs.size === 2) pinchDist = ptrDist();
    } else return;
    try { cv.setPointerCapture(e.pointerId); } catch(_) {}
  });
  document.addEventListener('pointermove', e => {
    if (phase === 'over' && showPtrs.has(e.pointerId)){
      const p = showPtrs.get(e.pointerId);
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (showPtrs.size === 1) rotateShow(dx, dy);
      else if (showPtrs.size === 2){
        const d = ptrDist();
        if (pinchDist > 0) setZoom(showZoom * d / pinchDist);
        pinchDist = d;
      }
      return;
    }
    if (!press || e.pointerId !== press.id || phase !== 'cut') return;
    // 指を下に動かした分だけ刃を下ろす（上には戻らない）
    const dy = e.clientY - press.y;
    press.y = e.clientY;
    if (dy > 0) depth = Math.min(L0, depth + dy * worldPerPx);
  });
  const release = e => {
    if (showPtrs.delete(e.pointerId) && showPtrs.size < 2) pinchDist = 0;
    if (!press || e.pointerId !== press.id) return;
    press = null;
  };
  cv.addEventListener('wheel', e => {
    if (phase !== 'over') return;
    e.preventDefault();
    setZoom(showZoom * Math.exp(-e.deltaY * 0.0015));
  }, { passive:false });
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);

  const bindBtn = (id, fn) => {
    $(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fn(); });
    $(id).addEventListener('click', e => { if (e.detail === 0) fn(); });   // キーボードで押したとき
  };
  bindBtn('done', finish);
  bindBtn('mute', toggleMute);
  bindBtn('again', reset);

  // PC：結果画面ではスペースかEnterでもう一回
  document.addEventListener('keydown', e => {
    if (!$('share-view').classList.contains('hidden')){
      if (e.key === 'Escape') closeShareView();
      return;   // 共有される内容を表示中は結果画面のキー操作を止める
    }
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    if ((e.key === ' ' || e.key === 'Enter') && phase === 'over'){ e.preventDefault(); reset(); }
  });

  // iPhone(Safari)で長押しや指の移動により文字選択・拡大鏡が出てドラッグが奪われるのを防ぐ
  document.addEventListener('touchstart', e => { if (e.target === cv) e.preventDefault(); }, { passive:false });
  document.addEventListener('touchmove', e => { if (press || showPtrs.size) e.preventDefault(); }, { passive:false });
  document.addEventListener('selectstart', e => {
    const t = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    if (!(t && t.closest('#share-text'))) e.preventDefault();   // 共有される文面は選んでコピーできるようにする
  });
  document.addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });
  // スマホでのダブルタップ拡大を防ぐ（拡大すると元に戻せなくなるため）
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });

  // ---------- 共有 ----------
  function shareText(){
    return `${rankName(result.len)}を${result.len.toFixed(1)}cm作った！\n`
      + new URL('./', location.href).href + '\n#ぐるぐるポテトメーカー';
  }
  // 結果画像：今の画面を縦長に切り出し、下に結果を書く
  function resultCanvas(){
    const W = 540, H = 960;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = css('--bg');
    g.fillRect(0, 0, W, H);
    renderAll();
    const src = renderer.domElement;
    const sc = Math.max(W / src.width, H / src.height);
    const sw = W / sc, sh = H / sc;
    g.drawImage(src, (src.width - sw) / 2, (src.height - sh) / 2, sw, sh, 0, 0, W, H);
    const font = getComputedStyle(document.body).fontFamily;
    g.fillStyle = 'rgba(0,0,0,.6)';
    g.fillRect(0, H - 150, W, 150);
    g.fillStyle = '#fff';
    g.textAlign = 'center';
    g.font = `bold 40px ${font}`;
    g.fillText(rankName(result.len), W / 2, H - 92);
    g.font = `bold 46px ${font}`;
    g.fillText(`${result.len.toFixed(1)}cm`, W / 2, H - 34);
    return c;
  }
  // 結果をPNG画像にする（共有シートの制約があるため同期処理で作る）
  function resultImageFile(c){
    const bin = atob(c.toDataURL('image/png').split(',')[1]);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new File([buf], 'result.png', { type:'image/png' });
  }

  $('share').addEventListener('pointerdown', e => e.stopPropagation());
  $('share').addEventListener('click', () => {
    if (!result || performance.now() - overShownAt < 400) return;   // できあがりを押したときのタップで押されないように
    const text = shareText();
    const c = resultCanvas();
    const file = resultImageFile(c);
    // 3) 共有シートが無い・使えない環境: 文面をコピーし、共有される内容（結果画像と文面）を画面に出す
    const fallback = () => {
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
      $('share-img').src = c.toDataURL('image/png');
      $('share-text').textContent = text;
      $('share-view').classList.remove('hidden');
      $('share-close').focus({ preventScroll:true });
    };
    // 共有シートが出なかったときは 3) へ：失敗した（埋め込み表示で共有が禁止されている等）とき、
    // またはキャンセル扱いでも押してすぐ（SHARE_INSTANT 秒未満）に終わったとき（シートを出せないアプリ内ブラウザ等）。
    // 共有シートを開いてから自分で閉じたキャンセルでは何もしない
    const shareStart = performance.now();
    const failed = err => {
      const instant = performance.now() - shareStart < SHARE_INSTANT * 1000;
      if (!err || err.name !== 'AbortError' || instant) fallback();
    };
    // 1) 画像を渡せる共有シート（スマホなど）: 文面＋結果画像
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ text, files:[file] }).catch(failed);
      return;
    }
    // 2) 画像を渡せない共有シート: 文面のみ
    if (navigator.share){
      navigator.share({ text }).catch(failed);
      return;
    }
    fallback();
  });
  const closeShareView = () => {
    $('share-view').classList.add('hidden');
    $('share').focus({ preventScroll:true });
  };
  $('share-close').addEventListener('click', closeShareView);
  $('share-view').addEventListener('pointerdown', e => e.stopPropagation());

  // ---------- 揚げる音 ----------
  // ブラウザは画面に触れるまで音を出せないので、最初に触れたときに準備する
  let actx = null, sizzle = null;
  let muted = false;
  try { muted = localStorage.getItem('guruguru-potato-muted') === '1'; } catch (e) {}
  function showMute(){
    $('mute').textContent = muted ? '🔇' : '🔊';
    $('mute').setAttribute('aria-label', muted ? '音を出す' : '音を消す');
  }
  showMute();
  function toggleMute(){
    muted = !muted;
    try { localStorage.setItem('guruguru-potato-muted', muted ? '1' : '0'); } catch (e) {}
    showMute();
  }
  function initSound(){
    if (actx){ if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    const bin = atob(FRY_SND.split(',')[1]);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    actx.decodeAudioData(buf.buffer, audio => {
      const src = actx.createBufferSource();
      src.buffer = audio;
      src.loop = true;
      src.loopStart = FRY_SND_START;
      src.loopEnd = FRY_SND_START + FRY_SND_LEN;
      sizzle = actx.createGain();
      sizzle.gain.value = 0;
      src.connect(sizzle).connect(actx.destination);
      src.start(0, FRY_SND_START);
    }, () => {});
  }
  window.addEventListener('pointerdown', initSound, true);
  // 油に浸かっている間だけ鳴らす
  function updateSound(){
    if (!sizzle) return;
    const on = !muted && (phase === 'fry' || phase === 'lift') && rigY < 0;
    sizzle.gain.setTargetAtTime(on ? 0.8 : 0, actx.currentTime, on ? 0.08 : 0.25);
  }

  // ---------- ループ ----------
  let last = performance.now();
  function loop(now){
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (phase === 'cut') updateCut(dt);
    else if (phase === 'stretch') updateStretch(dt);
    if (phase === 'stretch' || phase === 'cutEnd') updateFall(dt);
    else if (phase === 'fry') updateFry(dt);
    else if (phase === 'lift') updateLift(dt);
    else if (phase === 'salt') updateSalt(dt);
    else if ((phase === 'over' || phase === 'salt') && view === 'show' && !showPtrs.size){
      // 完成品はゆっくり回り続ける（指で回している間は止める）
      _qa.setFromAxisAngle(_ax.set(0, 1, 0), AUTO_ROT * dt);
      showPivot.quaternion.premultiply(_qa);
    }
    updateSound();
    updateFx(dt);
    if (halo.visible) halo.material.uniforms.uRot.value += HALO_ROT * dt;
    renderAll();
    requestAnimationFrame(loop);
  }
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
