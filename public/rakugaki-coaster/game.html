<html lang="ja">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 C8 26 9 6 16 6 C22 6 21 18 16 18 C11 18 12 10 18 10 C24 10 26 26 30 26' fill='none' stroke='%23d6342c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#14202b;--red:#d6342c;--gold:#ffc53d;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd4f2;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--sans);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font-family:inherit}

/* top bar */
#hud{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;pointer-events:none}
.brand{font:900 17px/1 var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:auto}
.brand i{display:inline-block;width:22px;height:14px;border-radius:7px;border:3px solid var(--red);border-bottom-color:transparent;transform:rotate(-12deg)}
.hb{pointer-events:auto;appearance:none;border:0;height:40px;min-width:40px;padding:0 13px;border-radius:20px;background:rgba(20,32,43,.82);color:#fff;font:800 14px/1 var(--sans);cursor:pointer;display:none}
#redraw{font-size:19px;padding:0}
body.hasTrack #redraw{display:block}
/* mini map button: only while riding in 3D */
/* view toggles (track, pillars, mini map): only while riding in 3D */
.tog{position:relative;padding:0;display:none !important;align-items:center;justify-content:center}
.tog svg{width:22px;height:22px;display:block}
body.pov3d .tog{display:flex !important}
.tog::after{content:'';position:absolute;left:9px;right:9px;top:50%;height:2.5px;margin-top:-1px;border-radius:2px;background:#ff7a6e;transform:rotate(-45deg);display:none}
body.mapOff #mapBtn,body.railsOff #railBtn,body.postsOff #postBtn{background:rgba(20,32,43,.45);color:rgba(255,255,255,.75)}
body.mapOff #mapBtn::after,body.railsOff #railBtn::after,body.postsOff #postBtn::after{display:block}
body.pov3d .brand{visibility:hidden}
/* mini map (the course from the side, with where you are now) */
#mini{position:fixed;inset:auto;left:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:8;display:none;width:auto;height:auto;border-radius:14px;background:rgba(255,255,255,.72);box-shadow:0 6px 20px rgba(0,30,60,.25);pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.pov3d:not(.mapOff) #mini{display:block}
@media (max-width:440px){body.hasTrack .brand span{display:none}}
#gl{z-index:1;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s}
body.pov3d #gl{opacity:1;visibility:visible;transition:opacity .7s ease}

/* start bar (after drawing) */
#startBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:8;display:none;flex-direction:column;align-items:center;gap:10px;width:min(420px,calc(100vw - 24px))}
body.ready #startBar{display:flex}
#readyMsg{font:800 14px/1.3 var(--sans);background:rgba(255,255,255,.88);padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,40,80,.12);text-align:center}
#startBar .row2{display:flex;gap:10px;width:100%}
#startBar .btn{flex:1;padding:17px 10px;font-size:16px;box-shadow:0 6px 16px rgba(0,30,60,.15)}
#bGo{flex:1.7 !important;font-size:20px !important;letter-spacing:.04em;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.045);box-shadow:0 10px 26px rgba(214,52,44,.45)}}

/* start screen */
#hint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;text-align:center;pointer-events:none;width:min(94vw,520px);transition:opacity .3s}
#hint.off{opacity:0}
#hint .h1{font:900 clamp(24px,6.6vw,40px)/1.15 var(--sans);letter-spacing:-.02em;text-shadow:0 2px 0 rgba(255,255,255,.6)}
#hint .sub{margin:12px 0 0;font:700 15px/1.5 var(--sans);opacity:.7}
#hint .pen{display:block;margin:14px auto 0;width:150px;height:56px}
#hint .pen path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s ease-in-out infinite}
@keyframes draw{60%,100%{stroke-dashoffset:0}}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-8px);z-index:10;background:var(--ink);color:#fff;font:700 14px/1.4 var(--sans);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}
#toast.in{opacity:1;transform:translate(-50%,0)}

/* cards */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(rgba(20,32,43,0) 40%,rgba(20,32,43,.35));overflow:auto;touch-action:pan-y}
.ov[hidden]{display:none}
.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,30,60,.35);animation:up .45s cubic-bezier(.2,.9,.25,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.kick{font:800 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:4px 0 7px}
.name{font:900 25px/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 10px;font:800 15px/1 var(--sans);cursor:pointer;background:#eef3f7;color:var(--ink);text-align:center;text-decoration:none;display:block}
.btn.pri{background:var(--ink);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.wide{grid-column:1/3}
.small{margin:12px 0 0;text-align:center;font-size:12px;opacity:.5;line-height:1.7}
.small a{color:inherit}
@media (max-height:700px){.card{padding:14px 14px 12px}.name{font-size:22px;margin-bottom:12px}.btn{padding:13px 10px}.small{margin-top:8px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="gl"></canvas>
<canvas id="mini"></canvas>

<div id="hud">
  <div class="brand"><i></i><span id="brandT">らくがきコースター</span></div>
  <button class="hb tog" id="railBtn" type="button" aria-label="線路"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v18M16 3v18M8 7.5h8M8 12h8M8 16.5h8"/></svg></button>
  <button class="hb tog" id="postBtn" type="button" aria-label="柱"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7c5-4 13-4 18 0M7.5 5.2V20M16.5 5.2V20M4 20.5h16"/></svg></button>
  <button class="hb tog" id="mapBtn" type="button" aria-label="マップ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6.5l5.5-2.5 7 2.5L21 4v13.5L15.5 20l-7-2.5L3 20z"/><path d="M8.5 4v13.5M15.5 6.5V20"/></svg></button>
  <button class="hb" id="redraw" type="button" aria-label="描き直す">↺</button>
</div>

<div id="startBar"><div id="readyMsg"></div><div class="row2"><button class="btn" id="bRedo" type="button"></button><button class="btn red" id="bGo" type="button"></button></div></div>

<div id="hint">
  <div class="h1" id="h1"></div>
  <p class="sub" id="sub"></p>
  <svg class="pen" viewBox="0 0 150 60"><path d="M5 50 C25 50 30 8 52 8 C72 8 66 38 54 38 C40 38 46 16 66 16 C86 16 92 50 108 50 C122 50 128 28 145 28" fill="none" stroke="#d6342c" stroke-width="4" stroke-linecap="round"/></svg>
</div>
<div id="toast"></div>

<div class="ov" id="sharedOv" hidden>
  <div class="card">
    <p class="kick" id="sKick"></p><h2 class="name" id="sName"></h2>
    <div class="btns"><button class="btn red wide" id="sPov" type="button"></button><button class="btn wide" id="sDraw" type="button"></button></div>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="card" id="rCard">
    <p class="kick" id="rKick"></p><h2 class="name" id="rName"></h2>
    <div class="btns">
      <button class="btn red wide" id="rShare" type="button"></button>
      <button class="btn pri" id="rAgain" type="button"></button>
      <button class="btn" id="rNew" type="button"></button>
      <button class="btn wide" id="rSave" type="button"></button>
    </div>
    <p class="small" id="credit"></p>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- language ---------- */
const QP = new URLSearchParams(location.search);
const LANG = 'ja';
document.documentElement.lang = LANG;
const T = {
  ja: {
    brand: 'らくがきコースター', h1: '一筆書きで<br>ジェットコースターを描こう', sub: '描いた線が、そのままコースになる。',
    tooShort: '短すぎます。もっと長く描いてね', start: '▶ スタート', readyMsg: 'コース完成！スタートで出発',
    kick: 'らくがきコースター', done: 'おかえりなさい！',
    share: 'コースを共有', again: 'もう一度乗る', fresh: '描き直す', save: '画像を保存',
    ride: '🎢 このコースに乗る', no3d: 'このブラウザは3D表示に対応していないため、横から見る表示で走ります', mapOn: 'マップ表示', mapOff: 'マップ非表示', rails: '線路', posts: '柱', map: 'マップ', shown: '表示', hidden: '非表示',
    sKick: '誰かが描いたコースター', sName: 'このコースに乗ってみる？', sDraw: '自分で描く',
    tweet: '一筆書きでジェットコースターを作った🎢\nこのコースに乗る→', tag: 'らくがきコースター'
  }
};
const L = T[LANG];

/* ---------- world (1 unit = 1 m; the drawer's screen is 10 px per metre) ---------- */
const PX_PER_M = 10, G = 9.81, VMIN = 10, V0 = 1.5, DRAG = .0008, ROLL = .15, DS = .25, GROUND_PX = 76;
const cv = $('#cv');
let ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let view = { s: PX_PER_M, ox: 0, oy: 0 }, baseView = null, fitted = false;
let groundY = 0;                 // world y of the ground
let mode = 'draw';               // draw | drawing | ready | ride | done | shared
let raw = [], pid = null, ctrl = null, track = null, code = '', codeKey = 't', ride = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (!track && mode !== 'drawing') { view = { s: PX_PER_M, ox: 0, oy: 0 }; groundY = (H - GROUND_PX) / PX_PER_M; }
  else if (track && (fitted || mode === 'shared')) { fitView(); baseView = { ...view }; }
  buildBackdrop();
}
addEventListener('resize', resize);

const toScreen = (x, y) => [x * view.s + view.ox, y * view.s + view.oy];
const toWorld = e => ({ x: (e.clientX - view.ox) / view.s, y: (e.clientY - view.oy) / view.s });

/* ---------- drawing ---------- */
cv.addEventListener('pointerdown', e => {
  if (mode !== 'draw' || pid !== null) return;
  audioInit();
  pid = e.pointerId; mode = 'drawing';
  try { cv.setPointerCapture(pid); } catch (_) {}
  const p = toWorld(e); p.y = Math.min(p.y, groundY - 1.2);
  raw = [p];
  $('#hint').classList.add('off');
});
cv.addEventListener('pointermove', e => {
  if (mode !== 'drawing' || e.pointerId !== pid) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const p = toWorld(ev); p.y = Math.min(p.y, groundY - 1.2);
    const l = raw[raw.length - 1];
    if (Math.hypot(p.x - l.x, p.y - l.y) >= .2) raw.push(p);
  }
});
const endDraw = e => {
  if (e.pointerId !== pid) return;
  pid = null;
  if (mode === 'drawing') finishDraw();
};
cv.addEventListener('pointerup', endDraw); cv.addEventListener('pointercancel', endDraw);

const plen = pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return s; };

function finishDraw() {
  if (raw.length < 3 || plen(raw) < 25) { toast(L.tooShort); resetDraw(); return; }
  const c = buildControl(raw);
  code = encode(c, groundY); codeKey = 't';
  loadCode(code, false, UNIT, c[0]);
  baseView = { ...view };
  enterReady();
}
function prepare3D() { setTimeout(() => { try { if (track && init3D() && (!scene3d || scene3d.track !== track)) build3D(); } catch (e) {} }, 80); }
function enterReady() {
  mode = 'ready';
  ride = newRide();                                  // the train waits at the station
  prepare3D();
  document.body.classList.add('hasTrack', 'ready');
  document.body.classList.remove('riding');
  $('#hint').classList.add('off');
}
function resetDraw() {
  raw = []; ctrl = null; track = null; ride = null; fitted = false; baseView = null;
  view = { s: PX_PER_M, ox: 0, oy: 0 }; groundY = (H - GROUND_PX) / PX_PER_M;
  mode = 'draw'; document.body.classList.remove('riding', 'hasTrack', 'ready');
  setView3d(false); scene3d = null;
  $('#hint').classList.remove('off'); $('#result').hidden = true; $('#sharedOv').hidden = true;
  buildBackdrop();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

// resample a polyline every `step` metres
function resample(pts, step) {
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < 1e-9) continue;
    let t = step - carry;
    while (t <= d) { const k = t / d; out.push({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k }); t += step; }
    carry = d - (t - step);
  }
  const l = pts[pts.length - 1], e = out[out.length - 1];
  if (Math.hypot(l.x - e.x, l.y - e.y) > step * .3) out.push({ x: l.x, y: l.y });
  return out;
}
// gaussian blur of a list of numbers (sigma in samples, edges held)
function blur(a, sig) {
  const R = Math.ceil(sig * 3), w = []; let ws = 0;
  for (let j = -R; j <= R; j++) { const v = Math.exp(-j * j / (2 * sig * sig)); w.push(v); ws += v; }
  const n = a.length, out = new Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = -R; j <= R; j++) s += a[Math.max(0, Math.min(n - 1, i + j))] * w[j + R]; out[i] = s / ws; }
  return out;
}
// smooth the hand-drawn stroke and resample it every metre — these become the shareable control points.
// We smooth the direction of travel rather than the positions: finger wobble melts away,
// yet a loop stays a loop of the same size. A slow correction then keeps the shape where it was drawn.
const SMOOTH_TURN = 2, SMOOTH_PULL = 6;            // metres
function buildControl(pts) {
  const st = .25;
  let p = resample(pts, st);
  p = p.map((a, i) => {                            // take the pixel jitter off first
    if (i === 0 || i === p.length - 1) return { x: a.x, y: a.y };
    const k = Math.min(2, i, p.length - 1 - i); let x = 0, y = 0;
    for (let j = i - k; j <= i + k; j++) { x += p[j].x; y += p[j].y; }
    return { x: x / (2 * k + 1), y: y / (2 * k + 1) };
  });
  const n = p.length, th = [], d = [];
  for (let i = 0; i < n - 1; i++) {
    let a = Math.atan2(p[i + 1].y - p[i].y, p[i + 1].x - p[i].x);
    if (i) { while (a - th[i - 1] > Math.PI) a -= 2 * Math.PI; while (a - th[i - 1] < -Math.PI) a += 2 * Math.PI; }
    th.push(a); d.push(Math.hypot(p[i + 1].x - p[i].x, p[i + 1].y - p[i].y));
  }
  const ts = blur(th, SMOOTH_TURN / st), q = [{ x: p[0].x, y: p[0].y }];
  for (let i = 0; i < n - 1; i++) q.push({ x: q[i].x + d[i] * Math.cos(ts[i]), y: q[i].y + d[i] * Math.sin(ts[i]) });
  const ex = blur(p.map((a, i) => a.x - q[i].x), SMOOTH_PULL / st), ey = blur(p.map((a, i) => a.y - q[i].y), SMOOTH_PULL / st);
  const sm = q.map((a, i) => ({ x: a.x + ex[i], y: Math.min(groundY - 1, a.y + ey[i]) }));
  const out = [{ x: sm[0].x, y: sm[0].y }];
  let carry = 0;
  for (let i = 1; i < sm.length; i++) {
    const a = sm[i - 1], b = sm[i], d = Math.hypot(b.x - a.x, b.y - a.y);
    let t = 1 - carry;
    while (t <= d) { const k = t / d; out.push({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k }); t += 1; }
    carry = d - (t - 1);
  }
  return out;
}
/* ---------- share code: first point + per-metre deltas in centimetres (int8), ground as int16 ----------
   (links made by the first version used decimetres and the key "c=", new ones use "t=") */
const UNIT = 100;
function encode(c, gY) {
  const q = c.map(p => [Math.round(p.x * UNIT), Math.round(p.y * UNIT)]);
  const bytes = new Uint8Array(2 + (q.length - 1) * 2);
  const gr = Math.max(-32768, Math.min(32767, Math.round(gY * UNIT) - q[0][1]));
  bytes[0] = (gr >> 8) & 255; bytes[1] = gr & 255;
  for (let i = 1; i < q.length; i++) {
    bytes[2 + (i - 1) * 2] = Math.max(-127, Math.min(127, q[i][0] - q[i - 1][0])) & 255;
    bytes[3 + (i - 1) * 2] = Math.max(-127, Math.min(127, q[i][1] - q[i - 1][1])) & 255;
  }
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decode(str, unit) {
  const b = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  const by = Uint8Array.from(b, ch => ch.charCodeAt(0));
  if (by.length < 8) throw new Error('short');
  let gr = (by[0] << 8) | by[1]; if (gr > 32767) gr -= 65536;
  const pts = [{ x: 0, y: 0 }]; let x = 0, y = 0;
  for (let i = 2; i + 1 < by.length; i += 2) {
    const dx = by[i] > 127 ? by[i] - 256 : by[i], dy = by[i + 1] > 127 ? by[i + 1] - 256 : by[i + 1];
    x += dx; y += dy; pts.push({ x: x / unit, y: y / unit });
  }
  return { pts, ground: gr / unit };
}
// the drawer and anyone opening the link ride exactly the same decoded track
function loadCode(c, shared, unit = UNIT, origin = null) {
  const { pts, ground } = decode(c, unit);
  if (shared) { ctrl = pts; groundY = ground; }
  else {
    const o = origin || raw[0];                    // keep the drawer's own screen position
    const q0 = [Math.round(o.x * unit) / unit, Math.round(o.y * unit) / unit];
    ctrl = pts.map(p => ({ x: p.x + q0[0], y: p.y + q0[1] }));
    groundY = ground + q0[1];
  }
  track = buildTrack(ctrl); buildExt(track); buildDepth(track); railCache = null;
  if (shared) fitView();
}

/* ---------- track: Catmull-Rom through the control points, resampled every 25 cm ---------- */
function buildTrack(c) {
  const dense = [];
  const P = i => c[Math.max(0, Math.min(c.length - 1, i))];
  for (let i = 0; i < c.length - 1; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let k = 0; k < 8; k++) {
      const t = k / 8, t2 = t * t, t3 = t2 * t;

  const [sx, sy] = P(0); g.fillStyle = '#2d3e4f'; g.fillRect(sx - 4, sy - 7, 8, 2.5);
  const [ex, ey] = P(t.n - 1); g.fillRect(ex - .6, ey - 9, 1.2, 9);
  for (let r = 0; r < 2; r++) for (let q = 0; q < 3; q++) { g.fillStyle = (r + q) % 2 ? '#fff' : '#14202b'; g.fillRect(ex + .6 + q * 2, ey - 9 + r * 2, 2, 2); }
  mini.width = cw * dpr; mini.height = ch * dpr; mini.style.width = cw + 'px'; mini.style.height = ch + 'px';

}
function drawMini() {
  if (!view3d || !mapOn || !track) return;
  const M = miniLayer(), g = mctx;
  g.setTransform(M.dpr, 0, 0, M.dpr, 0, 0);
  g.clearRect(0, 0, M.cw, M.ch);
  g.drawImage(M.img, 0, 0, M.cw, M.ch);
  if (!ride) return;
  const p = sample(Math.max(0, Math.min(track.len, ride.s))), x = M.ox + p.x * M.sc, y = M.oy + p.y * M.sc;
  const pulse = (Math.sin(performance.now() / 160) + 1) / 2;
  g.fillStyle = `rgba(255,190,40,${(.45 - pulse * .3).toFixed(2)})`; g.beginPath(); g.arc(x, y, 6 + pulse * 5, 0, 7); g.fill();
  g.fillStyle = '#ffc93c'; g.strokeStyle = '#14202b'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(x, y, 4.6, 0, 7); g.fill(); g.stroke();
}
setMap(mapOn);
// show / hide the track and the pillars in 3D (each remembered on its own)
const loadFlag = k => { try { return localStorage.getItem('rakugaki-coaster:' + k) !== 'off'; } catch (e) { return true; } };
let showRails = loadFlag('rails'), showPosts = loadFlag('posts');
function setShow(which, on) {
  if (which === 'rails') showRails = on; else showPosts = on;
  document.body.classList.toggle(which + 'Off', !on);
  $(which === 'rails' ? '#railBtn' : '#postBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
  try { localStorage.setItem('rakugaki-coaster:' + which, on ? 'on' : 'off'); } catch (e) {}
}
setShow('rails', showRails); setShow('posts', showPosts);

/* ---------- save image ---------- */
function saveImage() {
  const w = 1200, h = 630, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#7cc3ee'); sky.addColorStop(1, '#eaf6fb');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  let minX = Infinity, maxX = -Infinity, minY = Infinity;
  for (const p of ctrl) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); }
  const area = { x: 60, y: 130, w: 1080, h: 420 }, gy0 = Math.max(groundY, minY + 5);
  const sc = Math.min(area.w / (maxX - minX + 8), area.h / (gy0 - minY + 6));
  const ox = area.x + area.w / 2 - sc * (minX + maxX) / 2, oy = area.y + area.h - sc * gy0;
  g.fillStyle = '#6fbb5f'; g.fillRect(0, oy + sc * gy0, w, h);
  g.strokeStyle = 'rgba(110,125,138,.75)'; g.lineWidth = Math.max(1, .18 * sc); g.beginPath();
  for (let i = 0; i < track.n; i += 16) { const x = ox + track.xs[i] * sc, y = oy + track.ys[i] * sc; g.moveTo(x, y); g.lineTo(x, oy + sc * gy0); }
  g.stroke();
  g.strokeStyle = '#d6342c'; g.lineWidth = Math.max(3, .5 * sc); g.lineJoin = g.lineCap = 'round'; g.beginPath();
  for (let i = 0; i < track.n; i++) { const x = ox + track.xs[i] * sc, y = oy + track.ys[i] * sc; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
  const font = getComputedStyle(document.body).fontFamily;
  g.fillStyle = '#14202b'; g.font = `900 46px ${font}`; g.fillText(L.brand, 60, 86);
  g.fillStyle = 'rgba(20,32,43,.6)'; g.font = `700 22px ${font}`; g.fillText(L.sub, 62, 120);
  const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'rakugaki-coaster.png'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- boot ---------- */
$('#brandT').textContent = L.brand; document.title = L.brand;
$('#h1').innerHTML = L.h1; $('#sub').textContent = L.sub;
$('#bGo').textContent = L.start; $('#bRedo').textContent = L.fresh; $('#readyMsg').textContent = L.readyMsg;
resize();
const m = location.hash.match(/(?:^#|&)([ct])=([A-Za-z0-9_-]+)/);
if (m) {
  try {
    codeKey = m[1]; code = m[2]; loadCode(code, true, codeKey === 'c' ? 10 : UNIT); baseView = { ...view }; buildBackdrop();
    mode = 'shared'; ride = newRide(); prepare3D(); $('#hint').classList.add('off');
    document.body.classList.add('hasTrack');
    $('#sKick').textContent = L.sKick; $('#sName').textContent = L.sName;
    $('#sDraw').textContent = L.sDraw; $('#sPov').textContent = L.ride;
    $('#sharedOv').hidden = false;
  } catch (e) { resetDraw(); }
}
requestAnimationFrame(frame);

if (QP.get('test') === '1') window.__olc = { sample: s => sample(s), get view3d() { return view3d; }, get ride() { return ride; }, get mode() { return mode; }, get code() { return code; }, get track() { return track; }, get view() { return view; },
  dry: () => { const r = newRide(); while (!r.ended) stepRide(r, .05); return { s: r.s, t: r.t }; } };
})();
