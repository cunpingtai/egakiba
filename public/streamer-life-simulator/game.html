<section id="intro" class="panel intro"><h1>あなたは、<br>何者になれる？</h1><p>同接0人から始まる配信者人生。バズ、投げ銭、恋愛、繋がり、炎上。<br>何もしていなくても、人生は勝手に動き出す。</p><div class="field"><label for="name">配信者名</label><input id="name" maxlength="18" value="るん" placeholder="配信者名"></div><div class="field"><label for="gender">配信者の性別</label><select id="gender"><option value="male">男性</option><option value="female">女性</option></select></div><div class="field"><label for="genre">配信ジャンル</label><select id="genre"><option>雑談</option><option>ゲーム</option><option>ゴシップ</option><option>ASMR</option><option>歌い手</option></select></div><button class="primary" id="start">配信者人生を始める →</button><p class="note">※登場する人物・投稿・事件はすべてフィクションです。</p></section>

function setup(){const g=$('genre').value,gender=$('gender').value,names=gender==='male'?femaleNames:maleNames;let used=new Set();let people=[];let taken=new Set();for(let i=0;i<4;i++){let nm;do{nm=pick(names)}while(taken.has(nm));taken.add(nm);people.push({name:nm,role:roles[i],trait:pick(personalities),aff:rand(35,65),dep:rand(5,35),spent:0,status:'応援中',romance:false,obsessed:false,called:false,confessed:false,ex:false,metDay:0,departed:false});}s={name:$('name').value.trim()||'名無し',gender,genre:g,day:0,followers:0,viewers:0,peak:0,tips:0,mental:83,people,used,plotUsed:new Set(),pending:[],choices:0,policy:'steady',scandals:0,romance:false,partner:null,relationshipHistory:[],ended:false,paused:false,dialog:false,majorCount:0,logCount:0,early:null,events:0,activity:0,limit:BASE,extended:false,departedNames:[]};last=0;$('intro').classList.add('hidden');$('ending').classList.add('hidden');$('game').classList.remove('hidden');$('log').innerHTML='';$('modal').classList.add('hidden');log('DAY 1','配信活動を開始した。最初の配信の同接は0人だった。','major');render();clearInterval(timer);timer=setInterval(tick,70);}
function log(title,body,type=''){let e=document.createElement('div');e.className='entry '+type;e.innerHTML=`<small>${esc(title)}</small><p>${esc(body)}</p>`;$('log').append(e);while($('log').children.length>50)$('log').firstChild.remove();$('log').scrollTop=$('log').scrollHeight;s.logCount++;}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function change(f=0,v=0,t=0,m=0){s.followers=Math.max(0,Math.round(s.followers+f));s.viewers=Math.max(0,Math.round(s.viewers+v));s.tips=Math.max(0,Math.round(s.tips+t));s.mental=clamp(s.mental+m,0,100);s.peak=Math.max(s.peak,s.viewers);}
function viewerStatus(p){if(p.romance)return '交際中';if(p.ex)return '元恋人・'+(p.departed?'降りた':'応援中');if(p.departed)return '降りた';if(p.called)return '繋がり（個通済み）';return p.status==='低浮上'?'低浮上': '応援中';}
function leaveViewer(p,reason){if(p.departed)return;p.departed=true;p.status='降りた';p.aff=0;change(-rand(0,Math.max(3,Math.round(s.followers*.03))),-rand(0,Math.max(1,Math.round(s.viewers*.07))),0,-rand(1,5));log(`DAY ${s.day}｜${p.name}が降りた`,`${p.name}は${reason}。主な視聴者の状態が「降りた」に変わった。`,'bad');}
function anonymousDeparture(){let reaction;if(s.policy==='aggressive'||s.scandals>=3){reaction=pick(['「今は新規獲得で手一杯だ」と自分に言い聞かせ、返信せず配信を続けた。','「残念ですが、今までありがとう」とだけ返信した。']);change(0,0,0,-rand(0,2));}else if(s.mental<35){reaction='落ち込んで何度もDMを読み返した。返信する気力が出ず、その日は早めに配信を切った。';change(0,0,0,-6);}else if(s.policy==='steady'){reaction='「寂しいけど、今まで本当にありがとう」と返した。無理に引き留めることはしなかった。';change(0,0,0,-3);}else{reaction=pick(['「何か嫌なことがあった？」と一度だけ引き留めたが、相手の決意は固かった。','少し凹んだが、今いるリスナーを大切にしようと気持ちを切り替えた。']);change(0,0,0,-3);}log(`DAY ${s.day}｜匿名の視聴者が卒業`,`主な視聴者欄にはいない一般視聴者から「推し活をやめます」と最後のDMが届いた。${reaction}`,'bad');}
function render(){$('identity').textContent=s.name+'｜'+s.genre+'配信者';$('date').textContent=`DAY ${fmt(s.day)} / ${fmt(s.limit)}　活動${Math.min(5,Math.floor(s.day/365)+1)}年目`;$('bar').style.width=(s.day/s.limit*100)+'%';$('followers').textContent=fmt(s.followers);$('viewers').textContent=fmt(s.viewers);$('tips').textContent='¥'+fmt(s.tips);$('mental').textContent=s.mental+' / 100';$('peak').textContent=fmt(s.peak);$('year').textContent=`${Math.min(5,Math.floor(s.day/365)+1)}年目`;$('characters').innerHTML=s.people.map(p=>`<div class="char">${esc(p.name)} <span>・${esc(viewerStatus(p))}</span></div>`).join('');$('pause').textContent=s.paused?'▶ 再開':'⏸ 停止';}
function event(){let pool=common.concat(genres[s.genre]).filter(x=>x[0]!=='リスナーの卒業');let avail=pool.filter(x=>!s.used.has(x[0]));if(!avail.length){s.used.clear();avail=pool;}let x=pick(avail);s.used.add(x[0]);let scale=Math.max(.25,Math.min(1.4,.3+s.day/MAX));let impact=x[2]==='good'?rand(1,9):rand(1,8);let f=x[3]>0?Math.round(x[3]*scale*impact):Math.round(x[3]*rand(1,9));let v=x[4]>0?Math.max(1,Math.round(x[4]*scale*impact)):Math.round(x[4]*rand(1,6));let oldF=s.followers,oldV=s.viewers;change(f,v,x[5],x[6]);if(impact>=6&&x[2]==='good')s.peak=Math.max(s.peak,Math.round(Math.max(1,oldV)*rand(2,5)));if(x[2]==='bad'&&Math.random()<.23)s.scandals++;log(`DAY ${s.day}｜${x[0]}`,x[1]+(Math.abs(f)>40||Math.abs(v)>5?` 【X ${f>=0?'+':''}${fmt(f)}人／平均同接 ${v>=0?'+':''}${fmt(v)}人】`:''),x[2]);s.events++;if(Math.random()<.10)anonymousDeparture();if(Math.random()<.24)personEvent();}
function donate(p,reason='応援'){let amount=0,issue=false;if(s.gender==='male'){if(Math.random()<.62)amount=pick([100,200,300,500,1000,1500,3000]);else if(Math.random()<.11)amount=pick([5000,10000,15000]);}else{if(p.obsessed||Math.random()<.10){amount=pick([10000,30000,50000,100000,200000,500000]);issue=true;p.obsessed=true;p.dep=clamp(p.dep+rand(12,28),0,100)}else if(Math.random()<.30)amount=pick([100,500,1000,3000]);}if(amount){p.spent+=amount;change(rand(0,Math.max(2,Math.round(s.viewers*.1))),0,amount,amount>10000?3:1);log(`DAY ${s.day}｜${p.name}から投げ銭`,`${p.name}が${fmt(amount)}円を投げ銭。「${reason}」${issue?' ただし、見返りを求めるようなDMも届き始めた。':''}`,amount>=10000?'major':'good');if(issue&&Math.random()<.48){s.scandals++;log(`DAY ${s.day}｜重いDM`,`${p.name}「こんなに投げたのに、なんで私だけ特別じゃないの？」`,'bad')}}else{log(`DAY ${s.day}｜${p.name}`,`${p.name}が今日も配信に来た。投げ銭はなかったが、コメントで盛り上げてくれた。`,'good');}}
function personEvent(){let active=s.people.filter(p=>!p.departed&&!p.romance);if(!active.length)return;let p=pick(active);let lines=[`${p.name}が今日も配信に来てくれた。`,`${p.name}から「最近忙しくて見られない」とDMが届いた。`,`${p.name}が他のリスナーと仲良くなっている。`,null,`${p.name}が「前よりコメント拾ってくれなくなった」と不満をこぼした。`,`${p.name}から長文の応援メッセージが届いた。`,`${p.name}が他の配信者の枠に通い始めた。`,`${p.name}が自分の配信をSNSで紹介してくれた。`,`${p.name}が「なんでDM返してくれないの？」と送ってきた。`,`${p.name}が「私がいなくても平気だよね」と意味深なポストをした。`];let idx=rand(0,lines.length-1);if(idx===3){donate(p,'今日も楽しかった！');return;}let good=[0,5,7].includes(idx);p.aff=clamp(p.aff+(good?rand(1,8):-rand(2,9)),0,100);p.dep=clamp(p.dep+rand(-5,7),0,100);if(idx===6&&Math.random()<.48){leaveViewer(p,'別の配信者を応援することにした');return;}if(idx===1){p.status='低浮上';change(0,-rand(0,2),0,-2);}if(idx===7)change(rand(5,Math.max(50,Math.round(s.followers*.15))),rand(1,Math.max(2,Math.round(s.viewers*.08))),0,2);if(idx===8||idx===9)change(0,0,0,-4);log(`DAY ${s.day}｜${p.name}`,lines[idx],good?'good':'bad');if(p.aff<12&&Math.random()<.5)leaveViewer(p,'配信から距離を置くことにした');}
function showPeak(title,success){let before=s.viewers;let multiplier=success?rand(210,650)/100:rand(12,85)/100;let peak=Math.max(success?2:0,Math.round(Math.max(1,before)*multiplier));s.peak=Math.max(s.peak,peak);if(success){change(rand(30,Math.max(180,Math.round(s.followers*(multiplier-1)*.55+80))),Math.max(1,Math.round(before*(multiplier-1)*rand(10,35)/100)),rand(0,12000),rand(2,9));}else{change(-rand(0,Math.max(10,Math.round(s.followers*.12))),-rand(0,Math.max(2,Math.round(s.viewers*.22))),0,-rand(2,8));}log(`DAY ${s.day}｜${title}・配信結果`,success?`企画が大成功！ 平均同接${fmt(before)}人に対し、今回の最大同接は${fmt(peak)}人（約${(peak/Math.max(1,before)).toFixed(1)}倍）。フォロワーも急増した！`:`企画は不発…。平均同接${fmt(before)}人に対して、今回の最大同接は${fmt(peak)}人。期待したほど人が来なかった。`,success?'major':'bad');}
function choosePlot(){
 const candidates=[];
 for(const p of plots){
  if(s.plotUsed.has(p.title))continue;
  if(p.title==='恋人からの究極の選択'){if(s.partner&&s.partner.romance)candidates.push({p,n:s.partner});continue;}
  if(p.title==='元恋人からの連絡'){for(const n of s.people.filter(n=>n.ex&&!n.romance))candidates.push({p,n});continue;}
  if(p.title==='高額支援者からの個通の誘い'){for(const n of s.people.filter(n=>n.spent>=10000&&!n.called&&!n.romance&&!n.departed))candidates.push({p,n});continue;}
  if(p.title==='突然の告白'){for(const n of s.people.filter(n=>!n.romance&&!n.ex&&!n.departed&&(n.called||n.aff>=65)))candidates.push({p,n});continue;}
  if(p.title==='暴露予告のDM'){for(const n of s.people.filter(n=>(n.called||n.romance||n.ex)&&!n.departed))candidates.push({p,n});continue;}
  if(p.title==='リスナーの特別扱い疑惑'){for(const n of s.people.filter(n=>(n.called||n.spent>=10000||n.aff>=75)&&!n.departed))candidates.push({p,n});continue;}
  candidates.push({p,n:pick(s.people.filter(n=>!n.departed))||s.people[0]});
 }
 if(!candidates.length){s.plotUsed.clear();return choosePlot();}
 const {p,n}=pick(candidates);s.plotUsed.add(p.title);s.dialog=true;clearInterval(timer);
 log(`DAY ${s.day}｜${p.title}`,p.text(n),'major');
 $('modal').classList.remove('hidden');$('modal').scrollIntoView({behavior:'smooth',block:'center'});
 $('modalType').textContent='DAY '+s.day+'｜人生の転機';$('modalTitle').textContent=p.title;$('modalText').textContent=p.text(n);$('choices').innerHTML='';
 p.options.forEach(([label,desc,action])=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+esc(label)+'</b><small>'+esc(desc)+'</small>';b.onclick=()=>{s.choices++;log(`DAY ${s.day}｜あなたの選択`,`${p.title}：${label}`,'major');resolve(action,n,p.title);$('modal').classList.add('hidden');s.dialog=false;render();if(!s.ended)timer=setInterval(tick,70);};$('choices').append(b)});
}
function resolve(a,n,title){let outcome='';let luck=Math.random();switch(a){case 'call':n.called=true;n.aff+=15;n.dep+=18;change(0,1,0,luck<.2?-8:4);outcome=luck<.25?`${n.name}と初めて個通をした。翌日、相手が意味深な投稿を始めた。交際はしていない。`:`${n.name}と初めて10分間の個通をした。話は盛り上がり、少し親しくなった。交際はしていない。`;break;case 'date':if(s.partner&&s.partner!==n&&s.partner.romance){outcome=`${n.name}に気持ちを伝えたが、現在${s.partner.name}と交際中のため、新たな交際には進まなかった。`;change(0,0,0,-5);break;}n.romance=true;n.ex=false;n.confessed=true;s.romance=true;s.partner=n;n.aff+=20;n.dep+=15;s.relationshipHistory.push({name:n.name,day:s.day,kind:'start'});change(rand(0,30),1,0,5);outcome=`DAY ${s.day}、${n.name}とお互いの気持ちを確認して正式に交際を始めた。配信ではまだ公表していない。`;break;case 'retireLove':if(s.partner&&s.partner.romance){s.early='love';outcome=`恋人の${s.partner.name}と話し合い、一緒に暮らすため配信を引退することにした。`;}else{outcome='交際相手がいないため、引退の決断には至らなかった。';}break;case 'collab':case 'agency':case 'video':showPeak(title,luck>=.32);outcome=luck<.32?'期待したほど伸びなかった。企画の数字はログに記録された。':'企画の反響が大きく、数字が跳ねた！ 詳細はログに記録された。';if(luck<.12)s.scandals+=2;break;case 'aggressive':showPeak(title,luck>=.38);s.scandals+=rand(0,2);outcome=luck<.38?'攻めた企画が空振り。数字はログに記録された。':'攻めた企画が大きな話題に！ 数字はログに記録された。';break;case 'pay':change(-rand(5,35),-1,0,-5);outcome='相手の要求を受け入れ、ひとまず話は収まった。';break;case 'block':case 'ignore':change(-rand(0,60),-rand(0,4),0,-rand(1,8));if(luck<.4){s.scandals+=2;outcome='しばらくして、匿名の暴露ポストが拡散された。';}else outcome='その後しばらく連絡はなかった。';break;case 'announce':case 'deny':change(luck<.4?rand(30,300):-rand(5,80),luck<.4?-rand(1,9):rand(0,4),0,-5);outcome=luck<.4?'説明の一部が切り抜かれ、さらに騒ぎが広がった。':'説明を信じてくれる人もいた。';if(luck<.4)s.scandals++;break;case 'rest':change(-rand(5,60),-rand(1,6),0,rand(5,15));outcome='しばらく休んだ。戻ると配信の雰囲気が少し変わっていた。';break;case 'steady':case 'boundary':case 'balance':change(rand(1,50),rand(0,4),rand(0,3000),rand(2,8));outcome='無理をせず活動を続けることにした。';break;case 'talk':case 'caution':change(rand(-10,45),rand(-2,3),0,rand(-3,6));outcome=luck<.3?'話し合ったが、完全には納得してもらえなかった。':'丁寧に話し合い、ひとまず落ち着いた。';break;case 'career':change(rand(5,110),rand(0,7),rand(0,2500),-2);if(title==='恋人からの究極の選択'&&s.partner&&luck<.45){let old=s.partner;old.romance=false;old.ex=true;old.status='元恋人';s.partner=null;s.romance=false;s.relationshipHistory.push({name:old.name,day:s.day,kind:'breakup'});outcome=`配信を優先すると伝えた結果、${old.name}から別れを告げられた。DAY ${s.day}に交際終了。`; }else outcome='配信者としての活動を続けることにした。';break;case 'refuse':n.aff-=rand(5,16);change(rand(-10,25),0,0,rand(-2,4));if(luck<.25){leaveViewer(n,'断られたことをきっかけに離れた');outcome=`${n.name}はその後、配信に来なくなった。`;}else outcome='丁寧に断った。大きな問題にはならなかった。';break;case 'ambiguous':n.confessed=true;n.dep+=15;change(0,0,0,-4);outcome=`${n.name}への告白の返事を保留した。まだ交際していない。`;break;default:outcome='その選択は、これからの活動に影響するかもしれない。'}n.aff=clamp(n.aff,0,100);n.dep=clamp(n.dep,0,100);if(n.romance)n.status='交際中';else if(n.ex)n.status='元恋人';else if(n.departed)n.status='降りた';else if(n.aff<20){leaveViewer(n,'関係が悪化して離れた');}else if(n.status!=='低浮上')n.status='応援中';log(`DAY ${s.day}｜${title}・その後`,outcome,'major');if(s.early){end(s.early);return;}if(s.scandals>=7&&Math.random()<.28){end('scandal');return;}if(s.mental<=4&&Math.random()<.45){end('burnout');return;}}
function tick(){if(!s||s.paused||s.dialog||s.ended)return;let step=+$('speed').value;for(let i=0;i<step;i++){if(s.ended||s.dialog)return;s.day=Math.min(MAX,s.day+1);let base=Math.max(.05,(s.followers+20)/80000);if(Math.random()<.22){change(Math.random()<.67?rand(0,Math.max(2,Math.round(3+base*85))):-rand(0,Math.max(3,Math.round(s.followers*.007))),Math.random()<.28?rand(-Math.max(1,Math.round(s.viewers*.025)),Math.max(2,Math.round(s.viewers*.04))):0,0,Math.random()<.3?-1:0)}if(Math.random()<(s.gender==='male'?.007:.0035)){let active=s.people.filter(p=>!p.departed);if(active.length)donate(pick(active),'応援してる！')}if(s.day-last>=rand(38,58)){last=s.day;event();}if(s.day%180===0&&s.choices<6){choosePlot();return;}if(s.day%365===0){log(`DAY ${s.day}｜活動の節目`,`${Math.floor(s.day/365)+1}年近く配信を続けた。Xフォロワーは${fmt(s.followers)}人、平均同接は${fmt(s.viewers)}人。`,'major');}if(s.day>180&&s.mental===0&&Math.random()<.018){log(`DAY ${s.day}｜心が限界に`,`メンタルが0になり、活動を続けられなくなった。`,'bad');end('burnout');return;}if(s.day>300&&s.mental<9&&Math.random()<.003){end('burnout');return;}if(s.day>240&&s.scandals>=6&&Math.random()<.003){end('scandal');return;}if(s.day===BASE&&!s.extended){if(s.mental>=65&&s.scandals<=2&&(s.followers>=300||s.viewers>=15)&&Math.random()<.22){s.extended=true;s.limit=MAX;log(`DAY ${s.day}｜3周年・活動続行`,`3年間を乗り越え、活動は絶好調。もう少しだけ配信者人生を続けることにした。最大5周年まで進む。`,'major');}else{end();return;}}if(s.day>=s.limit){end();return;}}render();}
function endingType(force){if(force)return force;if(s.scandals>=5&&s.mental<32)return 'scandal';if(s.mental<17)return 'burnout';if(s.romance&&s.partner&&s.partner.romance&&Math.random()<.22)return 'love';if(s.followers>=6000||s.viewers>=120)return 'success';if(s.followers<100&&s.viewers<5&&Math.random()<.35)return 'retire';if(s.followers<800&&Math.random()<.25)return 'retire';return 'quiet';}
function replies(type){let arr=[];let candidates=[...s.people.filter(p=>!p.departed)].sort(()=>Math.random()-.5);for(let i=0;i<3;i++){let p=candidates.length?candidates[i%candidates.length]:s.people[i%s.people.length];let pool;if(p.romance&&type==='love')pool=['これからもよろしくね。','本当に色々あったね。幸せになろう。'];else if(p.departed)pool=['もう配信は見ていないけど、お疲れ様。','離れてからも少し気になっていました。'];else if(p.aff<25)pool=['最後まで色々あったね。','お疲れ様。もう見ることはないかな。','正直、複雑な気持ちです。'];else if(type==='scandal')pool=['ちゃんと説明してほしかった。','ずっと応援してたから悲しい。','お疲れ様。今は何も言えない。'];else if(type==='love')pool=['結婚おめでとう！幸せになってね！','寂しいけどおめでとう😭','配信で出会えたことに感謝してます！'];else if(type==='success')pool=['初期から見てたから泣ける😭','これからも応援してる！','もっともっと有名になって！'];else if(type==='burnout')pool=['無理しないでね。ゆっくり休んで。','今までありがとう。お疲れ様でした。'];else pool=['3年間お疲れ様！','いつも楽しかったよ！','これからも見に来るね！','初期からずっと応援してます！'];arr.push({name:p.name,txt:pick(pool)});}return arr;}
function end(force){if(s.ended)return;s.ended=true;clearInterval(timer);$('modal').classList.add('hidden');$('game').classList.add('hidden');$('ending').classList.remove('hidden');let type=endingType(force);let titles={scandal:['すべてを失った配信者','広がった炎上','燃え尽きた信頼'],love:['画面の向こうの君と','配信より大切な人','二人で歩く人生'],success:['伝説への第一歩','配信者としての大躍進','夢はまだ続く'],quiet:['いつもの配信、いつもの夜','細く長く愛された人','積み重ねた居場所'],retire:['同接0人の最終回','配信者から会社員へ','夢に区切りを'],burnout:['燃え尽きた夜','もう配信できない','静かな引退']};let title=pick(titles[type]);let years=Math.floor(s.day/365),days=s.day%365;let story={scandal:`活動${years}年${days}日。\n噂と批判が広がり、信頼を取り戻すことができなかった。\nあなたは配信活動に幕を下ろした。`,love:`活動${years}年${days}日。\n配信で出会った大切な人と、これからの人生を歩むことにした。\nあなたは配信者ではない未来を選んだ。`,success:`活動${years}年${days}日。\n同接0人から始まった配信は、たくさんの人が集まる場所になった。\nあなたの配信者人生は、これからも続く。`,quiet:`活動${years}年${days}日。\n派手な出来事ばかりではなかった。\nそれでも、あなたの配信を待つ人がいる。明日もまた配信は続く。`,retire:`活動${years}年${days}日。\n夢見た景色には届かなかった。\nそれでも、配信を通じて過ごした時間は確かにあった。`,burnout:`活動${years}年${days}日。\n毎日の配信と人間関係に疲れ、限界を迎えた。\nあなたは静かに活動を終えた。`}[type];let post=pick(posts[type]).join('\n\n');if(s.day>BASE){post=post.replace(/3周年/g,`${years}周年`).replace(/3年前/g,`${years}年前`).replace(/3年経って/g,`${years}年経って`).replace(/3年/g,`${years}年`);} let likes=Math.max(0,Math.round(s.followers*(type==='scandal'?rand(4,20)/100:rand(2,13)/100)+rand(0,Math.max(2,Math.floor(s.viewers/2)))));let rts=Math.max(0,Math.round(likes*(type==='scandal'?.55:.12)));let rep=replies(type);let replyCount=Math.max(rep.length,Math.round(likes*(type==='scandal'?.22:.07)));let handle='@'+s.name.replace(/[^a-zA-Z0-9ぁ-んァ-ヶ一-龠]/g,'').slice(0,8)+'_live';let h=`<div class="pill" style="display:inline-block">配信者人生の結末</div><h1>${esc(title)}</h1><div class="story">${esc(story)}</div><div class="endstats"><div class="stat"><small>最終Xフォロワー</small><strong>${fmt(s.followers)}人</strong></div><div class="stat"><small>最終平均同接</small><strong>${fmt(s.viewers)}人</strong></div><div class="stat"><small>最高同接</small><strong>${fmt(s.peak)}人</strong></div><div class="stat"><small>累計投げ銭</small><strong>¥${fmt(s.tips)}</strong></div><div class="stat"><small>活動期間</small><strong>${years}年${days}日</strong></div></div><div class="tweet"><div class="user">${esc(s.name)} <span class="handle">${esc(handle)}</span></div><div class="note">最後のポスト（架空）</div><div class="content">${esc(post)}</div><div class="metrics"><span>♡ ${fmt(likes)}</span><span>↻ ${fmt(rts)}</span><span>💬 ${fmt(replyCount)}</span></div><div class="note" style="margin-top:18px">リスナーからの返信</div>${rep.map(r=>`<div class="reply"><b>${esc(r.name)}</b>${esc(r.txt)}</div>`).join('')}</div><div class="controls"><button type="button" class="primary" id="retry">もう一度人生を始める</button><button type="button" class="secondary" id="copy">結果をコピー</button></div><p class="note">※この投稿はゲーム内の演出です。実際のXとは関係ありません。</p>`;$('ending').innerHTML=h;$('retry').onclick=()=>{$('ending').classList.add('hidden');$('intro').classList.remove('hidden');};$('copy').onclick=async()=>{let text=`配信者人生シミュレーター\n${title}\n${s.genre}｜活動${years}年${days}日\nXフォロワー ${fmt(s.followers)}人\n平均同接 ${fmt(s.viewers)}人\n最高同接 ${fmt(s.peak)}人\n累計投げ銭 ¥${fmt(s.tips)}\n\n最後のポスト：\n${post}\n${new URL("./", location.href).href}\n#配信者人生シミュレーター`;try{await navigator.clipboard.writeText(text);$('copy').textContent='コピーしました！'}catch(e){let ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();$('copy').textContent='コピーしました！'}};}
$('start').onclick=setup;$('pause').onclick=()=>{if(!s)return;s.paused=!s.paused;render();};})();
