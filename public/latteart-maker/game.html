<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: a café table seen from the barista's side. The cup fills the screen, the HUD floats on top and the pour lever hugs the right edge. When the pour ends the camera looks straight down at the cup, and the result card rises below it (beside it on wide screens), so the art is never covered. */
:root{
  --porcelain:#f8f7f3;
  --porcelain2:#eceae3;
  --ink:#1b2130;
  --mute:#687084;
  --cobalt:#2747a8;
  --cobalt-d:#1b3482;
  --crema:#b8773f;
  --espresso:#3a2317;
  --warn:#d2452f;
  --line:rgba(27,33,48,.12);
  --glass:rgba(248,247,243,.8);
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --f-dis:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background-color:#3b271a;color:var(--ink);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#stage{position:fixed;inset:0;z-index:0}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.brand{font-family:var(--f-dis);font-weight:800;font-size:16px;letter-spacing:.06em;color:#fff;
  padding:7px 13px 6px;white-space:nowrap;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.hr{display:flex;align-items:center;gap:8px}
.ib{pointer-events:auto;appearance:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib .off{display:none}
.ib[aria-pressed="true"] .on{display:none}
.ib[aria-pressed="true"] .off{display:block}

.lever{position:fixed;z-index:6;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-42%);width:66px;height:min(50vh,400px);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;justify-items:center;gap:7px;touch-action:none;cursor:ns-resize;transition:opacity .3s}
.done .lever{opacity:0;pointer-events:none}
.wait .lever{opacity:.4;pointer-events:none}
.lv-cap{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink);background:var(--glass);padding:4px 9px 3px;border-radius:99px;border:1px solid var(--line);line-height:1.2}
.lv-track{position:relative;width:58px;height:100%;border-radius:30px;background:rgba(248,247,243,.5);border:1px solid rgba(27,33,48,.16);
  box-shadow:inset 0 2px 10px rgba(27,33,48,.14);overflow:hidden;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lv-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,rgba(255,252,246,.95),rgba(255,252,246,.4))}
.lv-thumb{position:absolute;left:4px;right:4px;bottom:4px;height:50px;border-radius:25px;background:var(--cobalt);
  box-shadow:0 6px 16px rgba(27,52,130,.38);display:grid;place-items:center;will-change:transform}
.lever.on .lv-thumb{background:var(--cobalt-d)}
.lv-thumb svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .05s linear}
.lever:focus-visible .lv-track{outline:3px solid var(--crema);outline-offset:2px}
.lever-left .lever{right:auto;left:max(10px,env(safe-area-inset-left,0px))}
.swap{position:fixed;z-index:6;right:max(13px,env(safe-area-inset-right,0px));top:calc(50% + min(50vh,400px) * 0.58 + 10px);appearance:none;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;width:60px;height:30px;padding:0;border-radius:99px;border:1px solid var(--line);
  background:var(--glass);color:var(--ink);font:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer;touch-action:manipulation;transition:opacity .3s}
.swap svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lever-left .swap{right:auto;left:max(13px,env(safe-area-inset-left,0px))}
.done .swap{opacity:0;pointer-events:none}
.swap:focus-visible{outline:3px solid var(--crema);outline-offset:2px}

.hint{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);margin:0;
  padding:9px 16px 8px;border-radius:999px;background:rgba(27,33,48,.84);color:#fff;font-size:13px;font-weight:700;line-height:1.35;
  width:max-content;max-width:calc(100vw - 120px);text-align:center;pointer-events:none;animation:breathe 2s ease-in-out infinite}
.hint b{color:#f2c58f;font-weight:700}
.oops{position:fixed;z-index:6;left:50%;top:26%;margin:0;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--f-dis);font-weight:800;font-size:clamp(40px,12vw,72px);color:var(--warn);letter-spacing:.04em;white-space:nowrap;
  text-shadow:0 0 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 6px 18px rgba(46,28,12,.35);animation:oops 1.6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes oops{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-14deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(4deg)}30%{transform:translate(-50%,-50%) scale(.96) rotate(-3deg)}42%{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1) rotate(-6deg)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.7}}

.result{position:fixed;z-index:7;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.wide .result{left:auto;top:0;width:min(42vw,430px);flex-direction:column;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 64px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 0}
.card{pointer-events:auto;width:100%;max-width:480px;background:var(--porcelain);border-radius:22px;overflow:hidden;
  box-shadow:0 24px 60px rgba(46,28,12,.38);animation:rise .55s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.c-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:end;padding:14px 18px 10px}
.c-top small,.c-stats small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--mute)}
.c-stats small{letter-spacing:.04em;white-space:nowrap}
.res-col{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.cups-float{pointer-events:auto;display:flex;gap:8px;padding:6px 8px;animation:rise .55s cubic-bezier(.2,.8,.2,1)}
.c-lab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px;margin-bottom:2px}
.c-score small{display:flex;align-items:center;min-height:26px;margin-bottom:2px}
.cupc{appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(27,33,48,.24);padding:0;cursor:pointer;touch-action:manipulation;background:var(--c)}
.cupc[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink)}
.cupc:focus-visible{outline:3px solid var(--crema);outline-offset:2px}
.c-score b{display:flex;align-items:baseline;font-family:var(--f-dis);font-weight:800;font-size:60px;line-height:.95;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.c-score b i{font-style:normal;font-size:20px;margin-left:3px;letter-spacing:0}
.c-name{min-width:0;padding-bottom:4px}
.c-name > b{display:block;font-family:var(--f-dis);font-weight:800;font-size:26px;line-height:1.2;color:var(--espresso);white-space:nowrap;overflow:hidden;padding:12px 18px 12px 0;margin:-12px -18px -12px 0}
.c-name p{margin:4px 0 0;font-size:14px;font-weight:700;color:var(--cobalt);letter-spacing:.04em}
.rar{display:inline-block;vertical-align:.18em;padding:.16em .5em .12em;border-radius:.32em;font-family:var(--f-dis);font-weight:800;font-size:.62em;line-height:1.1;letter-spacing:.04em;position:relative;overflow:hidden}
.rar-ssr::after,.rar-ur::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);transform:translateX(-120%);animation:shine 2.4s ease-in-out .9s infinite}
@keyframes shine{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}
.c-stats{list-style:none;margin:0;padding:9px 18px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px dashed rgba(27,33,48,.16)}
.c-stats li{min-width:0}
.c-stats b{display:block;margin-top:2px;font-weight:700;font-size:18px;line-height:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-stats b i{font-style:normal;font-size:11px;margin-left:1px}
.c-stats #mVol{font-size:16px}
.c-stats .bar{display:block;margin-top:4px;height:4px;border-radius:4px;background:rgba(27,33,48,.1);overflow:hidden}
.c-stats .bar i{display:block;height:100%;background:var(--crema);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px 10px 18px;border-top:1px dashed rgba(27,33,48,.16);
  color:var(--ink);text-decoration:none;touch-action:manipulation}
.tip > span:first-child{font-family:var(--f-dis);font-weight:800;font-size:14px;color:var(--espresso);white-space:nowrap}
.tip-go{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--crema);white-space:nowrap}
.tip-go svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip-go svg:last-child{width:13px;height:13px;stroke-width:2.4}
.tip:focus-visible{outline:3px solid var(--crema);outline-offset:-3px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px 12px;background:var(--porcelain2);border-top:1px solid var(--line)}
.act{appearance:none;height:44px;padding:0 6px;border-radius:12px;border:1px solid rgba(27,33,48,.16);background:#fff;color:var(--ink);
  font:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;
  cursor:pointer;touch-action:manipulation;white-space:nowrap;min-width:0}
.act svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.act.x{background:#0f1419;color:#fff;border-color:transparent}
.act[aria-disabled="true"]{opacity:.45;pointer-events:none}
.act.again{background:var(--cobalt);color:#fff;border-color:transparent}
.act:focus-visible,.ib:focus-visible{outline:3px solid var(--crema);outline-offset:2px}
.share-note{margin:0;padding:0 14px 10px;background:var(--porcelain2);font-size:12px;line-height:1.5;color:var(--ink)}
.credit{margin:0;display:flex;justify-content:space-between;gap:12px;padding:0 14px 12px;background:var(--porcelain2);font-size:12px;line-height:1.4;color:var(--mute)}
.credit a{color:inherit}
.save{width:min(340px,calc(100% - 32px));box-sizing:border-box;padding:14px;border:0;border-radius:22px;background:var(--porcelain);color:var(--ink);text-align:center;box-shadow:0 24px 60px rgba(46,28,12,.38)}
.save::backdrop{background:rgba(32,20,10,.55)}
.save img{display:block;width:min(100%,calc(100vh - 200px));aspect-ratio:1;margin:0 auto;border-radius:12px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.save p{margin:10px 0;font-size:13px;font-weight:700;color:var(--mute)}
.save-b{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.zk-ib{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 56px);right:max(12px,env(safe-area-inset-right,0px));transition:opacity .25s}
body:not(.zk-on) .zk-ib{opacity:0;pointer-events:none}
.zk-link{flex:none;appearance:none;display:inline-flex;align-items:center;gap:3px;padding:4px 7px 4px 11px;border-radius:99px;border:1px solid rgba(27,33,48,.16);
  background:#fff;color:var(--ink);font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.zk-link b{color:var(--cobalt);font-weight:700;font-variant-numeric:tabular-nums}
.zk-link svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.zk-link.pulse{border-color:var(--warn);animation:zkp 1.1s ease-out .5s 3}
@keyframes zkp{0%{box-shadow:0 0 0 0 rgba(210,69,47,.5)}100%{box-shadow:0 0 0 12px rgba(210,69,47,0)}}
.zk-link:focus-visible{outline:3px solid var(--crema);outline-offset:2px}
.new{font-style:normal;display:inline-block;margin-left:7px;padding:1px 6px 0;border-radius:4px;background:var(--warn);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.08em;vertical-align:1px}
.zk{position:fixed;inset:0;z-index:11;display:flex;align-items:flex-end;justify-content:center;background:rgba(32,20,10,.45);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.zk-panel{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;background:var(--porcelain);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 40px rgba(46,28,12,.3);animation:rise .4s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.wide .zk{align-items:center;padding-bottom:12px}
.wide .zk-panel{border-radius:22px}
.zk-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 18px;border-bottom:1px solid var(--line)}
.zk-head h2{margin:0;font-family:var(--f-dis);font-weight:800;font-size:20px;color:var(--espresso)}
.zk-head b{margin-right:auto;font-size:15px;font-weight:700;color:var(--cobalt);font-variant-numeric:tabular-nums}
.zk-body{overflow-y:auto;overscroll-behavior:contain;padding:2px 14px 16px}
.zk-sec h3{margin:12px 2px 8px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.zk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px}
@media (min-width:520px){.zk-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.zk-cell{display:grid;justify-items:center;align-content:start;gap:4px;text-align:center;min-width:0}
.zk-pic{width:100%;max-width:74px;aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--porcelain2);box-shadow:inset 0 0 0 1px var(--line)}
.zk-pic img{width:100%;height:100%;object-fit:cover;display:block}
.zk-cell.no .zk-pic{background:#e6e2da;box-shadow:inset 0 0 0 2px #d8d3c9;color:#b3ab9e;font-family:var(--f-dis);font-weight:800;font-size:24px}
.zk-cell.fresh .zk-pic{box-shadow:0 0 0 3px var(--warn)}
.zk-name{font-size:11.5px;font-weight:700;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.zk-cell.no .zk-name{color:var(--mute);letter-spacing:.12em}
.zk-name .rar{margin-left:.3em;font-size:.85em;vertical-align:.08em}
.zk-best{font-size:10.5px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;line-height:1.8;font-weight:700;z-index:20;background:#e9e1d4;color:var(--ink);margin:0}

@media (max-width:370px){
  .brand{font-size:14px;padding:6px 10px 5px}
  .c-score b{font-size:52px}
  .c-name > b{font-size:22px}
  .act{font-size:12px;gap:3px}
}
@media (prefers-reduced-motion:reduce){
  .cups-float{animation:none}
  .zk-panel,.zk-link.pulse{animation:none}
  .oops{animation:none}
  .hint{animation:none}
  .card{animation:none}
  .rar::after{animation:none!important;display:none}
}
</style>
</head>
<body class="wait">

<div id="stage"><canvas id="c" aria-label="カップとミルクピッチャー。なぞると注ぐ位置が動きます"></canvas></div>

<header class="hud">
  <div class="brand">#ラテアート注ぎました</div>
  <div class="hr">
    <button class="ib" id="mute" type="button" aria-pressed="false" aria-label="音を切る">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>
</header>
<button class="ib zk-ib" id="zkOpen" type="button" aria-label="見立て図鑑を開く"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 0 7.5 23H19v-5"/><path d="M9 7.5h6"/></svg></button>

<div class="lever" id="lever" role="slider" tabindex="0" aria-label="ピッチャーの傾き" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <span class="lv-cap">注ぐ</span>
  <div class="lv-track" id="lvTrack">
    <i class="lv-fill" id="lvFill"></i>
    <b class="lv-thumb" id="lvThumb"><svg viewBox="0 0 32 32" aria-hidden="true" id="lvIcon"><path d="M9 9h12l-1.2 15.5a1.6 1.6 0 0 1-1.6 1.5h-6.4a1.6 1.6 0 0 1-1.6-1.5z"/><path d="M21 9l4.5-2.2"/><path d="M9.6 13H7.2a2.2 2.2 0 0 0-2.2 2.2v2.6a2.2 2.2 0 0 0 2.2 2.2h2.2"/></svg></b>
  </div>
  <span class="lv-cap">止める</span>
</div>
<button class="swap" id="swap" type="button" aria-label="レバーを右側に移す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-3.5-3.5"/><path d="M19 16H5l3.5 3.5"/></svg><span>左右</span></button>

<p class="hint" id="hint">ミルクを温めています…</p>
<p class="oops" id="oops" hidden aria-live="polite">あふれた！</p>

<section class="result" id="result" hidden aria-label="仕上がり">
  <div class="res-col">

<script src="./three.min.js"></script>
<script>
(() => {
'use strict';
const SHARE_URL = new URL('./', location.href).href;
const $ = (id) => document.getElementById(id);
const DEG = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const FINE = !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);

function fatal(msg) { const p = document.createElement('p'); p.className = 'nogl'; p.textContent = msg; document.body.appendChild(p); }
if (!window.THREE) { fatal('3D表示の部品を読み込めませんでした。通信状況を確認して、ページを開き直してください。'); return; }
const V2 = THREE.Vector2, V3 = THREE.Vector3;

/* ================= renderer ================= */
const canvas = $('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (_) { fatal('この端末では3D表示が使えないため、遊べませんでした。'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.setClearColor(0x3b271a, 1);

/* ================= GPU passes ================= */
const quadScene = new THREE.Scene(), quadCam = new THREE.Camera();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quad.frustumCulled = false; quadScene.add(quad);
function pass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); }
function makeRT(w, h, type, linear) {
  const f = linear ? THREE.LinearFilter : THREE.NearestFilter;
  return new THREE.WebGLRenderTarget(w, h, { type, format: THREE.RGBAFormat, minFilter: f, magFilter: f,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, depthBuffer: false, stencilBuffer: false });
}
const VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const SMS = [];
const SM = (frag, uniforms) => { const m = new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false }); SMS.push(m); return m; };
const HEAD = `
varying vec2 vUv;
float inD(vec2 p){ return step(length(p - 0.5), 0.5); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a * vnoise(p); p = p * 2.03 + 1.7; a *= 0.5; } return s; }
`;

const fillMat = SM('uniform vec4 val; void main(){ gl_FragColor = val; }', { val: { value: new THREE.Vector4() } });
const probeMat = SM('uniform sampler2D uSrc; varying vec2 vUv; void main(){ vec4 t = texture2D(uSrc, vec2(0.5)); gl_FragColor = vec4((t.x + 1.0) * 0.5, t.y * 2.0 * 0.5, 0.0, 1.0); }', { uSrc: { value: null } });
const copyMat = SM('uniform sampler2D uSrc; varying vec2 vUv; void main(){ gl_FragColor = texture2D(uSrc, vUv); }', { uSrc: { value: null } });
function testType(type) {
  let a = null, b = null;
  try {
    a = makeRT(4, 4, type, true); b = makeRT(4, 4, THREE.UnsignedByteType, false);
    fillMat.uniforms.val.value.set(-0.5, 0.25, 0, 1); pass(fillMat, a);
    probeMat.uniforms.uSrc.value = a.texture; pass(probeMat, b);
    const buf = new Uint8Array(64); renderer.readRenderTargetPixels(b, 0, 0, 4, 4, buf);
    return Math.abs(buf[0] - 64) < 8 && Math.abs(buf[1] - 64) < 8;
  } catch (_) { return false; }
  finally { renderer.setRenderTarget(null); if (a) a.dispose(); if (b) b.dispose(); }
}
let FT = null;
if (testType(THREE.HalfFloatType)) FT = THREE.HalfFloatType; else if (testType(THREE.FloatType)) FT = THREE.FloatType;
if (!FT) { fatal('この端末ではミルクの流れを計算できないため、遊べませんでした。'); return; }

/* ================= milk surface simulation ================= */
const SIM = 128, DYE = Math.min(512, renderer.capabilities.maxTextureSize), ITER = 28;
const pp = (s, lin) => { const o = { read: makeRT(s, s, FT, lin), write: makeRT(s, s, FT, lin), swap() { const t = this.read; this.read = this.write; this.write = t; } }; return o; };
const vel = pp(SIM, true), prs = pp(SIM, false), dye = pp(DYE, true);
const mcA = makeRT(DYE, DYE, FT, true), mcB = makeRT(DYE, DYE, FT, true);
const divRT = makeRT(SIM, SIM, FT, false);
const readN = 256, readRT = makeRT(readN, readN, THREE.UnsignedByteType, true), rbuf = new Uint8Array(readN * readN * 4);
const H_SIM = 1 / SIM;

const advMat = SM(HEAD + `
uniform sampler2D uVel; uniform sampler2D uSrc; uniform float dt; uniform float diss; uniform float isVel;
void main(){
  vec2 v = texture2D(uVel, vUv).xy;
  vec4 r = texture2D(uSrc, vUv - dt * v);
  if (isVel > 0.5) {
    r.xy *= diss;
    vec2 c = vUv - 0.5; float d = length(c); vec2 n = c / max(d, 1e-4);
    float e = smoothstep(0.42, 0.5, d);
    r.xy -= n * max(dot(r.xy, n), 0.0) * e;
    r.xy *= 1.0 - 0.3 * e;
    if (d > 0.5) r.xy = vec2(0.0);
    r.zw = vec2(0.0, 1.0);
  }
  gl_FragColor = r;
}`, { uVel: { value: null }, uSrc: { value: null }, dt: { value: 0 }, diss: { value: 1 }, isVel: { value: 1 } });

const mcMat = SM(HEAD + `
uniform sampler2D uVel; uniform sampler2D uSrc; uniform sampler2D uFwd; uniform sampler2D uBack; uniform float dt; uniform float texel;
void main(){
  vec2 v = texture2D(uVel, vUv).xy;
  vec2 p = vUv - dt * v;
  vec4 r = texture2D(uFwd, vUv) + 0.5 * (texture2D(uSrc, vUv) - texture2D(uBack, vUv));
  vec2 i = floor(p / texel - 0.5);
  vec2 c0 = (i + 0.5) * texel;
  vec4 a = texture2D(uSrc, c0), b = texture2D(uSrc, c0 + vec2(texel, 0.0)), c = texture2D(uSrc, c0 + vec2(0.0, texel)), d = texture2D(uSrc, c0 + vec2(texel));
  gl_FragColor = clamp(r, min(min(a, b), min(c, d)), max(max(a, b), max(c, d)));
}`, { uVel: { value: null }, uSrc: { value: null }, uFwd: { value: null }, uBack: { value: null }, dt: { value: 0 }, texel: { value: 1 / DYE } });

const splatVMat = SM(HEAD + `
uniform sampler2D uVel; uniform vec2 pt; uniform vec2 pv; uniform float rad; uniform float amt;
void main(){
  vec2 v = texture2D(uVel, vUv).xy;
  vec2 d = vUv - pt;
  float g = exp(-dot(d, d) / (rad * rad));
  v = mix(v, pv, clamp(amt * g, 0.0, 1.0));
  if (length(vUv - 0.5) > 0.5) v = vec2(0.0);
  gl_FragColor = vec4(v, 0.0, 1.0);
}`, { uVel: { value: null }, pt: { value: new V2() }, pv: { value: new V2() }, rad: { value: 0.03 }, amt: { value: 0 } });

const divMat = SM(HEAD + `
uniform sampler2D uVel; uniform float h; uniform vec2 pt; uniform float sA; uniform float sR;
void main(){
  vec2 L = vUv - vec2(h, 0.0), R = vUv + vec2(h, 0.0), B = vUv - vec2(0.0, h), T = vUv + vec2(0.0, h);
  float vl = texture2D(uVel, L).x * inD(L), vr = texture2D(uVel, R).x * inD(R);
  float vb = texture2D(uVel, B).y * inD(B), vt = texture2D(uVel, T).y * inD(T);
  float div = 0.5 * (vr - vl + vt - vb) / h;
  vec2 d = vUv - pt;
  float S = sA * (exp(-dot(d, d) / (sR * sR)) - sR * sR * 4.0);
  gl_FragColor = vec4((div - S) * inD(vUv), 0.0, 0.0, 1.0);
}`, { uVel: { value: null }, h: { value: H_SIM }, pt: { value: new V2() }, sA: { value: 0 }, sR: { value: 0.03 } });

const jacMat = SM(HEAD + `
uniform sampler2D uP; uniform sampler2D uDiv; uniform float h; uniform float keep;
void main(){
  float c = texture2D(uP, vUv).x * keep;
  vec2 L = vUv - vec2(h, 0.0), R = vUv + vec2(h, 0.0), B = vUv - vec2(0.0, h), T = vUv + vec2(0.0, h);
  float pl = inD(L) > 0.5 ? texture2D(uP, L).x * keep : c;
  float pr = inD(R) > 0.5 ? texture2D(uP, R).x * keep : c;
  float pb = inD(B) > 0.5 ? texture2D(uP, B).x * keep : c;
  float pt = inD(T) > 0.5 ? texture2D(uP, T).x * keep : c;
  float p = (pl + pr + pb + pt - h * h * texture2D(uDiv, vUv).x) * 0.25;
  gl_FragColor = vec4(mix(c, p, inD(vUv)), 0.0, 0.0, 1.0);
}`, { uP: { value: null }, uDiv: { value: null }, h: { value: H_SIM }, keep: { value: 1 } });

const gradMat = SM(HEAD + `
uniform sampler2D uP; uniform sampler2D uVel; uniform float h;
void main(){
  float c = texture2D(uP, vUv).x;
  vec2 L = vUv - vec2(h, 0.0), R = vUv + vec2(h, 0.0), B = vUv - vec2(0.0, h), T = vUv + vec2(0.0, h);
  float pl = inD(L) > 0.5 ? texture2D(uP, L).x : c;
  float pr = inD(R) > 0.5 ? texture2D(uP, R).x : c;
  float pb = inD(B) > 0.5 ? texture2D(uP, B).x : c;
  float pt = inD(T) > 0.5 ? texture2D(uP, T).x : c;
  vec2 v = texture2D(uVel, vUv).xy - 0.5 * vec2(pr - pl, pt - pb) / h;
  if (length(vUv - 0.5) > 0.5) v = vec2(0.0);
  gl_FragColor = vec4(v, 0.0, 1.0);
}`, { uP: { value: null }, uVel: { value: null }, h: { value: H_SIM } });

const splatDMat = SM(HEAD + `
uniform sampler2D uDye; uniform vec2 pt; uniform float foam; uniform float fR; uniform float mixA; uniform float mR; uniform float cut; uniform float cR;
void main(){
  vec4 c = texture2D(uDye, vUv);
  vec2 d = vUv - pt; float r2 = dot(d, d);
  c.r *= 1.0 - clamp(cut * exp(-r2 / (cR * cR)), 0.0, 1.0);
  float gf = exp(-r2 / (fR * fR));
  c.r += (1.0 - c.r) * clamp(foam * gf, 0.0, 1.0);
  float gm = exp(-r2 / (mR * mR));
  float k = clamp(mixA * gm, 0.0, 1.0);
  c.g = mix(c.g, 0.3, k);
  c.b = mix(c.b, 0.45, k * 0.6);
  gl_FragColor = c;
}`, { uDye: { value: null }, pt: { value: new V2() }, foam: { value: 0 }, fR: { value: 0.03 }, mixA: { value: 0 }, mR: { value: 0.08 }, cut: { value: 0 }, cR: { value: 0.02 } });

const initDyeMat = SM(HEAD + `
uniform float seed;
void main(){
  float n = fbm(vUv * 7.0 + seed);
  float n2 = fbm(vUv * 26.0 + seed * 1.7 + vec2(n * 2.0));
  float tiger = smoothstep(0.35, 0.75, fbm(vec2(vUv.x * 3.0, vUv.y * 18.0) + seed * 0.6));
  gl_FragColor = vec4(0.0, 1.0, clamp(n * 0.7 + n2 * 0.35 + tiger * 0.15 - 0.05, 0.0, 1.0), 1.0);
}`, { seed: { value: 0 } });

const sim = {
  reset() {
    fillMat.uniforms.val.value.set(0, 0, 0, 1);
    for (const t of [vel.read, vel.write, prs.read, prs.write, divRT]) pass(fillMat, t);
    initDyeMat.uniforms.seed.value = Math.random() * 40;
    pass(initDyeMat, dye.read); pass(initDyeMat, dye.write);
    renderer.setRenderTarget(null);
  },
  step(dt, P) {
    const a = advMat.uniforms;
    a.uVel.value = vel.read.texture; a.uSrc.value = vel.read.texture; a.dt.value = dt; a.diss.value = Math.exp(-dt * 2.3); a.isVel.value = 1;
    pass(advMat, vel.write); vel.swap();
    if (P.active) {
      const s = splatVMat.uniforms;
      s.uVel.value = vel.read.texture; s.pt.value.set(P.pt.x, P.pt.y); s.pv.value.set(P.pv.x, P.pv.y); s.rad.value = P.rad; s.amt.value = P.amt;
      pass(splatVMat, vel.write); vel.swap();
    }
    const d = divMat.uniforms;
    d.uVel.value = vel.read.texture; d.pt.value.set(P.pt.x, P.pt.y); d.sA.value = P.active ? P.sA : 0; d.sR.value = P.sR;
    pass(divMat, divRT);
    const j = jacMat.uniforms; j.uDiv.value = divRT.texture;
    for (let k = 0; k < ITER; k++) { j.uP.value = prs.read.texture; j.keep.value = k === 0 ? 0.8 : 1; pass(jacMat, prs.write); prs.swap(); }
    const g = gradMat.uniforms; g.uP.value = prs.read.texture; g.uVel.value = vel.read.texture;
    pass(gradMat, vel.write); vel.swap();
    a.uVel.value = vel.read.texture; a.uSrc.value = dye.read.texture; a.diss.value = 1; a.isVel.value = 0; a.dt.value = dt;
    pass(advMat, mcA);
    a.uSrc.value = mcA.texture; a.dt.value = -dt;
    pass(advMat, mcB);
    const m = mcMat.uniforms;
    m.uVel.value = vel.read.texture; m.uSrc.value = dye.read.texture; m.uFwd.value = mcA.texture; m.uBack.value = mcB.texture; m.dt.value = dt;
    pass(mcMat, dye.write); dye.swap();
    if (P.active) {
      const s = splatDMat.uniforms;
      s.uDye.value = dye.read.texture; s.pt.value.set(P.pt.x, P.pt.y);
      s.foam.value = P.foam; s.fR.value = P.fR; s.mixA.value = P.mixA; s.mR.value = P.mR; s.cut.value = P.cut; s.cR.value = P.cR;
      pass(splatDMat, dye.write); dye.swap();
    }
    renderer.setRenderTarget(null);
  },
  read() {
    copyMat.uniforms.uSrc.value = dye.read.texture; pass(copyMat, readRT);
    renderer.readRenderTargetPixels(readRT, 0, 0, readN, readN, rbuf);
    renderer.setRenderTarget(null);
    return rbuf;
  },
};

/* ================= scene ================= */
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, 1, 0.05, 80);

/* environment for reflections: warm room, a window and a pendant lamp */
(() => {
  const env = new THREE.Scene();
  const sg = new THREE.SphereGeometry(10, 32, 16), sp = sg.attributes.position, cols = new Float32Array(sp.count * 3);
  const top = new THREE.Color(0.8, 0.78, 0.74), midC = new THREE.Color(0.62, 0.56, 0.49), bot = new THREE.Color(0.32, 0.22, 0.14), tc = new THREE.Color();
  for (let i = 0; i < sp.count; i++) {
    const y = sp.getY(i) / 10;
    if (y > 0) tc.copy(midC).lerp(top, Math.pow(y, 0.6)); else tc.copy(midC).lerp(bot, Math.pow(-y, 0.5));
    cols[i * 3] = tc.r; cols[i * 3 + 1] = tc.g; cols[i * 3 + 2] = tc.b;
  }
  sg.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  env.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const panel = (w, h, col, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  panel(5, 3.6, new THREE.Color(2.5, 2.45, 2.35), -6, 5, 2);
  panel(2.2, 2.2, new THREE.Color(3.4, 2.6, 1.7), 4, 7, -3);
  panel(8, 1.4, new THREE.Color(1.3, 1.25, 1.2), 0, 3, -8);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.035).texture;
  pm.dispose();
})();
const LIGHT_DIR = new V3(-2.2, 4, 2.4).normalize();
const key = new THREE.DirectionalLight(0xfff0dc, 1.15); key.position.copy(LIGHT_DIR).multiplyScalar(6); scene.add(key);
scene.add(new THREE.HemisphereLight(0xfff6ea, 0x6b4c32, 0.25));

function texFrom(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t; }

/* table: dark walnut planks */
(() => {
  const S = 1024, c = mk(S, S), g = c.getContext('2d');
  g.fillStyle = '#5a3c29'; g.fillRect(0, 0, S, S);
  const tones = [0.0, 0.06, -0.05, 0.03];
  for (let p = 0; p < 4; p++) {
    const y0 = p * 256, t = tones[p];
    g.fillStyle = t > 0 ? `rgba(255,225,190,${t})` : `rgba(30,18,10,${-t})`; g.fillRect(0, y0, S, 256);
    for (let k = 0; k < 80; k++) {
      const y = y0 + 6 + Math.random() * 244, a = 0.025 + Math.random() * 0.085;
      g.strokeStyle = `rgba(34,20,11,${a * 1.6})`; g.lineWidth = 0.5 + Math.random() * 2.4; g.beginPath();
      const n = 1 + Math.floor(Math.random() * 4), ph = Math.random() * 6.28, amp = 1 + Math.random() * 5;
      for (let x = 0; x <= S; x += 8) { const yy = y + Math.sin(x / S * Math.PI * 2 * n + ph) * amp; if (x) g.lineTo(x, yy); else g.moveTo(x, yy); }
      g.stroke();
    }
    g.fillStyle = 'rgba(22,13,7,.5)'; g.fillRect(0, y0, S, 2);
    g.fillStyle = 'rgba(255,225,190,.12)'; g.fillRect(0, y0 + 2, S, 1);
  }
  const tex = texFrom(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(3, 3);
  const table = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.62, metalness: 0, envMapIntensity: 0.6 }));
  table.rotation.x = -Math.PI / 2; table.rotation.z = 0.06; scene.add(table);
  /* soft vignette so the table edge never shows */

      composeCard().toBlob((b) => {
        if (!b) { rej(new Error('blob')); return; }
        if (gen !== cardGen) { makeBlob().then(res, rej); return; }
        cardCache = b; res(b);
      }, 'image/png');
    } catch (e) { rej(e); }
  }));
}
/* phones: share sheet with the image, text and URL; without one (in-app browsers), the image to long-press and save before opening X.
   PC: copy the image to paste into the post, and let the link open X; if copying fails, download it instead */
const PASTE_KEY = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? '⌘V' : 'Ctrl+V';
function shareNote(text) { const n = $('shareNote'); n.textContent = text; n.hidden = false; }
let shareBusy = false;
/* phones: keep the share button off until the image is ready, so the tap can open the share sheet right away */
function holdShare(p) {
  if (FINE) return;
  const b = $('shareX'); b.setAttribute('aria-disabled', 'true');
  if (p) p.catch(() => {}).then(() => b.removeAttribute('aria-disabled'));
}
function downloadCard() {
  return makeBlob().then((blob) => {
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = 'latteart-maker.png'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
    shareNote('画像を保存しました');
  }, () => shareNote('画像を作れませんでした'));
}
/* in-app browsers often can't download files either; a data URL, since some save a long-pressed image by fetching its URL, which a blob: URL can't serve */
const saveDlg = $('save');
function showSave(blob) {
  if (typeof saveDlg.showModal !== 'function') return false;
  const img = $('saveImg'), fr = new FileReader();
  img.removeAttribute('src'); fr.onload = () => { img.src = fr.result; }; fr.readAsDataURL(blob);
  saveDlg.showModal();
  return true;
}
$('saveNo').addEventListener('click', () => saveDlg.close());
$('saveX').addEventListener('click', () => {
  navigator.clipboard?.writeText(shareText).catch(() => {});
  saveDlg.close();
});
/* a tap on the backdrop closes it; a tap on the box's own padding also targets the dialog, so check the position */
saveDlg.addEventListener('click', (e) => {
  if (e.target !== saveDlg) return;
  const r = saveDlg.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) saveDlg.close();
});
$('shareX').addEventListener('click', (e) => {
  e.preventDefault();
  if (shareBusy || e.currentTarget.getAttribute('aria-disabled') === 'true') return;
  shareBusy = true;
  const done = () => { shareBusy = false; };
  if (!FINE && cardCache) {
    const data = { files: [new File([cardCache], 'latteart-maker.png', { type: 'image/png' })], text: shareText };
    if (navigator.canShare && navigator.canShare(data)) {
      e.preventDefault();
      navigator.share(data).catch((err) => (err && err.name === 'AbortError' ? null : showSave(data.files[0]) || downloadCard())).then(done);
      return;
    }
    if (showSave(cardCache)) { e.preventDefault(); done(); return; }
  }
  try {
    if (!navigator.clipboard || !navigator.clipboard.write || typeof ClipboardItem !== 'function') throw new Error('unsupported');
    navigator.clipboard.write([new ClipboardItem({ 'image/png': makeBlob() })]).then(
      () => shareNote(FINE ? `画像をコピーしました。貼り付け（${PASTE_KEY}）してください` : '画像をコピーしました。貼り付けてください'),
      downloadCard).then(done);
  } catch (_) { downloadCard().then(done); }
});

/* ================= loop ================= */
function tick(dt) {
  G.t += dt;
  updateTiltCmd(dt);
  if (G.state === 'play') physics(dt);
  else if (G.state === 'settle') settle(dt);
  if (G.state !== 'result') updatePitcher(dt);
  if (G.state === 'play' || G.state === 'settle') simulate(dt);
  updateVisuals();
  updateSpill(dt);
  updateCamera(dt);
  if (G.state === 'play') measure();
  updateAudio();
  updateHud();
}
let last = performance.now(), paused = false;
function frame(now) {
  if (paused) return;
  const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000)); last = now;
  tick(dt);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}

/* test hooks for automated play-throughs */
window.__latte = {
  pause() { paused = true; },
  resume() { if (paused) { paused = false; last = performance.now(); requestAnimationFrame(frame); } },
  run(steps) { for (const s of steps) { const n = Math.round(s.t * 60); for (let i = 0; i < n; i++) { if (s.x !== undefined) G.land.set(typeof s.x === 'function' ? s.x(i / n) : s.x, typeof s.z === 'function' ? s.z(i / n) : s.z); if (s.tilt !== undefined) wheelTilt = typeof s.tilt === 'function' ? s.tilt(i / n) : s.tilt; tick(1 / 60); } } renderer.render(scene, cam); },
  state: () => ({ state: G.state, Lf: G.Lf, flow: G.flow, tilt: G.tilt, cmd: G.tiltCmd, lev: leverId, mh: mouseHold, wt: wheelTilt, ht: holdTilt, sy: surfY(G.Lf), foam: G.foamLaid, res: RES && RES.score, shape: RES && RES.shape }),
  feats: () => RES && RES.A,
  zukan: () => ({ n: zkCount(), keys: Object.keys(ZD), fresh: zkFresh }),
  restart() { restart(); },
  dump() { const b = sim.read(); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); },
  card: () => fontsReady().then(() => composeCard().toDataURL('image/png')),
  photo: (size, half, zoff) => renderPhoto(size, half, zoff).toDataURL('image/png'),
  render() { renderer.render(scene, cam); },
};

/* ================= boot ================= */
/* Safari can take seconds to prepare shaders on first visit, so keep pouring off until every program has finished compiling. */
function markReady() { if (ready) return; ready = true; document.body.classList.remove('wait'); setHint(); }
function watchReady(frames) {
  if (ready) return;
  const gl = renderer.getContext(), pcx = gl.getExtension('KHR_parallel_shader_compile');
  const done = pcx ? renderer.info.programs.every((p) => gl.getProgramParameter(p.program, pcx.COMPLETION_STATUS_KHR)) : true;
  if (done && frames >= 3) { markReady(); return; }
  requestAnimationFrame(() => watchReady(frames + 1));
}
applyLeverSide();
sim.reset();
layout(true);
/* compile blocks the page, so let the waiting hint paint for one frame before starting it */
requestAnimationFrame(() => requestAnimationFrame((t) => {
  renderer.compile(scene, cam);
  /* the sim passes only run once pouring starts, so build them now too (against a render target, which changes the program) */
  renderer.setRenderTarget(readRT);
  for (const m of SMS) { quad.material = m; renderer.compile(quadScene, quadCam); }
  renderer.setRenderTarget(null);
  last = t; frame(t);
  watchReady(0);
}));
setTimeout(markReady, 8000);
})();
</script>
