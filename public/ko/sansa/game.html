<style>
  .sansa-boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:24px; background:#eeece3; color:#4d5144; font-family:Sansa Quiet UI,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; text-align:center; }
  .sansa-boot-mark { display:flex; margin-bottom:6px; color:#8a8068; }
  .sansa-boot-mark svg { width:32px; height:32px; stroke-width:1; }
  .sansa-boot h1 { margin:0; padding-left:5px; font-size:27px; font-weight:500; letter-spacing:5px; }
  .sansa-boot p { margin:0; max-width:28rem; color:#838677; font-size:12px; line-height:1.7; }
  .sansa-boot-dot { width:4px; height:4px; margin-top:18px; background:#a99a7b; border-radius:50%; animation:boot-breathe 1.8s ease-in-out infinite; }
  .sansa-boot-retry { position:absolute; bottom:max(24px,env(safe-area-inset-bottom)); display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 16px; color:#64664f; font-size:13px; text-decoration:underline; text-underline-offset:3px; visibility:hidden; animation:boot-retry 0s 15s forwards; }
  .sansa-boot-retry:focus-visible { outline:2px solid #988762; outline-offset:4px; }
  .sansa-boot.is-error h1 { padding:0; font-size:21px; letter-spacing:0; }
  .sansa-boot.is-error .sansa-boot-dot { display:none; }
  .sansa-boot.is-error .sansa-boot-retry { position:static; visibility:visible; animation:none; }
  @keyframes boot-breathe { 50% { opacity:.25; } }
  @keyframes boot-retry { to { visibility:visible; } }
  @media(prefers-reduced-motion:reduce) { .sansa-boot-dot { animation:none; } }
</style>
</head>

<div id="app">

    <span class="sansa-boot-dot" aria-hidden="true"></span>
    <a class="sansa-boot-retry" href="">다시 들어가기</a>
  </main>
</div>
