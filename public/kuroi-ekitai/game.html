<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex,follow" />
		<link rel="canonical" href="https://egakiba.com/kuroi-ekitai/" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>黒い液体</title>
		<!-- X などに URL を貼った時の紹介カード。画像は本番の場所を指す -->
		<meta
			name="description"
			content="吸収してデカくなれ。3分と15分で遊べるブラウザゲーム"
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://egakiba.com/kuroi-ekitai/" />
		<meta property="og:title" content="黒い液体" />
		<meta
			property="og:description"
			content="吸収してデカくなれ。3分と15分で遊べるブラウザゲーム"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #e8e3d8;
				overflow: hidden;
				overscroll-behavior: none;
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
				font-family:
					'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans',
					'Noto Sans JP', sans-serif;
			}
			/* 中国語の時だけ、日本語用の書体より先に中国語の書体を並べる(lang は言葉を決める script が html に付ける) */
			html[lang='zh-Hans'],
			html[lang='zh-Hans'] body {
				font-family:
					'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'M PLUS Rounded 1c',
					'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP',
					sans-serif;
			}
			body {
				position: fixed;
				inset: 0;
			}
			canvas {
				display: block;
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				touch-action: none;
			}
			[hidden] {
				display: none !important;
			}

			/* ========== HUD ========== */
			.outlined {
				color: #fff;
				font-weight: 900;
				text-shadow:
					2px 0 0 #3a2e26,
					-2px 0 0 #3a2e26,
					0 2px 0 #3a2e26,
					0 -2px 0 #3a2e26,
					1.5px 1.5px 0 #3a2e26,
					-1.5px 1.5px 0 #3a2e26,
					1.5px -1.5px 0 #3a2e26,
					-1.5px -1.5px 0 #3a2e26,
					0 3px 6px rgba(58, 46, 38, 0.35);
			}
			#hud {
				position: absolute;
				inset: 0;
				pointer-events: none;
			}
			.hud-top {
				position: absolute;
				top: calc(env(safe-area-inset-top) + 10px);
				left: 0;
				right: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 2px;
			}
			#timer {
				font-size: clamp(32px, 11vw, 64px);
				line-height: 1;
			}
			#timer.danger {
				color: #ff3b30;
				animation: pulse 1s ease-out infinite;
			}
			@keyframes pulse {
				0% {
					transform: scale(1.25);
				}
				60%,
				100% {
					transform: scale(1);
				}
			}
			/* 合計量は画面の右上(切り欠きの余白の内側)に置く。吸った数字がここへ飛んで吸い込まれる。
			   長い数字は JS が文字数から見積もった幅で transform の縮みを掛け、残り時間とぶつけない */
			#liters {
				position: absolute;
				top: calc(env(safe-area-inset-top) + 10px);
				right: calc(env(safe-area-inset-right) + 12px);
				font-size: clamp(18px, 6vw, 34px);
				line-height: 1.1;
				white-space: nowrap;
				transform-origin: 100% 50%;
				will-change: transform;
			}
			#liters .unit {
				font-size: 0.6em;
				margin-left: 0.15em;
			}
			/* 吸われて減っている間は、増える時と区別できるよう赤く震わせる */
			#liters.losing #liters-num {
				display: inline-block;
				color: #ff5a4f;
				animation: shake 0.12s linear infinite;
			}
			@keyframes shake {
				0%,
				100% {
					transform: translate(0, 0);
				}
				25% {
					transform: translate(-2px, 1px);
				}
				50% {
					transform: translate(2px, -1px);
				}
				75% {
					transform: translate(-1px, -1px);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#liters.losing #liters-num {
					animation: none;
				}
			}
			/* 自分が吸われている間、画面の縁を赤くして危険を伝える */
			#danger {
				position: absolute;
				inset: 0;
				opacity: 0;
				background: radial-gradient(
					ellipse at center,
					rgba(220, 30, 30, 0) 55%,
					rgba(220, 30, 30, 0.55) 100%
				);
			}
			#drinkable {
				margin-top: 4px;
				font-size: clamp(11px, 3.2vw, 15px);
			}
			/* 大きさの段(量が 2 倍ごと)の進み具合。上の表示はあまり見られないので画面の下に、少し太く置く */
			#size-gauge {
				position: absolute;
				left: 50%;
				bottom: calc(env(safe-area-inset-bottom) + 14px);
				transform: translateX(-50%);
				width: min(40vw, 200px);
				height: 12px;
				border-radius: 7px;
				background: rgba(29, 26, 23, 0.25);
				border: 1.5px solid #1d1a17;
				overflow: hidden;
			}
			#progress-fill {
				height: 100%;
				width: 0;
				background: #1d1a17;
				transition: width 0.25s ease-out;
			}
			#next {
				font-size: clamp(10px, 2.9vw, 13px);
			}
			#hint .hint-rule {
				margin-top: 6px;
				font-size: 0.78em;
			}

			/* ========== 吸った量の数字(+◯L) ========== */
			#pops {
				position: absolute;
				inset: 0;
				overflow: hidden;
			}
			.pop {
				position: absolute;
				left: 0;
				top: 0;
				line-height: 1;
				white-space: nowrap;
				will-change: transform, opacity;
			}
			.pop.loss {
				color: #ff5a4f;
			}
			/* 成長促進剤が効いている間に床の液体から増えた分 */
			.pop.boost {
				color: #8dff9c;
			}
			/* 画面の外にあるアイテム(巨大化・触手の嵐・成長促進剤)と大きな水たまりの方向を、画面の端に出す印。
			   見た目は種類ごとの絵(assets/icons/)。位置と向きは JS が transform で、出し消しと濃さは opacity で動かす。
			   大きさも明るさも一定にする(脈打たせるとチカチカして見えたため) */
			.pointer {
				position: absolute;
				left: 0;
				top: 0;
				width: 56px;
				height: 56px;
				margin: -28px 0 0 -28px;
				opacity: 0;
				pointer-events: none;
				will-change: transform, opacity;
			}
			.pointer-img {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}
			/* 対象の方を向いた小さな矢印。絵の外側に置き、印の中心を軸に回す。白に暗い縁で、どの背景でも見えるようにする */
			.pointer-arrow {
				position: absolute;
				left: 54px;
				top: 21px;
				width: 0;
				height: 0;
				border-top: 7px solid transparent;
				border-bottom: 7px solid transparent;
				border-left: 10px solid #fff;
				filter: drop-shadow(0 0 1px #1d1a17) drop-shadow(0 0 1px #1d1a17);
				/* 印の中心(28px, 28px)を軸に回す */
				transform-origin: -26px 7px;
				will-change: transform;
			}
			/* 安全な余白の内側の枠を読むための見えない箱(画面の大きさが変わった時だけ読む) */
			#safe-probe {
				position: absolute;
				top: env(safe-area-inset-top);
				right: env(safe-area-inset-right);
				bottom: env(safe-area-inset-bottom);
				left: env(safe-area-inset-left);
				visibility: hidden;
				pointer-events: none;
			}
			.item-timer {
				display: flex;
				align-items: center;
				gap: 6px;
				margin-top: 2px;
				font-size: clamp(11px, 3.2vw, 14px);
			}
			.item-bar {
				display: block;
				width: min(24vw, 110px);
				height: 8px;
				border: 1.5px solid #1d1a17;
				border-radius: 5px;
				background: rgba(29, 26, 23, 0.25);
				overflow: hidden;
			}
			.item-fill {
				display: block;
				height: 100%;
				width: 100%;
			}
			.item-timer.giant .item-fill {
				background: #f2a516;
			}
			.item-timer.boost .item-fill {
				background: #3ccf5a;
			}
			.item-timer.storm .item-fill {
				background: #7a3cff;
			}
			#hint {
				position: absolute;
				left: 0;
				right: 0;
				/* どの幅でも左右からはみ出さないよう、内側に余白を取って折り返す */
				padding: 0 calc(env(safe-area-inset-right) + 16px) 0
					calc(env(safe-area-inset-left) + 16px);
				overflow-wrap: anywhere;
				bottom: calc(env(safe-area-inset-bottom) + 9vh);
				bottom: calc(env(safe-area-inset-bottom) + 9dvh);
				text-align: center;
				font-size: clamp(16px, 5vw, 24px);
				transition: opacity 0.4s;
			}
			#toast {
				position: absolute;
				left: 0;
				right: 0;
				top: 58%;
				text-align: center;
				font-size: clamp(14px, 4.4vw, 20px);
				opacity: 0;
			}
			#toast.show {
				animation: toast 0.9s ease-out;
			}
			@keyframes toast {
				0% {
					opacity: 1;
					transform: translateY(6px);
				}
				70% {
					opacity: 1;
					transform: translateY(0);
				}
				100% {
					opacity: 0;
				}
			}

			/* ========== 叩きつける文字 ========== */
			.slam {
				position: absolute;
				left: 0;
				right: 0;
				top: 40%;
				text-align: center;
				pointer-events: none;
				opacity: 0;
			}
			.slam.show {
				animation: slam 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
			}
			@keyframes slam {
				0% {
					opacity: 0;
					transform: scale(2.4);
				}
				12% {
					opacity: 1;
					transform: scale(0.92);
				}
				20% {
					transform: scale(1);
				}
				80% {
					opacity: 1;
					transform: scale(1);
				}
				100% {
					opacity: 0;
					transform: scale(1);
				}
			}
			.slam .big {
				font-size: clamp(34px, 11vw, 64px);
				line-height: 1.15;
			}
			.slam .sub {
				font-size: clamp(16px, 5.2vw, 28px);
				margin-top: 4px;
			}
			#finish.show {
				animation-duration: 1.4s;
			}
			/* 段アップは最後に 0.45 秒かけてゆっくり薄くなって消える。叩きつける文字の消え方は 0.24 秒で、
			   しかも始めに一気に薄くなる速さの付け方だったため、別に用意する。長さは JS の LEVELUP_SHOW_SECONDS と揃える(危険度アップのお知らせも同じ) */
			.notice.show {
				animation: levelup 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
			}
			/* 文字の大きさは画面の短い辺で決める。横画面は体の下とゲージの間が狭く、横幅で決めると体かゲージに重なったため
			   (縦画面では短い辺が横幅なので大きさは変わらない) */
			.notice .big {
				font-size: clamp(34px, 11vmin, 64px);
			}
			.notice .sub {
				font-size: clamp(16px, 5.2vmin, 28px);
			}
			@keyframes levelup {
				0% {
					opacity: 0;
					transform: scale(2.4);
				}
				9% {
					opacity: 1;
					transform: scale(0.92);
				}
				15% {
					transform: scale(1);
				}
				72% {
					opacity: 1;
					transform: translateY(0) scale(1);
					animation-timing-function: ease-in-out;
				}
				100% {
					opacity: 0;
					transform: translateY(-10px) scale(1);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.notice.show {
					animation-name: levelup-fade;
				}
			}
			@keyframes levelup-fade {
				0% {
					opacity: 0;
				}
				9% {
					opacity: 1;
				}
				72% {
					opacity: 1;
					animation-timing-function: ease-in-out;
				}
				100% {
					opacity: 0;
				}
			}

			/* ========== 仮想スティックの印 ========== */
			.stick {
				position: absolute;
				border-radius: 50%;
				pointer-events: none;
				transform: translate(-50%, -50%);
			}
			#stick-base {
				width: 120px;
				height: 120px;
				border: 2px solid rgba(29, 26, 23, 0.35);
				background: rgba(29, 26, 23, 0.08);
			}
			#stick-knob {
				width: 40px;
				height: 40px;
				background: rgba(29, 26, 23, 0.4);
			}

			/* ========== タイトルと結果 ========== */
			.screen {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: space-between;
				padding: calc(env(safe-area-inset-top) + 9vh)
					calc(env(safe-area-inset-right) + 16px)
					calc(env(safe-area-inset-bottom) + 4vh)
					calc(env(safe-area-inset-left) + 16px);
				padding: calc(env(safe-area-inset-top) + 9dvh)
					calc(env(safe-area-inset-right) + 16px)
					calc(env(safe-area-inset-bottom) + 4dvh)
					calc(env(safe-area-inset-left) + 16px);
				box-sizing: border-box;
				text-align: center;
				color: #2b2622;
				background: linear-gradient(
					to bottom,
					rgba(232, 227, 216, 0.85),
					rgba(232, 227, 216, 0) 38%,
					rgba(232, 227, 216, 0) 62%,
					rgba(232, 227, 216, 0.9)
				);
			}
			.screen h1 {
				margin: 0;
				font-size: clamp(48px, 17vw, 96px);
				font-weight: 900;
				letter-spacing: 0.04em;
				line-height: 1;
			}
			.screen .lead {
				margin: 10px 0 0;
				font-size: clamp(16px, 4.8vw, 24px);
				font-weight: 800;
			}
			/* 英語の名前は日本語の 3 倍の字数なので、同じ大きさだと縦画面で 2 行に折れる */
			html[lang='en'] .screen h1 {
				font-size: clamp(40px, 12vw, 88px);
			}
			/* 言葉の切り替え。遊び方のボタンの下に置き、Tab でも遊び方が先に選ばれるようにする。
			   指で押しやすい高さ 44px 以上にし、選んでいる言葉は塗りつぶす */
			.langs {
				display: flex;
				justify-content: center;
				gap: 8px;
			}
			.lang {
				appearance: none;
				min-width: 72px;
				min-height: 44px;
				padding: 0 12px;
				border: 2px solid #1d1a17;
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.85);
				color: #2b2622;
				font: inherit;
				font-size: 15px;
				font-weight: 900;
				cursor: pointer;
			}
			.lang[aria-pressed='true'] {
				background: #2b2622;
				color: #fff;
			}
			.lang:focus-visible {
				outline: 3px solid #2563eb;
				outline-offset: 3px;
			}
			.screen .bottom {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
				width: 100%;
			}
			.btn {
				appearance: none;
				border: 0;
				border-radius: 999px;
				padding: 14px 0;
				width: min(72vw, 320px);
				font: inherit;
				font-size: clamp(18px, 5.4vw, 24px);
				font-weight: 900;
				color: #fff;
				background: radial-gradient(
					ellipse at 35% 25%,
					#4a4038 0%,
					#2b2622 55%,
					#1d1a17 100%
				);
				box-shadow:
					0 6px 0 #1d1a17,
					0 10px 20px rgba(0, 0, 0, 0.25);
				cursor: pointer;
			}
			.btn:active {
				transform: translateY(4px);
				box-shadow:
					0 2px 0 #1d1a17,
					0 4px 10px rgba(0, 0, 0, 0.25);
			}
			.btn.sub {
				background: #fff;
				color: #2b2622;
				box-shadow:
					0 6px 0 #1d1a17,
					0 10px 20px rgba(0, 0, 0, 0.15);
				border: 2px solid #1d1a17;
			}
			/* 画像の保存はリンク(a)なので、ボタンと同じ箱の形にそろえる */
			#save-image {
				display: block;
				box-sizing: border-box;
				text-decoration: none;
			}
			#save-image[hidden] {
				display: none;
			}
			/* 「Xでシェア」と「画像で共有(保存)」は左右に並べ、ボタンの段を増やさない(狭い縦画面で下のボタンが画面の外へ出たため)。
			   幅が狭い画面で英語の文が 2 行に折れて並びだけ背が高くならないよう、文字は少し小さくして 1 行に収める */
			.share-row {
				display: flex;
				justify-content: center;
				gap: 10px;
				width: min(72vw, 320px);
			}
			.share-row .btn {
				flex: 1 1 0;
				width: auto;
				font-size: clamp(15px, 4.6vw, 24px);
				white-space: nowrap;
			}
			.credit {
				font-size: 11px;
				color: rgba(43, 38, 34, 0.7);
			}
			.credit a {
				color: inherit;
			}
			#result-reason {
				margin-bottom: 10px;
				font-size: clamp(18px, 5.6vw, 28px);
				font-weight: 900;
			}
			#result-liters {
				--result-font-size: clamp(40px, 13vw, 80px);
				font-size: var(--result-font-size);
				font-weight: 900;
				line-height: 1.05;
				/* 量は 1 行に収める(長い時は JS が文字を縮める) */
				white-space: nowrap;
				/* 量の数字だけ、体の縁の紫に合わせた濃い紫にする(「まで育った」は元の色のまま) */
				color: #5b2fd6;
			}
			#result-liters small {
				color: #2b2622;
				display: block;
				font-size: 0.42em;
				margin-top: 6px;
			}
			#result-title {
				margin-top: 14px;
				font-size: clamp(18px, 5.6vw, 28px);
				font-weight: 900;
			}
			#result-compare {
				margin-top: 8px;
				font-size: clamp(15px, 4.6vw, 22px);
				font-weight: 900;
			}
			/* 結果の文字の後ろに砂色の半透明の板を敷き、後ろの大きな体と重なっても読めるようにする */
			#result-screen > div:first-child {
				padding: 14px 20px;
				border-radius: 18px;
				background: rgba(232, 227, 216, 0.88);
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
			}
			#result-mode {
				margin-bottom: 6px;
				font-size: clamp(14px, 4.2vw, 18px);
				font-weight: 800;
			}
			#result-extra {
				margin-top: 10px;
				font-size: clamp(13px, 3.8vw, 16px);
				font-weight: 800;
				line-height: 1.5;
			}
			#result-extra .new {
				color: #c2410c;
			}
			/* 最初の画面のモード選び: 指で押しやすい大きさの 2 つを左右に並べる */
			.modes {
				display: flex;
				justify-content: center;
				gap: 12px;
				width: 100%;
			}
			.btn.mode {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 4px;
				width: min(44vw, 240px);
				min-height: 84px;
				padding: 12px 8px;
				border-radius: 20px;

			// 英語は 3 桁ごとの単位(million〜vigintillion)で上から 3 桁にする。英語では「1.36 billion」の小数が普通なので、

				['quadrillion', 1e15],
				['quintillion', 1e18],
				['sextillion', 1e21],

				['tredecillion', 1e42],
				['quattuordecillion', 1e45],
				['quindecillion', 1e48],
				['sexdecillion', 1e51],
				['septendecillion', 1e54],
				['octodecillion', 1e57],
				['novemdecillion', 1e60],

			function countText(n) {

				return lang === 'en' ? bigAmountEn(n) : bigAmount(n)

				const names = BIG_UNIT_NAMES[lang]
				const last = BIG_UNIT_VALUES.length - 1
				if (l * (1 + 1e-12) >= BIG_UNIT_VALUES[last] * 1e4)
					return bigAmount(l / BIG_UNIT_VALUES[last]) + names[last]
				let i = last
				// 掛け算の誤差で 1e40 が少しだけ小さくなっても、1 つ下の単位(10,000澗)にしない
				while (i > 0 && l * (1 + 1e-12) < BIG_UNIT_VALUES[i]) i--
				const name = names[i]
				const unit = BIG_UNIT_VALUES[i]
				const lead = l / unit
				const locale = NUMBER_LOCALES[lang]
				if (lead >= 10)
					return Math.floor(lead * (1 + 1e-12)).toLocaleString(locale) + name
				const top3 = Math.floor((l / (unit / 100)) * (1 + 1e-12))
				const rest = (top3 % 100) * 100

				if (rest === 0) return head
				return `${head}${rest.toLocaleString(locale)}${i === 0 ? '' : names[i - 1]}`

			function makeSynthBus(ctx, destination) {
				const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate)
				const nd = noise.getChannelData(0)
				for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1

				const irLen = Math.round(ctx.sampleRate * 0.6)
				const ir = ctx.createBuffer(2, irLen, ctx.sampleRate)
				for (let c = 0; c < 2; c++) {
					const d = ir.getChannelData(c)
					for (let i = 0; i < irLen; i++)

				limiter.threshold.value = -10
				limiter.knee.value = 6
				limiter.ratio.value = 8

				limiter.release.value = 0.15

				out.gain.value = SE_VOLUME

				wet.gain.value = 0.5
				reverb.connect(wet).connect(out)

				gain.gain.value = volume
				gain.connect(dest)

			function envelope(v, t, { attack, decay, peak, hold = 0, holdTo = 1 }) {

				v.end = Math.max(v.end, t + attack + hold + decay)
				return g
			}

			function bubble(v, dest, t, opts) {

				osc.type = opts.type ?? 'sine'
				osc.frequency.setValueAtTime(opts.f0, t)
				osc.frequency.exponentialRampToValueAtTime(opts.f1, t + opts.glide)
				const env = envelope(v, t, opts)
				osc.connect(env).connect(dest)
				osc.start(t)
				osc.stop(t + opts.attack + (opts.hold ?? 0) + opts.decay + 0.02)
				return osc
			}

				filter.type = opts.type ?? 'bandpass'

				filter.frequency.setValueAtTime(opts.freq, t)
				if (opts.freqEnd)

				filter.Q.value = opts.q
				const env = envelope(v, t, opts)
				src.connect(filter).connect(env).connect(dest)

				src.stop(t + len + 0.02)
				return env

						f1: 1500 * r,
						glide: 0.12 * k,
						attack: 0.005,
						hold: 0.03,
						decay: 0.25 * k,
						peak: 0.1,
					})
					reverbSend(v, 0.15)
				},
				// アイテムを飲んだ時・開始: 「ぽちゃん」。明るい水しぶきの粒 5 つと、1,000〜2,000Hz の短い水の音。
				// 長さ 780ms・一番大きい所 90ms・消え方 310ms・重心 5,800Hz・高さは横ばい
				item(v, t, r, k) {
					// 水しぶきの下地(粒の間も途切れない)
					noiseBurst(v, v.gain, t, {
						freq: 3500 * r,
						q: 0.7,
						attack: 0.005,
						hold: 0.08,
						holdTo: 0.6,
						decay: 0.3 * k,
						peak: 0.35,
					})
					splashGrains(v, t, [0, 0.09, 0.21, 0.28, 0.33, 0.45, 0.56], {
						freq: 4000 * r,
						q: 0.7,
						decay: 0.07,
						peak: [0.7, 1, 0.3, 0.25, 0.2, 0.025, 0.02],
						k,
					})
					// 水の音は 1,000Hz から 2,000Hz へ上がっていく
					for (const [at, f] of [
						[0.1, 1000],
						[0.3, 1950],
					])
						bubble(v, v.gain, t + at * k, {
							f0: f * r,
							f1: f * 1.05 * r,
							glide: 0.03,
							attack: 0.004,
							decay: 0.08,
							peak: 0.3,

						freq: 4000 * r,
						q: 0.7,
						attack: 0.01,
						decay: 1.6 * k,
						peak: 0.015,
					})
				},
				// 触手の嵐を飲んだ時: 「ぽちゃん」の後の水の音が少しうねる
				itemStorm(v, t, r, k) {
					SYNTH.item(v, t, r, k)
					const wob = bubble(v, v.gain, t + 0.12 * k, {
						f0: 1200 * r,
						f1: 1250 * r,
						glide: 0.2,
						attack: 0.01,
						hold: 0.08,
						decay: 0.1,
						peak: 0.03,
					})
					const lfo = track(v, v.ctx.createOscillator())
					lfo.frequency.value = 9
					const depth = track(v, v.ctx.createGain())
					depth.gain.value = 120 * r
					lfo.connect(depth).connect(wob.frequency)
					lfo.start(t)
					lfo.stop(t + 0.35 * k)
				},
				// 開始: アイテムと同じ「ぽちゃん」を少し明るく
				start(v, t, r, k) {
					SYNTH.item(v, t, r * 1.08, k)
				},
				// 残り時間: ごく短い水滴「ぴっ」。長さ 40ms・重心 3,200Hz で上がる・高さははっきりしない
				tick(v, t, r, k) {
					noiseBurst(v, v.gain, t, {
						freq: 2600 * r,
						freqEnd: 3600 * r,
						q: 6,
						type: 'lowpass',
						attack: 0.002,
						decay: 0.035 * k,
						peak: 1,
					})
					// すぐ消えた後の、ごく小さな余韻(-24dB ほど)
					noiseBurst(v, v.gain, t + 0.012, {
						freq: 3000 * r,
						q: 6,
						type: 'lowpass',
						attack: 0.004,
						decay: 0.04,
						peak: 0.09,
					})
				},
				// 結果画面: 水しぶき「ばしゃっ」。明るい雑音が 70ms ほどで一段下がってからゆっくり消え、途中で粒が 7 つはねる。
				// 長さ 800ms・消え方 590ms・重心 5,800Hz・高さははっきりしない
				result(v, t, r, k) {
					noiseBurst(v, v.gain, t, {
						freq: 2800 * r,
						q: 0.6,
						attack: 0.012,
						hold: 0.07,
						holdTo: 0.3,
						decay: 1.3 * k,
						peak: 0.8,
					})
					splashGrains(v, t, [0.15, 0.24, 0.32, 0.4, 0.48, 0.56, 0.66], {
						freq: 3500 * r,
						q: 0.8,
						decay: 0.025,
						peak: [1.4, 1.3, 1.1, 0.9, 0.7, 0.6, 0.5],
						k,
					})

			}
			// 1 回ぶんの音を組み立てて鳴らし、鳴り終わったら部品を片付ける。鳴らした時は鳴り終わる時刻を返す
			function buildSound(bus, dest, name, t, { rate = 1, volume = 1 } = {}) {
				const v = makeVoice(bus, dest, volume * (SOUND_GAIN[name] ?? 1))
				// 同じ音の繰り返しに聞こえないよう、高さと長さを毎回少し揺らす
				SYNTH[name](v, t, rate * rand(0.94, 1.06), rand(0.9, 1.1))
				return v
			}
			function initAudio() {
				const AudioCtx = window.AudioContext || window.webkitAudioContext
				if (!AudioCtx) return
				audio.ctx = new AudioCtx()
				audio.bus = makeSynthBus(audio.ctx, audio.ctx.destination)
				audio.master = audio.bus.out
				loadSlurp()
			}
			function unlockAudio() {
				if (
					audio.ctx &&
					audio.ctx.state !== 'running' &&
					audio.ctx.state !== 'closed'

				}

			// key: 同時に鳴らす数と間隔を数える組(省けば name)
			// 鳴らさない音。試しで外した物をここに並べる
			const MUTED_SOUNDS = new Set(['big', 'levelup'])
			function playSound(
				name,
				{ rate = 1, volume = 1, maxVoices = 3, minGap = 0.04, key = name } = {},
				dest = null,
			) {
				// 発注者が「ペシ」と聞こえるとして外した音(大きく吸う音。30 秒で 10 回と一番よく鳴り、出だしが乾いている)
				if (MUTED_SOUNDS.has(name)) return
				const { ctx } = audio
				if (!ctx || ctx.state !== 'running') return
				const now = ctx.currentTime
				if (now - (audio.lastAt[key] ?? -1) < minGap) return
				const voices = (audio.voices[key] ??= [])
				if (voices.length >= maxVoices || audio.playing >= CAP.voices) return
				const v = buildSound(audio.bus, dest ?? audio.master, name, now, {
					rate,
					volume,
				})
				voices.push(v)
				audio.playing++
				audio.lastAt[key] = now
				if (DEBUG) audio.played.push(name)
				// 鳴り終わる時刻に止まる小さな部品で、片付けの時を知る
				const done = ctx.createConstantSource()
				done.start(now)
				done.stop(v.end + 0.05)
				done.onended = () => {
					audio.playing--
					const i = voices.indexOf(v)
					if (i >= 0) voices.splice(i, 1)
					for (const n of v.nodes) n.disconnect()
					done.disconnect()
				}
			}
			// たくさん吸っている間(2 本以上、または大きな水たまり)は、効果音ラボの「水ぶくぶく1」の録音を 1 本だけ途切れず繰り返す。
			// 合成の泡では発注者の「コボコボした音なんで消すの？」とあったので、この場面だけ録音に戻した。
			// 音量は吸っている本数で上げ、吸い終わったら約 0.25 秒で小さくして止める
			const SLURP_FILE = 'assets/se/water-bukubuku1.mp3'
			const SLURP_FADE = 0.08
			function slurpLinks() {
				// 「おわる」の確かめで止めている間も鳴らさない
				if (state !== 'play' || body.dead || paused) return 0
				const n = body.links.length
				return n >= 2 || body.links.some((l) => l.pool) ? n : 0
			}
			// 録音を読み込む。読めなくてもゲームは止めず、この音が鳴らないだけにする
			function loadSlurp() {
				fetch(SLURP_FILE)
					.then((res) => res.arrayBuffer())
					.then((buf) => audio.ctx.decodeAudioData(buf))
					.then((decoded) => {
						audio.slurpBuffer = decoded
					})
					.catch(() => {})
			}
			function updateSlurp() {
				const { ctx } = audio
				const buffer = audio.slurpBuffer
				if (!ctx || !buffer || ctx.state !== 'running') return
				const n = slurpLinks()
				const target = n > 0 ? Math.min(1, 0.4 + 0.1 * n) * SOUND_GAIN.slurp : 0
				const now = ctx.currentTime
				let loop = audio.loop
				if (!loop) {
					if (target <= 0) return
					const src = ctx.createBufferSource()
					src.buffer = buffer
					src.loop = true
					const gain = ctx.createGain()
					gain.gain.value = 0
					src.connect(gain).connect(audio.master)
					src.start()
					audio.playing++
					loop = audio.loop = { src, gain, target: -1, silentAt: 0 }
				}
				if (target !== loop.target) {
					loop.target = target
					loop.gain.gain.setTargetAtTime(target, now, SLURP_FADE)
					if (target <= 0) {
						loop.silentAt = now + SLURP_FADE * 3
						// 音を出す機器が無い環境などで音の時計(currentTime)が進まない時も止まるよう、普段の時計でも数える
						loop.silentAtMs = performance.now() + SLURP_FADE * 3000
					}
				}
				if (
					target <= 0 &&
					(now >= loop.silentAt || performance.now() >= loop.silentAtMs)
				) {
					loop.src.stop()
					loop.src.disconnect()
					loop.gain.disconnect()
					audio.playing--
					audio.loop = null
				}
			}
			// 確認用: 音を書き出して数値を測るため、同じ作り方で OfflineAudioContext に鳴らして波形を返す
			async function renderSoundOffline(name, opts = {}, seconds = 1.5) {
				const ctx = new OfflineAudioContext(
					1,
					Math.round(44100 * seconds),
					44100,
				)
				const bus = makeSynthBus(ctx, ctx.destination)
				buildSound(bus, bus.out, name, 0.1, opts)
				const buf = await ctx.startRendering()
				return Array.from(buf.getChannelData(0))
			}

			/* ========== 描画の土台 ========== */
			const BG_COLOR = 0xe8e3d8
			const canvas = $('game')
			const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
			renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
			renderer.setSize(window.innerWidth, window.innerHeight, false)

			const scene = new THREE.Scene()
			scene.background = new THREE.Color(BG_COLOR)
			scene.fog = new THREE.Fog(BG_COLOR, 10, 30)

			const camera = new THREE.PerspectiveCamera(
				50,
				window.innerWidth / window.innerHeight,
				0.1,
				400,
			)

			// 黒いツヤは周りの映り込みで決まるので、部屋の環境光を入れる
			const pmrem = new THREE.PMREMGenerator(renderer)
			const roomEnv = new RoomEnvironment()
			scene.environment = pmrem.fromScene(roomEnv, 0.04).texture

			pmrem.dispose()

			const sun = new THREE.DirectionalLight(0xffffff, 0.9)

			scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc8b8, 0.35))

			/* ========== 地面と影 ========== */
			function makeGroundTexture() {
				const size = 512
				const c = document.createElement('canvas')
				c.width = c.height = size
				const g = c.getContext('2d')
				g.fillStyle = '#ddd8cc'
				g.fillRect(0, 0, size, size)
				for (let i = 0; i < 2500; i++) {
					g.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,255,255'},${rand(0.02, 0.06)})`
					g.fillRect(
						Math.random() * size,
						Math.random() * size,
						rand(1, 3),
						rand(1, 3),
					)
				}
				// 1 タイル = 10 単位。1 単位ごとの細線と 10 単位ごとの太線
				const step = size / 10
				g.fillStyle = 'rgba(60,52,40,0.2)'
				for (let i = 1; i < 10; i++) {
					g.fillRect(i * step - 1, 0, 2, size)
					g.fillRect(0, i * step - 1, size, 2)
				}
				g.fillStyle = 'rgba(60,52,40,0.38)'
				g.fillRect(0, 0, 5, size)
				g.fillRect(0, 0, size, 5)
				const tex = new THREE.CanvasTexture(c)
				tex.colorSpace = THREE.SRGBColorSpace
				tex.wrapS = tex.wrapT = THREE.RepeatWrapping
				tex.anisotropy = renderer.capabilities.getMaxAnisotropy()
				return tex
			}
			const GROUND_SIZE = 2000
			const groundTex = makeGroundTexture()
			// 地面は光を受けない色づけにして、明るい背景でも格子が白飛びしないようにする。
			// 結果画面だけ、届いた称号に合う景色の絵(tScene)を地面いっぱいに重ねる(uSceneMix で出す)。
			// 景色は霧を掛けずに重ねる(砂色の霧が掛かると宇宙の絵がかすんだため)。uSceneTile は絵 1 枚の広さ、uSceneAnchor は絵の中心を画面の中心に合わせる量
			const groundMaterial = new THREE.ShaderMaterial({
				uniforms: {
					...THREE.UniformsLib.fog,
					tGrid: { value: groundTex },
					tScene: { value: null },
					uSceneMix: { value: 0 },
					uGrid: { value: 10 },
					uSceneTile: { value: 10 },
					uSceneAnchor: { value: new THREE.Vector2() },
				},
				vertexShader: /* glsl */ `
					varying vec3 vWorld;
					#include <fog_pars_vertex>
					void main() {
						vec4 wp = modelMatrix * vec4(position, 1.0);
						vWorld = wp.xyz;
						vec4 mvPosition = viewMatrix * wp;
						gl_Position = projectionMatrix * mvPosition;
						#include <fog_vertex>
					}
				`,
				fragmentShader: /* glsl */ `
					uniform sampler2D tGrid;
					uniform sampler2D tScene;
					uniform float uSceneMix;
					uniform float uGrid;
					uniform float uSceneTile;
					uniform vec2 uSceneAnchor;
					varying vec3 vWorld;
					#include <fog_pars_fragment>
					void main() {
						gl_FragColor = vec4(texture2D(tGrid, vWorld.xz / uGrid).rgb, 1.0);
						#include <colorspace_fragment>
						#include <fog_fragment>
						if (uSceneMix > 0.0) {
							vec2 u = (vWorld.xz + uSceneAnchor) / uSceneTile;
							vec4 img = linearToOutputTexel(vec4(texture2D(tScene, u).rgb, 1.0));
							gl_FragColor.rgb = mix(gl_FragColor.rgb, img.rgb, uSceneMix);
						}
					}

			const ground = new THREE.Mesh(
				new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE),
				groundMaterial,

			ground.rotation.x = -Math.PI / 2
			scene.add(ground)
			const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0)
			// 地面はカメラについていき、映る範囲より広く敷く。格子が動いて見えないよう、置く位置は格子の大きさの倍数にし、
			// 広げる時は整数倍にして格子の大きさを保つ(地面が原点に 1 枚だけだと、遠くへ進むと地面が無くなった)。
			// 格子の大きさは最初 10。世界を縮め直すたびに同じ割合で縮め、体との大きさの比を保つ
			let groundScale = 1
			let gridSize = 10

				const want = Math.max(
					1,
					Math.ceil((cam.viewRange * 2.5) / (GROUND_SIZE / 2)),

					groundScale = want
					ground.scale.set(groundScale, groundScale, 1)

				ground.position.set(
					Math.round(cam.x / gridSize) * gridSize,
					0,
					Math.round(cam.z / gridSize) * gridSize,
				)
			}

			function makeRadialTexture(stops) {
				const size = 128
				const c = document.createElement('canvas')
				c.width = c.height = size
				const g = c.getContext('2d')
				const grad = g.createRadialGradient(
					size / 2,
					size / 2,
					0,
					size / 2,
					size / 2,
					size / 2,

				for (const [at, color] of stops) grad.addColorStop(at, color)

				g.fillRect(0, 0, size, size)
				const tex = new THREE.CanvasTexture(c)
				tex.colorSpace = THREE.SRGBColorSpace
				return tex

			const shadowMaterial = new THREE.MeshBasicMaterial({
				map: makeRadialTexture([
					[0, 'rgba(20,16,10,0.5)'],
					[0.5, 'rgba(20,16,10,0.25)'],

			// 床の液体の接地の影: 縁のすぐ外側にうっすら暗い輪を落とし、床に開いた穴ではなく床に乗った液に見せる。
			// かけらは画面に 40 個前後あるので、1 つのまとめ描き(インスタンス)で描く
			const FLOOR_SHADOW_MAX = 400

			const floorShadows = new THREE.InstancedMesh(

					map: makeRadialTexture([

				floorShadows.setMatrixAt(floorShadows.count++, floorShadowMatrix)

			// 相手役の足元の印: 吸える相手はうっすら緑、自分を吸える相手は赤く脈打つ
			function makeMarkMaterial(rgb, alpha) {

					depthWrite: false,

			const edibleMarkMaterial = makeMarkMaterial('60,200,100', 0.7)
			const dangerMarkMaterial = makeMarkMaterial('235,50,40', 0.8)
			function makeMark() {

				m.position.y = 0.016
				m.renderOrder = 2
				m.visible = false

			/* ========== 液体の色づけ(体・管・水たまり・入れ物の液面で共通) ========== */
			// 映り込みは環境の絵に頼らず、反射の向きから空(上・明るい段)と地面(下・暗い段)の色を段で引くトゥーン調にする
			const liquidUniforms = {
				uFogColor: { value: scene.fog.color },
				uFogRange: { value: new THREE.Vector2(10, 30) },
				uCamDir: { value: new THREE.Vector3(0, -1, 0) },
				uViewProj: { value: new THREE.Matrix4() },
				// 距離 1 での 1 画素の大きさ。輪郭線の幅と、表面に当たったとみなす近さに使う
				uPixel: { value: 0.001 },
				uEdgePx: { value: 1.5 },
				// 場面の時間。大きな水たまりの液面を管の方へ流れる波に使う
				uTime: { value: 0 },
			}
			const LIQUID_SHADE_GLSL = /* glsl */ `
				uniform vec3 uFogColor;
				uniform vec2 uFogRange;
				uniform vec3 uCamDir;
				const vec3 LIGHT_KEY = vec3(-0.36, 0.78, 0.51);
				const vec3 LIGHT_SUB = vec3(0.62, 0.38, 0.69);
				// 床の液の上面に映る明かり。上を向いた面に映る向き(画面の中央より少し左下)に置く
				const vec3 LIGHT_TOP = vec3(-0.18, 0.84, -0.5);
				const vec3 OUTLINE = vec3(0.004, 0.003, 0.008);
				// onFloor は床に溜まった液(1)か、それ以外(0)か
				vec3 liquidShade(vec3 n, vec3 v, vec3 wp, float onFloor) {
					float f = 1.0 - clamp(dot(n, v), 0.0, 1.0);
					vec3 r = reflect(-v, n);
					vec3 env = mix(vec3(0.03, 0.026, 0.022), vec3(0.15, 0.135, 0.115), smoothstep(-0.32, -0.28, r.y));
					env = mix(env, vec3(0.42, 0.4, 0.37), smoothstep(0.1, 0.14, r.y));
					env = mix(env, vec3(0.9, 0.88, 0.84), smoothstep(0.52, 0.56, r.y));
					// 映り込みの強さも段にする。正面はほぼ黒く、斜めになるほど映る
					float amt = 0.025 + 0.15 * smoothstep(0.38, 0.42, f) + 0.4 * smoothstep(0.6, 0.64, f);
					// 床の液の上面だけは段を付けず、滑らかに空を映す。段が平らな面の途中に出ると、穴や盛り上がりに見えたため。
					// 丸く盛り上がった縁は体と同じ段・紫の光・輪郭線にして、体と同じ物に見せる
					float top = onFloor * smoothstep(0.8, 0.94, n.y);
					amt = mix(amt, 0.02 + 0.22 * smoothstep(0.2, 0.75, f), top);
					env = mix(env, mix(vec3(0.42, 0.4, 0.37), vec3(0.9, 0.88, 0.84), smoothstep(0.35, 0.85, r.y)), top);
					vec3 col = vec3(0.0015, 0.0015, 0.002) + env * amt;
					float key = dot(r, normalize(LIGHT_KEY));
					col += 0.22 * smoothstep(0.93, 0.936, key) + 0.78 * smoothstep(0.982, 0.986, key);
					col += 0.7 * smoothstep(0.991, 0.994, dot(r, normalize(LIGHT_SUB)));

					float curved = smoothstep(0.9995, 0.996, n.y);
					col += top * curved * 0.85 * smoothstep(0.996, 0.9975, dot(r, normalize(LIGHT_TOP)));

					vec3 irid = 0.5 + 0.5 * cos(6.2831853 * (vec3(0.0, 0.33, 0.67) + f * 2.4 + wp.y * 0.35));

			`

			const templates = []
			function templateFor(stage) {

			/* ========== 液体の形(SDF をレイマーチングで描く) ========== */
			// 液体ごとに包む箱を 1 つ置き、その箱に映る画素だけで、その液体の部品(球とカプセル)が作る表面を探す。
			// 部品は「列」にまとめ、列の中は普通の min(つなぎ目が膨らんで節に見えない)、列同士は smooth min で溶け合わせる
			const SDF_MAX_PARTS = 56
			const SDF_MAX_CHAINS = 32
			const SDF_MAX_STEPS = 56
			// 大きな水たまりに刺さる管の先の数の上限(同時に吸える者の数 × 1 者が刺す管の数)
			const SDF_MAX_DENTS = MAX_POOL_SUCKERS * POOL_TUBES
			const SDF_VERTEX = /* glsl */ `
				varying vec3 vWorld;
				void main() {
					vec4 w = modelMatrix * vec4(position, 1.0);
					vWorld = w.xyz;
					gl_Position = projectionMatrix * viewMatrix * w;
				}
			`
			const SDF_FRAGMENT = /* glsl */ `
				${LIQUID_SHADE_GLSL}
				uniform mat4 uViewProj;
				uniform float uPixel;
				uniform float uEdgePx;
				uniform vec3 uOrigin;
				uniform float uFlat;
				uniform vec3 uBoxMin;
				uniform vec3 uBoxMax;
				uniform vec4 uPA[MAX_PARTS];
				uniform vec4 uPB[MAX_PARTS];
				uniform vec4 uCB[MAX_CHAINS];
				uniform vec4 uCI[MAX_CHAINS];
				uniform int uChainCount;
				// 大きな水たまりに管を刺した所(xy: 位置, z: 届く半径, w: 凹みの深さの基準。液の厚みで、刺した直後は小さい)
				uniform vec4 uDent[MAX_DENTS];
				uniform int uDentCount;
				// 足す色(rgb)と強さ(w)。アイテムと巨大化中の体だけ 0 より大きい
				uniform vec4 uTint;
				// 縁だけに足す色(rgb)と強さ(w)。触手の嵐が効いている体だけ 0 より大きい
				uniform vec4 uRim;
				uniform float uTime;
				varying vec3 vWorld;

				float smin(float a, float b, float k) {
					float h = max(k - abs(a - b), 0.0) / k;
					return min(a, b) - h * h * k * 0.25;
				}
				// 両端の太さが違うカプセル。球は両端が同じ点
				float sdPart(vec3 p, int i) {
					vec4 a = uPA[i];
					vec4 b = uPB[i];
					vec3 pa = p - a.xyz;
					vec3 ba = b.xyz - a.xyz;
					float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
					return length(pa - ba * h) - mix(a.w, b.w, h);
				}
				// 床に溜まった液の部品(円盤)の、床の上での輪郭までの距離。b.x は平らな所の半径。
				// 縁は 3 つの山で揺れる(b.zw は揺れの強さ × 向きの cos / sin)。sin(3θ + φ) を atan を使わずに求める
				float footPart(vec3 p, int i) {
					vec2 q = p.xz - uPA[i].xz;
					vec4 b = uPB[i];
					float len = length(q);
					vec2 cs = q / max(len, 1e-5);
					float wob = b.z * cs.y * (3.0 - 4.0 * cs.y * cs.y) + b.w * cs.x * (4.0 * cs.x * cs.x - 3.0);
					return len - b.x - wob;
				}
				// この画素のレイが近くを通る列の印(1 列 1 ビット)。遠い列は 1 歩ごとの計算から外す
				uint gMask;
				// 管を刺した所の周りの凹みと、液面を管の方へ寄っていく波(距離に足す量)。床際(縁の付け根)は動かさない
				float dentAt(vec3 p) {
					float add = 0.0;
					for (int i = 0; i < MAX_DENTS; i++) {
						if (i >= uDentCount) break;
						vec4 dn = uDent[i];
						float u = length(p.xz - dn.xy) / dn.z;
						if (u >= 1.0) continue;
						float fall = (1.0 - u) * (1.0 - u);
						float ripple = sin(u * 20.0 + uTime * 14.0) * fall * smoothstep(0.08, 0.3, u);
						add += clamp(p.y / dn.w, 0.0, 1.0) * dn.w * (0.4 * exp(-u * u * 9.0) * fall + 0.08 * ripple);
					}
					return add;
				}
				// 最後に map を呼んだ点での、床の液の列と、それ以外(管の先など)の列までの近さ。床の液だけの色づけに使う
				float gFloorD;
				float gOtherD;
				float map(vec3 p) {
					float d = 1e5;
					float dent = uDentCount > 0 ? dentAt(p) : 0.0;
					gFloorD = 1e5;
					gOtherD = 1e5;
					for (int c = 0; c < MAX_CHAINS; c++) {
						if (c >= uChainCount) break;
						if ((gMask & (1u << uint(c))) == 0u) continue;
						vec4 info = uCI[c];
						vec4 bound = uCB[c];
						// 列を包む球が、溶け合う幅を足しても届かないほど遠い列は計算しない
						if (length(p - bound.xyz) - bound.w > d + info.z) continue;
						int first = int(info.x);
						int last = first + int(info.y);
						float cd = 1e5;
						if (info.w > 0.5) {
							// 床の液の列: 円盤の輪郭を床の上で滑らかに溶け合わせてから、1 つの厚みと丸い縁を付ける。
							// 円盤ごとに厚みを付けてから溶け合わせると、上面の重なった所が段になって輪に見えたため。
							// 部品は同じ厚み: a.y は縁の丸みの中心の高さ、-a.w は丸みの半径、b.y は上面の中央の膨らみ
							float e = 1e5;
							for (int i = 0; i < MAX_PARTS; i++) {
								int j = first + i;
								if (j >= last) break;
								e = smin(e, footPart(p, j), info.z);
							}
							vec4 a0 = uPA[first];
							vec4 b0 = uPB[first];
							float edge = 1.0 - clamp(-e / max(b0.x, 1e-5), 0.0, 1.0);
							float y = p.y - a0.y + b0.y * edge * edge;
							// 凹みは床の液だけに付ける。管の先は凹みに沈めない
							cd = length(vec2(max(e, 0.0), y)) + a0.w + dent;
						} else {
							for (int i = 0; i < MAX_PARTS; i++) {
								int j = first + i;
								if (j >= last) break;
								cd = min(cd, sdPart(p, j));
							}
						}
						if (info.w > 0.5) gFloorD = min(gFloorD, cd);
						else gOtherD = min(gOtherD, cd);
						d = smin(d, cd, info.z);
					}
					return d;
				}
				vec3 mapNormal(vec3 p, float e) {
					vec2 k = vec2(1.0, -1.0);
					return normalize(
						k.xyy * map(p + k.xyy * e) + k.yyx * map(p + k.yyx * e) + k.yxy * map(p + k.yxy * e) + k.xxx * map(p + k.xxx * e)
					);
				}
				void main() {
					vec3 ro = cameraPosition - uOrigin;
					vec3 rd = normalize(vWorld - cameraPosition);
					vec3 inv = 1.0 / (rd + vec3(1e-7));
					vec3 t0 = (uBoxMin - ro) * inv;
					vec3 t1 = (uBoxMax - ro) * inv;
					vec3 tlo = min(t0, t1);
					vec3 thi = max(t0, t1);
					float tNear = max(max(max(tlo.x, tlo.y), tlo.z), 0.0);
					float tFar = min(min(thi.x, thi.y), thi.z);
					if (tNear >= tFar) discard;
					// 列を包む球との最短距離が、溶け合う幅と輪郭線の幅を足しても届かない列は、この画素には関係しない
					gMask = 0u;
					float edge = tFar * uPixel * (uEdgePx + 1.0);
					for (int c = 0; c < MAX_CHAINS; c++) {
						if (c >= uChainCount) break;
						vec4 bound = uCB[c];
						vec3 q = ro + rd * clamp(dot(bound.xyz - ro, rd), tNear, tFar) - bound.xyz;
						float reach = bound.w + uCI[c].z + edge;
						if (dot(q, q) < reach * reach) gMask |= 1u << uint(c);
					}
					if (gMask == 0u) discard;
					float t = tNear;
					float nearest = 1e9;
					float tNearest = tNear;
					bool hit = false;
					for (int i = 0; i < MAX_STEPS; i++) {
						float d = map(ro + rd * t);
						float px = t * uPixel;
						if (d < px * 0.4) {
							hit = true;
							break;
						}
						if (d / px < nearest) {
							nearest = d / px;
							tNearest = t;
						}
						t += d * 0.9;
						if (t > tFar) break;
					}
					vec3 col = OUTLINE;
					if (hit) {
						vec3 p = ro + rd * t;
						vec3 n = mapNormal(p, max(t * uPixel * 0.5, 1e-4));
						// 床の液に刺さった管の先は体と同じ色づけにする(床の液の早めの紫が管の先に付いて、ざらついて見えたため)。
						// 近さは、向きを求めた最後の map(当たった点から 1 画素未満ずれた点)の値をそのまま使う
						float floorPart = uFlat * smoothstep(-0.02, 0.02, gOtherD - gFloorD);
						col = liquidShade(n, -rd, p + uOrigin, floorPart);
						// アイテムと巨大化中の体は、同じ描き方のまま色を足して光らせる。正面ほど強く、輪郭線は残す
						if (uTint.w > 0.0) {
							float ndv = clamp(dot(n, -rd), 0.0, 1.0);
							col += uTint.rgb * uTint.w * (0.3 + 0.7 * ndv) * (1.0 - smoothstep(0.9, 0.93, 1.0 - ndv));
						}
						// 縁の紫の光(liquidShade)より内側から光らせ、太く強い縁にする。輪郭線は残す
						if (uRim.w > 0.0) {
							float f = 1.0 - clamp(dot(n, -rd), 0.0, 1.0);
							col += uRim.rgb * uRim.w * smoothstep(0.4, 0.78, f) * (1.0 - smoothstep(0.9, 0.93, f));
						}
					} else {
						// 表面のすぐそばを通った画素は輪郭線にする。縁のなめらかさは画面へ重ねる時に付ける
						if (nearest > uEdgePx) discard;
						t = tNearest;
					}
					vec3 wp = ro + rd * t + uOrigin;
					// 奥行きは 2 画素ぶん手前にずらす。床すれすれの縁が、粗い描画先から戻した奥行きで床と前後を争い、ギザギザになるため
					vec4 clip = uViewProj * vec4(wp - rd * max(0.01, t * uPixel * 2.0), 1.0);
					gl_FragDepth = clamp(clip.z / clip.w * 0.5 + 0.5, 0.0, 1.0);
					gl_FragColor = vec4(liquidFog(col, wp), 1.0);
					#include <colorspace_fragment>
				}
			`
			const sdfProxyGeometry = new THREE.BoxGeometry(1, 1, 1)
			const sdfProxies = []
			function makeSdfProxy() {
				const material = new THREE.ShaderMaterial({
					uniforms: {
						...liquidUniforms,
						uOrigin: { value: new THREE.Vector3() },
						uFlat: { value: 0 },
						uBoxMin: { value: new THREE.Vector3() },
						uBoxMax: { value: new THREE.Vector3() },
						uPA: { value: new Float32Array(SDF_MAX_PARTS * 4) },
						uPB: { value: new Float32Array(SDF_MAX_PARTS * 4) },
						uCB: { value: new Float32Array(SDF_MAX_CHAINS * 4) },
						uCI: { value: new Float32Array(SDF_MAX_CHAINS * 4) },
						uChainCount: { value: 0 },
						uDent: { value: new Float32Array(SDF_MAX_DENTS * 4) },
						uDentCount: { value: 0 },
						uTint: { value: new THREE.Vector4() },
						uRim: { value: new THREE.Vector4() },
					},
					defines: {
						MAX_PARTS: SDF_MAX_PARTS,
						MAX_CHAINS: SDF_MAX_CHAINS,
						MAX_STEPS: SDF_MAX_STEPS,
						MAX_DENTS: SDF_MAX_DENTS,
					},
					vertexShader: SDF_VERTEX,
					fragmentShader: SDF_FRAGMENT,
					// 裏面を描くと、箱のどこから覗いても 1 画素 1 回だけ計算される
					side: THREE.BackSide,
				})
				const mesh = new THREE.Mesh(sdfProxyGeometry, material)
				mesh.visible = false
				liquidScene.add(mesh)
				return { mesh, u: material.uniforms }
			}

			/* ========== 液体だけを低い解像度で描いて重ねる ========== */
			// 液体は画素ごとに表面を探すので重い。画面より粗い描画先へ色と奥行きを描き、
			// 画面へ重ねる時に奥行きも書き込んで、入れ物・地面・ガラスとの前後を正しく保つ
			const liquidScene = new THREE.Scene()
			const liquidTarget = new THREE.WebGLRenderTarget(1, 1, {
				type: THREE.HalfFloatType,
				depthTexture: new THREE.DepthTexture(1, 1),
			})
			const liquidComposite = new THREE.Mesh(
				new THREE.PlaneGeometry(2, 2),
				new THREE.ShaderMaterial({
					uniforms: {
						tLiquid: { value: liquidTarget.texture },
						tLiquidDepth: { value: liquidTarget.depthTexture },
					},
					vertexShader: /* glsl */ `
						varying vec2 vUv;
						void main() {
							vUv = uv;
							gl_Position = vec4(position.xy, 0.0, 1.0);
						}
					`,
					fragmentShader: /* glsl */ `
						uniform sampler2D tLiquid;
						uniform sampler2D tLiquidDepth;
						varying vec2 vUv;
						void main() {
							// 色と覆う割合は周りの画素となめらかに混ぜ、縁を滑らかにする
							vec4 c = texture2D(tLiquid, vUv);
							if (c.a < 0.02) discard;
							// 奥行きは周り 4 画素のうち一番手前の液体の値を使う(何も無い所の奥行きを混ぜない)
							ivec2 size = textureSize(tLiquidDepth, 0);
							ivec2 i0 = ivec2(floor(vUv * vec2(size) - 0.5));
							ivec2 hi = size - 1;
							float d = min(
								min(texelFetch(tLiquidDepth, clamp(i0, ivec2(0), hi), 0).r, texelFetch(tLiquidDepth, clamp(i0 + ivec2(1, 0), ivec2(0), hi), 0).r),
								min(texelFetch(tLiquidDepth, clamp(i0 + ivec2(0, 1), ivec2(0), hi), 0).r, texelFetch(tLiquidDepth, clamp(i0 + ivec2(1, 1), ivec2(0), hi), 0).r)
							);
							gl_FragDepth = d;
							gl_FragColor = vec4(c.rgb / c.a, c.a);
							#include <colorspace_fragment>
						}
					`,
					alphaToCoverage: true,
				}),
			)
			liquidComposite.frustumCulled = false
			scene.add(liquidComposite)
			// 液体の描画先は「何も無い所 = 透明」で消す。画面側は背景色で消すのでこの値の影響を受けない
			renderer.setClearColor(0x000000, 0)
			// 液体の描画先の細かさ。画素の倍率 2 の画面では 0.75 倍、倍率 1.5 以下の画面ではそのまま。
			// 0.5 倍だと縁の紫の光が点々に欠けて見えたため、縁が滑らかに保てる 0.75 倍にした
			let liquidScale = 1
			function resizeLiquidTarget(width, height) {
				liquidScale = clamp(1.5 / renderer.getPixelRatio(), 0.5, 1)
				liquidTarget.setSize(
					Math.max(1, Math.round(width * liquidScale)),
					Math.max(1, Math.round(height * liquidScale)),
				)
			}
			function renderLiquids() {
				renderer.setRenderTarget(liquidTarget)
				renderer.render(liquidScene, camera)
			}

			// いま組み立て中の液体。座標は世界の値で受け取り、中心からの相対で詰める。
			// 縮みながら消える液体は、中心 (cx, cz) を基準に s 倍して (dx, dz) ずらす
			const sdf = {
				proxy: null,
				used: 0,
				parts: 0,
				chains: 0,
				partsDrawn: 0,
				chainFirst: 0,
				chainK: 0,
				chainFloor: 0,
				maxK: 0,
				cx: 0,
				cz: 0,
				s: 1,
				ox: 0,
				oz: 0,
				box: new Float32Array(6),
				cbox: new Float32Array(6),
			}
			function resetBox(box) {
				box[0] = box[1] = box[2] = Infinity
				box[3] = box[4] = box[5] = -Infinity
			}
			function growBox(box, x0, y0, z0, x1, y1, z1) {
				box[0] = Math.min(box[0], x0)
				box[1] = Math.min(box[1], y0)
				box[2] = Math.min(box[2], z0)
				box[3] = Math.max(box[3], x1)
				box[4] = Math.max(box[4], y1)
				box[5] = Math.max(box[5], z1)
			}
			function sdfFrameStart() {
				sdf.used = 0
				sdf.partsDrawn = 0
			}
			function sdfFrameEnd() {
				for (let i = sdf.used; i < sdfProxies.length; i++)
					sdfProxies[i].mesh.visible = false
			}
			// flat: 床に広がった平たい液(水たまり・かけら)なら 1
			function sdfBegin(x, z, s = 1, dx = 0, dz = 0, flat = 0) {
				if (sdf.used >= sdfProxies.length) sdfProxies.push(makeSdfProxy())
				sdf.proxy = sdfProxies[sdf.used++]
				sdf.proxy.u.uFlat.value = flat
				sdf.proxy.u.uDentCount.value = 0
				sdf.proxy.u.uTint.value.set(0, 0, 0, 0)
				sdf.proxy.u.uRim.value.set(0, 0, 0, 0)
				sdf.parts = 0
				sdf.chains = 0
				sdf.maxK = 0
				sdf.cx = x
				sdf.cz = z
				sdf.s = s
				sdf.ox = x + dx
				sdf.oz = z + dz
				resetBox(sdf.box)
			}
			// 列を始める。k は他の列と溶け合う幅。floor は床に溜まった液の列(管を刺した所の凹みを受ける)なら 1。
			// 部品や列が上限に達していたら false
			function sdfChain(k, floor = 0) {
				if (sdf.chains >= SDF_MAX_CHAINS || sdf.parts >= SDF_MAX_PARTS)
					return false
				sdf.chainFirst = sdf.parts
				sdf.chainK = Math.max(1e-4, k * sdf.s)
				sdf.chainFloor = floor
				resetBox(sdf.cbox)
				return true
			}
			function writePart(ax, ay, az, ra, bx, by, bz, rb) {
				const i = sdf.parts++ * 4
				const A = sdf.proxy.u.uPA.value
				const B = sdf.proxy.u.uPB.value
				A[i] = ax
				A[i + 1] = ay
				A[i + 2] = az
				A[i + 3] = ra
				B[i] = bx
				B[i + 1] = by
				B[i + 2] = bz
				B[i + 3] = rb
			}
			function sdfPart(ax, ay, az, ra, bx, by, bz, rb) {
				if (sdf.parts >= SDF_MAX_PARTS) return
				const s = sdf.s
				const lax = (ax - sdf.cx) * s
				const laz = (az - sdf.cz) * s
				const lbx = (bx - sdf.cx) * s
				const lbz = (bz - sdf.cz) * s
				writePart(lax, ay * s, laz, ra * s, lbx, by * s, lbz, rb * s)
				const m = Math.max(ra, rb) * s
				growBox(
					sdf.cbox,
					Math.min(lax, lbx) - m,
					Math.min(ay, by) * s - m,
					Math.min(laz, lbz) - m,
					Math.max(lax, lbx) + m,
					Math.max(ay, by) * s + m,
					Math.max(laz, lbz) + m,
				)
			}
			function sdfSphere(x, y, z, r) {
				sdfPart(x, y, z, r, x, y, z, r)
			}
			// 地面に落ちた平たい液: 地面の下に中心を沈めた大きい球の頭だけを出す。地面との境目が浅い角度になる
			function sdfDome(x, z, foot, h) {
				if (sdf.parts >= SDF_MAX_PARTS || foot <= 1e-4) return
				const s = sdf.s
				const r = (foot * foot + h * h) / (2 * h)
				const lx = (x - sdf.cx) * s
				const lz = (z - sdf.cz) * s
				writePart(lx, (h - r) * s, lz, r * s, lx, (h - r) * s, lz, r * s)
				// 地面の下は描かれないので、包む箱は地面から上の頭だけにする。
				// 斜面が浅いので、他の列と溶け合って表面が少し膨らむと地面との境目は横へ大きく広がる。その分も含める
				const spread = (foot + ((sdf.chainK / s) * 0.3 * r) / foot) * s
				growBox(
					sdf.cbox,
					lx - spread,
					0,
					lz - spread,
					lx + spread,
					h * s,
					lz + spread,
				)
			}
			// 床に溜まった液: 厚み h の円盤。縁は丸く、表面張力で床から少し外へ張り出す。上面は中央が bow だけ膨らむ。
			// wob は縁を 3 つの山で揺らす強さ、phase はその山の向き。床の液の列(sdfChain の floor = 1)の中でだけ使う。
			// 列の中の円盤は同じ厚みにする(厚みと丸みは列の最初の円盤の値で付ける)
			function sdfDisc(x, z, foot, h, wob, phase, bow) {
				if (sdf.parts >= SDF_MAX_PARTS || foot <= 1e-4 || h <= 1e-4) return
				const s = sdf.s
				const r = Math.min(h * 0.6, foot)
				const lx = (x - sdf.cx) * s
				const lz = (z - sdf.cz) * s
				writePart(
					lx,
					(h - r) * s,
					lz,
					-r * s,
					(foot - r) * s,
					bow * s,
					wob * Math.cos(phase) * s,
					wob * Math.sin(phase) * s,
				)
				const spread = (foot + wob) * s + sdf.chainK * 0.3
				growBox(
					sdf.cbox,
					lx - spread,
					0,
					lz - spread,
					lx + spread,
					h * s,
					lz + spread,
				)
			}
			function sdfEndChain() {
				const n = sdf.parts - sdf.chainFirst
				if (n === 0) return
				const c = sdf.chains++ * 4
				const b = sdf.cbox
				const CB = sdf.proxy.u.uCB.value
				const CI = sdf.proxy.u.uCI.value
				CB[c] = (b[0] + b[3]) / 2
				CB[c + 1] = (b[1] + b[4]) / 2
				CB[c + 2] = (b[2] + b[5]) / 2
				const ex = b[3] - b[0]
				const ey = b[4] - b[1]
				const ez = b[5] - b[2]
				CB[c + 3] = Math.sqrt(ex * ex + ey * ey + ez * ez) / 2
				CI[c] = sdf.chainFirst
				CI[c + 1] = n
				CI[c + 2] = sdf.chainK
				CI[c + 3] = sdf.chainFloor
				growBox(sdf.box, b[0], b[1], b[2], b[3], b[4], b[5])
				sdf.maxK = Math.max(sdf.maxK, sdf.chainK)
			}
			function sdfEnd() {
				const { proxy, box } = sdf
				if (sdf.chains === 0) {
					proxy.mesh.visible = false
					return
				}
				// smooth min で溶け合う所は部品より少し膨らむので、その分だけ箱を広げる
				const pad = sdf.maxK * 0.3 + 0.01
				// レイは床の高さで止める。床に広がった平たい液は床の下で大きく広がっており、床の下まで探すと縁の外に液がはみ出して見える
				const minY = Math.max(box[1] - pad, 0)
				proxy.u.uBoxMin.value.set(box[0] - pad, minY, box[2] - pad)
				proxy.u.uBoxMax.value.set(box[3] + pad, box[4] + pad, box[5] + pad)
				proxy.u.uOrigin.value.set(sdf.ox, 0, sdf.oz)
				proxy.u.uChainCount.value = sdf.chains
				proxy.mesh.position.set(
					sdf.ox + (box[0] + box[3]) / 2,
					(minY + box[4] + pad) / 2,
					sdf.oz + (box[2] + box[5]) / 2,
				)
				proxy.mesh.scale.set(
					box[3] - box[0] + pad * 2,
					box[4] + pad - minY,
					box[5] - box[2] + pad * 2,
				)
				proxy.mesh.visible = true
				sdf.partsDrawn += sdf.parts
			}
			// 画面に小さく映る液体ほど部品を減らす。2: すべて / 1: 触手を 1 本の筒に / 0: 体と触手だけ
			function detailFor(x, y, z, Rv) {
				const d = Math.hypot(
					camera.position.x - x,
					camera.position.y - y,
					camera.position.z - z,
				)
				// 画面の画素の倍率に関係なく、CSS の画素の大きさで決める
				const px =
					Rv /
					(d *
						liquidUniforms.uPixel.value *
						liquidScale *
						renderer.getPixelRatio())
				return px >= 14 ? 2 : px >= 5 ? 1 : 0
			}

			/* ========== 体の形(芯・ぷるぷる・触手) ========== */
			function bodyPulse(b) {
				// サイズアップの「ドクン」: 1.3 から弾みながら 1 へ戻る
				if (b.pulseT >= 1) return 1
				return 1 + 0.3 * (1 - easeOutElastic(b.pulseT, 1, 0.45))
			}
			function visualRadius(b) {
				return (
					b.dispR * (1 + b.gulp) * bodyPulse(b) * (b.isPlayer ? giantScale : 1)
				)
			}
			// 触手が地面を離してから糸が切れて消えるまでの秒数
			const STRING_SECONDS = 0.26
			const legSpot = { x: 0, z: 0 }
			const legTip = { x: 0, y: 0, z: 0 }
			// 触手 i が掴みたい地面の点。体の周りに等間隔で、ゆっくり回り、進む向きへ先回りする(先回りの量は updateLegs で決める)
			function legIdeal(b, i, st, Rv, t) {
				const a = (i / st.count) * Math.PI * 2 + b.phases[0] + t * 0.1
				const d =
					Rv * st.reach * (1 + 0.06 * Math.sin(t * 1.3 + b.phases[i % 9]))
				legSpot.x = b.x + Math.cos(a) * d + b.legLeadX
				legSpot.z = b.z + Math.sin(a) * d + b.legLeadZ
				return legSpot
			}
			// 掴んだ点から離れすぎた触手を、一度に半分(切り上げ)までの本数ずつ次の点へ踏み替える。
			// 踏み替えの速さと歩幅は今の速さに合わせる。決まった値だと、小さい体が全速で動いた時に
			// 踏み替えが追い付かず、触手が後ろに取り残されて長く伸びた(体の半径の 2.8 倍まで)
			function updateLegs(b, dt, t) {
				const st = LEG_STYLES[b.stage]
				const Rv = visualRadius(b)
				const speed = Math.hypot(b.vx, b.vz)
				b.legSwing = st.swing / (1 + speed / (Rv * 4))
				const stride = Math.max(Rv * 0.45, speed * b.legSwing * 1.6)
				// 着地した時に、歩幅の半分だけ体より前にあるよう先回りする
				const lead =
					speed > 1e-3
						? Math.min(Rv * st.reach, speed * b.legSwing + stride / 2) / speed
						: 0
				b.legLeadX = b.vx * lead
				b.legLeadZ = b.vz * lead
				// 新しい触手は体の中心から引き出す
				while (b.legs.length < st.count)
					b.legs.push({
						gx: b.x,
						gz: b.z,
						ox: b.x,
						oz: b.z,
						u: 0,
						splashT: 1,
						grow: 0,
						str: null,
					})
				if (b.legs.length > st.count) b.legs.length = st.count
				let swinging = 0
				for (const leg of b.legs) if (leg.u < 1) swinging++
				const maxSwing = Math.ceil(st.count / 2)
				for (let i = 0; i < b.legs.length; i++) {
					const leg = b.legs[i]
					const spot = legIdeal(b, i, st, Rv, t)
					leg.grow = Math.min(1, leg.grow + dt / 0.3)
					leg.splashT += dt
					if (leg.str) {
						leg.str.t += dt
						if (leg.str.t >= STRING_SECONDS) leg.str = null
					}
					if (leg.u < 1) {
						leg.u = Math.min(1, leg.u + dt / b.legSwing)
						if (leg.u >= 1) {
							leg.gx = spot.x
							leg.gz = spot.z
							leg.splashT = 0
						}
						continue
					}
					const ox = leg.gx - spot.x
					const oz = leg.gz - spot.z
					const off = Math.sqrt(ox * ox + oz * oz)
					const fx = leg.gx - b.x
					const fz = leg.gz - b.z
					const far = Rv * (st.reach + 0.4) + stride
					const tooFar = fx * fx + fz * fz > far * far
					if ((off > stride && swinging < maxSwing) || tooFar) {
						leg.str = { x: leg.gx, z: leg.gz, t: 0 }
						leg.ox = leg.gx
						leg.oz = leg.gz
						leg.u = 0
						swinging++
					}
				}
			}
			function legTipPos(b, i, leg, st, Rv, t, tipR) {
				const y0 = tipR * 0.4
				if (leg.u >= 1) {
					legTip.x = leg.gx
					legTip.y = y0
					legTip.z = leg.gz
					return
				}
				const spot = legIdeal(b, i, st, Rv, t)
				const e = leg.u * leg.u * (3 - 2 * leg.u)
				legTip.x = lerp(leg.ox, spot.x, e)
				legTip.y = y0 + Math.sin(Math.PI * leg.u) * Rv * 0.4
				legTip.z = lerp(leg.oz, spot.z, e)
			}
			// 地面を離した触手の先と、地面に残った滴の間に糸を引き、途中で切れて両側へ縮む。
			// 糸は maxLen より長く伸びる前に切る(長い糸は床に落ちた針のように見えるため)
			function addLegString(leg, tipR, maxLen) {
				const u = leg.str.t / STRING_SECONDS
				const ax = leg.str.x
				const az = leg.str.z
				const r = tipR * 0.32 * (1 - 0.6 * u)
				if (!sdfChain(tipR * 0.8)) return
				sdfDome(ax, az, tipR * 1.4 * (1 - u), tipR * 0.45 * (1 - u) + 1e-3)
				const len = Math.hypot(legTip.x - ax, legTip.y, legTip.z - az)
				if (u < 0.5 && len <= maxLen)
					sdfPart(ax, tipR * 0.2, az, r, legTip.x, legTip.y, legTip.z, r)
				else {
					const s =
						Math.min(1 - u, 0.5) * Math.min(1, maxLen / Math.max(len, 1e-4))
					sdfPart(
						ax,
						tipR * 0.2,
						az,
						r,
						lerp(ax, legTip.x, s),
						lerp(tipR * 0.2, legTip.y, s),
						lerp(az, legTip.z, s),
						r * 0.6,
					)
					sdfPart(
						legTip.x,
						legTip.y,
						legTip.z,
						r,
						lerp(legTip.x, ax, s),
						lerp(legTip.y, tipR * 0.2, s),
						lerp(legTip.z, az, s),
						r * 0.6,
					)
				}
				sdfEndChain()
			}
			// 自分も相手役も同じ作り: 芯の球 1 つ + ぷるぷる揺れる球 3 つ + 触手(段階で本数が増える) + 管
			function drawBlobShape(b, t, detail) {
				const st = LEG_STYLES[b.stage]
				const Rv = visualRadius(b)
				const ph = b.phases
				const bodyY = st.lift * Rv
				// 吸われている間は速く細かく震える
				const jig = b.suckers.length ? 0.04 * Math.sin(t * 38) : 0
				const sf = clamp(
					Math.hypot(b.vx, b.vz) / moveSpeedFor(Math.max(0.05, b.R)),
					0,
					1,
				)
				// 動いている時は、揺れる球が進む向きの後ろへ少し遅れる
				const lagX = -Math.cos(b.heading) * sf * 0.12 * Rv
				const lagZ = -Math.sin(b.heading) * sf * 0.12 * Rv
				const bodyK = Rv * 0.36
				if (sdfChain(bodyK)) {
					sdfSphere(
						b.x,
						bodyY,
						b.z,
						Rv * (0.6 + 0.03 * Math.sin(t * 2.4 + ph[0]) + jig),
					)
					sdfEndChain()
				}
				const lobes = detail > 0 ? 3 : 1
				for (let i = 0; i < lobes; i++) {
					const a = (i / 3) * Math.PI * 2 + t * 0.35 + i + ph[1]
					const d = Rv * (0.32 + 0.06 * Math.sin(t * 3.1 + i * 1.7))
					if (!sdfChain(bodyK)) break
					sdfSphere(
						b.x + Math.cos(a) * d + lagX,
						bodyY + Rv * (0.05 + 0.12 * Math.sin(t * 4.3 + i)),
						b.z + Math.sin(a) * d + lagZ,
						Rv * (0.42 + 0.05 * Math.sin(t * 5 + i * 2) + jig),
					)
					sdfEndChain()
				}
				// 管は触手より先に部品を取る(上限に達した時に消えるのは触手の飾りの方)
				if (b.linkFrame === drawFrame) {
					for (const link of links) {
						if (link.eater === b) addTube(link, detail)
						else if (link.target === b) addTubeTip(link)
					}
				}
				const rootR = Rv * 0.26 * st.thick
				const tipR = Rv * 0.1 * st.thick
				const segs = detail >= 2 ? (b.legs.length <= 6 ? 3 : 2) : 1
				for (let i = 0; i < b.legs.length; i++) {
					const leg = b.legs[i]
					legTipPos(b, i, leg, st, Rv, t, tipR)
					const hx = legTip.x - b.x
					const hz = legTip.z - b.z
					const h = Math.hypot(hx, hz) || 1
					const rx = b.x + (hx / h) * Rv * 0.3
					const ry = bodyY - 0.1 * Rv
					const rz = b.z + (hz / h) * Rv * 0.3
					// 膝を持ち上げた弧にする
					const kx = (rx + legTip.x) / 2 + (hx / h) * Rv * 0.12
					const ky =
						(ry + legTip.y) / 2 +
						Rv * (0.3 + 0.05 * Math.sin(t * 3 + ph[i % 9]))
					const kz = (rz + legTip.z) / 2 + (hz / h) * Rv * 0.12
					const g = lerp(0.3, 1, leg.grow)
					if (!sdfChain(Rv * 0.22)) break
					let px = rx
					let py = ry
					let pz = rz
					for (let j = 1; j <= segs; j++) {
						const u = j / segs
						const a = (1 - u) * (1 - u)
						const m = 2 * u * (1 - u)
						const c = u * u
						const qx = a * rx + m * kx + c * legTip.x
						const qy = a * ry + m * ky + c * legTip.y
						const qz = a * rz + m * kz + c * legTip.z
						sdfPart(
							px,
							py,
							pz,
							lerp(rootR, tipR, (j - 1) / segs) * g,
							qx,
							qy,
							qz,
							lerp(rootR, tipR, u) * g,
						)
						px = qx
						py = qy
						pz = qz
					}
					sdfEndChain()
					// 掴んだ所で液がはねて広がり、落ち着くと小さな足になる
					if (detail >= 1 && leg.u >= 1) {
						const splash =
							Math.exp(-leg.splashT * 8) * (1 - Math.exp(-leg.splashT * 50))
						if (sdfChain(tipR * 1.4)) {
							sdfDome(
								leg.gx,
								leg.gz,
								tipR * g * (1.5 + 3 * splash),
								tipR * g * (0.55 - 0.2 * splash),
							)
							sdfEndChain()
						}
					}
					if (detail >= 2 && leg.str) addLegString(leg, tipR, Rv * 0.8)
				}
			}

			/* ========== 液体(自分と相手役) ========== */
			const blobs = []
			let body = null
			// 確認用: 相手役の考えを止める / 湧きと片付けを止める
			let aiFrozen = false
			let spawnPaused = false
			// 確認用: 自分が吸われない(長い時間の確認で、吸い切られて止まらないように。点滅はしない)
			let godMode = false

			function createBlob(isPlayer, x, z, liters) {
				const mass = liters
				const R = radiusForMass(mass)
				const b = {
					isPlayer,
					x,
					z,
					vx: 0,
					vz: 0,
					heading: rand(0, Math.PI * 2),
					mass,
					R,
					dispR: R,
					gulp: 0,
					pulseT: 1,
					stage: stageForRadius(R),
					best: mass,
					// 自分だけ: 吸ったがまだ体の大きさに入れていない量(たまって満ちたら一気に膨らむ)
					store: 0,
					safeT: 0,
					dead: false,
					// 自分を吸っている管と、吸われ始めた時の量(吸い切りの下限の基準)
					suckers: [],
					drainRef: mass,
					links: [],
					legs: [],
					// 触手の踏み替えにかける秒数と、着地点の先回りの量(今の速さで毎コマ決める)
					legSwing: 0.2,
					legLeadX: 0,
					legLeadZ: 0,
					// 自分が吸われて減った量を「-◯L」で出すための溜め
					lossAcc: 0,
					lossPopT: 0,
					speedK: isPlayer ? 1 : rand(0.85, 0.95),
					thinkT: rand(0, 0.3),
					// 追っている相手と、管を刺せずに追い続けた秒数。諦めた相手は狙わない期限(場面の時刻)を覚える
					chaseTarget: null,
					chaseT: 0,
					ignoreUntil: new Map(),
					goalX: 0,
					goalZ: 0,
					goalMag: 0,
					wanderA: rand(0, Math.PI * 2),
					phases: Array.from({ length: 9 }, () => rand(0, Math.PI * 2)),
					shadow: makeShadow(1),
					mark: isPlayer ? null : makeMark(),
				}
				scene.add(b.shadow)
				if (b.mark) scene.add(b.mark)
				blobs.push(b)
				return b
			}
			function removeBlob(b) {
				b.dead = true
				scene.remove(b.shadow)
				if (b.mark) scene.remove(b.mark)
				const i = blobs.indexOf(b)
				if (i >= 0) blobs.splice(i, 1)
			}
			function setMass(b, mass) {
				b.mass = Math.max(0, mass)
				b.R = radiusForMass(b.mass)
			}
			// 吸って増えた量を足す。自分は体の大きさにすぐ入れず、ためておく(満ちたら updateFever で一気に膨らむ)
			function gainMass(b, amount) {
				if (b === body) body.store += amount
				else setMass(b, b.mass + amount)
			}
			// 自分の点数の元の量(体の量 + たまっている量)
			function playerTotal() {
				return body.mass + body.store
			}
			// 吸われている間は、自分も小さい相手を吸っていても普段の速さで動ける(逃げるのが最優先)
			function speedFactor(b) {
				if (b.suckers.length) return 1
				return b.links.some((l) => l.isBlob) ? SUCKING_SPEED_K : 1
			}

			// 吸い切られた液体は、量を渡し終えた後も少しの間、縮みながら吸った側へ引き込まれる姿だけ残す
			const ghosts = []
			const GHOST_SECONDS = 0.3
			function updateGhosts(dt) {
				for (let i = ghosts.length - 1; i >= 0; i--) {
					ghosts[i].t += dt
					if (ghosts[i].t >= GHOST_SECONDS) ghosts.splice(i, 1)
				}
			}

			/* ========== 床の液体(水たまり・散った粒・入れ物) ========== */
			const foods = []
			const FLOOR_LIQUID_SOFT_MAX = 120
			// 種類ごとの今の数(上限 CAP と比べるため、作る時と消す時に数え直す)
			const foodCount = { puddle: 0, bit: 0, pellet: 0, pool: 0, container: 0 }
			function foodKey(f) {
				return f.kind === 'container' ? 'container' : f.role
			}

			// role: puddle(ふつうの水たまり) / pellet(吸い切られた時に散った粒) / bit(道端のかけら) / pool(大きな水たまり)
			function createPuddle(
				x,
				z,
				liters,
				role = 'puddle',
				fromX = x,
				fromZ = z,
			) {
				const f = {
					kind: 'puddle',
					role,
					x: fromX,
					z: fromZ,
					fromX,
					fromZ,
					toX: x,
					toZ: z,
					liters,
					full: liters,
					yaw: rand(0, Math.PI * 2),
					t: 0,
					// 大きな水たまりは何者かが同時に吸うので suckers に管を持つ。それ以外は 1 本だけの capturedBy
					capturedBy: null,
					suckers: [],
					dead: false,
				}
				foods.push(f)
				foodCount[role]++
				return f
			}
			function createContainer(stage, x, z) {
				const tpl = templateFor(stage)
				const group = tpl.group.clone()
				group.position.set(x, 0, z)
				group.rotation.y = rand(0, Math.PI * 2)
				group.scale.setScalar(0.001)
				scene.add(group)
				const f = {
					kind: 'container',
					stage,
					x,
					z,
					liters: STAGES[stage].liters,
					full: STAGES[stage].liters,
					group,
					liquid: group.children[tpl.liquidIndex],
					t: 0,
					vanishing: false,
					capturedBy: null,
					suckers: [],
					dead: false,
				}
				foods.push(f)
				foodCount.container++
				return f
			}
			function removeFood(f) {
				if (f.dead) return
				f.dead = true
				if (f.group) scene.remove(f.group)
				const i = foods.indexOf(f)
				if (i >= 0) foods.splice(i, 1)
				foodCount[foodKey(f)]--
			}
			// 散る粒が上限なら、吸われていない粒のうち自分から一番遠いものを消して場所を空ける
			function makeRoomForPellet() {
				if (foodCount.pellet < CAP.pellets) return
				let far = null
				let farD = -1
				for (const f of foods) {
					if (f.role !== 'pellet' || f.capturedBy) continue
					const dx = f.x - body.x
					const dz = f.z - body.z
					const d = dx * dx + dz * dz
					if (d > farD) {
						farD = d
						far = f
					}
				}
				if (far) removeFood(far)
			}
			function puddleAppear(f) {
				return Math.max(0.001, easeOutBack(Math.min(1, f.t / 0.3)))
			}
			function puddleSize(f) {
				const appear = puddleAppear(f)
				// 大きな水たまりは厚みを変えずに広さで量を表す。量が半分なら面積も半分になり、吸われて縮むのが目に見える
				if (f.role === 'pool')
					return puddleRadius(f.full) * Math.sqrt(liquidFraction(f)) * appear
				// 吸われている間は量の減り以上に平たく縮めて、減っているのを見せる
				const draining = f.capturedBy ? lerp(0.55, 1, liquidFraction(f)) : 1
				return puddleRadius(Math.max(0, f.liters)) * appear * draining
			}
			// 床の液の厚み。小さいほど表面張力で丸く盛り上がり、大きな水たまりは満タンの時の広さで厚みが決まる
			// (縮んでも厚みは保ち、小さくなり切ったら滴の丸みに近づく)
			const POOL_THICKNESS = 0.11
			function puddleThickness(f, rp) {
				if (f.role === 'pool')
					return Math.min(
						puddleRadius(f.full) * puddleAppear(f) * POOL_THICKNESS,
						rp * 0.4,
					)
				return rp * (f.role === 'puddle' ? 0.26 : 0.38)
			}
			function liquidFraction(f) {
				return clamp(f.liters / f.full, 0, 1)
			}
			function liquidTopY(f) {
				const tpl = templates[f.stage]
				const frac = liquidFraction(f)
				return lerp(tpl.bottom, tpl.top, frac)
			}
			function setLiquidLevel(f) {
				const tpl = templates[f.stage]
				const frac = liquidFraction(f)
				const m = f.liquid
				if (tpl.mode === 'disc') {
					const k = lerp(0.85, 1, frac)
					m.position.y = lerp(tpl.bottom, tpl.top, frac)
					m.scale.set(k, 1, k)
					return
				}
				// 液の形は中心が原点なので、底を固定したまま高さを縮める
				const k = lerp(0.9, 1, frac)
				m.scale.set(k, Math.max(0.001, frac), k)
				m.position.y = tpl.bottom + ((tpl.top - tpl.bottom) * frac) / 2
			}
			// 吸い切れなかった液体は、小さな水たまりになって周りへ散らばる。散らした量を返す(少なすぎて散らさない時は 0)
			function scatterPellets(x, z, liters, spread) {
				if (liters < 0.005) return 0
				// 散る数は床の液体の合計(かけらを含む)が 120 に近いほど減らす(前からの決まり。かけらが多い時はほぼ 1 粒)。
				// 量を捨てないよう、粒が上限でも遠い粒を消して 1 つは作る
				const floorLiquids =
					foodCount.puddle + foodCount.bit + foodCount.pellet + foodCount.pool
				const n = clamp(
					Math.min(
						FLOOR_LIQUID_SOFT_MAX - floorLiquids,
						Math.round(3 + Math.cbrt(liters)),
					),
					1,
					7,
				)
				for (let i = 0; i < n; i++) {
					makeRoomForPellet()
					const a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3)
					const d = spread * rand(0.8, 1.8)
					createPuddle(
						x + Math.cos(a) * d,
						z + Math.sin(a) * d,
						liters / n,
						'pellet',
						x,
						z,
					)
				}
				return liters
			}
			function updateFoods(dt) {
				for (let i = foods.length - 1; i >= 0; i--) {
					const f = foods[i]
					f.t += dt
					if (f.kind === 'puddle') {
						const u = easeOutQuad(Math.min(1, f.t / 0.35))
						f.x = lerp(f.fromX, f.toX, u)
						f.z = lerp(f.fromZ, f.toZ, u)
						continue
					}
					if (f.vanishing) {
						const u = Math.min(1, f.t / 0.3)
						f.group.scale.setScalar(Math.max(0.001, 1 - easeInQuad(u)))
						if (u >= 1) removeFood(f)
						continue
					}
					f.group.scale.setScalar(
						Math.max(0.001, easeOutBack(Math.min(1, f.t / 0.3))),
					)
					setLiquidLevel(f)
				}
			}

			const PUDDLE_LOBES = [
				[0, 0, 1, 0.8],
				[0.6, 0.36, 0.55, 0.45],
				[-0.55, -0.3, 0.48, 0.6],
			]
			const POOL_LOBES = [
				[0, 0, 1, 0.85],
				[0.55, 0.4, 0.6, 0.5],
				[-0.6, -0.25, 0.55, 0.62],
				[0.35, -0.55, 0.5, 0.45],
				[-0.3, 0.6, 0.45, 0.5],
			]
			// かけらと散った粒は数が多いので、部品 1 つ(平たい液 1 枚)で描く
			const SINGLE_LOBE = [[0, 0, 1, 1]]
			function lobesFor(f, detail) {
				if (detail === 0 || f.role === 'bit' || f.role === 'pellet')
					return SINGLE_LOBE
				return f.role === 'pool' ? POOL_LOBES : PUDDLE_LOBES
			}
			// 縁がぷるぷる揺れる強さ(液の半径に対する割合)と、揺れの速さ
			const FLOOR_WOBBLE = {
				bit: 0.05,
				pellet: 0.05,
				puddle: 0.04,
				pool: 0.025,
			}
			const FLOOR_WOBBLE_SPEED = 4.2
			// 体と同じ黒い液が床に溜まった形: 縁の丸い厚みのある円盤をいくつか溶け合わせて形を不揃いにし、縁を揺らす。
			// 散った粒は宙を飛ぶ間だけ丸い滴
			function drawPuddle(f, t) {
				const rp = puddleSize(f)
				if (rp < 0.005) return
				sdfBegin(f.x, f.z, 1, 0, 0, 1)
				const flying = f.role === 'pellet' ? Math.min(1, f.t / 0.35) : 1
				if (flying < 1) {
					if (sdfChain(rp * 0.3)) {
						sdfSphere(
							f.x,
							rp * 0.45 + Math.sin(Math.PI * flying) * rp * 1.6,
							f.z,
							rp * 0.45,
						)
						sdfEndChain()
					}
					addFloorShadow(f.x, f.z, rp * 0.45)
				} else {
					const h = puddleThickness(f, rp)
					const c = Math.cos(f.yaw)
					const s = Math.sin(f.yaw)
					const lobes = lobesFor(f, detailFor(f.x, 0, f.z, rp))
					// 円盤はすべて 1 つの列に入れ、輪郭どうしを床の上で溶け合わせる(溶け合う幅は液の広さに合わせる)
					if (sdfChain(rp * 0.3, 1)) {
						for (let i = 0; i < lobes.length; i++) {
							// 配列の分割代入は毎回作り捨ての物を作るので、添え字で読む
							const lobe = lobes[i]
							const lx = lobe[0]
							const lz = lobe[1]
							const sx = lobe[2]
							const sz = lobe[3]
							const ox = lx * rp
							const oz = lz * rp
							const x = f.x + ox * c + oz * s
							const z = f.z - ox * s + oz * c
							const foot = (rp * (sx + sz)) / 2
							sdfDisc(
								x,
								z,
								foot,
								h,
								foot * FLOOR_WOBBLE[f.role],
								t * FLOOR_WOBBLE_SPEED + f.yaw * 3 + i * 1.9,
								h * 0.2,
							)
							addFloorShadow(x, z, foot)
						}
						sdfEndChain()
					}
					if (f.role === 'pool') setPoolDents(f, rp, h)
				}
				if (f.linkFrame === drawFrame)
					for (const link of links) if (link.target === f) addTubeTip(link)
				sdfEnd()
			}
			// 管を刺した所を液の中心からの位置で渡す。刺した直後は凹みを少しずつ深くする
			function setPoolDents(f, rp, h) {
				const D = sdf.proxy.u.uDent.value
				let n = 0
				for (const link of f.suckers) {
					if (link.phase !== 'suck') continue
					const deep = Math.min(1, link.t / 0.3)
					if (deep < 0.02) continue
					for (let k = 0; k < link.tubes && n < SDF_MAX_DENTS; k++) {
						setupTube(link, k)
						D[n * 4] = tubeTip.x - sdf.ox
						D[n * 4 + 1] = tubeTip.z - sdf.oz
						// 凹みは液の広さに合わせて広げ、縮んだ水たまりでも急な壁にならない幅を保つ(急な壁は縁の紫に光り、ざらついて見えた)
						D[n * 4 + 2] = Math.max(rp * 0.5, h * 3.5)
						D[n * 4 + 3] = h * deep
						n++
					}
				}
				sdf.proxy.u.uDentCount.value = n
			}

			/* ========== 吸い込み(管でつながって量が移る) ========== */
			const links = []
			const EXTEND_SECONDS = 0.12
			// 管が離れる時は、細い糸になって伸び、切れて両側へ縮んで消える
			const RETRACT_SECONDS = 0.25
			// 触手の嵐の管: 太さはふつうの管のこの割合。粘りを見せるため、離れる時は真ん中がくびれてからちぎれるまで長めにかける
			const STORM_TUBE_THIN = 0.4
			const STORM_RETRACT_SECONDS = 0.4
			function retractSeconds(link) {
				return link.storm ? STORM_RETRACT_SECONDS : RETRACT_SECONDS
			}
			// 相手役を吸っている間に「+◯L」を出す間隔
			const GAIN_POP_INTERVAL = 0.5

			// storm: 触手の嵐で伸ばした管。遠くから伸ばすので、切れる距離を嵐の届く範囲に合わせる。
			// 嵐の管はアイテム(items の 1 つ)にも伸ばす。アイテムは吸わずに、管が届いたら飲ませる
			function startLink(eater, target, isBlob, storm = false) {
				const pool = target.role === 'pool'
				const item = items.includes(target)
				// 床の液体を吸う管は 1 本だけ。吸われている途中の物を横取りする時は前の管を外す(それまでに移った分は前の吸う側に残る)
				if (!isBlob && !pool && target.capturedBy)
					cutLink(target.capturedBy, 'stolen')
				const link = {
					eater,
					target,
					isBlob,
					storm,
					item,
					// 大きな水たまりは何者かで同時に吸い、1 者が管を何本も刺す
					pool,
					tubes: pool ? POOL_TUBES : 1,
					// 管の先を横へ広げる幅(大きな水たまりの管だけ)
					spread: 0,
					phase: 'extend',
					ext: 0,
					t: 0,
					rt: 0,
					// 床の液体は決まった秒数で飲み干す。液体同士は繋がっている間ずっと少しずつ吸う
					T: isBlob || item ? 0 : suckSeconds(target.liters),
					total: isBlob || item ? 0 : target.liters,
					// 液体同士を吸う速さは繋がった時の大きさの比、大きな水たまりは水たまりの量と刺した時の吸う側の量で決める
					rate: isBlob
						? drainFraction(sizeR(eater) / sizeR(target))
						: pool
							? Math.min(
									target.full / POOL_DRAIN_SECONDS,
									eater.mass * POOL_DRINK_RATE,
								)
							: 0,
					moved: 0,
					popAcc: 0,
					popT: 0,
					// 吸い終わって相手が消えた管は、相手側へは縮まず吸う側へ引き戻す
					targetGone: false,
					// 大きな水たまりを吸い切った時に、管を通って吸い込まれる最後のひとしずくの半径
					lastDrop: 0,
					ax: 0,
					ay: 0,
					az: 0,
					bx: 0,
					by: 0,
					bz: 0,
					er: 0,
				}
				if (isBlob) {
					// 吸い切りの下限は、誰にも吸われていない状態から吸われ始めた時の量で決める
					if (target.suckers.length === 0) target.drainRef = target.mass
					target.suckers.push(link)
					// 吸われた相手役はすぐ逃げる向きを考え直す
					if (!target.isPlayer) target.thinkT = Math.min(target.thinkT, 0.05)
				} else if (pool) target.suckers.push(link)
				else target.capturedBy = link
				eater.links.push(link)
				links.push(link)
				updateLinkEnds(link)
				// 小さい物を吸い始めた時の音は鳴らさない(かけらを吸うたびに鳴り、発注者に「ペシペシ」と聞こえたため)
				if (eater === body && (isBlob || target.stage >= 3)) {
					// 水ぶくぶくが鳴っている間(たくさん吸っている時)は、間引いて小さくし、連打でうるさくしない
					const many = slurpLinks() > 0
					playSound('big', {
						maxVoices: many ? 1 : 3,
						volume: many ? 0.5 : 1,
						minGap: many ? 0.15 : 0.04,
						rate: rand(0.9, 1.12),
					})
				}
				if (target === body) onPlayerSucked()
			}
			function detachLink(link) {
				link.phase = 'retract'
				link.rt = 0
				const list = link.eater.links
				const i = list.indexOf(link)
				if (i >= 0) list.splice(i, 1)
				const target = link.target
				if (link.isBlob || link.pool) {
					const j = target.suckers.indexOf(link)
					if (j >= 0) target.suckers.splice(j, 1)
				} else if (target.capturedBy === link) target.capturedBy = null
				if (link.item) target.grabbed = false
			}
			// reason: break(離れすぎ・大きさの差が足りなくなった) / stop(時間切れ) / stolen(横取り) / gone(相手が消えた) / reset(片付け)
			function cutLink(link, reason) {
				if (link.phase === 'retract') return
				detachLink(link)
				if (reason !== 'reset') flushGainPop(link)
			}
			function finishFood(link) {
				detachLink(link)
				link.targetGone = true
				const { eater, target } = link
				if (target.kind === 'puddle') removeFood(target)
				else {
					target.liters = 0
					target.vanishing = true
					target.t = 0
				}
				eater.gulp = 0.06
				flushGainPop(link)
			}
			// 下限を下回った液体の残りを一気に吸い切る。残りの一部は粒として散らばる
			function devourBlob(link) {
				const { eater, target } = link
				const rest = target.mass
				const gain =
					rest -
					scatterPellets(
						target.x,
						target.z,
						rest * FINISH_SPILL_RATIO,
						target.R,
					)
				setMass(target, 0)
				gainMass(eater, gain)
				link.moved += gain
				link.popAcc += gain
				if (target === body) body.lossAcc += rest
				removeBlob(target)
				detachLink(link)
				link.targetGone = true
				flushGainPop(link)
				// 他に吸っていた側はそこまでの分だけ、吸い切られた側が吸っていた相手は残りの量が助かる
				for (const l of [...target.suckers]) {
					cutLink(l, 'gone')
					l.targetGone = true
				}
				for (const l of [...target.links]) cutLink(l, 'gone')
				eater.gulp = 0.08
				ghosts.push({ b: target, t: 0, eater })
				if (target === body) onPlayerDevoured()
			}
			function updateLinkEnds(link) {
				const e = link.eater
				if (!e.dead) {
					const Rv = visualRadius(e)
					link.ax = e.x
					// 体同士が近くても見えるよう、管は体の上の方から出す
					link.ay = (LEG_STYLES[e.stage].lift + 0.3) * Rv
					link.az = e.z
					link.er = Rv
				}
				const t = link.target
				if (t.dead) return
				link.bx = t.x
				link.bz = t.z
				if (link.isBlob) {
					// 管の先は相手の中心ではなく、吸う側に向いた上の面に刺す
					const Rv = visualRadius(t)
					const h = Math.hypot(t.x - link.ax, t.z - link.az) || 1
					link.bx -= ((t.x - link.ax) / h) * Rv * 0.3
					link.bz -= ((t.z - link.az) / h) * Rv * 0.3
					link.by = (LEG_STYLES[t.stage].lift + 0.25) * Rv
				} else if (link.pool) {
					// 大きな水たまりには、吸う側に近い縁の内側へ管を横に並べて刺す
					const rp = puddleSize(t)
					const h = Math.hypot(t.x - link.ax, t.z - link.az) || 1
					const inset = Math.min(h * 0.5, rp * 0.55)
					link.bx -= ((t.x - link.ax) / h) * inset
					link.bz -= ((t.z - link.az) / h) * inset
					link.by = puddleThickness(t, rp) * 0.3
					link.spread = rp * 0.35
				} else if (link.item) link.by = t.r * 0.3
				else
					link.by =
						t.kind === 'puddle'
							? puddleThickness(t, puddleSize(t)) * 0.5
							: liquidTopY(t)
			}
			function updateLinks(dt) {
				for (let i = links.length - 1; i >= 0; i--) {
					const link = links[i]
					if (link.phase === 'retract') {
						link.rt += dt
						updateLinkEnds(link)
						if (link.rt >= retractSeconds(link)) links.splice(i, 1)
						continue
					}
					if (link.phase === 'extend') {
						link.ext += dt / EXTEND_SECONDS
						if (link.ext >= 1) {
							link.ext = 1
							link.phase = 'suck'
						}
					}
					updateLinkEnds(link)
					if (link.phase !== 'suck') continue
					if (link.isBlob) suckBlob(link, dt)
					else if (link.pool) suckPool(link, dt)
					else suckFood(link, dt)
				}
			}
			// 床の液体と入れ物から移った量を吸う側に足す。自分は FOOD_GAIN 倍、成長促進剤が効いている間はさらに倍に増える
			function addFoodGain(link, amount) {
				const rate = foodGainRate(link.eater)
				if (rate > FOOD_GAIN) link.boosted = true
				link.popAcc += amount * rate
				gainMass(link.eater, amount * rate)
			}
			function suckFood(link, dt) {
				const { eater, target } = link
				// 入れ物と水たまりは動かないので、吸う側が離れすぎたら管が切れて残りは対象に残る
				// 嵐の管でアイテムを掴んだ時は、吸わずに飲ませて引き戻す
				if (link.item) {
					if (items.includes(target) && target.drinkT < 0) target.drinkT = 0
					detachLink(link)
					link.targetGone = true
					return
				}
				const breakDistance = Math.max(
					eater.isPlayer && giantActive()
						? Math.max(
								sizeR(eater) * 3,
								reachRadius(eater) * 1.3 +
									(target.kind === 'container'
										? STAGES[target.stage].f
										: puddleSize(target)),
							)
						: eater.R * 3,
					link.storm ? stormRange() * BREAK_RATIO : 0,
				)
				if (Math.hypot(link.bx - eater.x, link.bz - eater.z) > breakDistance) {
					cutLink(link, 'break')
					return
				}
				link.t += dt
				const want = Math.min(link.total, (link.total * link.t) / link.T)
				const amount = Math.min(want - link.moved, target.liters)
				if (amount > 0) {
					link.moved += amount
					target.liters -= amount
					addFoodGain(link, amount)
				}
				if (link.t >= link.T) finishFood(link)
			}
			// 大きな水たまりは、吸う側の量に比例した速さで少しずつ吸う。何者かが同時に吸えるので取り合いになる
			function suckPool(link, dt) {
				const { eater, target } = link
				const d = Math.hypot(target.x - eater.x, target.z - eater.z)
				// 切れる距離は満タンの時の広さで決める。吸われて縮むたびに管が切れないように(管の先は縮む縁に付いていく)
				if (
					d >
					reachRadius(eater) +
						puddleRadius(target.full) * 1.1 +
						sizeR(eater) * 0.5
				) {
					cutLink(link, 'break')
					return
				}
				link.t += dt
				const amount = Math.min(target.liters, link.rate * dt)
				target.liters -= amount
				link.moved += amount
				addFoodGain(link, amount)
				if (target.liters <= target.full * POOL_FINISH) {
					// 残りを吸い切った者が最後の分をもらい、他の吸っていた側の管は吸う側へ引き戻す。
					// 最後に残った液は、ひとしずくになって縮む管の先と一緒に吸う側へ吸い込まれる
					link.lastDrop = Math.min(puddleSize(target) * 0.6, link.er * 0.22)
					link.moved += target.liters
					addFoodGain(link, target.liters)
					target.liters = 0
					detachLink(link)
					link.targetGone = true
					for (const l of [...target.suckers]) {
						cutLink(l, 'gone')
						l.targetGone = true
					}
					removeFood(target)
					eater.gulp = 0.08
					flushGainPop(link)
					return
				}
				link.popT += dt
				if (link.popT >= GAIN_POP_INTERVAL) {
					link.popT = 0
					flushGainPop(link)
				}
			}
			// 液体同士は、繋がっている間だけ一定の速さで少しずつ吸う。離れて管が切れれば残りは助かる
			function suckBlob(link, dt) {
				const { eater, target } = link
				const d = Math.hypot(target.x - eater.x, target.z - eater.z)
				const reach = link.storm
					? Math.max(contactDistance(eater, target), stormRange())
					: contactDistance(eater, target)
				if (d > reach * BREAK_RATIO || !canEat(eater, target)) {
					cutLink(link, 'break')
					return
				}
				link.t += dt
				const amount = Math.min(target.mass, target.drainRef * link.rate * dt)
				setMass(target, target.mass - amount)
				gainMass(eater, amount)
				link.moved += amount
				link.popAcc += amount
				if (target === body) body.lossAcc += amount
				if (target.mass <= target.drainRef * DRAIN_FLOOR) {
					devourBlob(link)
					return
				}
				link.popT += dt
				if (link.popT >= GAIN_POP_INTERVAL) {
					link.popT = 0
					flushGainPop(link)
				}
			}

			/* ========== 管の形 ========== */
			// ゴクッ、ゴクッ: 膨らみが一定間隔で対象側から吸う側へ流れる
			const GULP_INTERVAL = 0.3
			const GULP_TRAVEL = 0.4
			const TUBE_SEGS = 8
			const tubeStart = new THREE.Vector3()
			const tubeTip = new THREE.Vector3()
			const tubeCtrl = new THREE.Vector3()
			const tubeA = new THREE.Vector3()
			const tubeB = new THREE.Vector3()
			// 吸う側(u=0)から先端(u=1)までの弧を決める。弧の頂点は体の上に持ち上げ、重なった体に埋もれないようにする。
			// k は何本目の管か。何本も刺す時は先端を横に並べる
			function setupTube(link, k) {
				const h = Math.hypot(link.bx - link.ax, link.bz - link.az) || 1
				const ux = (link.bx - link.ax) / h
				const uz = (link.bz - link.az) / h
				const side = link.spread * (k - (link.tubes - 1) / 2)
				tubeStart.set(
					link.ax + ux * link.er * 0.3,
					link.ay,
					link.az + uz * link.er * 0.3,
				)
				tubeTip.set(link.bx - uz * side, link.by, link.bz + ux * side)
				if (link.phase === 'extend')
					tubeTip.lerpVectors(tubeStart, tubeTip, clamp(link.ext, 0, 1))
				const len = tubeStart.distanceTo(tubeTip)
				tubeCtrl.addVectors(tubeStart, tubeTip).multiplyScalar(0.5)
				tubeCtrl.y += len * 0.35 + link.er * 0.3
				return len
			}
			function tubePoint(u, out) {
				const a = (1 - u) * (1 - u)
				const b = 2 * u * (1 - u)
				const c = u * u
				out.set(
					a * tubeStart.x + b * tubeCtrl.x + c * tubeTip.x,
					a * tubeStart.y + b * tubeCtrl.y + c * tubeTip.y,
					a * tubeStart.z + b * tubeCtrl.z + c * tubeTip.z,
				)
			}
			// 太さ(半径)は吸う側の半径の 0.13 倍(何本も刺す時は細め)。吸っている間は、管の半径を流れる波で太らせる。
			// 何本も刺した管は、膨らみが流れる時刻を少しずつずらす
			function tubeBase(link) {
				return (
					link.er *
					(link.tubes > 1 ? 0.09 : 0.13) *
					(link.storm ? STORM_TUBE_THIN : 1)
				)
			}
			function tubeRadius(link, u, tube) {
				let rad = tubeBase(link) * lerp(1, 0.75, u)
				if (link.storm && link.phase !== 'suck') return rad * stormNeck(link, u)
				if (link.phase !== 'suck') return rad * retractThin(link)
				const time = link.t + tube * 0.11
				const p = time / GULP_INTERVAL
				for (let k = Math.floor(p) - 2; k <= Math.floor(p); k++) {
					if (k < 0) continue
					const age = (time - k * GULP_INTERVAL) / GULP_TRAVEL
					if (age < 0 || age > 1) continue
					const q = (u - (1 - age)) / 0.2
					rad += tubeBase(link) * 0.8 * Math.exp(-q * q)
				}
				return rad
			}
