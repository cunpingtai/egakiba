			function bodyRoom(share) {
				const r = bodyScreenRect()
				const cx = window.innerWidth / 2
				const cy = window.innerHeight / 2
				let room = Infinity
				const fit = (space, span) => {
					if (span > 1) room = Math.min(room, (space / span) * share)
				}
				fit(cx, cx - r.left)
				fit(cx, r.right - cx)
				fit(cy, cy - r.top)
				fit(cy, r.bottom - cy)
				return room
			}
			// 画面の四隅を一周する順に並べる(映っている地面の面積を求めるため)
			const SCREEN_CORNERS = [
				[-1, -1],
				[1, -1],
				[1, 1],
				[-1, 1],
			]
			function baseCameraDistance() {
				const portrait = window.innerHeight >= window.innerWidth
				// 縦画面は横幅が狭く、7R+3 では体と触手が横幅からはみ出したため距離を広げた
				return (
					(CAM_DIST_PER_R * cam.focusR + CAM_DIST_BASE) * (portrait ? 1 : 0.75)
				)
			}
			// 画面の四隅が地面に当たる所までの距離と、画面に映っている地面の面積。湧きと片付けの範囲・かけらの数に使う
			const cornerHits = SCREEN_CORNERS.map(() => new THREE.Vector3())
			function measureViewRange() {
				let far = 0
				let allHit = true
				SCREEN_CORNERS.forEach(([x, y], i) => {
					pointerNdc.set(x, y)
					raycaster.setFromCamera(pointerNdc, camera)
					if (raycaster.ray.intersectPlane(groundPlane, cornerHits[i])) {
						far = Math.max(
							far,
							Math.hypot(cornerHits[i].x - cam.x, cornerHits[i].z - cam.z),
						)
					} else {
						far = Math.max(far, cam.dist * 2)
						allHit = false
					}
				})
				cam.viewRange = far
				let area = 0
				for (let i = 0; i < cornerHits.length; i++) {
					const a = cornerHits[i]
					const b = cornerHits[(i + 1) % cornerHits.length]
					area += a.x * b.z - b.x * a.z
				}
				cam.screenArea = allHit ? Math.abs(area) / 2 : far * far
			}
			function aimCamera() {
				scene.fog.near = cam.dist * 1.1
				scene.fog.far = cam.dist * 2.8
				camera.near = Math.max(0.1, cam.dist * 0.01)
				camera.far = cam.dist * 6
				camera.updateProjectionMatrix()
				camera.position.set(
					cam.x,
					Math.sin(CAM_PITCH) * cam.dist,
					cam.z + Math.cos(CAM_PITCH) * cam.dist,
				)
				camera.lookAt(cam.x, 0, cam.z)
				camera.updateMatrixWorld()
			}
			// 結果画面では、大きくなった体を画面の真ん中に大きく映す(縦画面で横幅の RESULT_BODY_WIDTH ほど、高さは RESULT_BODY_HEIGHT まで)。
			// 文字の板とボタンは体の上に重ねる(板の下地があるので文字は読める)。空きに収めると小さく見えたため
			const RESULT_BODY_WIDTH = 0.7
			const RESULT_BODY_HEIGHT = 0.8
			function aimResultCamera(realDt) {
				const w = window.innerWidth
				const h = window.innerHeight
				aimCamera()
				const r = bodyScreenRect()
				const scale = Math.max(
					(r.right - r.left) / (w * RESULT_BODY_WIDTH),
					(r.bottom - r.top) / (h * RESULT_BODY_HEIGHT),
				)
				cam.dist += (cam.dist * scale - cam.dist) * damp(4, realDt)
				aimCamera()
				// 体の範囲の中心と、体の足元の点の画面上のずれを保ったまま、足元の点を置く画面の位置を決める
				const r2 = bodyScreenRect()
				projected.set(body.x, 0, body.z).project(camera)
				const footX = (projected.x * 0.5 + 0.5) * w
				const footY = (-projected.y * 0.5 + 0.5) * h
				const tx = w / 2 - ((r2.left + r2.right) / 2 - footX)
				const ty = h / 2 - ((r2.top + r2.bottom) / 2 - footY)
				// 見下ろす向きは同じなので、カメラの見ている点と、画面のその位置に映る地面の点のずれは、どこへ動かしても変わらない
				pointerNdc.set((tx / w) * 2 - 1, -(ty / h) * 2 + 1)
				raycaster.setFromCamera(pointerNdc, camera)
				if (!raycaster.ray.intersectPlane(groundPlane, hitPoint)) return
				const wantX = body.x - (hitPoint.x - cam.x)
				const wantZ = body.z - (hitPoint.z - cam.z)
				cam.x += (wantX - cam.x) * damp(6, realDt)
				cam.z += (wantZ - cam.z) * damp(6, realDt)
				aimCamera()
			}
			function updateCamera(dt, realDt, realTime) {
				if (state === 'result' && !body.dead) {
					aimResultCamera(realDt)
					measureViewRange()
					followGround()
					return
				}
				// 吸い切られた後は寄らずに、引いたまま吸い切られる様子を見せる
				fever.t += realDt
				if (!body.dead) {
					const want = body.dispR * giantScale
					if (cam.holdT > 0) cam.holdT -= realDt
					else if (cam.slowT > 0) {
						cam.slowT -= realDt
						cam.focusR += (want - cam.focusR) * damp(2, realDt)
					} else {
						cam.focusR = want
						cam.fitDist = 0
					}
				}
				const target = Math.max(baseCameraDistance(), cam.fitDist)
				cam.dist += (target - cam.dist) * damp(3, dt)
				cam.x += (body.x - cam.x) * damp(6, dt)
				cam.z += (body.z - cam.z) * damp(6, dt)
				aimCamera()
				// 体と触手が画面の端に近づいたら、その分だけすぐ引く(膨らんだ後はカメラを止めているので、待つとはみ出す)。
				// 先に引いた距離は、ゆっくり引き終えるまで覚え、引いた後に戻らないようにする。
				// 斜めに見下ろすので 1 回では収まり切らないことがあり、3 回まで詰める
				const share = giantActive() ? CAM_GIANT_FIT_SHARE : CAM_FIT_SHARE
				for (let i = 0; i < 3 && !body.dead; i++) {
					const room = bodyRoom(share)
					if (room >= 1) break
					cam.dist /= room
					cam.fitDist = Math.max(cam.fitDist, cam.dist)
					aimCamera()
				}
				measureViewRange()
				followGround()
				// 揺れの量は足し算で溜め、1 秒に 1.6 ずつ減らす。ずらす幅は量の 2 乗
				cam.trauma = Math.max(0, cam.trauma - 1.6 * realDt)
				if (cam.trauma > 0) {
					const amount =
						cam.trauma * cam.trauma * 0.07 * cam.dist * MOTION_SCALE
					camera.translateX(
						Math.sin(realTime * 71.3) * Math.cos(realTime * 13.1) * amount,
					)
					camera.translateY(
						Math.cos(realTime * 63.7) * Math.sin(realTime * 17.9) * amount,
					)
					camera.updateMatrixWorld()
				}
			}
			function placeCamera() {
				cam.holdT = 0
				cam.slowT = 0
				cam.fitDist = 0
				fever.t = Infinity
				cam.focusR = body.dispR * giantScale
				cam.x = body.x
				cam.z = body.z
				cam.dist = baseCameraDistance()
				cam.trauma = 0
				updateCamera(0, 0, 0)
			}

			/* ========== 透明な衝撃波(画面全体のゆがみ) ========== */
			const sceneTarget = new THREE.WebGLRenderTarget(1, 1, {
				samples: 4,
				type: THREE.HalfFloatType,
			})
			const wave = { active: false, time: 0, strength: 0 }
			const waveMaterial = new THREE.ShaderMaterial({
				uniforms: {
					tScene: { value: sceneTarget.texture },
					uRes: { value: new THREE.Vector2(1, 1) },
					uCenter: { value: new THREE.Vector2() },
					uTime: { value: 0 },
					uStrength: { value: 0 },
					uScale: { value: 1 },
				},
				vertexShader: /* glsl */ `
					varying vec2 vUv;
					void main() {
						vUv = uv;
						gl_Position = vec4(position.xy, 0.0, 1.0);
					}
				`,
				fragmentShader: /* glsl */ `
					uniform sampler2D tScene;
					uniform vec2 uRes;
					uniform vec2 uCenter;
					uniform float uTime;
					uniform float uStrength;
					uniform float uScale;
					varying vec2 vUv;
					void main() {
						vec2 p = vUv * uRes;
						vec2 d = p - uCenter;
						float dist = length(d);
						float wl = 120.0 * uScale;
						float reach = 520.0 * uScale;
						float x = dist - 900.0 * uScale * uTime;
						float life = 1.0 - uTime / 0.6;
						float env = exp(-(x * x) / (wl * wl * 0.25)) * life * (1.0 - smoothstep(reach * 0.6, reach, dist));
						float crest = sin(x / wl * 6.2831853);
						vec2 dir = dist > 0.001 ? d / dist : vec2(0.0);
						vec2 uv = (p - dir * crest * 18.0 * uScale * uStrength * env) / uRes;
						vec4 color = texture2D(tScene, uv);
						gl_FragColor = color;
						#include <colorspace_fragment>
					}
				`,
				depthTest: false,
				depthWrite: false,
			})
			const postScene = new THREE.Scene()
			const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
			postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), waveMaterial))
			const projected = new THREE.Vector3()

			function startWave(strength) {
				wave.active = true
				wave.time = 0
				wave.strength = strength * MOTION_SCALE
			}
			function updateWave(realDt) {
				if (!wave.active) return
				wave.time += realDt
				if (wave.time >= 0.6) {
					wave.active = false
					waveMaterial.uniforms.uStrength.value = 0
					return
				}
				const res = waveMaterial.uniforms.uRes.value
				projected.set(body.x, 0.45 * visualRadius(body), body.z).project(camera)
				waveMaterial.uniforms.uCenter.value.set(
					(projected.x * 0.5 + 0.5) * res.x,
					(projected.y * 0.5 + 0.5) * res.y,
				)
				waveMaterial.uniforms.uTime.value = wave.time
				waveMaterial.uniforms.uStrength.value = wave.strength
			}

			/* ========== 毎コマの描画(体・管・水たまり・影と印) ========== */
			// 管の先まで含めて画面に映るかを見るための、吸う側から管の先までの最大の距離
			function tubeSpan(b) {
				let span = 0
				for (const link of links)
					if (link.eater === b)
						span = Math.max(span, Math.hypot(link.bx - b.x, link.bz - b.z))
				return span
			}
			// 巨大化中の体は金色に光る。終わる前の GIANT_WARN_SECONDS 秒は、点滅させずにゆっくり弱めていく(点滅は白くチカチカして見えたため)
			// 体は黒いままにし、縁を金色に光らせる。体全体の色づけは弱く(以前の 0.75 の 3 割)する
			// (発注者「黄色もう少し減らしたい」。体全体が黄色く光って見えたため)
			function setGiantTint() {
				const c = ITEM_TYPES.giant.tint
				const fade = Math.min(1, itemTimers.giant / GIANT_WARN_SECONDS)
				sdf.proxy.u.uTint.value.set(c[0], c[1], c[2], 0.225 * fade)
				sdf.proxy.u.uRim.value.set(c[0], c[1], c[2], 1.2 * fade)
			}
			// 触手の嵐が効いている体は縁が紫に強く光る(明るさを上下させるとチカチカして見えたため脈打たせない)。最後の 0.3 秒で消えていく
			function setStormRim() {
				const c = ITEM_TYPES.storm.tint
				const fade = Math.min(1, itemTimers.storm / 0.3)
				sdf.proxy.u.uRim.value.set(c[0], c[1], c[2], 1.6 * 0.85 * fade)
			}
			// 床のアイテム: 液体と同じ描き方の小さな溜まりに色を足し、足元に足し算で重ねる柔らかい光を敷いて遠くからでも分かるようにする。
			// 光はゆっくり脈打つ(動きを減らす設定では脈打たない)。飲まれる間は縮みながら自分の方へ吸い込まれる
			const itemGlowTexture = makeRadialTexture([
				[0, 'rgba(255,255,255,0.95)'],
				[0.3, 'rgba(255,255,255,0.4)'],
				[1, 'rgba(255,255,255,0)'],
			])
			const itemGlows = {}
			for (const [type, def] of Object.entries(ITEM_TYPES)) {
				const glow = new THREE.Mesh(
					shadowGeometry,
					new THREE.MeshBasicMaterial({
						map: itemGlowTexture,
						color: new THREE.Color(def.tint[0], def.tint[1], def.tint[2]),
						transparent: true,
						blending: THREE.AdditiveBlending,
						depthWrite: false,
						fog: false,
					}),
				)
				glow.renderOrder = 3
				glow.visible = false
				scene.add(glow)
				itemGlows[type] = glow
			}
			function drawItem(it, t) {
				let s = Math.max(0.001, easeOutBack(Math.min(1, it.t / 0.3)))
				let dx = 0
				let dz = 0
				if (it.drinkT >= 0) {
					const u = easeInQuad(Math.min(1, it.drinkT / ITEM_DRINK_SECONDS))
					s *= 1 - u
					dx = (body.x - it.x) * u
					dz = (body.z - it.z) * u
				}
				if (s < 0.02 || !isOnScreen(it.x + dx, it.z + dz, it.r * 4)) return
				// 明るさは上下させない(チカチカして見えたため)
				const pulse = 0.8
				const c = ITEM_TYPES[it.type].tint
				sdfBegin(it.x, it.z, s, dx, dz, 1)
				sdf.proxy.u.uTint.value.set(c[0], c[1], c[2], 0.55 + 0.45 * pulse)
				if (sdfChain(it.r * 0.3, 1)) {
					sdfDisc(
						it.x,
						it.z,
						it.r,
						it.r * 0.42,
						it.r * 0.05,
						t * FLOOR_WOBBLE_SPEED + it.yaw * 3,
						it.r * 0.12,
					)
					sdfEndChain()
				}
				sdfEnd()
				addFloorShadow(it.x + dx, it.z + dz, it.r * s)
				const glow = itemGlows[it.type]
				glow.visible = true
				glow.position.set(it.x + dx, 0.02, it.z + dz)
				const g = it.r * 7 * s * (0.85 + 0.15 * pulse)
				glow.scale.set(g, 1, g)
				glow.material.opacity = 0.35 + 0.35 * pulse
			}
			// 管がつながっている物だけに印を付け、液体を描くたびに全部の管をなめないようにする
			let drawFrame = 0
			function drawWorld(t) {
				drawFrame++
				for (const link of links) {
					link.eater.linkFrame = drawFrame
					link.target.linkFrame = drawFrame
				}
				sdfFrameStart()
				floorShadows.count = 0
				liquidUniforms.uTime.value = t
				for (const b of blobs) {
					const Rv = visualRadius(b)
					if (
						!isOnScreen(b.x, b.z, Rv * 2 + tubeSpan(b)) ||
						sdf.used >= CAP.liquidDraws
					)
						continue
					sdfBegin(b.x, b.z)
					if (b.isPlayer && giantActive()) setGiantTint()
					if (b.isPlayer && itemTimers.storm > 0) setStormRim()
					drawBlobShape(b, t, detailFor(b.x, Rv * 0.5, b.z, Rv))
					sdfEnd()
				}
				for (const g of ghosts) {
					const u = easeInQuad(g.t / GHOST_SECONDS)
					const s = 1 - u
					if (s < 0.02 || sdf.used >= CAP.liquidDraws) continue
					const { b, eater } = g
					sdfBegin(
						b.x,
						b.z,
						s,
						(eater.x - b.x) * u * 0.8,
						(eater.z - b.z) * u * 0.8,
					)
					drawBlobShape(b, t, 1)
					sdfEnd()
				}
				for (const f of foods) {
					if (sdf.used >= CAP.liquidDraws) break
					if (f.kind === 'puddle' && isOnScreen(f.x, f.z, puddleSize(f) * 1.5))
						drawPuddle(f, t)
				}
				for (const glow of Object.values(itemGlows)) glow.visible = false
				for (const it of items) {
					if (sdf.used >= CAP.liquidDraws) break
					drawItem(it, t)
				}

				sdfFrameEnd()
				floorShadows.instanceMatrix.needsUpdate = true
				updateShadowsAndMarks()
			}
			// 液体の描き方が使うカメラの値を、揺れまで反映した後で渡す
			function updateLiquidUniforms() {
				liquidUniforms.uViewProj.value.multiplyMatrices(
					camera.projectionMatrix,
					camera.matrixWorldInverse,
				)
				camera.getWorldDirection(liquidUniforms.uCamDir.value)
				liquidUniforms.uFogRange.value.set(scene.fog.near, scene.fog.far)
				liquidUniforms.uPixel.value =
					(2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) /
					liquidTarget.height
				liquidUniforms.uEdgePx.value =
					0.8 * renderer.getPixelRatio() * liquidScale
			}
			function updateShadowsAndMarks() {
				const showMarks = state === 'play' && !body.dead
				// 印の明るさは上下させない(チカチカして見えたため)
				dangerMarkMaterial.opacity = 0.8
				for (const b of blobs) {
					const Rv = visualRadius(b)
					b.shadow.position.set(b.x, 0.012, b.z)
					b.shadow.scale.set(Rv * 4.2, 1, Rv * 4.2)
					if (!b.mark) continue
					let material = null
					if (showMarks) {
						if (canEat(body, b)) material = edibleMarkMaterial
						else if (canEat(b, body)) material = dangerMarkMaterial
					}
					b.mark.visible = material !== null
					if (!material) continue
					b.mark.material = material
					// 危険の印は脈打たせない(チカチカをやめた)。大きさだけ少し大きくして見分けやすくする
					const s = Rv * 3.6 * (material === dangerMarkMaterial ? 1.06 : 1)
					b.mark.position.set(b.x, 0.016, b.z)
					b.mark.scale.set(s, 1, s)
				}
			}

			/* ========== 画面(HTML)の部品 ========== */
			const ui = {
				hud: $('hud'),
				danger: $('danger'),
				timer: $('timer'),
				liters: $('liters'),
				litersNum: $('liters-num'),
				litersUnit: $('liters-unit'),
				drinkable: $('drinkable'),
				progressFill: $('progress-fill'),
				sizeGauge: $('size-gauge'),
				next: $('next'),
				pops: $('pops'),
				hint: $('hint'),
				toast: $('toast'),
				levelup: $('levelup'),
				dangerUp: $('danger-up'),
				safeProbe: $('safe-probe'),
				itemUp: $('item-up'),
				itemUpTitle: $('item-up-title'),
				itemUpSub: $('item-up-sub'),
				itemTimers: {
					giant: $('item-timer-giant'),
					boost: $('item-timer-boost'),
					storm: $('item-timer-storm'),
				},
				quitButton: $('quit-button'),
				quitConfirm: $('quit-confirm'),
				quitNo: $('quit-no'),
				resultMode: $('result-mode'),
				resultExtra: $('result-extra'),
				hudTop: document.querySelector('.hud-top'),
				levelupTitle: $('levelup-title'),
				levelupSub: $('levelup-sub'),
				finish: $('finish'),
				finishText: $('finish-text'),
				stickBase: $('stick-base'),
				stickKnob: $('stick-knob'),
				titleScreen: $('title-screen'),
				resultScreen: $('result-screen'),
				resultReason: $('result-reason'),
				resultLiters: $('result-liters'),
				resultTitle: $('result-title'),
				resultCompare: $('result-compare'),
				saveImage: $('save-image'),
				imageButton: $('image-button'),
			}
			// 指で操作できる端末では指の操作だけを案内する(マウスの文は指では使えず、長くて狭い画面からはみ出した)
			const hasTouch =
				matchMedia('(any-pointer: coarse)').matches ||
				navigator.maxTouchPoints > 0

			// 画面の文字の入れ替え(data-t・題名・html の lang・選んでいる言葉の印)は window.kuroLang が済ませている。
			// ここは本体だけが持つ表示(遊び方の案内文・入れ物の段の名前)を今の言葉に合わせ直す
			function applyLangToHud() {
				$('hint-move').textContent =
					isFinePointer && !hasTouch ? T.hintMouse : T.hintTouch
				shownStage = -1
			}
			function chooseLang(next) {
				window.kuroLang.choose(next)
				lang = window.kuroLang.lang
				T = TEXT[lang]
				applyLangToHud()
			}
			for (const button of document.querySelectorAll('.lang'))
				button.addEventListener('click', () => chooseLang(button.dataset.lang))

			function restartAnimation(el, className) {
				el.classList.remove(className)
				void el.offsetWidth
				el.classList.add(className)
			}

			// 合計量の表示: 吸った数字が飛んで吸い込まれた分だけ増やす。
			// 表示を向かわせる値 = 点数 − 飛んでいる途中の量 − まだ数字にしていない量。向かう時は COUNT_SECONDS で数え上がる(下がる)
			const COUNT_SECONDS = 0.3
			// 吸い込まれた瞬間のふくらみ(倍率と、ふくらんで戻るまでの秒数)
			const ABSORB_BUMP = 1.25
			const ABSORB_BUMP_SECONDS = 0.18
			let litersShown = START_LITERS
			let litersPending = 0
			const litersCount = { from: START_LITERS, to: START_LITERS, t: 1 }
			let absorbT = 1
			// 文字の幅は文字数から見積もり、残り時間とぶつからない幅(litersMaxW)を超える時だけ縮める(毎コマ配置を読み出さない)
			let litersFontPx = 23
			let litersMaxW = 100
			let litersFit = 1
			let litersEstEm = 60 / 23
			// 合計量の右端と縦の中心(飛ぶ数字の行き先)。画面の大きさが変わった時と、表示を出した時に 1 回だけ読む
			const litersAnchor = { right: 0, cy: 0, dirty: true }
			let shownLitersTransform = ''
			let litersLosingT = 0
			let litersLosingShown = false
			let shownSecond = -1
			let shownLitersText = ''
			let shownStage = -1
			// 速く上がって(全体の 3 割)、ゆっくり戻る
			function absorbBump(t) {
				if (t >= 1) return 1
				if (t < 0.3) return lerp(1, ABSORB_BUMP, easeOutQuad(t / 0.3))
				return lerp(ABSORB_BUMP, 1, easeOutQuad((t - 0.3) / 0.7))
			}
			// 合計量の文字の幅の見積もり(数字 0.62・カンマ 0.32・漢字 1.0 文字ぶん。単位は 0.6 倍の大きさ)
			function estimateLitersWidth(value, unit) {
				let em = 0
				for (const c of value)
					em += c === ',' ? 0.32 : c >= '0' && c <= '9' ? 0.62 : 1
				em += 0.15 + 0.6 * (unit === 'mL' ? 1.25 : 0.62)
				return em
			}
			// 画面の大きさが変わった時に、合計量の文字の大きさと、残り時間とぶつからない幅を決め直す(CSS の clamp と同じ式)
			function layoutLiters() {
				const w = window.innerWidth
				litersFontPx = clamp(w * 0.06, 18, 34)
				const timerFontPx = clamp(w * 0.11, 32, 64)
				// 残り時間「15:00」の幅は文字の約 3.1 倍。真ん中から半分 + すき間 16px + 右の余白 12px を空ける
				litersMaxW = Math.max(60, w / 2 - (timerFontPx * 3.1) / 2 - 16 - 12)
				litersFit = Math.min(
					1,
					litersMaxW /
						(litersEstEm * litersFontPx * (reducedMotion ? 1 : ABSORB_BUMP)),
				)
				litersAnchor.dirty = true
				pointerFrame.dirty = true
			}
			// 飛ぶ数字の行き先: 合計量の文字の真ん中
			function litersTargetX() {
				return litersAnchor.right - (litersEstEm * litersFontPx * litersFit) / 2
			}
			function formatClock(sec) {
				return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`
			}
			const shownItemFill = { giant: '', boost: '', storm: '' }
			function updateItemTimers() {
				for (const type of Object.keys(ITEM_TYPES)) {
					const el = ui.itemTimers[type]
					const left = itemTimers[type]
					const on = state === 'play' && left > 0
					if (el.hidden === on) {
						el.hidden = !on
						// 上の情報表示の大きさが変わるので、方向の印が避ける範囲を読み直す
						pointerFrame.dirty = true
					}
					if (!on) continue
					// 足せる種類は上限に対する割合で出し、足された分が見えるようにする
					const def = ITEM_TYPES[type]
					const fill = `${((left / (def.max ?? def.seconds)) * 100).toFixed(1)}%`
					if (fill !== shownItemFill[type]) {
						shownItemFill[type] = fill
						el.lastElementChild.firstElementChild.style.width = fill
					}
				}
			}
			function updateHud(realDt) {
				updateItemTimers()
				const sec = Math.ceil(Math.max(0, timeLeft))
				if (sec !== shownSecond) {
					shownSecond = sec
					ui.timer.textContent = formatClock(sec)
					ui.timer.classList.toggle('danger', sec <= 5 && state === 'play')
					if (sec <= 5 && sec > 0 && state === 'play') {
						playSound('tick', { maxVoices: 1 })
						restartAnimation(ui.timer, 'danger')
					}
				}
				// 合計量は、吸った数字が飛んで吸い込まれた分だけ数え上がる。減る時はそのまま数え下がる。吸い切られた時は 0 まで減らす
				if (state === 'play' || state === 'devoured' || state === 'ending') {
					let unflushed = 0
					for (const l of body.links) unflushed += l.popAcc
					const score = scoreOf(playerTotal())
					const target = Math.max(
						0,
						score >= MAX_SCORE
							? score
							: score - litersPending - scoreOf(unflushed),
					)
					// 減っている間は赤く震わせ、増える時と区別する
					if (target < litersShown * (1 - 1e-4) - 0.002) litersLosingT = 0.25
					if (Math.abs(target - litersCount.to) > 1e-9 + target * 1e-9) {
						litersCount.from = litersShown
						litersCount.to = target
						litersCount.t = 0
					}
					litersCount.t = Math.min(1, litersCount.t + realDt / COUNT_SECONDS)
					litersShown = lerp(
						litersCount.from,
						litersCount.to,
						easeOutQuad(litersCount.t),
					)
				}
				litersLosingT =
					state === 'play' ? Math.max(0, litersLosingT - realDt) : 0
				const losing = litersLosingT > 0
				if (losing !== litersLosingShown) {
					litersLosingShown = losing
					ui.liters.classList.toggle('losing', losing)
				}
				const amount = amountParts(litersShown)
				if (amount.value + amount.unit !== shownLitersText) {
					shownLitersText = amount.value + amount.unit
					ui.litersNum.textContent = amount.value
					ui.litersUnit.textContent = amount.unit
					litersEstEm = estimateLitersWidth(amount.value, amount.unit)
					litersFit = Math.min(
						1,
						litersMaxW /
							(litersEstEm * litersFontPx * (reducedMotion ? 1 : ABSORB_BUMP)),
					)
				}
				// 数字が吸い込まれた瞬間に、一瞬ふくらんで戻る(動きを減らす設定ではふくらまさない)
				absorbT = Math.min(1, absorbT + realDt / ABSORB_BUMP_SECONDS)
				const bump = reducedMotion ? 1 : absorbBump(absorbT)
				const transform = `scale(${(litersFit * bump).toFixed(3)})`
				if (transform !== shownLitersTransform) {
					shownLitersTransform = transform
					ui.liters.style.transform = transform
				}
				if (litersAnchor.dirty && !ui.hud.hidden) {
					const r = ui.liters.getBoundingClientRect()
					litersAnchor.right = r.right
					litersAnchor.cy = r.top + r.height / 2
					litersAnchor.dirty = false
				}

				if (body.stage !== shownStage) {
					shownStage = body.stage
					ui.drinkable.textContent = T.drinkable(T.stages[body.stage])
					const next = T.stages[body.stage + 1]
					ui.next.textContent = next ? T.next(next) : T.maxSize
				}
				// 次に一気に膨らむまでの、たまり具合
				const progress = clamp(body.store / feverNeed(), 0, 1)
				ui.progressFill.style.width = `${(progress * 100).toFixed(1)}%`

				hintTime -= realDt
				ui.hint.style.opacity = hintTime > 0 ? '1' : '0'
			}

			/* ========== 吸った量の数字(+◯L) ========== */
			const POP_COUNT = 12
			const pops = Array.from({ length: POP_COUNT }, () => {
				const el = document.createElement('div')
				el.className = 'pop outlined'
				el.hidden = true
				ui.pops.appendChild(el)
				return {
					el,
					t: 0,
					x: 0,
					y: 0,
					k: 1,
					w: 0,
					shift: 0,
					active: false,
					// 合計量へ飛ぶ数字か、飛ぶ途中の量(点数の単位)、どの管から出たか、飛び始めの位置
					fly: false,
					amount: 0,
					link: null,
					boost: false,
					sx: 0,
					sy: 0,
				}
			})
			// 吸った数字は今の場所でポンと出て(POP_HOLD 秒まで)、FLY_SECONDS 秒で右上の合計量へ飛んで吸い込まれる。
			// slither.io の餌の動きを手本に、位置は経過の割合の 2 乗で寄せて加速させ、大きさは「1 − 割合の 3 乗」で縮める
			const POP_HOLD = 0.32
			const FLY_SECONDS = 0.5
			function absorbPop(p) {
				if (!p.fly || p.amount <= 0) return
				litersPending = Math.max(0, litersPending - p.amount)
				p.amount = 0
				absorbT = 0
			}
			let popCursor = 0
			// 吸った場所(対象の画面上の位置)から飛び出す。大物ほど文字を大きく・長く。loss は自分が吸われて減った量
			// amount は合計量へ飛ばす量(点数の単位)。0 なら飛ばさずにその場で消える(減った時の赤い数字・動きを減らす設定)
			function showPop(
				x,
				y,
				z,
				text,
				ratio,
				loss,
				boost = false,
				amount = 0,
				link = null,
			) {
				projected.set(x, y, z).project(camera)
				const p = pops[popCursor]
				popCursor = (popCursor + 1) % POP_COUNT
				// 使い回しで上書きする数字がまだ飛んでいたら、その分はすぐ合計に入れる
				absorbPop(p)
				p.fly = amount > 0
				p.amount = amount
				p.link = link
				p.boost = boost
				if (p.fly) litersPending += amount
				p.k = 1 + 0.8 * clamp(Math.sqrt(ratio * 2), 0, 1)
				// 同じ管から続けて出る数字が重ならないよう、横に少しずらす
				p.x = (projected.x * 0.5 + 0.5) * window.innerWidth + rand(-14, 14)
				// 対象の少し上から出して、吸っている管と相手を隠さない
				p.y = (-projected.y * 0.5 + 0.5) * window.innerHeight - 28
				p.shift = 0
				p.sx = null
				p.t = 0
				p.active = true
				p.el.textContent = text
				p.el.classList.toggle('loss', loss)
				p.el.classList.toggle('boost', boost)
				p.el.style.fontSize = `${Math.round(18 * p.k)}px`
				p.el.style.opacity = '1'
				p.el.hidden = false
				// 続けて出た数字が前の数字に重ならないよう、横に重なる位置でまだ出ている数字を 1 行ぶん上へ押し上げる。
				// 「+1,572mL」のように文字が長いと横にも広がるので、文字の幅で重なりを見る
				p.w = p.el.offsetWidth
				const lineH = 18 * p.k
				for (const q of pops) {
					if (!q.active || q === p) continue
					if (
						Math.abs(q.x - p.x) < (q.w + p.w) / 2 &&
						Math.abs(q.y - p.y) < lineH
					)
						q.shift += lineH
				}
				placePop(p)
			}
			function placePop(p) {
				if (p.fly) return placeFlyingPop(p)
				const k = p.k
				const hold = 0.25 + 0.2 * (k - 1)
				const fade = 0.35 * k
				let scale = 1
				let rise = 16 * k
				let opacity = 1
				if (p.t < 0.09) {
					const u = p.t / 0.09
					scale = lerp(0.3, 1.7, easeOutQuad(u))
					rise = 10 * k * u
				} else if (p.t < 0.22) {
					const u = (p.t - 0.09) / 0.13
					scale = lerp(1.7, 1, easeOutQuad(u))
					rise = 10 * k + 6 * k * u
				} else if (p.t > 0.22 + hold) {
					const u = Math.min(1, (p.t - 0.22 - hold) / fade)
					rise = 16 * k + 40 * k * u
					opacity = 1 - u
				}
				// 動きを減らす設定では弾みと上昇を止め、薄くなる消え方だけ残す
				if (reducedMotion) {
					scale = 1
					rise = 0
				}
				p.el.style.transform = `translate(${p.x.toFixed(1)}px, ${(p.y - p.shift - rise).toFixed(1)}px) translate(-50%, -50%) scale(${scale.toFixed(3)})`
				p.el.style.opacity = opacity.toFixed(3)
				return p.t <= 0.22 + hold + fade
			}
			// 合計量へ飛ぶ数字: ポンと出て(拡大して戻る)、少し止まってから、加速しながら縮んで右上へ吸い込まれる。transform と opacity だけで動かす
			function placeFlyingPop(p) {
				const k = p.k
				let scale = 1
				let rise = 16 * k
				let x = p.x
				let y = p.y - p.shift
				if (p.t < 0.09) {
					const u = p.t / 0.09
					scale = lerp(0.3, 1.7, easeOutQuad(u))
					rise = 10 * k * u
				} else if (p.t < 0.22) {
					const u = (p.t - 0.09) / 0.13
					scale = lerp(1.7, 1, easeOutQuad(u))
					rise = 10 * k + 6 * k * u
				}
				y -= rise
				if (p.t >= POP_HOLD) {
					if (p.sx === null) {
						p.sx = x
						p.sy = y
					}
					const u = Math.min(1, (p.t - POP_HOLD) / FLY_SECONDS)
					const e = u * u
					x = lerp(p.sx, litersTargetX(), e)
					y = lerp(p.sy, litersAnchor.cy, e)
					scale = 1 - u * u * u
				}
				p.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%) scale(${Math.max(0.001, scale).toFixed(3)})`
				return p.t < POP_HOLD + FLY_SECONDS
			}
			function updatePops(realDt) {
				for (const p of pops) {
					if (!p.active) continue
					p.t += realDt
					if (!placePop(p)) {
						absorbPop(p)
						p.active = false
						p.el.hidden = true
					}
				}
			}
			function clearPops() {
				for (const p of pops) {
					p.active = false
					p.amount = 0
					p.el.hidden = true
				}
				litersPending = 0
			}
			// 自分が吸った分を、前に出してからの合計で出す。1mL 未満は「+0mL」になるので出さずに次へ持ち越す
			function flushGainPop(link) {
				if (
					link.eater !== body ||
					body.dead ||
					amountParts(scoreOf(link.popAcc)).zero
				)
					return
				const amount = link.popAcc
				const shown = scoreOf(amount)
				link.popAcc = 0
				link.popT = 0
				const ratio = amount / Math.max(0.001, body.mass - amount)
				// 成長促進剤の間も文字は同じ(「×2」は付けない)。緑色にするだけ(showPop の boost)
				const label = (v) => `+${formatAmount(v)}`
				// 大きな水たまりのように続けて増える時は、同じ管の数字がまだポンと出ている間ならその数字に足して、飛ばす数を間引く
				if (!reducedMotion) {
					const same = pops.find(
						(q) => q.active && q.fly && q.link === link && q.t < POP_HOLD,
					)
					if (same) {
						same.amount += shown
						litersPending += shown
						same.el.textContent = label(same.amount)
						if (ratio > 0.25)
							playSound('big', {
								rate: rand(0.95, 1.05),
								maxVoices: 2,
								minGap: 0.2,
							})
						return
					}
				}
				// 動きを減らす設定では飛ばさず、その場で薄く消える(合計量はそのまま数え上がる)
				showPop(
					link.bx,
					link.by,
					link.bz,
					label(shown),
					ratio,
					false,
					link.boosted,
					reducedMotion ? 0 : shown,
					link,
				)
				if (ratio > 0.25)
					playSound('big', {
						rate: rand(0.95, 1.05),
						maxVoices: 2,
						minGap: 0.2,
					})
			}
			/* ========== 画面の外のアイテムと大きな水たまりの方向の印 ========== */
			// 巨大化・触手の嵐・成長促進剤・大きな水たまりを、種類ごとに自分から一番近い 1 つだけ指す(探すのは POINTER_FIND_SECONDS ごと)。
			// 画面の外にある時だけ、自分から対象への向きの線が安全な余白の内側の枠と交わる所に出し、他の表示と先に置いた印を避けて端に沿わせる。
			// かけら・相手役は指さない
			const POINTER_FIND_SECONDS = 0.2
			// 印の半径(絵の半径 28px に、外側の矢印の分を少し足す)と、枠・避ける範囲とのすき間(px)
			const POINTER_HALF = 34
			const POINTER_GAP = 6
			// #timer の CSS「pulse」最大倍率(1.25)とそろえる
			const TIMER_PULSE_MAX_SCALE = 1.25
			// 置く順。先に置いた印を後の印が避ける
			const POINTER_TYPES = ['giant', 'storm', 'boost', 'pool']
			const pointerList = POINTER_TYPES.map((type) => {
				const el = $(`pointer-${type}`)
				const p = {
					type,
					el,
					arrow: el.firstElementChild,
					// 絵(読めなかった時・読み込み中は、その印を出さない。ゲームは続ける)
					img: el.lastElementChild,
					target: null,
					opacity: 0,
					x: 0,
					y: 0,
					angle: 0,
					scale: 1,
					shownT: '',
					shownA: '',
					shownO: '',
				}
				return p
			})
			let pointerFindT = 0
			// 印を置ける枠と、避ける表示の範囲。画面の大きさが変わった時・表示を出した時・アイテムのゲージが出入りした時だけ読む
			const pointerFrame = {
				left: 0,
				top: 0,
				right: 0,
				bottom: 0,
				avoid: [],
				dirty: true,
			}
			function findPointerTargets() {
				for (const p of pointerList) {
					let best = null
					let bestD = Infinity
					const list =
						p.type === 'pool'
							? foods.filter(
									(f) => f.role === 'pool' && !f.dead && f.liters > 0,
								)
							: items.filter((it) => it.type === p.type && it.drinkT < 0)
					for (const t of list) {
						const d = (t.x - body.x) ** 2 + (t.z - body.z) ** 2
						if (d < bestD) {
							bestD = d
							best = t
						}
					}
					p.target = best
				}
			}
			function readPointerFrame() {
				const safe = ui.safeProbe.getBoundingClientRect()
				const m = POINTER_HALF + POINTER_GAP
				pointerFrame.left = safe.left + m
				pointerFrame.top = safe.top + m
				pointerFrame.right = safe.right - m
				pointerFrame.bottom = safe.bottom - m
				// 上の情報表示は横幅いっぱいの箱なので、中の部品ごとに読む
				const avoid = []
				for (const el of [
					ui.timer,
					ui.drinkable,
					ui.next,
					ui.itemTimers.giant,
					ui.itemTimers.boost,
					ui.itemTimers.storm,
					ui.quitButton,
					ui.sizeGauge,
				]) {
					if (el.hidden) continue
					const r = el.getBoundingClientRect()
					if (r.width > 0) {
						if (el === ui.timer) {
							const extraX = ((TIMER_PULSE_MAX_SCALE - 1) * r.width) / 2
							const extraY = ((TIMER_PULSE_MAX_SCALE - 1) * r.height) / 2
							avoid.push({
								left: r.left - extraX,
								top: r.top - extraY,
								right: r.right + extraX,
								bottom: r.bottom + extraY,
							})
						} else {
							avoid.push({
								left: r.left,
								top: r.top,
								right: r.right,
								bottom: r.bottom,
							})
						}
					}
				}
				pointerFrame.avoid = avoid
				pointerFrame.dirty = false
			}
			// 毎コマ変わる範囲(右上の合計量・指の操作の丸)を足した、避ける範囲の一覧
			const pointerAvoid = []
			function collectPointerAvoid() {
				pointerAvoid.length = 0
				for (const r of pointerFrame.avoid) pointerAvoid.push(r)
				const w = litersEstEm * litersFontPx * litersFit * ABSORB_BUMP
				const h = litersFontPx * 1.1 * litersFit * ABSORB_BUMP
				pointerAvoid.push({
					left: litersAnchor.right - w,
					top: litersAnchor.cy - h / 2,
					right: litersAnchor.right,
					bottom: litersAnchor.cy + h / 2,
				})
				const st = input.stick
				if (st)
					pointerAvoid.push({
						left: st.ox - 62,
						top: st.oy - 62,
						right: st.ox + 62,
						bottom: st.oy + 62,
					})
			}
			// 辺に沿って動かす向き(縦の辺なら縦、横の辺なら横)で、避ける範囲が占める区間を集め、
			// どの区間にも入らない、along に一番近い位置を返す(無ければ null)。2 つの範囲の間を行ったり来たりしないように区間で探す
			function freeAlongEdge(vertical, across, along) {
				const f = pointerFrame
				const pad = POINTER_HALF + POINTER_GAP
				const lo = vertical ? f.top : f.left
				const hi = vertical ? f.bottom : f.right
				const blocked = []
				for (const r of pointerAvoid) {
					const a0 = vertical ? r.left - pad : r.top - pad
					const a1 = vertical ? r.right + pad : r.bottom + pad
					if (across < a0 || across > a1) continue
					blocked.push(
						vertical
							? [r.top - pad, r.bottom + pad]
							: [r.left - pad, r.right + pad],
					)
				}
				const free = (v) =>
					v >= lo && v <= hi && blocked.every(([b0, b1]) => v < b0 || v > b1)
				const start = clamp(along, lo, hi)
				if (free(start)) return start
				let best = null
				for (const [b0, b1] of blocked) {
					for (const v of [b0 - 0.5, b1 + 0.5, lo, hi]) {
						if (
							free(v) &&
							(best === null || Math.abs(v - start) < Math.abs(best - start))
						)
							best = v
					}
				}
				return best
			}
			// (cx, cy) から (dx, dy) の向きの線が枠と交わる点。避ける範囲に入ったら、その辺に沿って外へずらす
			const pointerSpot = { x: 0, y: 0 }
			function pointerOnEdge(cx, cy, dx, dy) {
				const f = pointerFrame
				const x0 = clamp(cx, f.left, f.right)
				const y0 = clamp(cy, f.top, f.bottom)
				const tx =
					dx > 1e-6
						? (f.right - x0) / dx
						: dx < -1e-6
							? (f.left - x0) / dx
							: Infinity
				const ty =
					dy > 1e-6
						? (f.bottom - y0) / dy
						: dy < -1e-6
							? (f.top - y0) / dy
							: Infinity
				const onSide = tx < ty
				let x = clamp(x0 + dx * Math.min(tx, ty), f.left, f.right)
				let y = clamp(y0 + dy * Math.min(tx, ty), f.top, f.bottom)
				let best = freeAlongEdge(onSide, onSide ? x : y, onSide ? y : x)
				// 辺がすべてふさがっている時(縦画面の上の辺など)は、向きに近い側の縦の辺(または横の辺)へ移し、角に近い空いた所に置く
				if (best === null) {
					const side = !onSide
					const across = side
						? dx >= 0
							? f.right
							: f.left
						: dy >= 0
							? f.bottom
							: f.top
					const start = side
						? dy >= 0
							? f.bottom
							: f.top
						: dx >= 0
							? f.right
							: f.left
					const alt = freeAlongEdge(side, across, start)
					if (alt !== null) {
						if (side) {
							x = across
							y = alt
						} else {
							y = across
							x = alt
						}
					}
				} else if (onSide) y = best
				else x = best
				pointerSpot.x = x
				pointerSpot.y = y
				return pointerSpot
			}
			// 対象の画面上の位置と大きさで、画面に少しでも映っているかを見る(描く時の判定は余白が広く、遠くの上側を中と見なすため)
			function pointerTargetVisible(x, z, r) {
				screenVec.set(x, 0, z).applyMatrix4(camera.matrixWorldInverse)
				if (screenVec.z >= 0) return false
				projected.set(x, 0, z).project(camera)
				const cx = (projected.x * 0.5 + 0.5) * window.innerWidth
				const cy = (-projected.y * 0.5 + 0.5) * window.innerHeight
				projected.set(x + r, 0, z).project(camera)
				const pr = Math.abs((projected.x * 0.5 + 0.5) * window.innerWidth - cx)
				return (
					cx + pr > 0 &&
					cx - pr < window.innerWidth &&
					cy + pr > 0 &&
					cy - pr < window.innerHeight
				)
			}
			function updatePointers(realDt) {
				const playing = state === 'play' && !paused && !body.dead
				pointerFindT -= realDt
				if (playing && pointerFindT <= 0) {
					pointerFindT = POINTER_FIND_SECONDS
					findPointerTargets()
				}
				if (pointerFrame.dirty && !ui.hud.hidden) readPointerFrame()
				collectPointerAvoid()
				projected.set(body.x, 0, body.z).project(camera)
				const bx = (projected.x * 0.5 + 0.5) * window.innerWidth
				const by = (-projected.y * 0.5 + 0.5) * window.innerHeight
				for (const p of pointerList) {
					const t = p.target
					let want = 0
					const alive =
						t &&
						(p.type === 'pool'
							? !t.dead && t.liters > 0
							: items.includes(t) && t.drinkT < 0)
					if (
						playing &&
						alive &&
						p.img.naturalWidth > 0 &&
						!pointerTargetVisible(
							t.x,
							t.z,
							p.type === 'pool' ? puddleSize(t) : t.r,
						)
					) {
						const dx = t.x - body.x
						const dz = t.z - body.z
						const dist = Math.hypot(dx, dz) || 1
						// 向きは、自分と「自分から対象の方へ少し進んだ地面の点」を画面へ写して求める(遠い点を写すとカメラより手前に回って裏返ることがあるため)
						const step = cam.viewRange * 0.25
						projected
							.set(body.x + (dx / dist) * step, 0, body.z + (dz / dist) * step)
							.project(camera)
						const sx = (projected.x * 0.5 + 0.5) * window.innerWidth - bx
						const sy = (-projected.y * 0.5 + 0.5) * window.innerHeight - by
						const sl = Math.hypot(sx, sy) || 1
						const spot = pointerOnEdge(bx, by, sx / sl, sy / sl)
						// 近いほど濃く大きく、遠いほど薄く小さく(画面の広さの 0.5 倍で一番近い、2.2 倍で一番遠い)
						const near = clamp(
							1 - (dist - cam.viewRange * 0.5) / (cam.viewRange * 1.7),
							0,
							1,
						)
						want = lerp(0.5, 0.95, near)
						p.scale = lerp(0.82, 1.1, near)
						p.x = spot.x
						p.y = spot.y
						p.angle = Math.atan2(sy, sx)
						// 後から置く印が、先に置いた印に重ならないよう、避ける範囲に足す
						const half = POINTER_HALF * p.scale
						pointerAvoid.push({
							left: p.x - half,
							top: p.y - half,
							right: p.x + half,
							bottom: p.y + half,
						})
					}
					// 画面に入ったらすっと消える。遊んでいない時(おわるの確かめの間はコマの時間が 0)はその場で消す
					p.opacity = playing
						? p.opacity + (want - p.opacity) * damp(10, realDt)
						: 0
					if (want === 0 && p.opacity < 0.01) p.opacity = 0
					const o = p.opacity.toFixed(2)
					if (o !== p.shownO) {
						p.shownO = o
						p.el.style.opacity = o
					}
					if (p.opacity === 0) continue
					const tr = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) scale(${p.scale.toFixed(3)})`
					if (tr !== p.shownT) {
						p.shownT = tr
						p.el.style.transform = tr
					}
					const ar = `rotate(${p.angle.toFixed(3)}rad)`
					if (ar !== p.shownA) {
						p.shownA = ar
						p.arrow.style.transform = ar
					}
				}
			}
			// 自分が吸われて減った分を、体から赤い「-◯L」で出す
			const LOSS_POP_INTERVAL = 0.4
			function flushLossPop() {
				if (amountParts(scoreOf(body.lossAcc)).zero) return
				const Rv = visualRadius(body)
				const lost = body.lossAcc
				body.lossAcc = 0
				body.lossPopT = 0
				showPop(
					body.x,
					(LEG_STYLES[body.stage].lift + 0.6) * Rv,
					body.z,
					`-${formatAmount(scoreOf(lost))}`,
					lost / (body.mass + lost),
					true,
				)
			}
			function updateLossPops(realDt) {
				if (!body.suckers.length) {
					flushLossPop()
					return
				}
				body.lossPopT += realDt
				if (body.lossPopT >= LOSS_POP_INTERVAL) flushLossPop()
			}
			// 吸われている間は画面の縁を赤くする
			let dangerLevel = 0
			let dangerShown = ''
			function updateDanger(realDt) {
				const want = state === 'play' && body.suckers.length > 0 ? 1 : 0
				dangerLevel += (want - dangerLevel) * damp(8, realDt)
				// 明るさは上下させない(チカチカして見えたため)
				const text = dangerLevel.toFixed(2)
				if (text !== dangerShown) {
					dangerShown = text
					ui.danger.style.opacity = text
				}
			}

			/* ========== サイズアップと終了の演出 ========== */
			// 体と触手の広がりを囲む箱を画面へ写した範囲(px)
			function bodyScreenRect() {
				const Rv = visualRadius(body)
				const reach = LEG_STYLES[body.stage].reach * Rv
				const top = (LEG_STYLES[body.stage].lift + 1) * Rv
				const r = {
					left: Infinity,
					right: -Infinity,
					top: Infinity,
					bottom: -Infinity,
				}
				for (const dx of [-reach, reach])
					for (const dz of [-reach, reach])
						for (const y of [0, top]) {
							projected.set(body.x + dx, y, body.z + dz).project(camera)
							const px = (projected.x * 0.5 + 0.5) * window.innerWidth
							const py = (-projected.y * 0.5 + 0.5) * window.innerHeight
							r.left = Math.min(r.left, px)
							r.right = Math.max(r.right, px)
							r.top = Math.min(r.top, py)
							r.bottom = Math.max(r.bottom, py)
						}
				return r
			}
			// 段アップの文字が体に重なると見づらいので、体の少し上に置く。
			// 横画面のように上の情報表示と体の間に入らない時は、体の下に置く。
			// 量が一気に増えた直後はカメラが引き切る前で体が一時的に大きく映るので、間を広めに取る
			const LEVELUP_GAP = 30
			function placeNotice(el) {
				const r = bodyScreenRect()
				const h = el.offsetHeight
				const hudBottom = ui.hudTop.getBoundingClientRect().bottom
				let top = r.top - LEVELUP_GAP - h
				if (top < hudBottom + 4) top = r.bottom + LEVELUP_GAP
				// 下の段のゲージには重ねない
				const gaugeTop = ui.sizeGauge.getBoundingClientRect().top
				el.style.top = `${Math.round(clamp(top, 0, gaugeTop - 6 - h))}px`
			}
			let hitstop = 0
			// 段アップの表示は、入れ物の段(STAGES)とは別の「大きさの段」で出す。最大到達量が 2 倍になるたびに 1 段上がる。
			// 入れ物の段は 5 回しか上がらず、育った手応えが少なかったため
			function sizeStepFor(liters) {
				return Math.floor(Math.log2(liters))
			}
			// CSS の #levelup.show の長さと揃える
			const LEVELUP_SHOW_SECONDS = 1.6
			let announcedStep = 0
			let announcedStage = 0
			let levelupShowT = Infinity
			let levelupCount = 0
			function updateSizeNotice(realDt) {
				levelupShowT += realDt
				// 大きな水たまりを飲んでいる間は 1 段ずつ出さず、飲み切るか管が切れた時にまとめて出す
				if (body.links.some((l) => l.pool)) return
				const steps = sizeStepFor(body.best) - announcedStep
				const newStage = body.stage > announcedStage
				if (steps <= 0 && !newStage) return
				announcedStep += Math.max(0, steps)
				onSizeUp(Math.max(0, steps), newStage)
				if (newStage) announcedStage = body.stage
			}
			function onSizeUp(steps, newStage) {
				// 表示中にさらに上がったら、段の数を足して書き換える
				const showing = levelupShowT < LEVELUP_SHOW_SECONDS
				levelupCount = showing ? levelupCount + steps : steps
				levelupShowT = 0
				ui.levelupTitle.textContent =
					levelupCount >= 2 ? T.stepsUp(levelupCount) : T.sizeUp
				if (newStage)
					ui.levelupSub.textContent = T.canDrink(T.stages[body.stage])
				else if (!showing) ui.levelupSub.textContent = ''
				// 位置は文字を書き換えた後、体をふくらませる演出より前の大きさで決める(ふくらんだ大きさで測ると縦画面でも下に回ってしまう)
				placeNotice(ui.levelup)
				restartAnimation(ui.levelup, 'show')
				// 危険度アップとアイテムのお知らせが出ていたら引っ込め、重ねない
				if (dangerShowT < LEVELUP_SHOW_SECONDS) {
					ui.dangerUp.classList.remove('show')
					dangerShowT = Infinity
				}
				if (itemNoticeT < LEVELUP_SHOW_SECONDS) {
					ui.itemUp.classList.remove('show')
					itemNoticeT = Infinity
				}
				// 段アップでは、場面を止める・画面を揺らす・衝撃波・体を弾ませる演出をしない。
				// 発注者の「大きくなる時のエフェクトもっと和らげてほしい。カメラ振動」で外した(膨らみの演出だけで足りる)
				// 段アップは、大きな泡が「ごぽん」と上がってはじける音
				playSound('levelup', { maxVoices: 1 })
			}
			// 自分に管が刺さった: 小さく揺らして危険を知らせる(吸い切られるまでは動けて逃げられる)
			function onPlayerSucked() {
				cam.trauma = Math.min(1, cam.trauma + 0.3)
				playSound('sucked', { maxVoices: 1 })
			}
			// 自分が吸い切られた: 場面だけ一瞬止め、揺れと衝撃波を出してから「吸い切られた…」
			function onPlayerDevoured() {
				state = 'devoured'
				// たまっていた量も一緒に失う(合計量は 0 まで減る)
				body.store = 0
				clearItemTimers()
				updateItemTimers()
				endReason = 'devoured'
				endingTime = 0
				endStick()
				hitstop = 0.15
				cam.trauma = Math.min(1, cam.trauma + 0.9)
				startWave(1.3)
				ui.timer.classList.remove('danger')
				ui.finishText.textContent = T.finish.devoured
				restartAnimation(ui.finish, 'show')
				playSound('big', { rate: 0.75, maxVoices: 2 })
			}

			/* ========== ゲームの流れ ========== */
			let state = 'title'
			let mode = MODES.short
			// timeup(時間切れ) / devoured(吸い切られた) / quit(おわるを押した)
			let endReason = 'timeup'
			let timeLeft = mode.seconds
			let hintTime = 0
			let endingTime = 0
			// 「おわる」の確かめを開いている間は、場面を止める
			let paused = false
			// 15分チャレンジの危険度の段と、上がったお知らせ(段アップの表示中は待たせる)
			let dangerIndex = 0
			let dangerPending = false
			let dangerShowT = Infinity
			let itemNoticeT = Infinity

			function clearWorld() {
				for (const link of links) {
					if (link.isBlob || link.pool) link.target.suckers.length = 0
					else link.target.capturedBy = null
					link.eater.links.length = 0
				}
				links.length = 0
				ghosts.length = 0
				while (blobs.length) removeBlob(blobs[0])
				while (foods.length) removeFood(foods[0])
				clearPops()
			}
			function resetWorld() {
				dangerIndex = 0
				dangerPending = false
				dangerShowT = Infinity
				clearWorld()
				resetItems()
				massScale = 1
				gridSize = 10
				body = createBlob(true, 0, 0, START_LITERS)
				body.heading = -Math.PI / 2
				placeCamera()
				resultScene.mix = 0
				shownStage = -1
				shownSecond = -1
				litersShown = START_LITERS
				announcedStep = sizeStepFor(body.best)
				announcedStage = body.stage
				// 場面の時計は開始ごとに 0 へ戻す(開いたままでも液体の揺れに渡す時刻が大きくなり続けないように)
				sceneTime = 0
				realTime = 0
				levelupShowT = Infinity
				levelupCount = 0
				itemNoticeT = Infinity
				litersPending = 0
				litersCount.from = litersCount.to = START_LITERS
				litersCount.t = 1
				absorbT = 1
				litersAnchor.dirty = true
				// 開始直後にすぐ吸える水たまりと、最初の目標のコップを近くに置く
				for (let i = 0; i < 10; i++) spawnPuddle(true)
				const bitTarget = bitTargetCount()
				for (let i = 0; i < bitTarget; i++) spawnBit(true)
				spawnPool(true)
				poolCooldown = POOL_RESPAWN_SECONDS
				spawnContainer(true)
				for (let i = 0; i < CPU_TARGET_COUNT; i++) spawnCpu(true)
				spawnTinyGroup(true, tinyTargetCount())
				maintainTimer = 0
			}

			function startGame(nextMode) {
				mode = nextMode
				resetWorld()
				timeLeft = mode.seconds
				ui.dangerUp.classList.remove('show')
				ui.itemUp.classList.remove('show')
				closeQuitConfirm()
				ui.quitButton.hidden = !mode.canQuit
				pointerFrame.dirty = true
				hintTime = 3
				body.safeT = SAFE_SECONDS
				state = 'play'
				ui.titleScreen.hidden = true
				ui.resultScreen.hidden = true
				ui.hud.hidden = false
			}

			function endGame(reason) {
				state = 'ending'
				// 巨大化中に終わっても縮めず、切れた時と同じく見た目の大きさを本当の大きさとして残し、点数にも入れる
				// (発注者「なんで最後ゲーム終わったら小さくなるの？」)
				if (giantScale > 1) {
					endGiant()
					body.best = Math.max(body.best, scoreOf(playerTotal()))
				}
				clearItemTimers()
				updateItemTimers()
				endReason = reason
				endingTime = 0
				endStick()
				closeQuitConfirm()
				// 時間切れの瞬間に吸っていた管と、自分を吸っていた管は外す。それまでに移った分だけが点数に入る
				for (let i = body.links.length - 1; i >= 0; i--)
					cutLink(body.links[i], 'stop')
				for (let i = body.suckers.length - 1; i >= 0; i--)
					cutLink(body.suckers[i], 'stop')
				ui.timer.classList.remove('danger')
				ui.finishText.textContent = T.finish[reason]
				restartAnimation(ui.finish, 'show')
			}
			// アイテムを飲んだ瞬間のお知らせ。段アップと同じ置き方・消え方で、出ている他のお知らせは引っ込める
			function showItemNotice(type) {
				ui.itemUpTitle.textContent = T.items[type].title
				ui.itemUpSub.textContent = T.items[type].sub
				for (const el of [ui.levelup, ui.dangerUp]) el.classList.remove('show')
				levelupShowT = Infinity
				dangerShowT = Infinity
				itemNoticeT = 0
				placeNotice(ui.itemUp)
				restartAnimation(ui.itemUp, 'show')
			}
			// 15分チャレンジ: 経過時間で危険度の段を上げ、上がったら段アップと同じ形で知らせる
			function updateDangerLevel(realDt) {
				dangerShowT += realDt
				itemNoticeT += realDt
				if (!mode.escalate) return
				const next = Math.min(
					DANGER_LEVELS.length - 1,
					Math.floor((mode.seconds - timeLeft) / DANGER_STEP_SECONDS),
				)
				if (next > dangerIndex) {
					dangerIndex = next
					dangerPending = true
				}
				// 段アップの表示と重ならないよう、段アップが消えてから出す
				if (
					dangerPending &&
					levelupShowT >= LEVELUP_SHOW_SECONDS &&
					itemNoticeT >= LEVELUP_SHOW_SECONDS
				) {
					dangerPending = false
					dangerShowT = 0
					placeNotice(ui.dangerUp)
					restartAnimation(ui.dangerUp, 'show')
				}
			}

			/* 「おわる」は押した後に画面の中で 1 回確かめる(ブラウザの確認ダイアログは見た目が合わず、スマホで押し間違えやすいため) */
			function openQuitConfirm() {
				if (state !== 'play' || !mode.canQuit) return
				paused = true
				endStick()
				ui.quitConfirm.hidden = false
				ui.quitNo.focus()
			}
			function closeQuitConfirm() {
				paused = false
				ui.quitConfirm.hidden = true
			}

			/* 自己ベストはモードごとに残す。保存できない環境(プライベートモードなど)でも遊べるよう、失敗は無視する */
			function bestKey(m) {
				return `kuroi-ekitai:best:${m.id}`
			}
			function readBest(m) {
				try {
					const v = Number(localStorage.getItem(bestKey(m)))
					return Number.isFinite(v) && v > 0 && v <= MAX_SCORE ? v : 0
				} catch {
					return 0
				}
			}
			function writeBest(m, liters) {
				try {
					localStorage.setItem(bestKey(m), String(liters))
				} catch {
					// 保存できなくても結果は出す
				}
			}
			function playedSeconds() {
				return Math.min(mode.seconds, Math.round(mode.seconds - timeLeft))
			}
			function showResult() {
				state = 'result'
				ui.hud.hidden = true
				ui.resultMode.textContent = T.modes[mode.id].name
				ui.resultReason.textContent = T.reason[endReason]
				ui.resultLiters.firstChild.textContent = formatAmount(body.best)
				ui.resultTitle.firstElementChild.textContent = titleFor(body.best)
				ui.resultCompare.textContent = compareText(body.best)
				showResultScene(TITLES[titleIndex(body.best)].scene)
				hideSaveImage()
				ui.imageButton.textContent = canShareImage(shareImageProbe())
					? T.shareImage
					: T.saveImage
				const prev = readBest(mode)
				const isNew = body.best > prev
				if (isNew) writeBest(mode, body.best)
				ui.resultExtra.textContent = ''
				if (endReason !== 'timeup')
					ui.resultExtra.append(
						T.lived(formatClock(playedSeconds())),
						document.createElement('br'),
					)
				const best = document.createElement('span')
				if (isNew) best.className = 'new'
				best.textContent = isNew ? T.bestNew : T.best(formatAmount(prev))
				ui.resultExtra.append(best)
				ui.resultScreen.hidden = false
				fitResultLiters()
				playSound('result', { maxVoices: 1 })
			}

			// 結果の量は 1 行に収める。画面の幅(余白を除く)に入らない時は、入る大きさまで文字を縮める(右上の合計量と同じ考え)
			function fitResultLiters() {
				const el = ui.resultLiters
				el.style.fontSize = ''
				const range = document.createRange()
				range.selectNodeContents(el.firstChild)
				const width = range.getBoundingClientRect().width
				const room = window.innerWidth - 2 * RESULT_TEXT_SIDE
				if (width > room) {
					const size = parseFloat(getComputedStyle(el).fontSize)
					el.style.fontSize = `${Math.floor((size * room) / width)}px`
				}
			}
			// 結果の量の左右に残す幅(画面の余白 16px と、文字の板の内側の余白 20px)
			const RESULT_TEXT_SIDE = 40
			// タグはどの言葉でも日本語の名前のまま(言葉ごとに分けると、遊んだ人の投稿が 1 つのタグに集まらないため)
			function shareText() {
				const text = T.shareText({
					modeName: T.modes[mode.id].name,
					amount: formatAmount(body.best),
					lived: endReason === 'timeup' ? '' : formatClock(playedSeconds()),
					title: titleFor(body.best),
					compare: compareText(body.best),
				})
				return `${text}\n#黒い液体 #黒い液体${TEXT.ja.modes[mode.id].name}`
			}
			// 共有する本文(両方のボタンで同じ): 文・タグ → ゲームの住所 → 引用させる投稿の住所、の順に改行で並べる。
			// X は本文の最後にある投稿の住所を引用として出すので、引用の住所を一番最後にする
			function sharePostText() {
				return `${shareText()}\n${SHARE_URLS[lang]}`
			}
			// 「Xでシェア」: どの端末でも、押したらすぐ文だけで X の投稿画面を開く(押した処理の中で呼ぶこと。後から呼ぶとブラウザが窓を開かせない)。
			// 住所は url の引数に分けず、本文(text)に入れる。url の引数を使うと X が住所を本文の最後に付け足し、ゲームの住所が引用の住所より後ろに来るため
			function openShareIntent() {
				const text = sharePostText()
				if (navigator.share) {
					navigator.share({ title: document.title, text }).catch(() => {})
					return
				}
				navigator.clipboard?.writeText(text).catch(() => {})
			}

			/* ========== 共有の画像 ========== */
			// 結果画面(景色・体・量・称号・比べ)を 1 枚の JPEG にする。three.js の絵は描いた直後でないと読めない
			// (描き終わると中身を捨てる設定)ので、押した時にもう 1 回描いてすぐ写す。文字は HTML なので、
			// 結果の板の各要素の位置と書体を読んで 2D の絵に描き直す。toDataURL で同期のまま作るのは、
			// Safari が押した時の処理の中でしか navigator.share を許さず、非同期の toBlob を待つと断られるため
			function drawShareImage() {
				renderFrame()
				const shot = document.createElement('canvas')
				shot.width = canvas.width
				shot.height = canvas.height
				const ctx = shot.getContext('2d')
				ctx.drawImage(canvas, 0, 0)
				const scale = shot.width / window.innerWidth
				ctx.scale(scale, scale)
				// 結果画面の上下の砂色のぼかし(.screen の背景と同じ)
				const shade = ctx.createLinearGradient(0, 0, 0, window.innerHeight)
				shade.addColorStop(0, 'rgba(232, 227, 216, 0.85)')
				shade.addColorStop(0.38, 'rgba(232, 227, 216, 0)')
				shade.addColorStop(0.62, 'rgba(232, 227, 216, 0)')
				shade.addColorStop(1, 'rgba(232, 227, 216, 0.9)')
				ctx.fillStyle = shade
				ctx.fillRect(0, 0, window.innerWidth, window.innerHeight)
				const panel = ui.resultScreen.firstElementChild
				const panelStyle = getComputedStyle(panel)
				const pr = panel.getBoundingClientRect()
				ctx.fillStyle = panelStyle.backgroundColor
				ctx.beginPath()
				ctx.roundRect(pr.left, pr.top, pr.width, pr.height, 18)
				ctx.fill()
				const titleBox = ui.resultTitle.firstElementChild
				const tr = titleBox.getBoundingClientRect()
				ctx.fillStyle = '#fff'
				ctx.strokeStyle = '#1d1a17'
				ctx.lineWidth = 2
				ctx.beginPath()
				ctx.roundRect(tr.left + 1, tr.top + 1, tr.width - 2, tr.height - 2, 6)
				ctx.fill()
				ctx.stroke()
				const small = ui.resultLiters.querySelector('small')
				drawTextOf(ctx, ui.resultMode)
				drawTextOf(ctx, ui.resultReason)
				drawTextOf(ctx, ui.resultLiters, ui.resultLiters.firstChild)
				drawTextOf(ctx, small)
				drawTextOf(ctx, titleBox)
				drawTextOf(ctx, ui.resultCompare)
				for (const node of ui.resultExtra.childNodes) {
					if (node.nodeName === 'BR') continue
					const range = document.createRange()
					range.selectNodeContents(node)
					drawTextIn(
						ctx,
						node.nodeType === Node.TEXT_NODE ? ui.resultExtra : node,
						node.textContent,
						range.getBoundingClientRect(),
					)
				}
				return shot.toDataURL('image/jpeg', 0.9)
			}
			// 要素の文字を、その要素の書体・色・位置で描く。node を渡した時は要素の一部(量の数字)だけを描く
			function drawTextOf(ctx, el, node = el) {
				const range = document.createRange()
				range.selectNodeContents(node)
				drawTextIn(ctx, el, node.textContent, range.getBoundingClientRect())
			}
			// 文字の箱(rect)の中に、真ん中ぞろえで描く。HTML で折り返していたら、同じ幅で折り返して行を分ける
			function drawTextIn(ctx, styleEl, text, rect) {
				const style = getComputedStyle(styleEl)
				const size = parseFloat(style.fontSize)
				ctx.font = `${style.fontWeight} ${size}px ${style.fontFamily}`
				ctx.fillStyle = style.color
				ctx.textAlign = 'center'
				ctx.textBaseline = 'middle'
				const lines = wrapLines(ctx, text.trim(), rect.width + 2)
				const lineHeight = rect.height / lines.length
				const cx = rect.left + rect.width / 2
				lines.forEach((line, i) =>
					ctx.fillText(line, cx, rect.top + lineHeight * (i + 0.5)),
				)
			}
			// 英語は単語ごと、日本語・中国語は 1 文字ごとに折り返す
			function wrapLines(ctx, text, width) {
				const parts = lang === 'en' ? text.split(' ') : [...text]
				const join = lang === 'en' ? ' ' : ''
				const lines = []
				let line = ''
				for (const part of parts) {
					const next = line ? line + join + part : part
					if (line && ctx.measureText(next).width > width) {
						lines.push(line)
						line = part
					} else line = next
				}
				lines.push(line)
				return lines
			}
			function shareImageFile() {
				const dataUrl = drawShareImage()
				const bytes = Uint8Array.from(atob(dataUrl.split(',')[1]), (c) =>
					c.charCodeAt(0),
				)
				return new File([bytes], 'kuroi-ekitai.jpg', { type: 'image/jpeg' })
			}
			// 画像の保存はリンク(a)の href に画像の場所を入れて使う。押すたびに作り直すので、前の画像の場所は手放す
			function setSaveImageHref(file) {
				releaseSaveImage()
				ui.saveImage.href = URL.createObjectURL(file)
			}
			function releaseSaveImage() {
				if (ui.saveImage.href) URL.revokeObjectURL(ui.saveImage.href)
				ui.saveImage.removeAttribute('href')
			}
			// 画像を保存する(押した処理の中で呼ぶ)。隠したままのリンクを押して、端末に書き出す
			function downloadImage(file) {
				setSaveImageHref(file)
				ui.saveImage.click()
			}
			// 端末の共有を断られた後は、画像の共有ボタンの代わりに保存のリンクを出す
			// (同じ場所に入れ替えるので、狭い縦画面でも並びの幅が増えない)
			function showSaveImage(file) {
				setSaveImageHref(file)
				ui.saveImage.hidden = false
				ui.imageButton.hidden = true
			}
			function hideSaveImage() {
				releaseSaveImage()
				ui.saveImage.hidden = true
				ui.imageButton.hidden = false
			}
			// 画像を渡す共有は、指で操作する端末(hasTouch)で、画像つきの共有に対応している時だけ使う
			function canShareImage(data) {
				return hasTouch && Boolean(navigator.canShare?.(data))
			}
			// 「画像で共有」で渡す文は sharePostText()(「Xでシェア」と同じ本文)。住所は url の項目に分けず、text に入れる
			// (iPhone の X のアプリは url の項目だけを投稿の欄に入れ、text を捨てたため)
			// 結果を出す時にボタンの文字を決めるための、中身の無い画像(対応しているかだけを調べる。渡す形は shareImage と同じ)
			function shareImageProbe() {
				return {
					files: [new File([], 'kuroi-ekitai.jpg', { type: 'image/jpeg' })],
					text: sharePostText(),
				}
			}
			// 「画像で共有」: 指で操作する端末で画像を渡せる時は、端末の共有の画面で画像と本文(文・タグ・ゲームの住所・引用させる投稿の住所)を渡す。
			// 共有の前に同じ文を端末にコピーしておく(共有先のアプリが文を捨てても、貼り付けて投稿できるように)。
			// Safari は押した処理の中でしか share を許さないので、コピーの完了は待たず、await を挟まない。コピーの失敗は握りつぶす
			// それ以外(パソコンなど)は、画像を保存する(ボタンの文字も「画像を保存」にしてある)。
			// 共有の画面を閉じた(AbortError)時は何もしない。それ以外で断られた時は保存のリンクを出す。
			// 画像を作れなかった時も壊さず、押した処理の中ですぐ文だけの X の投稿画面を開く
			function shareImage() {
				let file
				try {
					file = shareImageFile()
				} catch (error) {
					console.warn('share image failed', error)
					openShareIntent()
					return
				}
				const data = { files: [file], text: sharePostText() }
				if (canShareImage(data)) {
					navigator.clipboard?.writeText(data.text)?.catch(() => {})
					navigator.share(data).catch((error) => {
						if (error.name === 'AbortError') return
						showSaveImage(file)
					})
					return
				}
				downloadImage(file)
			}
			function showTitle() {
				state = 'title'
				resetWorld()
				ui.hud.hidden = true
				ui.resultScreen.hidden = true
				ui.titleScreen.hidden = false
				$('mode-short').focus()
			}

			// iPhone の Safari は指で触れた時の処理の中でしか音を鳴らせる状態にできないので、モード選びの押しで鳴らせる状態にする
			function startWithSound(m) {
				const resumed = unlockAudio()
				if (resumed) resumed.then(() => playSound('start', { maxVoices: 1 }))
				else playSound('start', { maxVoices: 1 })
				startGame(m)
			}
			$('mode-short').addEventListener('click', () =>
				startWithSound(MODES.short),
			)
			$('mode-long').addEventListener('click', () => startWithSound(MODES.long))
			$('retry-button').addEventListener('click', () => startWithSound(mode))
			$('modes-button').addEventListener('click', () => {
				unlockAudio()
				showTitle()
			})
			$('share-button').addEventListener('click', openShareIntent)
			ui.imageButton.addEventListener('click', shareImage)
			ui.quitButton.addEventListener('click', openQuitConfirm)
			$('quit-yes').addEventListener('click', () => {
				if (state === 'play') endGame('quit')
			})
			ui.quitNo.addEventListener('click', closeQuitConfirm)
			window.addEventListener('keydown', (e) => {
				if (e.code === 'Escape' && !ui.quitConfirm.hidden) closeQuitConfirm()
			})

			/* ========== 画面サイズ ========== */
			const bufferSize = new THREE.Vector2()
			function resize() {
				const w = window.innerWidth
				const h = window.innerHeight
				renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
				renderer.setSize(w, h, false)
				camera.aspect = w / h
				camera.fov = w > h ? 45 : 50
				camera.updateProjectionMatrix()
				renderer.getDrawingBufferSize(bufferSize)
				sceneTarget.setSize(bufferSize.x, bufferSize.y)
				resizeLiquidTarget(bufferSize.x, bufferSize.y)
				waveMaterial.uniforms.uRes.value.copy(bufferSize)
				// 衝撃波の数値は短い辺 720px の画面が基準
				waveMaterial.uniforms.uScale.value =
					Math.min(bufferSize.x, bufferSize.y) / 720
				layoutLiters()
			}
			window.addEventListener('resize', resize)
			// スマホはアドレスバーの出入りと回転で画面の大きさが変わる。resize が遅れる端末があるので両方で測り直す
			window.visualViewport?.addEventListener('resize', resize)
			window.addEventListener('orientationchange', () =>
				requestAnimationFrame(resize),
			)
			resize()

			/* ========== 世界の原点の移し直し ========== */
			// 世界に端は無いので、走り続けると座標が大きくなる。自分が原点から離れすぎたら、座標を持つすべての物から
			// 同じ量を引いて原点を自分の近くへ戻す。地面の格子(10 単位)がずれないよう、引く量は 10 の倍数にする
			const worldShift = { count: 0, x: 0, z: 0 }
			function recenterWorld() {
				const limit = Math.max(RECENTER_MIN, cam.viewRange * RECENTER_VIEWS)
				if (body.x * body.x + body.z * body.z < limit * limit) return
				const dx = Math.round(body.x / gridSize) * gridSize
				const dz = Math.round(body.z / gridSize) * gridSize
				const shiftLegs = (b) => {
					for (const leg of b.legs) {
						leg.gx -= dx
						leg.gz -= dz
						leg.ox -= dx
						leg.oz -= dz
						if (leg.str) {
							leg.str.x -= dx
							leg.str.z -= dz
						}
					}
				}
				for (const b of blobs) {
					b.x -= dx
					b.z -= dz
					shiftLegs(b)
				}
				// 吸い切られて縮んでいく跡は、もう一覧に居ない体を指している
				for (const g of ghosts) {
					g.b.x -= dx
					g.b.z -= dz
					shiftLegs(g.b)
				}
				for (const f of foods) {
					f.x -= dx
					f.z -= dz
					if (f.kind === 'puddle') {
						f.fromX -= dx
						f.fromZ -= dz
						f.toX -= dx
						f.toZ -= dz
					} else f.group.position.set(f.x, 0, f.z)
				}
				for (const link of links) {
					link.ax -= dx
					link.az -= dz
					link.bx -= dx
					link.bz -= dz
				}

				for (const it of items) {
					it.x -= dx
					it.z -= dz
				}
				cam.x -= dx
				cam.z -= dz
				camera.position.x -= dx
				camera.position.z -= dz
				camera.updateMatrixWorld()
				worldShift.count++
				worldShift.x += dx
				worldShift.z += dz
			}

			/* ========== 世界の縮め直し(点数と世界の大きさを分ける) ========== */
			// 点数 = 世界の量 × massScale。縮め直すたびに massScale を RESCALE_FACTOR 倍にする
			let massScale = 1
			function scoreOf(liters) {
				return Math.min(MAX_SCORE, liters * massScale)
			}
			const worldRescale = { count: 0 }
			// 体の量が RESCALE_AT を超えたら、量を k で割り、長さを k の立方根で割る。量か長さを持つ物をすべて縮める
			function rescaleWorld(k) {
				const s = Math.cbrt(k)
				const scaleLegs = (b) => {
					for (const leg of b.legs) {
						leg.gx /= s
						leg.gz /= s
						leg.ox /= s
						leg.oz /= s
						if (leg.str) {
							leg.str.x /= s
							leg.str.z /= s
						}
					}
					b.legLeadX /= s
					b.legLeadZ /= s
				}
				for (const b of blobs) {
					b.x /= s
					b.z /= s
					b.vx /= s
					b.vz /= s
					b.mass /= k
					b.R = radiusForMass(b.mass)
					b.dispR /= s
					b.drainRef /= k
					b.lossAcc /= k
					scaleLegs(b)
				}
				for (const g of ghosts) {
					g.b.x /= s
					g.b.z /= s
					g.b.dispR /= s
					scaleLegs(g.b)
				}
				for (let i = foods.length - 1; i >= 0; i--) {
					const f = foods[i]
					// 入れ物は段ごとの決まった大きさなので縮められない。この大きさでは小さすぎて意味が無いので片付ける
					if (f.kind === 'container') {
						if (f.capturedBy) cutLink(f.capturedBy, 'reset')
						removeFood(f)
						continue
					}
					f.x /= s
					f.z /= s
					f.fromX /= s
					f.fromZ /= s
					f.toX /= s
					f.toZ /= s
					f.liters /= k
					f.full /= k
				}
				for (const link of links) {
					link.ax /= s
					link.ay /= s
					link.az /= s
					link.bx /= s
					link.by /= s
					link.bz /= s
					link.er /= s
					link.spread /= s
					link.lastDrop /= s
					link.total /= k
					link.moved /= k
					link.popAcc /= k
					// 大きな水たまりを吸う速さは 1 秒あたりの量(液体同士は割合なのでそのまま)
					if (link.pool) link.rate /= k
				}
				for (const it of items) {
					it.x /= s
					it.z /= s
					it.r /= s
				}
				cam.x /= s
				cam.z /= s
				cam.dist /= s
				cam.focusR /= s
				cam.fitDist /= s
				fever.from /= s
				body.store /= k
				cam.viewRange /= s
				cam.screenArea /= s * s
				camera.position.divideScalar(s)
				camera.updateMatrixWorld()
				gridSize /= s
				massScale *= k
				worldRescale.count++
			}

			/* ========== 毎コマの処理 ========== */
			const frameTimes = []
			let lastNow = performance.now()
			let realTime = 0
			let sceneTime = 0
			function tick(now) {
				requestAnimationFrame(tick)
				const workStart = performance.now()
				// 「おわる」の確かめを開いている間と、裏に回っている間は場面と時間を止める(描くのは続ける)
				const realDt =
					paused || document.hidden
						? 0
						: Math.max(0, Math.min(0.05, (now - lastNow) / 1000))
				lastNow = now
				stepGame(realDt, true)
				renderFrame()
				if (DEBUG) {
					frameTimes.push(performance.now() - workStart)
					if (frameTimes.length > 300) frameTimes.shift()
				}
			}
			// 1 コマぶん進める。draw が false の時は描く準備を省く(確認用の早送りで使う)
			function stepGame(realDt, draw) {
				realTime += realDt
				// ヒットストップは場面の時間だけ止める(HUD と制限時間は止めない)
				let dt = realDt
				if (hitstop > 0) {
					hitstop -= realDt
					dt = 0
				}
				sceneTime += dt

				if (state === 'play') {
					timeLeft -= realDt
					body.safeT = Math.max(0, body.safeT - realDt)
					if (timeLeft <= 0) {
						timeLeft = 0
						endGame('timeup')
					}
				} else if (state === 'ending' || state === 'devoured') {
					endingTime += realDt
					// 吸い切られた時は、残りが吸い込まれて管が引っ込むまで見せてから結果へ
					if (endingTime >= (state === 'devoured' ? 1.8 : 1.4)) showResult()
				}

				const playing = state === 'play'
				if (playing) {
					while (body.mass > RESCALE_AT) rescaleWorld(RESCALE_FACTOR)
					recenterWorld()
				}
				updateMovement(dt, playing)
				updateCpus(dt)
				updateBlobContacts()
				updateFoodContacts(dt)
				updateFoods(dt)
				updateLinks(dt)
				if (state === 'play') updateFever()
				updateBlobLooks(dt, sceneTime)
				updateGhosts(dt)
				if (state === 'play') {
					body.best = Math.max(body.best, scoreOf(playerTotal()))
					// 吸われて縮んだら、飲める入れ物の表示と触手の本数も戻す(演出は最大到達で数えるので出ない)
					body.stage = stageForRadius(body.R)
					updateSizeNotice(realDt)
					updateDangerLevel(realDt)
					// 効いている秒数は実時間で数える(育った時の一瞬の停止で効く秒数が延びないように)
					updateItems(realDt)
					maintainWorld(dt)
				}
				if (draw) drawWorld(sceneTime)

				updateCamera(dt, realDt, realTime)
				updateResultScene(realDt)
				if (draw) updateLiquidUniforms()
				updateWave(realDt)
				if (state !== 'title') {
					updateHud(realDt)
					updateLossPops(realDt)
					updatePointers(realDt)
					updateDanger(realDt)
					updatePops(realDt)
				}
				updateSlurp()
			}
			function renderFrame() {
				renderLiquids()
				if (wave.active) {
					renderer.setRenderTarget(sceneTarget)
					renderer.render(scene, camera)
					renderer.setRenderTarget(null)
					renderer.render(postScene, postCamera)
				} else {
					renderer.setRenderTarget(null)
					renderer.render(scene, camera)
				}
			}

			/* ========== 確認用の操作(URL に ?debug がある時だけ) ========== */
			if (DEBUG) {
				const removeCpu = (b) => {
					for (let i = b.links.length - 1; i >= 0; i--)
						cutLink(b.links[i], 'reset')
					for (let i = b.suckers.length - 1; i >= 0; i--)
						cutLink(b.suckers[i], 'reset')
					removeBlob(b)
				}
				window.kuroDebug = {
					get state() {
						return state
					},
					get mode() {
						return mode
					},
					get timeLeft() {
						return timeLeft
					},
					get massScale() {
						return massScale
					},
					worldRescale,
					scoreLiters: () => scoreOf(playerTotal()),
					formatAmount,
					get lang() {
						return lang
					},
					titleFor,
					compareText,
					shareText,
					// 共有の画像を作って、縦横の画素数とバイト数を返す
					shareImage: () => {
						const file = shareImageFile()
						return {
							bytes: file.size,
							width: canvas.width,
							height: canvas.height,
						}
					},
					pointerList,
					// 地面の点を画面の位置(px)へ写す。inFront はカメラより奥にあるか(手前の点は写すと裏返る)
					screenOf: (x, z) => {
						const v = new THREE.Vector3(x, 0, z)
						const inFront =
							v.clone().applyMatrix4(camera.matrixWorldInverse).z < 0
						v.project(camera)
						return {
							x: (v.x * 0.5 + 0.5) * window.innerWidth,
							y: (-v.y * 0.5 + 0.5) * window.innerHeight,
							inFront,
						}
					},
					get giantScale() {
						return giantScale
					},
					items,
					itemTimers,
					itemNext,
					itemGlows,
					// 自分からずらした所にアイテムを置く(湧く時刻と場所の決まりを通さない)
					spawnItemAt: (type, dx, dz) => {
						const it = {
							type,
							x: body.x + dx,
							z: body.z + dz,
							r: body.R * 0.45,
							t: 0,
							drinkT: -1,
							yaw: 0,
						}
						items.push(it)
						return it
					},
					get dangerIndex() {
						return dangerIndex
					},
					get paused() {
						return paused
					},
					cam,
					input,
					worldShift,
					foodCount,
					resultScene,
					audio,
					setGodMode: (on) => {
						godMode = on
					},
					// 描かずに seconds 秒ぶん進める。each(秒) は 1 コマごとに呼ばれ、自動操作に使う
					simulate: (seconds, step = 1 / 30, each = null) => {
						const n = Math.round(seconds / step)
						for (let i = 0; i < n; i++) {
							if (each) each(i * step)
							stepGame(step, false)
						}
					},
					// 長い時間の確認で見る数(種類ごとの数・管・弾む数字・音・three.js の形と絵と描き方)
					counts: () => {
						const roles = {
							puddle: 0,
							bit: 0,
							pellet: 0,
							pool: 0,
							container: 0,
						}
						for (const f of foods)
							roles[f.kind === 'container' ? 'container' : f.role]++
						return {
							cpus: blobs.length - 1,
							...roles,
							links: links.length,
							ghosts: ghosts.length,
							popsActive: pops.filter((p) => p.active).length,
							popElements: ui.pops.children.length,
							voices: audio.playing,
							sdfProxies: sdfProxies.length,
							sceneChildren: scene.children.length,
							geometries: renderer.info.memory.geometries,
							textures: renderer.info.memory.textures,
							programs: renderer.info.programs?.length ?? 0,
							domNodes: document.getElementsByTagName('*').length,
							bodyX: body.x,
							bodyZ: body.z,
							mass: body.mass,
							R: body.R,
							camDist: cam.dist,
							viewRange: cam.viewRange,
							groundScale,
						}
					},
					get body() {
						return body
					},
					blobs,
					foods,
					links,
					ghosts,
					pops,
					renderer,
					drainFraction,
					puddleSize,
					renderSound: renderSoundOffline,
					moveSpeedFor,
					sdfStats: () => ({
						proxies: sdfProxies.filter((p) => p.mesh.visible).length,
						parts: sdf.partsDrawn,
					}),
					setTimeLeft: (s) => {
						timeLeft = s
					},
					freezeAi: (on) => {
						aiFrozen = on
					},
					pauseSpawn: (on) => {
						spawnPaused = on
					},
					spawnCpu: (radiusRatio, dx, dz) =>
						createBlob(
							false,
							body.x + dx,
							body.z + dz,
							body.mass * radiusRatio ** 3,
						),
					spawnPuddle: (dx, dz, liters, role) =>
						createPuddle(body.x + dx, body.z + dz, liters, role),
					// 画面に映っている床の液体の数(役割ごと)
					countOnScreen: () => {
						const n = { bit: 0, puddle: 0, pellet: 0, pool: 0 }
						for (const f of foods)
							if (f.kind === 'puddle' && isOnScreen(f.x, f.z, puddleSize(f)))
								n[f.role]++
						return n
					},
					spawnContainer: (stage, dx, dz) =>
						createContainer(stage, body.x + dx, body.z + dz),
					clearCpus: () => {
						for (const b of blobs.filter((o) => !o.isPlayer)) removeCpu(b)
					},
					clearFoods: () => {
						for (const f of [...foods]) {
							if (f.capturedBy) cutLink(f.capturedBy, 'reset')
							for (const l of [...f.suckers]) cutLink(l, 'reset')
							removeFood(f)
						}
					},
					totalLiters: () => {
						let sum = 0
						for (const b of blobs) sum += b.mass
						for (const f of foods) sum += f.liters
						return sum
					},
					bodyScreenRect,
					frameMs: () =>
						frameTimes.reduce((a, b) => a + b, 0) /
						Math.max(1, frameTimes.length),
					resetFrames: () => {
						frameTimes.length = 0
					},
				}
			}

			applyLangToHud()
			initAudio()
			resetWorld()
			requestAnimationFrame(tick)
		</script>
	</body>
</html>
