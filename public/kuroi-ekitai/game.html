			// 嵐の管の太さの形。伸びる間は根元から細い糸を引き(真ん中ほど細い)、離れる時は真ん中がだんだんくびれる
			function stormNeck(link, u) {
				const mid = Math.exp(-(((u - 0.5) / 0.22) ** 2))
				if (link.phase === 'extend') return 1 - 0.35 * mid
				const pinch = Math.min(
					1,
					link.rt / (STORM_RETRACT_SECONDS * STORM_SPLIT_AT),
				)
				return 1 - 0.75 * pinch * mid
			}
			// 嵐の管がちぎれる時刻(離れ始めてからの割合)と、伸びる先と切れ端に付けるしずくの大きさ(管の太さの倍率)
			const STORM_SPLIT_AT = 0.45
			const STORM_DROP = 1.9
			function retractThin(link) {
				if (link.phase !== 'retract') return 1
				return lerp(
					1,
					0.22,
					easeOutQuad(Math.min(1, link.rt / (RETRACT_SECONDS * 0.3))),
				)
			}
			// 管の u0〜u1 の範囲を、隣同士は普通の min でつながるカプセルの列にする
			function addTubeRange(link, tube, u0, u1, n) {
				if (u1 - u0 < 1e-3 || !sdfChain(link.er * 0.26)) return
				tubePoint(u0, tubeA)
				let ra = tubeRadius(link, u0, tube)
				for (let i = 1; i <= n; i++) {
					const u = lerp(u0, u1, i / n)
					tubePoint(u, tubeB)
					const rb = tubeRadius(link, u, tube)
					sdfPart(tubeA.x, tubeA.y, tubeA.z, ra, tubeB.x, tubeB.y, tubeB.z, rb)
					tubeA.copy(tubeB)
					ra = rb
				}
				sdfEndChain()
			}
			// 吸う側の液体の部品として管を足す。離れる時は細い糸になって伸び、真ん中で切れて両側へ縮む
			function addTube(link, detail) {
				// 何本も刺す時は 1 本あたりの部品を減らして、部品の上限に収める
				// 何本も刺す時と嵐の管は 1 本あたりの部品を減らして、部品の上限に収める
				const n =
					link.tubes > 1 || link.storm
						? detail >= 2
							? 5
							: 3
						: detail >= 2
							? TUBE_SEGS
							: 4
				if (link.storm) {
					addStormTube(link, n)
					return
				}
				for (let k = 0; k < link.tubes; k++) {
					if (setupTube(link, k) < 0.01) continue
					if (link.phase !== 'retract') {
						addTubeRange(link, k, 0, 1, n)
						continue
					}
					const u = link.rt / RETRACT_SECONDS
					if (link.targetGone) {
						addTubeRange(link, k, 0, 1 - u, n)
						if (link.lastDrop > 0 && sdfChain(link.er * 0.26)) {
							tubePoint(1 - u, tubeA)
							sdfSphere(
								tubeA.x,
								tubeA.y,
								tubeA.z,
								link.lastDrop * (1 - 0.5 * u),
							)
							sdfEndChain()
						}
						continue
					}
					if (u < 0.45) {
						addTubeRange(link, k, 0, 1, n)
						continue
					}
					const s = 0.5 * (1 - (u - 0.45) / 0.55)
					addTubeRange(link, k, 0, s, Math.ceil(n / 2))
					addTubeRange(link, k, 1 - s, 1, Math.ceil(n / 2))
				}
			}
			// 嵐の管: 細い糸の先に少し太いしずくを付けて伸ばし、離れる時は真ん中がくびれてちぎれ、切れ端のしずくが両側へ縮む
			function addStormTube(link, n) {
				if (setupTube(link, 0) < 0.01) return
				const drop = tubeBase(link) * STORM_DROP
				const dropAt = (u, r) => {
					if (r <= 0 || !sdfChain(link.er * 0.26)) return
					tubePoint(u, tubeA)
					sdfSphere(tubeA.x, tubeA.y, tubeA.z, r)
					sdfEndChain()
				}
				if (link.phase === 'extend') {
					addTubeRange(link, 0, 0, 1, n)
					dropAt(1, drop)
					return
				}
				if (link.phase === 'suck') {
					addTubeRange(link, 0, 0, 1, n)
					return
				}
				const u = link.rt / STORM_RETRACT_SECONDS
				// 吸い終わった管は、先のしずくと一緒に吸う側へ引き戻す
				if (link.targetGone) {
					addTubeRange(link, 0, 0, 1 - u, n)
					dropAt(1 - u, drop * (1 - 0.5 * u))
					return
				}
				if (u < STORM_SPLIT_AT) {
					addTubeRange(link, 0, 0, 1, n)
					return
				}
				const v = (u - STORM_SPLIT_AT) / (1 - STORM_SPLIT_AT)
				const s = 0.5 * (1 - v)
				const m = Math.ceil(n / 2)
				addTubeRange(link, 0, 0, s, m)
				addTubeRange(link, 0, 1 - s, 1, m)
				dropAt(s, drop * (1 - 0.6 * v))
				dropAt(1 - s, drop * (1 - 0.6 * v))
			}
			// 管の先が刺さった相手の側にも管の先を溶け合わせ、液がつながって見えるようにする
			function addTubeTip(link) {
				if (link.phase === 'extend') return
				if (
					link.phase === 'retract' &&
					(link.targetGone || link.rt / retractSeconds(link) >= 0.45)
				)
					return
				for (let k = 0; k < link.tubes; k++) {
					setupTube(link, k)
					if (!sdfChain(link.er * 0.4)) return
					tubePoint(0.8, tubeA)
					tubePoint(1, tubeB)
					sdfPart(
						tubeA.x,
						tubeA.y,
						tubeA.z,
						tubeRadius(link, 0.8, k),
						tubeB.x,
						tubeB.y,
						tubeB.z,
						tubeRadius(link, 1, k),
					)
					sdfEndChain()
				}
			}

			/* ========== 触れた時の決まり(吸う・押し合う) ========== */
			// storm: 触手の嵐の管。1 者あたりの本数の上限には数えない
			function canCapture(eater, target, isBlob, storm = false) {
				if (eater.dead || target.dead || links.length >= CAP.links) return false
				if (
					!storm &&
					eater.links.length >= MAX_LINKS_PER_EATER &&
					ownLinkCount(eater) >= MAX_LINKS_PER_EATER
				)
					return false
				if (eater.isPlayer && state !== 'play') return false
				if (
					target.isPlayer &&
					(state !== 'play' || target.safeT > 0 || godMode || giantActive())
				)
					return false
				// 液体同士と大きな水たまりは、何者かで同時に吸える(同じ相手からは 1 つの管の束だけ)
				if (isBlob || target.role === 'pool') {
					const max = isBlob ? MAX_SUCKERS : MAX_POOL_SUCKERS
					return (
						target.suckers.length < max &&
						!target.suckers.some((l) => l.eater === eater)
					)
				}
				const holder = target.capturedBy
				// 吸われている途中の床の液体は、吸っている側より十分大きい者だけが横取りできる
				if (holder)
					return (
						holder.eater !== eater &&
						sizeR(eater) >= sizeR(holder.eater) * EAT_RATIO
					)
				return true
			}
			// 嵐の管を除いた管の数(嵐の最中でも、触れて吸う管はいつも通り 4 本まで刺せるように)
			function ownLinkCount(eater) {
				let n = 0
				for (const l of eater.links) if (!l.storm) n++
				return n
			}
			function pushApart(a, b, minD, d, dx, dz) {
				const nx = d > 1e-4 ? dx / d : 1
				const nz = d > 1e-4 ? dz / d : 0
				const overlap = minD - d
				// 重い方ほど動かない
				const wa = b.mass / (a.mass + b.mass || 1)
				a.x -= nx * overlap * wa
				a.z -= nz * overlap * wa
				b.x += nx * overlap * (1 - wa)
				b.z += nz * overlap * (1 - wa)
			}
			function updateBlobContacts() {
				for (let i = 0; i < blobs.length; i++) {
					const a = blobs[i]
					for (let j = i + 1; j < blobs.length; j++) {
						const b = blobs[j]
						if (a.dead || b.dead) continue
						const dx = b.x - a.x
						const dz = b.z - a.z
						// 吸う側は「吸える方」で決める。巨大化中の自分は、自分より大きい相手も吸う
						const eater = canEat(a, b) ? a : canEat(b, a) ? b : null
						const big = eater ?? (sizeR(a) >= sizeR(b) ? a : b)
						const small = big === a ? b : a
						const reachD = contactDistance(big, small)
						const d2 = dx * dx + dz * dz
						if (d2 > reachD * reachD) continue
						const d = Math.sqrt(d2)
						if (eater && canCapture(big, small, true))
							startLink(big, small, true)
						// 体の芯同士は重ならないよう押し合う(触手と管は重なってよい)
						const minD = (sizeR(a) + sizeR(b)) * 0.85
						if (d < minD) pushApart(a, b, minD, d, dx, dz)
					}
				}
			}
			let blockedCooldown = 0
			function updateFoodContacts(dt) {
				blockedCooldown -= dt
				// 全員 × 床の液体を毎コマ調べるので、まず「届き得る一番遠い距離」の 2 乗で大まかにふるい落とす。
				// 床の液体ごとの広がりは 1 コマに 1 回だけ求める
				for (const f of foods) {
					f.contactPad =
						f.kind === 'container'
							? STAGES[f.stage].f
							: f.role === 'pool'
								? puddleSize(f) * 0.8
								: puddleSize(f) * 0.5
				}
				for (const b of blobs) {
					if (b.dead) continue
					const reach = reachRadius(b)
					for (const f of foods) {
						if (f.dead || f.vanishing || f.liters <= 0) continue
						const dx = b.x - f.x
						const dz = b.z - f.z
						// 入れ物は押し返す距離(体の半径の 0.8 倍 + 足元)まで見る
						const lim =
							(f.kind === 'container' ? Math.max(reach, b.R * 0.8) : reach) +
							f.contactPad
						const d2 = dx * dx + dz * dz
						if (d2 >= lim * lim) continue
						const d = Math.sqrt(d2)
						if (f.role === 'pool') {
							if (d < reach + puddleSize(f) * 0.8 && canCapture(b, f, false))
								startLink(b, f, false)
							continue
						}
						if (f.kind === 'puddle') {
							if (d < reach + puddleSize(f) * 0.5 && canCapture(b, f, false))
								startLink(b, f, false)
							continue
						}
						const st = STAGES[f.stage]
						if ((b.isPlayer && giantActive()) || b.R >= st.need) {
							if (d < reach + st.f * 0.5 && canCapture(b, f, false))
								startLink(b, f, false)
							continue
						}
						// まだ飲めない入れ物は押し返す
						const minD = b.R * 0.8 + st.f
						if (d >= minD) continue
						const nx = (b.x - f.x) / (d || 1)
						const nz = (b.z - f.z) / (d || 1)
						b.x = f.x + nx * minD
						b.z = f.z + nz * minD
						const into = b.vx * nx + b.vz * nz
						if (into < 0) {
							b.vx -= into * nx
							b.vz -= into * nz
						}
						// 押し返されている間に鳴り続けないよう、1 秒に 1 回までにする
						if (b === body && state === 'play' && blockedCooldown <= 0) {
							blockedCooldown = 1
							restartAnimation(ui.toast, 'show')
						}
					}
				}
			}

			/* ========== 相手役の考えと動き ========== */
			// 吸われている間は逃げるのが最優先。それ以外は、見える範囲で
			// 大きい相手から逃げる > 吸っている相手を追い続ける > 小さい相手を追う > 床の液体へ向かう > うろつく
			function thinkCpu(b) {
				if (b.suckers.length) {
					let fx = 0
					let fz = 0
					for (const l of b.suckers) {
						const dx = b.x - l.eater.x
						const dz = b.z - l.eater.z
						const d = Math.hypot(dx, dz) || 1
						fx += dx / d
						fz += dz / d
					}
					b.goalX = fx || Math.cos(b.wanderA)
					b.goalZ = fz || Math.sin(b.wanderA)
					b.goalMag = 1
					b.chaseTarget = null
					return
				}
				const sight = b.R * 9
				let fleeX = 0
				let fleeZ = 0
				let prey = null
				let preyValue = 0
				for (const o of blobs) {
					if (o === b || o.dead) continue
					if (o.isPlayer && state !== 'play') continue
					const dx = o.x - b.x
					const dz = o.z - b.z
					const d = Math.hypot(dx, dz) || 1
					const gap = d - sizeR(o) - b.R
					if (gap > sight) continue
					if (canEat(o, b)) {
						const w = 1 / Math.pow(Math.max(0.3, gap + 0.5), 2)
						fleeX -= (dx / d) * w
						fleeZ -= (dz / d) * w
					} else if (
						canEat(b, o) &&
						!(o.isPlayer && o.safeT > 0) &&
						!(b.ignoreUntil.get(o) > sceneTime)
					) {
						const v = o.mass / (d + b.R)
						if (v > preyValue) {
							preyValue = v
							prey = o
						}
					}
				}
				if (fleeX || fleeZ) {
					b.goalX = fleeX
					b.goalZ = fleeZ
					b.goalMag = 1
					b.chaseTarget = null
					return
				}
				const holding = b.links.find((l) => l.isBlob)
				if (holding) prey = holding.target
				if (prey !== b.chaseTarget) {
					b.chaseTarget = prey
					b.chaseT = 0
				}
				if (prey) {
					// 相手の少し先を狙う。遠いうちは 85% の速さで追い(15分チャレンジは危険度で上がる)、近づいたら全速で飛びかかる(逃げ切れる余地を残す)
					b.goalX = prey.x + prey.vx * 0.3 - b.x
					b.goalZ = prey.z + prey.vz * 0.3 - b.z
					const lunge = contactDistance(b, prey) * 1.5
					b.goalMag =
						Math.hypot(prey.x - b.x, prey.z - b.z) < lunge
							? 1
							: DANGER_LEVELS[dangerIndex].farChase
					return
				}
				let food = null
				let foodValue = 0
				for (const f of foods) {
					if (f.dead || f.vanishing || f.capturedBy || f.liters <= 0) continue
					if (f.kind === 'container' && b.R < STAGES[f.stage].need) continue
					const d = Math.hypot(f.x - b.x, f.z - b.z)
					if (d > sight) continue
					const v = f.liters / (d + b.R)
					if (v > foodValue) {
						foodValue = v
						food = f
					}
				}
				if (food) {
					b.goalX = food.x - b.x
					b.goalZ = food.z - b.z
					b.goalMag = 0.75
					return
				}
				b.wanderA += rand(-0.9, 0.9)
				b.goalX = Math.cos(b.wanderA)
				b.goalZ = Math.sin(b.wanderA)
				b.goalMag = 0.45
			}
			function moveCpu(b, dt) {
				let speed = 0
				if (b.goalMag > 0 && !aiFrozen) {
					const diff = angleDiff(Math.atan2(b.goalZ, b.goalX), b.heading)
					// 大きいほどゆっくり曲がり、曲がり切るまでは速度を落とす(急に反転しない)。吸われている間は慌てて速く向きを変える
					const turn = ((b.suckers.length ? 6 : 3.2) / (1 + 0.35 * b.R)) * dt
					b.heading += clamp(diff, -turn, turn)
					speed =
						moveSpeedFor(b.R) *
						b.speedK *
						speedFactor(b) *
						b.goalMag *
						(0.35 + 0.65 * Math.max(0, Math.cos(diff)))
					// 小さい相手を追う時は、近くで飛びかかる時も含めて相手の全速の 9 割まで(15分チャレンジは危険度で上がる)
					if (b.chaseTarget)
						speed = Math.min(
							speed,
							moveSpeedFor(b.chaseTarget.R) * DANGER_LEVELS[dangerIndex].speed,
						)
				}
				const k = damp(5, dt)
				b.vx += (Math.cos(b.heading) * speed - b.vx) * k
				b.vz += (Math.sin(b.heading) * speed - b.vz) * k
				b.x += b.vx * dt
				b.z += b.vz * dt
			}
			// 追っている相手に管を刺せないまま一定時間たったら諦め、その相手をしばらく狙わない
			function updateChase(b, dt) {
				const t = b.chaseTarget
				if (!t) return
				if (t.dead) {
					b.chaseTarget = null
					return
				}
				if (b.links.some((l) => l.target === t)) {
					b.chaseT = 0
					return
				}
				b.chaseT += dt
				if (b.chaseT < DANGER_LEVELS[dangerIndex].giveUp) return
				for (const [o, until] of b.ignoreUntil)
					if (until <= sceneTime || o.dead) b.ignoreUntil.delete(o)
				b.ignoreUntil.set(t, sceneTime + CHASE_IGNORE_SECONDS)
				b.chaseTarget = null
				b.chaseT = 0
				b.thinkT = 0
			}
			function updateCpus(dt) {
				for (const b of blobs) {
					if (b.isPlayer) continue
					updateChase(b, dt)
					b.thinkT -= dt
					if (b.thinkT <= 0) {
						// 判断は毎コマではなく 0.2〜0.4 秒ごと。吸われている間は早めに考え直す。
						// 画面から離れた相手役は 0.8〜1.2 秒ごとにして、見えない所の計算を減らす
						const dx = b.x - body.x
						const dz = b.z - body.z
						const far = dx * dx + dz * dz > (cam.viewRange * RANGE.think) ** 2
						b.thinkT = b.suckers.length
							? rand(0.08, 0.15)
							: far
								? rand(0.8, 1.2)
								: rand(0.2, 0.4)
						thinkCpu(b)
					}
					moveCpu(b, dt)
				}
			}
			function updateBlobLooks(dt, t) {
				for (const b of blobs) {
					// 自分が満ちて膨らむ間は 2 拍の形で動かす。それ以外は本当の大きさへなめらかに追い付く
					const popR = b === body ? feverDisplayR() : null
					if (popR !== null) b.dispR = popR
					else b.dispR += (b.R - b.dispR) * damp(4, dt)
					b.gulp *= Math.exp(-dt * 10)
					b.pulseT = Math.min(1, b.pulseT + dt / 0.55)
					// 自分の段階はサイズアップの演出と一緒に毎コマの処理で上げる
					if (!b.isPlayer) b.stage = stageForRadius(b.R)
					// 画面から外れた相手役は触手の計算を止めて畳む。画面に近づくと体の中心から生え直す
					// (描く範囲より広めに見て、生え直すのは画面の外で済ませる)
					if (
						!b.isPlayer &&
						!isOnScreen(b.x, b.z, visualRadius(b) * 4 + tubeSpan(b))
					) {
						b.legs.length = 0
						continue
					}
					updateLegs(b, dt, t)
				}
			}

			/* ========== 湧きと片付け ========== */
			const screenVec = new THREE.Vector3()
			// r は物の広がり。画面の縁から少しでもはみ出して見えるなら画面内とみなす
			// 地面の点が画面の内側に映っているか(余白なし)
			function isInsideScreen(x, z) {
				screenVec.set(x, 0, z).project(camera)
				return Math.abs(screenVec.x) < 1 && Math.abs(screenVec.y) < 1
			}
			function isOnScreen(x, z, r) {
				screenVec.set(x, 0, z).project(camera)
				const cx = screenVec.x
				const cy = screenVec.y
				screenVec.set(x + r, 0, z).project(camera)
				const m = Math.abs(screenVec.x - cx) * 1.5 + 0.05
				return Math.abs(cx) < 1 + m && Math.abs(cy) < 1 + m * 1.5
			}
			const spawnSpot = { x: 0, z: 0 }
			function findSpawnSpot(r, minD, maxD, offScreen) {
				for (let attempt = 0; attempt < 12; attempt++) {
					const a = rand(0, Math.PI * 2)
					const d = rand(minD, maxD)
					const x = body.x + Math.cos(a) * d
					const z = body.z + Math.sin(a) * d
					if (offScreen && isOnScreen(x, z, r)) continue
					if (!spotIsFree(x, z, r)) continue
					spawnSpot.x = x
					spawnSpot.z = z
					return spawnSpot
				}
				return null
			}
			function spotIsFree(x, z, r) {
				for (const o of blobs)
					if (Math.hypot(x - o.x, z - o.z) < o.R * 1.8 + r + 0.3) return false
				for (const f of foods) {
					if (
						f.kind === 'container' &&
						Math.hypot(x - f.x, z - f.z) < STAGES[f.stage].f + r + 0.3
					)
						return false
					if (
						f.role === 'pool' &&
						Math.hypot(x - f.x, z - f.z) < puddleSize(f) * 1.3 + r
					)
						return false
				}
				return true
			}
			function pickCpuMass() {
				const r = Math.random()
				// 半径の倍率: 大きい相手の割合(普段 30%、15分チャレンジは危険度で増える)を除いた残りを、小さい 5 : 同じくらい 2 で分ける。
				// 大きい相手は 1.2 倍寄りにして 3 倍級はまれにする
				const small = (1 - DANGER_LEVELS[dangerIndex].bigChance) * (5 / 7)
				const same = (1 - DANGER_LEVELS[dangerIndex].bigChance) * (2 / 7)
				const k =
					r < small
						? rand(0.4, 0.95)
						: r < small + same
							? rand(0.95, 1.15)
							: 1.2 + 1.8 * Math.pow(Math.random(), 1.6)
				return body.mass * k * k * k
			}
			function spawnCpu(initial) {
				if (blobs.length - 1 >= CAP.cpus) return
				// 小さい相手役の分(TINY_MAX)は空けておく
				let normal = 0
				for (const b of blobs) if (!b.isPlayer && !b.tiny) normal++
				if (normal >= CAP.cpus - TINY_MAX) return
				const mass = pickCpuMass()
				const r = radiusForMass(mass)
				const view = cam.viewRange
				// 開始時は自分より大きい相手を画面内に置かず、すぐ追い付かれないよう遠めに置く。途中で湧く相手役は常に画面の外
				const offScreen = !initial || mass > body.mass
				const minD = !offScreen
					? body.R * 3 + r
					: initial
						? view * 0.9
						: view * 0.3
				const spot = findSpawnSpot(
					r * 2,
					minD,
					view * (initial && offScreen ? 1.6 : 1.3),
					offScreen,
				)
				if (spot) createBlob(false, spot.x, spot.z, mass)
			}
			function tinyTargetCount() {
				return Math.min(
					TINY_MAX,
					Math.round(4 + sizeStepFor(Math.max(1, body.best)) * TINY_PER_STEP),
				)
			}
			// 小さい相手役を、画面の外の 1 か所に群れで湧かせる(開始時は画面の中にも置く)。湧かせた数を返す
			function spawnTinyGroup(initial, room) {
				const n = Math.min(room, Math.round(rand(...TINY_GROUP)))
				const view = cam.viewRange
				const spot = initial
					? findSpawnSpot(body.R * 2, body.R * 4, view * 0.9, false)
					: findSpawnSpot(body.R * 2, view * 0.3, view * TINY_KEEP, true)
				if (!spot) return 0
				const cx = spot.x
				const cz = spot.z
				let made = 0
				for (let i = 0; i < n && blobs.length - 1 < CAP.cpus; i++) {
					const k = rand(...TINY_RADIUS)
					const a = rand(0, Math.PI * 2)
					const d = body.R * rand(0.5, 2.5)
					const b = createBlob(
						false,
						cx + Math.cos(a) * d,
						cz + Math.sin(a) * d,
						body.mass * k * k * k,
					)
					b.tiny = true
					made++
				}
				return made
			}
			function spawnPuddle(initial) {
				if (foodCount.puddle >= CAP.puddles) return
				// 3 割は自分よりずっと小さい水たまりにする(育った実感のため)
				const liters = Math.max(
					0.03,
					body.mass *
						(Math.random() < 0.3 ? rand(0.008, 0.03) : rand(0.04, 0.12)),
				)
				const view = cam.viewRange
				const r = puddleRadius(liters) * 1.2
				const spot = initial
					? findSpawnSpot(r, body.R * 2 + 0.3, view * 0.7, false)
					: findSpawnSpot(r, view * 0.3, view * 1.3, true)
				if (spot) createPuddle(spot.x, spot.z, liters)
			}
			// かけらを散りばめる円の半径と、その中に保つ数(画面に映る数が BIT_ON_SCREEN になる密度)
			function bitDiskRadius() {
				return cam.viewRange * 1.1
			}
			function bitTargetCount() {
				const R = bitDiskRadius()
				return Math.min(
					CAP.bits,
					Math.round(
						(BIT_ON_SCREEN * Math.PI * R * R) / Math.max(1, cam.screenArea),
					),
				)
			}
			// 道端のかけら: 自分の量の 1.2〜3.5% の小さな液(4 割はさらに小さい 0.3〜1.2%)。円の中に均一に散らす。
			// 遊んでいる最中は画面の外に湧かせ、目の前に急に現れないようにする
			function spawnBit(initial) {
				if (foodCount.bit >= CAP.bits) return
				const liters =
					body.mass *
					(Math.random() < 0.4 ? rand(0.003, 0.012) : rand(0.012, 0.035))
				const r = puddleRadius(liters) * 1.2
				const minD = reachRadius(body) * 1.5 + r
				const R = bitDiskRadius()
				for (let attempt = 0; attempt < 12; attempt++) {
					const a = rand(0, Math.PI * 2)
					const d = R * Math.sqrt(Math.random())
					const x = body.x + Math.cos(a) * d
					const z = body.z + Math.sin(a) * d
					if (
						d < minD ||
						(!initial && isOnScreen(x, z, r)) ||
						!spotIsFree(x, z, r)
					)
						continue
					createPuddle(x, z, liters, 'bit')
					return
				}
			}
			// 画面の中(縁から少し内側)の地面の点を選ぶ
			function findScreenSpot(r, minD) {
				for (let attempt = 0; attempt < 24; attempt++) {
					pointerNdc.set(rand(-0.7, 0.7), rand(-0.6, 0.75))
					raycaster.setFromCamera(pointerNdc, camera)
					if (!raycaster.ray.intersectPlane(groundPlane, hitPoint)) continue
					if (
						Math.hypot(hitPoint.x - body.x, hitPoint.z - body.z) < minD ||
						!spotIsFree(hitPoint.x, hitPoint.z, r)
					)
						continue
					spawnSpot.x = hitPoint.x
					spawnSpot.z = hitPoint.z
					return spawnSpot
				}
				return null
			}
			// 大きな水たまり: 自分の量の数倍〜数十倍。吸うのに時間がかかり、寄ってきた相手役と取り合いになる。
			// 開始時は画面の中に 1 個置き、遊んでいる最中は画面の少し外に湧かせる
			function spawnPool(initial) {
				if (foodCount.pool >= CAP.pools) return false
				const [min, max] = initial
					? POOL_FIRST_SIZE
					: POOL_SIZE_BY_STAGE[
							Math.min(body.stage, POOL_SIZE_BY_STAGE.length - 1)
						]
				const liters = body.mass * rand(min, max)
				const view = cam.viewRange
				const r = puddleRadius(liters) * 1.3
				// 縦画面は横幅が狭く大きな水たまりの直径が画面幅の半分を超えるので、開始時は縁が触手の少し先に来る所まで近づけてよい
				const spot = initial
					? findScreenSpot(r, reachRadius(body) + r * 0.8)
					: findSpawnSpot(r, view * 0.6, view * 1.3, true)
				if (spot) createPuddle(spot.x, spot.z, liters, 'pool')
				return spot !== null
			}
			function spawnContainer(initial) {
				if (foodCount.container >= CAP.containers) return
				const stage = clamp(
					body.stage + (Math.random() < 0.5 ? 0 : 1),
					1,
					STAGES.length - 1,
				)
				const view = cam.viewRange
				const r = STAGES[stage].f * 1.3
				const spot = initial
					? findSpawnSpot(r, 2.5, view * 0.6, false)
					: findSpawnSpot(r, view * 0.35, view * 1.3, true)
				if (spot) createContainer(stage, spot.x, spot.z)
			}

			let maintainTimer = 0
			let poolCooldown = 0
			function maintainWorld(dt) {
				maintainTimer -= dt
				if (maintainTimer > 0 || spawnPaused) return
				maintainTimer = 0.2
				const view = cam.viewRange
				// 遠すぎる物・小さすぎて意味の無い物を片付ける(吸い合いの途中の物は残す)
				for (let i = blobs.length - 1; i >= 0; i--) {
					const b = blobs[i]
					if (b.isPlayer || b.suckers.length || b.links.length) continue
					const d = Math.hypot(b.x - body.x, b.z - body.z)
					// 相手役同士の吸い合いで育ちすぎた者も、画面の外にいるうちに片付けて大きさの割合を保つ
					const offScreen = !isOnScreen(b.x, b.z, b.R * 2)
					// 小さい相手役(半径 0.15 倍から)は残す
					const outOfRange = b.R < body.R * 0.1 || b.R > body.R * 3.5
					const tinyFar = b.tiny && d > view * TINY_KEEP * 1.4
					if (d > view * RANGE.keep || ((outOfRange || tinyFar) && offScreen))
						removeBlob(b)
				}
				for (let i = foods.length - 1; i >= 0; i--) {
					const f = foods[i]
					if (f.capturedBy || f.suckers.length) continue
					const d = Math.hypot(f.x - body.x, f.z - body.z)
					const offScreen = !isOnScreen(f.x, f.z, 1)
					const tiny =
						(f.kind === 'puddle'
							? f.liters < body.mass * 0.002
							: f.stage < body.stage - 1) && offScreen
					// かけらは数が多いので、散りばめる円から離れて置いていかれた物は早めに片付ける
					const leftBehind =
						f.role === 'bit' && d > bitDiskRadius() * 1.3 && offScreen
					if (d > view * RANGE.keep || tiny || leftBehind) removeFood(f)
				}
				let cpus = 0
				let tinies = 0
				let puddles = 0
				let bits = 0
				let pools = 0
				let containers = 0
				for (const b of blobs)
					if (
						!b.isPlayer &&
						Math.hypot(b.x - body.x, b.z - body.z) < view * 1.5
					) {
						if (!b.tiny) cpus++
						else if (
							Math.hypot(b.x - body.x, b.z - body.z) <
							view * TINY_KEEP * 1.4
						)
							tinies++
					}
				for (const f of foods) {
					const d = Math.hypot(f.x - body.x, f.z - body.z)
					if (f.kind === 'container') containers++
					// 散った粒は数に入れない(湧く水たまりの数を変えない)
					else if (f.role === 'puddle') puddles++
					else if (f.role === 'bit' && d < bitDiskRadius()) bits++
					else if (f.role === 'pool' && d < view * 1.5) pools++
				}
				for (let k = 0; k < 2 && cpus + k < CPU_TARGET_COUNT; k++)
					spawnCpu(false)
				const tinyTarget = tinyTargetCount()
				if (tinies < tinyTarget) spawnTinyGroup(false, tinyTarget - tinies)
				for (let k = 0; k < 3 && puddles + k < PUDDLE_TARGET_COUNT; k++)
					spawnPuddle(false)
				const bitTarget = bitTargetCount()
				for (let k = 0; k < 12 && bits + k < bitTarget; k++) spawnBit(false)
				// 大きな水たまりは前に湧いてから一定の時間が過ぎた時だけ湧く。近くに無ければ必ず、1 個あればたまに 2 個目
				poolCooldown -= 0.2
				if (
					poolCooldown <= 0 &&
					(pools < 1 || (pools < POOL_TARGET_COUNT && Math.random() < 0.04)) &&
					spawnPool(false)
				) {
					poolCooldown = POOL_RESPAWN_SECONDS
				}
				if (containers < CONTAINER_TARGET_COUNT) spawnContainer(false)
				maintainItems()
			}

			/* ========== アイテム(巨大化・成長促進剤・触手の嵐) ========== */
			// 床にランダムに落ちていて、飲めるのは自分だけ。相手役も飲めると、急に何でも吸える相手が現れて理不尽になるため。
			// 種類ごとに画面の近くに同時に CAP.itemsPerType 個まで。飲まれるか遠くで消えてから、次が湧くまでの秒数を数える。
			// first / every は 1 つ目・次が湧くまでの秒数の [最小, 最大]。巨大化は約 20 秒に 1 回、成長促進剤と触手の嵐はそれより多い
			const ITEM_TYPES = {
				giant: {
					seconds: 12,
					tint: [1, 0.62, 0.08],
					first: [10, 20],
					every: [15, 25],
					// 効いている間に飲むと add 秒足す(上限 max 秒)。効いている間は activeEvery 秒ごとに近くへ湧く
					add: 12,
					max: 36,
					activeEvery: [6, 10],
				},
				boost: {
					seconds: 15,
					tint: [0.2, 0.9, 0.3],
					first: [5, 12],
					every: [12, 22],
				},
				// 色は体の縁の紫(liquidShade の縁の光)と同じ色合いで、明るさだけ上げる
				storm: {
					seconds: 6,
					tint: [0.35, 0.14, 1],
					// 発注者の「全体範囲のやつももう少しわいて欲しい」で、前の 6〜12 / 8〜14 / 4〜7 秒から縮めた
					first: [3, 7],
					every: [5, 9],
					add: 6,
					max: 24,
					activeEvery: [3, 5],
				},
			}
			// 巨大化: 見た目・当たり・触手の届く距離の倍率、大きくなる秒数、終わりを知らせる秒数、切れた後の吸われない秒数。
			// 切れても縮めず、その大きさを本当の大きさとして残す(発注者「戻されるのストレス」)
			const GIANT_SCALE = 2.5
			const GIANT_GROW_SECONDS = 0.3
			const GIANT_WARN_SECONDS = 2
			const GIANT_AFTER_SAFE = 1.5
			// 自分だけ、床の液体と入れ物から増える量をいつもこの倍にする(相手役を吸った量には掛けない)。
			// 床の液体の量そのものを増やすと水たまりが大きく描かれ、吸い終わるまでの秒数も延びて手触りが変わるため、増える量に掛ける。
			// 相手役には掛けない(相手役の育ち方まで変えると、追われる・逃げる釣り合いが変わるため)
			const FOOD_GAIN = 2
			// 成長促進剤: 床の液体と入れ物から増える量の倍率(FOOD_GAIN に重ねて掛ける。相手役を吸った量には掛けない)
			const BOOST_GAIN = 2
			// 触手の嵐: 管を一斉に伸ばす間隔と、1 回に伸ばす管の数。届く範囲は画面に映っている所全部(育って画面が引くほど広がる)。
			// 嵐の管は 1 者あたりの本数の上限(MAX_LINKS_PER_EATER)には数えず、全体の上限 CAP.links だけを守る
			const STORM_PULSE_SECONDS = 0.6
			const STORM_LINKS = 8
			// 触れてから飲み終えて効き始めるまでの秒数
			const ITEM_DRINK_SECONDS = 0.3
			const items = []
			// 効いている残りの秒数と、次が湧くまでの秒数
			const itemTimers = { giant: 0, boost: 0, storm: 0 }
			const itemNext = { giant: 0, boost: 0, storm: 0 }
			// 触手の嵐の次の一斉の管までの秒数
			let stormPulseT = 0
			// 自分の見た目と当たりの倍率(巨大化で 1 → 2 → 1)
			let giantScale = 1
			// 縮んでいる途中も巨大化の続きとして扱う(縮む間に吸われないように)
			function giantActive() {
				return itemTimers.giant > 0 || giantScale > 1
			}
			// 当たりと吸い合いの比べに使う半径。巨大化中の自分だけ大きくなる
			function sizeR(b) {
				return b.isPlayer ? b.R * giantScale : b.R
			}
			function foodGainRate(eater) {
				if (eater !== body) return 1
				return FOOD_GAIN * (itemTimers.boost > 0 ? BOOST_GAIN : 1)
			}
			// 嵐の管が切れずにいられる距離の目安。対象は画面に映っている物なので、画面の隅までの距離にする
			function stormRange() {
				return cam.viewRange
			}
			function clearItemTimers() {
				itemTimers.giant = 0
				itemTimers.boost = 0
				itemTimers.storm = 0
				giantScale = 1
			}
			function resetItems() {
				items.length = 0
				clearItemTimers()
				for (const type of Object.keys(ITEM_TYPES))
					itemNext[type] = rand(...ITEM_TYPES[type].first)
			}
			// かけらと同じ範囲(散りばめる円の中)の、画面の外に置く。縦画面はその円のうち画面の外の所が狭く、
			// 置ける所が見つからずに湧くのが遅れたので、見つからない時はふつうの水たまりが湧く範囲(画面の外)にも置く
			function spawnItem(type) {
				const r = body.R * 0.45
				// 効いている間に湧く物は、続けて取りに行けるよう画面のすぐ外に置く
				if (ITEM_TYPES[type].activeEvery && itemTimers[type] > 0) {
					const view = cam.viewRange
					const near = findSpawnSpot(r, view * 0.5, view * 0.9, true)
					if (near) {
						items.push({
							type,
							x: near.x,
							z: near.z,
							r,
							t: 0,
							drinkT: -1,
							yaw: rand(0, Math.PI * 2),
						})
						return true
					}
				}
				const minD = reachRadius(body) * 1.5 + r
				const R = bitDiskRadius()
				for (let attempt = 0; attempt < 12; attempt++) {
					const a = rand(0, Math.PI * 2)
					const d = R * Math.sqrt(Math.random())
					const x = body.x + Math.cos(a) * d
					const z = body.z + Math.sin(a) * d
					if (d < minD || isOnScreen(x, z, r * 4) || !spotIsFree(x, z, r))
						continue
					items.push({
						type,
						x,
						z,
						r,
						t: 0,
						drinkT: -1,
						yaw: rand(0, Math.PI * 2),
					})
					return true
				}
				const view = cam.viewRange
				const spot = findSpawnSpot(r, view * 0.35, view * 1.3, true)
				if (!spot) return false
				items.push({
					type,
					x: spot.x,
					z: spot.z,
					r,
					t: 0,
					drinkT: -1,
					yaw: rand(0, Math.PI * 2),
				})
				return true
			}
			function removeItem(it) {
				const i = items.indexOf(it)
				if (i >= 0) items.splice(i, 1)
				itemNext[it.type] = rand(...ITEM_TYPES[it.type].every)
			}
			// maintainWorld から呼ぶ: 遠くへ離れたアイテムを消し、無い種類は時間が来たら湧かせる(置けなければ次の回にまた試す)
			function maintainItems() {
				const limit = cam.viewRange * RANGE.keep
				for (let i = items.length - 1; i >= 0; i--) {
					const it = items[i]
					if (it.drinkT < 0 && Math.hypot(it.x - body.x, it.z - body.z) > limit)
						removeItem(it)
				}
				for (const type of Object.keys(ITEM_TYPES)) {
					if (items.filter((it) => it.type === type).length >= CAP.itemsPerType)
						continue
					if (itemNext[type] <= 0) spawnItem(type)
				}
			}
			// 触れたら短く吸い込み、飲み終えたら効き始める。効いている時間と巨大化の大きさを進める(dt は実時間)
			function updateItems(dt) {
				// 飲んだ時の 1 回目は activateItem で伸ばすので、ここはその後の 0.6 秒ごと。
				// 残りがほぼ 0 の時(切れる瞬間)は伸ばさない(6 秒で 10 回にする)
				if (itemTimers.storm > 1e-6) {
					stormPulseT -= dt
					if (stormPulseT <= 0) {
						// 止まっていた間の分をまとめて出さない
						stormPulseT += STORM_PULSE_SECONDS
						if (stormPulseT <= 0) stormPulseT = STORM_PULSE_SECONDS
						stormPulse()
					}
				}
				for (let i = items.length - 1; i >= 0; i--) {
					const it = items[i]
					it.t += dt
					if (it.drinkT >= 0) {
						it.drinkT += dt
						if (it.drinkT >= ITEM_DRINK_SECONDS) {
							removeItem(it)
							activateItem(it.type)
						}
						continue
					}
					if (
						!body.dead &&
						Math.hypot(it.x - body.x, it.z - body.z) <
							reachRadius(body) + it.r * 0.6
					)
						it.drinkT = 0
				}
				itemTimers.giant = Math.max(0, itemTimers.giant - dt)
				itemTimers.boost = Math.max(0, itemTimers.boost - dt)
				itemTimers.storm = Math.max(0, itemTimers.storm - dt)
				// 次が湧くまでの秒数は、その種類が床に無い間だけ実時間で数える(湧かせるのは maintainItems)
				for (const type of Object.keys(ITEM_TYPES)) {
					if (!items.some((it) => it.type === type)) itemNext[type] -= dt
					// 効いている間は、続けて取りに行けるよう早めに湧かせる
					const every = ITEM_TYPES[type].activeEvery
					if (every && itemTimers[type] > 0 && itemNext[type] > every[1])
						itemNext[type] = rand(...every)
				}
				if (itemTimers.giant > 0) {
					giantScale = Math.min(
						GIANT_SCALE,
						giantScale + (dt * (GIANT_SCALE - 1)) / GIANT_GROW_SECONDS,
					)
				} else if (giantScale > 1) endGiant()
			}
			// 切れたら、見た目の大きさを本当の大きさにする(量を倍率の 3 乗倍にし、倍率を 1 に戻す。見た目は変わらない)。
			// 増えた量は点数にも入る。切れた後は、相手との距離に関係なく少しの間は吸われない
			function endGiant() {
				setMass(body, body.mass * giantScale ** 3)
				body.dispR *= giantScale
				giantScale = 1
				body.safeT = GIANT_AFTER_SAFE
			}
			function activateItem(type) {
				// もう一度飲んだら、続けて取れる種類は時間を足し(上限まで)、それ以外は戻す
				const def = ITEM_TYPES[type]
				itemTimers[type] =
					def.max && itemTimers[type] > 0
						? Math.min(def.max, itemTimers[type] + def.add)
						: def.seconds
				// 巨大化した瞬間に、自分に刺さっている管は全部切れる
				if (type === 'giant')
					for (const l of [...body.suckers]) cutLink(l, 'break')
				if (type === 'storm') {
					stormPulse()
					stormPulseT = STORM_PULSE_SECONDS
				}
				showItemNotice(type)
				startWave(1)
				cam.trauma = Math.min(1, cam.trauma + 0.4)
				// 巨大化は低め、成長促進剤は高め、触手の嵐は中くらいで少しうねる「ぽちゃん」
				if (type === 'storm') playSound('itemStorm', { maxVoices: 1 })
				else
					playSound('item', {
						rate: type === 'giant' ? 0.65 : 1.5,
						maxVoices: 1,
					})
			}
			// 触手の嵐: 画面に映っている吸える物へ、管を一斉に伸ばす。アイテムを一番先に(近い順)、残りは近い順に選ぶ。
			// アイテムは掴んで飲ませるので、嵐が次の嵐や巨大化を拾って続けて効くことがある(狙いどおり)。
			// 大きな水たまりは何者かで時間をかけて吸い合う物なので伸ばさない。大きい相手役は canEat で外れる
			const stormTargets = []
			function stormPulse() {
				stormTargets.length = 0
				let n = 0
				const grab = []
				for (const it of items) {
					if (it.drinkT >= 0 || it.grabbed || !isInsideScreen(it.x, it.z))
						continue
					grab.push({ it, d: Math.hypot(it.x - body.x, it.z - body.z) })
				}
				grab.sort((a, b) => a.d - b.d)
				for (const g of grab) {
					if (n >= STORM_LINKS || links.length >= CAP.links) break
					g.it.grabbed = true
					startLink(body, g.it, false, true)
					n++
				}
				for (const f of foods) {
					if (
						f.kind !== 'puddle' ||
						f.role === 'pool' ||
						f.dead ||
						f.liters <= 0
					)
						continue
					if (isInsideScreen(f.x, f.z))
						stormTargets.push({
							target: f,
							d: Math.hypot(f.x - body.x, f.z - body.z),
							isBlob: false,
						})
				}
				for (const b of blobs) {
					if (b === body || b.dead || !canEat(body, b)) continue
					if (isInsideScreen(b.x, b.z))
						stormTargets.push({
							target: b,
							d: Math.hypot(b.x - body.x, b.z - body.z),
							isBlob: true,
						})
				}
				stormTargets.sort((a, b) => a.d - b.d)
				for (const c of stormTargets) {
					if (n >= STORM_LINKS) break
					if (!canCapture(body, c.target, c.isBlob, true)) continue
					startLink(body, c.target, c.isBlob, true)
					n++
				}
			}

			/* ========== 結果画面の景色 ========== */
			// 結果画面だけ、届いた称号に合う景色(TITLES の scene、assets/scale/ground/)を地面いっぱいに敷き、その上に大きくなった体を映す
			// (発注者「大きくなったまま黒くして、最後の結果画面の時だけ宇宙にしたり湖にしたりしてほしい」)。
			// 遊んでいる間は今の床のまま。景色は RESULT_SCENE_FADE 秒でふわっと出す(動きを減らす設定ではすっと出す)
			const RESULT_SCENE_FADE = 0.6
			// 絵 1 枚の広さ(画面に映る地面の広さの倍数)。1 枚で画面を覆う
			const RESULT_SCENE_VIEWS = 2.4
			const resultScene = { tex: null, mix: 0 }
			const sceneTextures = {}
			// 絵は使う時に 1 回だけ読む。読めなくても、景色が出ないだけにする
			function sceneTexture(name) {
				if (!sceneTextures[name]) {
					const tex = new THREE.TextureLoader().load(
						`assets/scale/ground/${name}.webp`,
						undefined,
						undefined,
						() => {},
					)
					tex.colorSpace = THREE.SRGBColorSpace
					tex.wrapS = tex.wrapT = THREE.RepeatWrapping
					tex.anisotropy = renderer.capabilities.getMaxAnisotropy()
					sceneTextures[name] = tex
				}
				return sceneTextures[name]
			}
			function showResultScene(name) {
				resultScene.tex = name ? sceneTexture(name) : null
				resultScene.mix = reducedMotion ? 1 : 0
			}
			function updateResultScene(realDt) {
				const u = groundMaterial.uniforms
				if (state !== 'result' || !resultScene.tex) {
					resultScene.mix = 0
					u.uSceneMix.value = 0
					return
				}
				resultScene.mix = Math.min(
					1,
					resultScene.mix + realDt / RESULT_SCENE_FADE,
				)
				const tile = cam.viewRange * RESULT_SCENE_VIEWS
				u.tScene.value = resultScene.tex
				u.uSceneMix.value = resultScene.mix
				u.uSceneTile.value = tile
				u.uSceneAnchor.value.set(tile / 2 - cam.x, tile / 2 - cam.z)
			}

			/* ========== 入力 ========== */
			const input = { stick: null, hover: null, keys: new Set() }
			const KEY_DIRS = {
				KeyW: [0, -1],
				ArrowUp: [0, -1],
				KeyS: [0, 1],
				ArrowDown: [0, 1],
				KeyA: [-1, 0],
				ArrowLeft: [-1, 0],
				KeyD: [1, 0],
				ArrowRight: [1, 0],
			}
			window.addEventListener('keydown', (e) => {
				unlockAudio()
				if (KEY_DIRS[e.code]) {
					input.keys.add(e.code)
					e.preventDefault()
				}
			})
			window.addEventListener('keyup', (e) => input.keys.delete(e.code))
			window.addEventListener('blur', () => {
				input.keys.clear()
				input.hover = null
				endStick()
			})

			// マウスはボタンを押している間だけカーソルの方へ進む(置いておくだけで進み続けると、操作していない時も勝手に動くため)。
			// 指は押した所からの引っ張りで進む
			canvas.addEventListener('pointerdown', (e) => {
				unlockAudio()
				if (state !== 'play') return
				if (e.pointerType === 'mouse') {
					if (e.button !== 0) return
					input.hover = { x: e.clientX, y: e.clientY }
					canvas.setPointerCapture(e.pointerId)
					return
				}
				if (input.stick) return
				input.stick = {
					id: e.pointerId,
					ox: e.clientX,
					oy: e.clientY,
					x: e.clientX,
					y: e.clientY,
				}
				canvas.setPointerCapture(e.pointerId)
				placeStickMarks()
				ui.stickBase.hidden = false
				ui.stickKnob.hidden = false
			})
			canvas.addEventListener('pointermove', (e) => {
				if (e.pointerType === 'mouse')

					input.stick.x = e.clientX
					input.stick.y = e.clientY
					placeStickMarks()
				}
			})
			function endStick() {
				input.stick = null
				ui.stickBase.hidden = true
				ui.stickKnob.hidden = true
			}
			const onPointerEnd = (e) => {
				if (e.pointerType === 'mouse') input.hover = null
				if (input.stick && input.stick.id === e.pointerId) endStick()
			}
			canvas.addEventListener('pointerup', onPointerEnd)
			canvas.addEventListener('pointercancel', onPointerEnd)
			// 着信や通知などで指の取り込みが外れた時も、操作の丸を残さず止める
			canvas.addEventListener('lostpointercapture', onPointerEnd)
			// 2 本指の拡大(iPhone の Safari は拡大禁止の指定を無視するため)・2 回押し・長押しのメニューで画面が動かないようにする
			for (const type of [
				'gesturestart',
				'gesturechange',
				'gestureend',
				'dblclick',
			]) {
				document.addEventListener(type, (e) => e.preventDefault(), {
					passive: false,
				})
			}
			document.addEventListener('contextmenu', (e) => {
				if (!(e.target instanceof Element && e.target.closest('a')))

			})
			// アプリを切り替えたり画面を消したりしたら、操作と音を止める(時間は毎コマの処理で止まる)。
			// 戻った時に大きな時間差で物が飛ばないよう、時刻の基準を取り直す
			let audioWasRunning = false
			document.addEventListener('visibilitychange', () => {
				if (document.hidden) {
					input.keys.clear()
					input.hover = null
					endStick()
					audioWasRunning = audio.ctx?.state === 'running'
					if (audioWasRunning) audio.ctx.suspend().catch(() => {})
					return
				}
				lastNow = performance.now()
				if (audioWasRunning) audio.ctx.resume().catch(() => {})
			})
			// カーソルが窓の外に出たら止まる

			})

			function placeStickMarks() {
				const s = input.stick
				const dx = s.x - s.ox
				const dy = s.y - s.oy
				const len = Math.hypot(dx, dy)
				const k = len > 60 ? 60 / len : 1
				ui.stickBase.style.left = `${s.ox}px`
				ui.stickBase.style.top = `${s.oy}px`
				ui.stickKnob.style.left = `${s.ox + dx * k}px`
				ui.stickKnob.style.top = `${s.oy + dy * k}px`
			}

			const raycaster = new THREE.Raycaster()
			const pointerNdc = new THREE.Vector2()
			const hitPoint = new THREE.Vector3()
			const moveIntent = { x: 0, z: 0, mag: 0 }
			function readMoveIntent() {
				moveIntent.mag = 0
				let kx = 0
				let kz = 0
				for (const code of input.keys) {
					kx += KEY_DIRS[code][0]
					kz += KEY_DIRS[code][1]
				}
				if (kx || kz) {
					const len = Math.hypot(kx, kz)
					moveIntent.x = kx / len
					moveIntent.z = kz / len
					moveIntent.mag = 1
					return
				}
				const s = input.stick
				if (s) {
					// 画面の上 = 奥(-z)。カメラは回さないので画面の向きがそのまま地面の向き
					const dx = s.x - s.ox
					const dy = s.y - s.oy
					const len = Math.hypot(dx, dy)
					if (len < 8) return
					moveIntent.x = dx / len
					moveIntent.z = dy / len
					moveIntent.mag = clamp((len - 8) / 52, 0, 1)
					return
				}
				if (input.hover) {
					pointerNdc.set(
						(input.hover.x / window.innerWidth) * 2 - 1,
						-(input.hover.y / window.innerHeight) * 2 + 1,
					)
					raycaster.setFromCamera(pointerNdc, camera)
					if (!raycaster.ray.intersectPlane(groundPlane, hitPoint)) return
					const dx = hitPoint.x - body.x
					const dz = hitPoint.z - body.z
					const d = Math.hypot(dx, dz)
					if (d <= body.dispR) return
					moveIntent.x = dx / d
					moveIntent.z = dz / d
					moveIntent.mag = clamp((d - body.dispR) / (body.dispR * 0.8), 0, 1)
				}
			}

			function updateMovement(dt, playing) {
				// 吸われている途中でも動けて、逃げ切れる
				if (body.dead) return
				if (playing) readMoveIntent()
				else moveIntent.mag = 0
				// 巨大化中は画面も見た目に合わせて引くので、見た目の大きさの速さで動く(画面の上の速さを保つ)
				const speed =
					moveSpeedFor(sizeR(body)) * speedFactor(body) * moveIntent.mag
				const k = damp(8, dt)
				body.vx += (moveIntent.x * speed - body.vx) * k
				body.vz += (moveIntent.z * speed - body.vz) * k
				body.x += body.vx * dt
				body.z += body.vz * dt
				if (Math.hypot(body.vx, body.vz) > 0.15) {
					const target = Math.atan2(body.vz, body.vx)
					body.heading += angleDiff(target, body.heading) * damp(6, dt)

			}

			/* ========== カメラと揺れ ========== */
			const CAM_PITCH = THREE.MathUtils.degToRad(53)
			const cam = {
				x: 0,
				z: 0,
				dist: 6.5,
				trauma: 0,
				viewRange: 9,
				screenArea: 60,
				focusR: 0.5,
				// 膨らんだ後にカメラを止めておく残りの秒数と、ゆっくり引く残りの秒数、はみ出さないために先に引いた距離

				slowT: 0,

			// 普段の成長は、吸った量をためておき、満ちたら「だんっ」と一気に膨らむ。
			// 少しずつ育つと見た目に出ず、膨らんでから戻る形は「戻される」と感じられたため(発注者「一定数とったらデカくなる」)。
			// 満ちる量は体の量の FEVER_FILL 倍。巨大化と同じ半径 2.5 倍分(2.5 の 3 乗 − 1 = 約 14.6 倍)の半分にした
			// (発注者「デカくなる必要量を今の半分ぐらいに」)。満ちたら、その量を体に入れるので、量は約 8.3 倍・半径は約 2 倍になる。
			// 大きな水たまりなどで一度に何回分も満ちた時は、FEVER_CHAIN_GAP 秒ごとに続けて膨らむ(発注者「2段っていうのは大量に吸った時」)。
			// 膨らむたびに FEVER_OVERSHOOT 倍まで行き過ぎて戻り、地面に透明な衝撃波が広がる。
			// 金色・画面の揺れ・音は付けない(発注者「通常時デカくなる時一瞬黄色なる」「カメラ揺れなくす」「音いらない」)。
			// 画面は止めず(発注者「画面は止めなくていい」)、最後の膨らみの後にカメラを FEVER_CAM_SLOW 秒ほどかけてゆっくり引く
			const FEVER_FILL = (GIANT_SCALE ** 3 - 1) * 0.5
			const FEVER_GROW = 0.1
			const FEVER_SETTLE = 0.12
			const FEVER_CHAIN_GAP = 0.3
			const FEVER_OVERSHOOT = 1.04
			const FEVER_CAM_SLOW = 1.75
			// 今の膨らみからの経過秒数、膨らみ始めの見た目の半径、続けて膨らんだ回数(衝撃波を少しずつ強くする)
			const fever = { t: Infinity, from: 0, chain: 0 }
			function feverNeed() {
				return body.mass * FEVER_FILL
			}
			function updateFever() {
				if (body.dead || body.store < feverNeed()) return
				// 続けて膨らむ時は、前の膨らみから FEVER_CHAIN_GAP 秒あける
				const chained = fever.t < FEVER_CHAIN_GAP + 0.1
				if (chained && fever.t < FEVER_CHAIN_GAP) return
				fever.chain = chained ? fever.chain + 1 : 0
				const need = feverNeed()
				body.store -= need
				fever.from = body.dispR
				fever.t = 0
				setMass(body, body.mass + need)
				const more = body.store >= feverNeed()
				// 続けて膨らむ間はカメラを止め、最後の膨らみの後にゆっくり引く
				cam.holdT = more ? FEVER_CHAIN_GAP + 0.1 : 0
				cam.slowT = FEVER_CAM_SLOW

				if (reducedMotion) return
				// 発注者の「もっと和らげて」で、前の 0.48〜0.84 から弱めた
				startWave(Math.min(0.4, 0.25 + 0.04 * fever.chain))

			// 膨らむ間の見た目の半径(行き過ぎて戻る)。膨らみ終えたら null
			function feverDisplayR() {

				const peak = body.R * FEVER_OVERSHOOT

				if (t < FEVER_GROW + FEVER_SETTLE)
					return lerp(

						body.R,
						easeOutQuad((t - FEVER_GROW) / FEVER_SETTLE),
					)
				return null

			// 体と触手が画面に占めてよい割合(縦横それぞれ)。超えそうならその分だけ先に引く。

			const CAM_FIT_SHARE = 0.7
			const CAM_GIANT_FIT_SHARE = 0.9
