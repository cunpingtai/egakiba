/* Full-screen story combat: arena is the stage, everything else is an overlay */
#battle-root{background:#080e2b;color:#f3f7ff}
#battle-root .r9-shell{padding:0;background:radial-gradient(ellipse at 52% 40%,#45548f,#1b2b59 60%,#0c1634);color:#e9f3ff;overflow:hidden;height:100dvh;min-height:540px}
#battle-root .r9-shell .r8-content{position:relative;width:100%;max-width:none;height:100%;margin:0}
#battle-root .r9-head{position:absolute;inset:8px 22px auto;z-index:15;display:flex;align-items:center;margin:0;pointer-events:none}
#battle-root .r9-head h1{font-size:clamp(15px,1.7vw,23px);margin:1px 0;color:#eff5ff;text-shadow:0 2px 12px #07112f}
#battle-root .r9-head small{font-size:9px;color:#bfcef0;letter-spacing:.2em}
#battle-root .r9-head button{pointer-events:auto;background:#122d59b7;color:#e8f2ff;border:1px solid #c3dafa77;padding:10px 16px}
#battle-root .r9-mission{position:absolute;top:71px;left:50%;transform:translateX(-50%);z-index:12;display:flex;gap:10px;max-width:60vw;width:max-content;background:#253760c9;border:1px solid #cfdfec55;border-radius:5px;box-shadow:0 9px 23px #0e1a47a1;padding:7px 13px;margin:0;backdrop-filter:blur(9px)}
#battle-root .r9-mission strong{color:#ffe1a1;font-size:9px;letter-spacing:.09em}
#battle-root .r9-mission span{font-size:11px;color:#edf4ff}
#battle-root .r9-hud{position:absolute;top:120px;left:clamp(12px,2vw,32px);right:clamp(12px,2vw,32px);z-index:11;grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr);gap:clamp(10px,2vw,30px);margin:0;pointer-events:none}
#battle-root .r9-player{border:0;border-top:2px solid #79d5ff;border-radius:0;padding:9px 14px;background:linear-gradient(90deg,#172e59df,#16285322);color:#fff;gap:12px;max-width:350px}
#battle-root .r9-player.opponent{justify-self:end;border-color:#ffad92;background:linear-gradient(270deg,#572c55e6,#16285322)}
#battle-root .r9-player .r9-glyph{color:#9de8ff;font-size:clamp(29px,2.8vw,51px);text-shadow:0 3px 0 #2b5674}
#battle-root .r9-player.opponent .r9-glyph{color:#ffc2a0;text-shadow:0 3px 0 #823d50}
#battle-root .r9-meters span,#battle-root .r9-meters small{color:#e9f2ff;font-size:10px}
#battle-root .r9-meter{background:#0b1432b5;height:10px;border:1px solid #bdc9f654;border-radius:3px}
#battle-root .r9-meter i{border-radius:0;background:linear-gradient(90deg,#75e3ff,#3a8ef8)}
#battle-root .r9-meter i.r9-red{background:linear-gradient(90deg,#e87983,#ffc19e)}
#battle-root .r9-meter.r9-spin{height:5px}
#battle-root .r9-center span{color:#cce0fd;font-size:10px;letter-spacing:.11em}
#battle-root .r9-center strong{color:#fff;font-size:clamp(21px,2.5vw,35px);text-shadow:0 3px 15px #0e1953}
#battle-root .r9-stage{position:absolute;inset:0;width:100%;height:100%;min-height:0;border:0;border-radius:0;background:radial-gradient(ellipse at 48% 62%,#778aca 0%,#42518d 34%,#252c65 66%,#101839 100%)}
#battle-root .r9-stage canvas{position:absolute;inset:0;width:100%;height:100%;outline-offset:-8px;touch-action:none;cursor:grab}
#battle-root .r9-stage canvas:active{cursor:grabbing}
#battle-root .r10-arena-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 56%,transparent 28%,#0f183459 71%,#09112b9c 100%),linear-gradient(115deg,transparent 18%,#d9eaff0e 20%,transparent 31%),linear-gradient(245deg,transparent 18%,#d9eaff0e 20%,transparent 31%)}
#battle-root .r10-aim-callout{position:absolute;z-index:6;top:24%;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 30px);padding:10px 18px;text-align:center;pointer-events:none;color:#eaf6ff;text-shadow:0 2px 10px #071429}
#battle-root .r10-aim-callout small{display:block;font-size:9px;letter-spacing:.22em;color:#bdeeff}
#battle-root .r10-aim-callout b{display:block;font-size:25px;font-variant-numeric:tabular-nums;margin:4px 0;color:#ffdfa2}
#battle-root .r10-aim-callout span{display:block;font-size:11px}
#battle-root .r10-aim-callout.is-dragging{transform:translateX(-50%) scale(1.08)}
#battle-root .r10-aim-callout.is-entering{animation:arenaCue .7s ease both}
#battle-root .r9-shell[data-phase=battle] .r10-aim-callout,#battle-root .r9-shell[data-phase=result] .r10-aim-callout{opacity:0}
@keyframes arenaCue{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#battle-root .r10-impact{position:absolute;z-index:8;top:41%;left:50%;transform:translate(-50%,-50%) scale(.78);opacity:0;pointer-events:none;text-align:center;text-shadow:0 4px 18px #091335;transition:opacity .09s,transform .12s}
#battle-root .r10-impact.is-visible{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
#battle-root .r10-impact b{display:block;font-size:clamp(30px,5vw,68px);font-weight:1000;font-style:italic;letter-spacing:.02em;color:#fff0ad;-webkit-text-stroke:1px #82604a}
#battle-root .r10-impact span{display:inline-block;font-size:12px;font-weight:900;color:#f8f8ff;margin:4px 8px}
#battle-root .r9-shell[data-phase=ready] .r10-impact{display:none}
#battle-root .r10-pause-overlay{position:absolute;z-index:30;inset:0;background:#07122ce6;backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}
#battle-root .r10-pause-overlay[hidden]{display:none!important}
#battle-root .r10-pause-overlay small{letter-spacing:.26em;color:#ffdbab;font-size:11px}
#battle-root .r10-pause-overlay strong{font:900 clamp(36px,7vw,78px) var(--serif)}
#battle-root .r10-pause-overlay span{font-size:13px;color:#d7e7ff}
#battle-root .r10-pause-overlay button{font-size:17px;background:#f6d391;color:#213258}
#battle-root .r9-controls{position:absolute;z-index:16;bottom:18px;left:clamp(14px,3vw,42px);right:clamp(14px,3vw,42px);display:flex;gap:12px;align-items:end;padding:13px 0;flex-wrap:nowrap;background:linear-gradient(transparent,#101d4799);color:#f4f8ff}
#battle-root .r10-spin-button,#battle-root .r10-pause-button{border:1px solid #b6d1ff88;background:#193467b6;color:#f1f7ff;min-height:52px;border-radius:7px;font-size:13px}
#battle-root .r10-control-caption{flex:1;min-width:0;text-align:center;padding:4px 6px;line-height:1.4}
#battle-root .r10-control-caption small{display:block;font-size:9px;letter-spacing:.2em;color:#ffdfa0}
#battle-root .r10-control-caption b{display:block;font-size:17px;color:#fff}
#battle-root .r10-control-caption span{display:block;font-size:10px;color:#c2d4ec}
#battle-root .r10-precision{position:relative;min-width:140px;max-width:280px;border:1px solid #a9c8f655;background:#1a3562bf;border-radius:7px}
#battle-root .r10-precision summary{padding:15px 14px;list-style:none;cursor:pointer;font-weight:850;font-size:12px;color:#eaf6ff}
#battle-root .r10-precision summary::-webkit-details-marker{display:none}
#battle-root .r10-precision summary span:first-child{color:#ffdd9f;margin-right:6px}
#battle-root .r10-precision[open]{border-color:#f4d79c}
#battle-root .r10-precision-fields{position:absolute;bottom:calc(100% + 12px);right:0;width:min(320px,calc(100vw - 24px));padding:18px;background:#102649ed;border:1px solid #c1d8ff74;box-shadow:0 20px 50px #061128bf;border-radius:9px}
#battle-root .r10-precision-fields label{display:grid;gap:10px;color:#eaf3ff;margin-bottom:10px}
#battle-root .r10-precision-fields output{color:#ffe1a7}
#battle-root .r10-precision-fields input{accent-color:#ffdfa5;width:100%}
#battle-root .r10-launch-button{min-height:55px;min-width:165px;background:linear-gradient(#ffe7ab,#f1bd78);border:1px solid #ffecbe;color:#24315b;box-shadow:0 5px #ad765c;border-radius:7px;font-size:15px}
#battle-root .r10-launch-button span{font-size:22px;margin-right:7px}
#battle-root .r10-launch-button:disabled{opacity:.47}
#battle-root .r8-status{position:absolute;z-index:10;bottom:105px;left:50%;transform:translateX(-50%);text-align:center;width:min(620px,85vw);font-size:13px;font-weight:800;color:#e8f4ff;text-shadow:0 2px 12px #07112f;pointer-events:none}
#battle-root .r8-note{display:none}/* Ruleset identifiers belong in About/engineering, not in play. */
#battle-root .r9-shell[data-phase=battle] .r10-control-caption{opacity:.6}
#battle-root .r9-shell[data-phase=result] .r9-controls{display:none}
/* Victory fills the stage, never a nested form/card */
#battle-root .r9-shell .r8-result{position:absolute;z-index:40;inset:0;top:0;left:0;transform:none;width:100%;max-height:none;height:100%;border-radius:0;background:#08122bdc;backdrop-filter:blur(13px);box-shadow:none;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:clamp(20px,4vw,50px)}
#battle-root .r9-shell .r8-result[hidden]{display:none!important}
#battle-root .r9-result-content{width:min(600px,100%);max-width:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:#eef6ff}
#battle-root .r9-result-content>small{letter-spacing:.23em;font-size:11px;color:#ffdaa0}
#battle-root .r9-result-content>strong{font:900 clamp(52px,9vw,118px)/1.05 var(--serif);letter-spacing:-.07em;color:#fff4ca;text-shadow:0 6px 0 #86627a,0 14px 40px #f4bd7e55}
#battle-root .r9-result-content[data-outcome=loss]>strong{color:#d4dff3;text-shadow:0 5px #4d5c83}
#battle-root .r9-result-content[data-outcome=draw]>strong{color:#a5dcff}
#battle-root .r9-result-content p{color:#d9e8fb;margin:5px 0;font-size:14px}
#battle-root .r9-result-stars{color:#ffe29a;font-size:clamp(31px,4vw,56px);letter-spacing:10px;text-shadow:0 0 20px #ffcb8c55}
#battle-root .r9-save-status{font-size:11px;color:#b6c9e3}
#battle-root .r9-result-actions{width:100%;margin-top:20px;gap:10px}
#battle-root .r9-result-actions button{min-height:50px;border-radius:7px}
#battle-root .r9-result-actions .r8-cta{background:#ffe2a1;color:#1b2b56;box-shadow:0 3px #b47d58}
#battle-root .r9-result-actions .r8-second{background:#1a3157;color:#e7f4ff;border:1px solid #a4bfed88}
#battle-root .r9-shell[data-danger=player] .r9-player:not(.opponent) .r9-meter:first-of-type{animation:dangerBlink .9s ease infinite alternate}
@keyframes dangerBlink{from{filter:brightness(1)}to{filter:brightness(1.6)}}

#flow-page .r17-hero-letter{display:block;max-width:100%;font:900 clamp(92px,10vw,163px)/1.3 var(--serif);color:#3376ba;text-shadow:2px 4px #b8d3ea,7px 13px 25px #3c779356;overflow-wrap:anywhere}

#flow-page .r17-fighter>b{font-size:14px;color:#273f55}

#flow-page .r17-battle-note{padding:15px 20px;color:#5c7283;background:#ffffff8a;border-top:1px solid #cfdbd8;font-size:11px;font-weight:700;text-align:center;line-height:1.6}
#flow-page .r17-checklist{display:flex;flex-direction:column;gap:19px;background:#fffaf3;padding:28px 27px;min-height:520px}

#flow-page .r17-checklist-sub{margin:0;font-size:12px;color:#647581;line-height:1.6}
#flow-page .r17-objectives{border:1px solid #e5d4be;background:#fff4e5;border-radius:14px;padding:16px 18px}
#flow-page .r17-objectives h3{font-size:11px;color:#98643f;margin:0 0 9px}
#flow-page .r17-objectives strong{font-size:15px;color:#3f4e5c;display:block;margin-bottom:10px}
#flow-page .r17-objectives p{font-size:12px;color:#64717a;margin:6px 0}
#flow-page .r17-rival-input{display:flex;flex-direction:column;gap:8px}
#flow-page .r17-rival-input label{font-size:12px;font-weight:900;color:#364d60}
#flow-page .r17-rival-input input{max-width:100%;width:100%;min-height:58px;border:1px solid #b9cbd3;border-radius:12px;color:#324d62;background:white;text-align:center;font:900 30px/1.2 var(--serif);outline-offset:3px}
#flow-page .r17-rival-input input[aria-invalid="true"]{border-color:#b95549;background:#fff0ed}
#flow-page .r17-rival-input small{font-size:11px;color:#6c7c87}
#flow-page .r17-rule-row{display:flex;align-items:start;justify-content:space-between;gap:15px;padding-bottom:11px;border-bottom:1px solid #e7ded2}
#flow-page .r17-rule-row>span{color:#7b8894;font-size:11px;flex-shrink:0}
#flow-page .r17-rule-row>strong{font-size:11px;color:#354d60;text-align:right;line-height:1.55}
#flow-page .r17-check-status{border-radius:12px;padding:13px 15px;line-height:1.5;font-size:12px;font-weight:750;color:#496678;background:#e8f0f5;border:1px solid #cbdce5}
#flow-page .r17-check-status[data-state="ready"]{color:#316748;background:#ecf7ee;border-color:#b7ddc7}
#flow-page .r17-check-status[data-state="invalid"]{color:#9a473e;background:#fff1ee;border-color:#edc1b9}
#flow-page .r17-check-status[data-state="starting"]{color:#4c658c;background:#eaf1ff;border-color:#bdcde9}

#flow-page .r17-secondary-actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

@media(max-width:550px){#flow-page .r17-heading{align-items:start}#flow-page .r17-prepare-layout{gap:12px}#flow-page .r17-versus,#flow-page .r17-checklist{border-radius:17px}#flow-page .r17-faceoff{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);padding:16px 9px;gap:3px;min-height:0}#flow-page .r17-arena-head{padding:12px;font-size:9px}#flow-page .r17-hero-letter{font-size:clamp(70px,21vw,111px)}#flow-page .r17-statline{gap:5px}#flow-page .r17-statline span{font-size:9px;padding:7px 5px}#flow-page .r17-statline span b{font-size:10px}#flow-page .r17-fighter>b{font-size:11px}#flow-page .r17-edit{padding:9px 10px}#flow-page .r17-checklist{padding:22px 17px;gap:15px}#flow-page .r17-rule-row{gap:10px}#flow-page .r17-battle-cta{min-height:56px}}
</style></head><body class="in-flow"><div class="app-shell"><main class="flow-page" id="flow-page"><div id="flow-content"></div></main></div>
 <script>const model={glyph:'龍',font:'gothic',mode:"story",selectedLevel:'01-01',opponent:'字',opponentDraft:null};
 const LEVEL_CATALOG={'01-01':{id:'01-01',enemy:'字',enemyFont:'mincho',arena:'classic'}};
 const pc=()=>({"rulesStory":"ARENA HP · HPとSPIN / DASH","rulesQuick":"CLASSIC V2 · HPなし","titleStory":"ステージバトル","titleQuick":"フリーバトル","mission":"ミッション","goalHp":"残りHP 55%以上","unranked":"ローカル練習","checking":"双方の文字と書体を確認中…","opponent":"相手","player":"あなた","rival":"相手の文字","rivalHelp":"一文字だけ入力","stats":"字形から計算した能力","edit":"文字を変える","retry":"もう一度確認","battle":"バトル開始"}),t=key=>({"prepare":"いざ、勝負！","prepBrief":"文字の準備はできた。勝負に出よう！","speed":"スピード","power":"パワー","balance":"バランス","hp":"HP","classic":"ルール","arena":"競技場","viewStage":"ステージを選び直す"})[key]||key,locale=()=>"ja";
 const getStageMission=()=>({main:'Win the battle',bonusHp:'HP ≥ 55%',bonusTime:'16s'}),levelName=()=>"初の発射";
 const stageMeta=()=>['01-01'],escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function prepare(){
 const c=pc(), story=model.mode==='story',level=LEVEL_CATALOG[model.selectedLevel],st=stageMeta(model.selectedLevel),rival=story?(level?.enemy||'—'):(model.opponentDraft??model.opponent),rivalFont=story?(level?.enemyFont||'—'):model.font;
 const mission=story?getStageMission(model.selectedLevel,locale()):null;
 const statGrid=(side)=>`<div class="r17-statline">${[['speed',t('speed')],['power',t('power')],['balance',t('balance')],['hp',t('hp')]].map(([id,label])=>`<span>${escapeHtml(label)} <b id="r17-${side}-${id}">—</b></span>`).join('')}</div>`;
 return `<div class="flow-heading r17-heading"><div><span class="flow-kicker">MATCH SETUP / ${story?'STORY':'VS COM'}</span><h1 tabindex="-1">${escapeHtml(t('prepare'))}</h1><p>${escapeHtml(t('prepBrief'))}</p></div><span class="r17-rule-chip">${escapeHtml(story?c.rulesStory:c.rulesQuick)}</span></div>
 <div class="r17-prepare-layout"><section class="r17-versus" aria-label="${escapeHtml(t('prepare'))}"><div class="r17-arena-head"><span>MOJI BLADE · VERSUS</span><span>${escapeHtml(story?'STAGE '+model.selectedLevel:'FREE BATTLE')}</span></div><div class="r17-faceoff">
 <div class="r17-fighter r17-player"><span class="r17-fighter-type">PLAYER 01</span><strong class="r17-hero-letter">${escapeHtml(model.glyph)}</strong><b>${escapeHtml(c.player)}</b><small>${escapeHtml(model.font.toUpperCase())}</small>${statGrid('player')}<button type="button" class="r17-edit" data-continue="glyph">↶ ${escapeHtml(c.edit)}</button></div>
 <div class="r17-vs">VS</div>
 <div class="r17-fighter r17-rival"><span class="r17-fighter-type">${story?'STAGE RIVAL':'CPU'}</span><strong class="r17-hero-letter" id="r17-rival-symbol">${escapeHtml(rival)}</strong><b>${escapeHtml(c.opponent)}</b><small>${escapeHtml(rivalFont.toUpperCase())}</small>${statGrid('rival')}</div>
 </div><div class="r17-battle-note">${escapeHtml(c.stats)} · ${escapeHtml(c.unranked)}</div></section>
 <aside class="r17-checklist"><div class="r17-checklist-top"><span class="flow-kicker">PRE-BATTLE CHECK</span><h2>${escapeHtml(story?levelName(st):c.titleQuick)}</h2><p class="r17-checklist-sub">${escapeHtml(story?c.titleStory:c.rulesQuick)}</p></div>
 ${story?`<section class="r17-objectives"><h3>${escapeHtml(c.mission)}</h3><strong>${escapeHtml(mission?.main||'—')}</strong><p>★ 2 — ${escapeHtml(mission?.bonusHp||c.goalHp)}</p><p>★ 3 — ${escapeHtml(mission?.bonusTime||'—')}</p></section>`:
 `<div class="r17-rival-input"><label for="r8-opponent-input">${escapeHtml(c.rival)}</label><input type="text" id="r8-opponent-input" value="${escapeHtml(rival)}" maxlength="20" aria-describedby="r17-rival-help r17-check-status" aria-invalid="false" autocomplete="off" spellcheck="false" /><small id="r17-rival-help">${escapeHtml(c.rivalHelp)}</small></div>`}
 <div class="r17-rule-row"><span>${escapeHtml(t('classic'))}</span><strong>${escapeHtml(story?c.rulesStory:c.rulesQuick)}</strong></div>
 <div class="r17-rule-row"><span>${escapeHtml(t('arena'))}</span><strong>${escapeHtml(story?(level?.arena||'classic'):'standard')}</strong></div>
 <div class="r17-check-status" id="r17-check-status" role="status" aria-live="polite" data-state="checking">${escapeHtml(c.checking)}</div>
 <button type="button" class="button button-primary r17-battle-cta" data-launch disabled aria-disabled="true">${escapeHtml(c.battle)} ↗</button>
 <div class="r17-secondary-actions">${story?`<button type="button" class="r17-subtle" data-continue="stages">← ${escapeHtml(t('viewStage'))}</button>`:''}<button type="button" class="r17-subtle" data-recheck>↻ ${escapeHtml(c.retry)}</button></div></aside></div>`;
}

 document.querySelector('#flow-content').innerHTML=prepare();
 </script></body></html>
